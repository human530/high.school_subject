nsitive"],["B","infected"],["C","complete"],["D","keen"]],"a":"C","e":"once the project is complete，complete 在 be 動詞後當形容詞「完成的」。"},{"i":"b1849","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Although the task was difficult, Tom ______ to finish it before the deadline. His boss was very pleased with the result.","o":[["A","refused"],["B","managed"],["C","avoided"],["D","failed"]],"a":"B","e":"後句說老闆很滿意，表示事情做成了。manage to V＝設法做到了（含成功的意思）。failed 與後句矛盾；refused、avoided 語意不合，avoid 也不接 to V。"},{"i":"b1850","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The man ______ helped me carry my suitcase up the stairs was very kind.","o":[["A","who"],["B","which"],["C","whom"],["D","whose"]],"a":"A","e":"先行詞 the man 是人，關代後面 helped 缺主詞，用主格 who。"},{"i":"b1851","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The book ______ I borrowed from the library is about training guide dogs.","o":[["A","who"],["B","whom"],["C","whose"],["D","which"]],"a":"D","e":"先行詞 the book 是物，borrowed 後面缺受詞，用受格 which（也可以用 that 或省略）。"},{"i":"b1852","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Taipei 101, ______ was once the tallest building in the world, still attracts many tourists.","o":[["A","that"],["B","which"],["C","who"],["D","it"]],"a":"B","e":"Taipei 101 獨一無二，用逗號的非限定用法，不能用 that；物用 which。(D) it 會變成兩個句子沒有連接詞。"},{"i":"b1853","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"下列哪一個句子文法正確？","o":[["A","The girl who sits next to me comes from Japan."],["B","My mother, that works in a hospital, is a nurse."],["C","Jade Mountain which is the highest mountain in Taiwan attracts many climbers."],["D","The village who we visited last summer was very quiet."]],"a":"A","e":"(B) 非限定不能用 that，應改 who；(C) Jade Mountain 獨一無二，關係子句前後要加逗號；(D) village 是物，應用 which 或 that。"},{"i":"b1854","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"下列哪一個句子中的關係代名詞可以省略？","o":[["A","The boy who won the race is my cousin."],["B","The cake that my sister made was delicious."],["C","Mr. Lin, who teaches us English, is very funny."],["D","The dog which barked all night belongs to my neighbor."]],"a":"B","e":"遮住關代看子句缺什麼：(B) my sister made ___ 缺受詞，是受格，可以省略。(A)(D) 缺主詞，是主格，不能省；(C) 是非限定用法，不能省。"},{"i":"b1855","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The flight was delayed for three hours ______ the heavy fog.","o":[["A","because"],["B","although"],["C","so that"],["D","due to"]],"a":"D","e":"the heavy fog 是名詞片語，要用 due to（＝because of）。because 後面要接子句。"},{"i":"b1856","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Some dogs have the ability ______ diseases in humans by smelling their breath.","o":[["A","detecting"],["B","of detect"],["C","to detect"],["D","detected"]],"a":"C","e":"the ability to V，不能寫成 of V-ing。"},{"i":"b1857","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"______, the lights went out, and everyone in the theater screamed.","o":[["A","All of a sudden"],["B","All of sudden"],["C","All in a sudden"],["D","At a sudden"]],"a":"A","e":"all of a sudden 是固定片語，一個字都不能改。"},{"i":"b1858","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The man we thought was a thief ______ to be a police officer in plain clothes.","o":[["A","came across"],["B","carried out"],["C","turned out"],["D","managed"]],"a":"C","e":"turn out to be＝結果是。"},{"i":"b1859","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"While cleaning the storeroom, I ______ some old photos of my grandparents' wedding.","o":[["A","carried out"],["B","came across"],["C","turned out"],["D","gave up"]],"a":"B","e":"come across＝偶然碰到，打掃時無意間翻到舊照片。"},{"i":"b1871","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"How does a dog know that its owner's blood sugar is too low?","o":[["A","The owner's face turns pale."],["B","The owner gives a special command."],["C","A machine makes a warning sound."],["D","The owner's breath and sweat smell different."]],"a":"D","e":"第二段：血糖太低時，呼吸和汗水的味道會稍微不同，狗聞得出來。"},{"i":"b1927","s":"數學","u":"單元06","t":"06-是圓條件","k":"s","q":"方程式 $2x^2+2y^2-8x+12y-6=0$ 的圖形是一個圓，其圓心與半徑為何？","o":[["A","圓心 $(4,-6)$，半徑 $\\sqrt{58}$"],["B","圓心 $(-2,3)$，半徑 $4$"],["C","圓心 $(2,-3)$，半徑 $16$"],["D","圓心 $(2,-3)$，半徑 $4$"],["E","圓心 $(2,-3)$，半徑 $\\sqrt{10}$"]],"a":"D","e":"先整式除以 2：$x^2+y^2-4x+6y-3=0$。圓心 $\\left(-\\frac{-4}{2},-\\frac{6}{2}\\right)=(2,-3)$；$r^2=2^2+(-3)^2-(-3)=16$，$r=4$。\n誘答：(A) 沒先除以 2，直接用 $-8$、$12$ 讀圓心；(B) 圓心忘了變號；(C) 把 $r^2$ 當成半徑；(E) 用 $4+9-3$，常數項 $-3$ 沒變號。","d":1},{"i":"b1928","s":"數學","u":"單元06","t":"06-是圓條件","k":"s","q":"若方程式 $x^2+y^2-2kx+4y+5k-2=0$ 的圖形是一個圓，則實數 $k$ 的範圍為何？","o":[["A","$2<k<3$"],["B","$k<2$ 或 $k>3$"],["C","$k>3$"],["D","$k<2$"],["E","$k=2$ 或 $k=3$"]],"a":"B","e":"圓心 $(k,-2)$，$r^2=k^2+(-2)^2-(5k-2)=k^2-5k+6=(k-2)(k-3)$。是圓要 $r^2>0$：$(k-2)(k-3)>0$，得 $k<2$ 或 $k>3$。\n(A) 是 $r^2<0$ 的範圍（沒有圖形）；(E) 是 $r^2=0$（圖形為一點）。","d":1},{"i":"b1929","s":"數學","u":"單元06","t":"06-點圓最值","k":"s","q":"設點 $(a,b)$ 在圓 $x^2+y^2-6x+8y+16=0$ 上，則 $a^2+b^2$ 的最大值為何？","o":[["A","$4$"],["B","$8$"],["C","$25$"],["D","$34$"],["E","$64$"]],"a":"E","e":"圓心 $(3,-4)$，$r^2=9+16-16=9$，$r=3$。原點到圓心 $d=5>3$，原點在圓外。圓上點到原點的距離介於 $5-3=2$ 和 $5+3=8$ 之間。$a^2+b^2$ 是距離的平方，最大值 $8^2=64$。\n誘答：(B) 8 是忘了平方；(A) 4 是最小值 $2^2$；(D) 34 是 $d^2+r^2$。","d":1},{"i":"b1930","s":"數學","u":"單元06","t":"06-讀圓心","k":"m","q":"已知圓 $C:x^2+y^2-4x+2y-20=0$。下列哪些選項正確？","o":[["A","圓 $C$ 的圓心為 $(2,-1)$"],["B","圓 $C$ 的半徑為 $25$"],["C","圓 $C$ 的圖形對稱於直線 $x=-2$"],["D","點 $(5,3)$ 在圓 $C$ 上"],["E","點 $(-1,2)$ 在圓 $C$ 的內部"]],"a":"ADE","e":"圓心 $(2,-1)$，$r^2=4+1+20=25$，$r=5$。\n(A) 對。(B) 半徑是 5，25 是 $r^2$，錯。(C) 圓對稱於通過圓心的直線，應為 $x=2$，$x=-2$ 是圓心沒變號，錯。(D) $(5-2)^2+(3+1)^2=9+16=25$，在圓上，對。(E) $(-1-2)^2+(2+1)^2=18<25$，在圓內，對。"},{"i":"b1931","s":"數學","u":"單元06","t":"06-是圓條件","k":"m","q":"下列哪些選項的圖形是一個圓？","o":[["A","$x^2+y^2-4x+6y+13=0$"],["B","$2x^2+2y^2-4x+8y+1=0$"],["C","$(x-1)(x+3)+(y-2)(y+4)=0$"],["D","坐標平面上與 $A(0,0)$、$B(6,0)$ 的距離比 $\\overline{PA}:\\overline{PB}=1:2$ 的所有點 $P$"],["E","坐標平面上與 $A(0,0)$、$B(6,0)$ 的距離比 $\\overline{PA}:\\overline{PB}=1:1$ 的所有點 $P$"]],"a":"BCD","e":"(A) 圓心 $(2,-3)$，$h^2+k^2-f=4+9-13=0$，圖形是一點，錯。\n(B) 除以 2：$x^2+y^2-2x+4y+\\frac12=0$，$1+4-\\frac12=\\frac92>0$，是圓，對。\n(C) 這是以 $(1,2)$、$(-3,-4)$ 為直徑兩端的直徑式，展開 $x^2+y^2+2x+2y-11=0$，$r^2=1+1+11=13$，是圓，對。\n(D) 距離比不是 1，是圓。一般解：$4(x^2+y^2)=(x-6)^2+y^2$，整理得 $(x+2)^2+y^2=16$，對。\n(E) 距離比 $1:1$ 是 $\\overline{AB}$ 的中垂線 $x=3$，是直線，錯。"},{"i":"b1932","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"m","q":"坐標平面上有兩點 $A(1,-2)$、$B(5,2)$。下列哪些選項正確？","o":[["A","以 $\\overline{AB}$ 為直徑的圓方程式為 $(x-3)^2+y^2=8$"],["B","通過 $A$、$B$ 兩點的所有圓中，面積最小的圓面積為 $8\\pi$"],["C","滿足 $\\angle APB=90^\\circ$ 的所有點 $P$ 所成的圖形，就是整個圓 $x^2+y^2-6x+1=0$"],["D","通過 $A$、$B$ 兩點且圓心在 $y$ 軸上的圓，半徑為 $5$"],["E","通過 $A$、$B$ 兩點且圓心在直線 $x-y=1$ 上的圓為 $(x-2)^2+(y-1)^2=10$"]],"a":"ABE","e":"(A) 圓心是中點 $(3,0)$；$\\overline{AB}^2=4^2+4^2=32$，$r^2=\\frac{32}{4}=8$，對。\n(B) 過兩點的圓中，以這兩點為直徑的圓最小，面積 $8\\pi$，對。\n(C) 展開 (A) 的圓確實是 $x^2+y^2-6x+1=0$，但 $P$ 與 $A$ 或 $B$ 重合時不構成角，所以圖形是這個圓扣掉 $A$、$B$ 兩點，不是整個圓，錯。\n(D) 設圓心 $(0,t)$，$1^2+(t+2)^2=5^2+(t-2)^2$，$t^2$ 消掉後 $8t=24$，$t=3$；$r^2=1+25=26$，半徑 $\\sqrt{26}$，錯。\n(E) $\\overline{AB}$ 的中垂線：中點 $(3,0)$、斜率 $-1$，得 $x+y=3$。與 $x-y=1$ 聯立得圓心 $(2,1)$；$r^2=(1-2)^2+(-2-1)^2=10$。驗算 $B$：$(5-2)^2+(2-1)^2=10$，對。"},{"i":"b1933","s":"數學","u":"單元06","t":"06-點圓最值","k":"m","q":"已知圓 $C:x^2+y^2+6x-8y=0$，點 $P(9,-5)$。下列哪些選項正確？","o":[["A","原點在圓 $C$ 的內部"],["B","點 $(0,9)$ 在圓 $C$ 的內部"],["C","圓 $C$ 上各點與 $P$ 的距離，最小值為 $10$"],["D","圓 $C$ 上各點與 $P$ 的距離，最大值為 $15$"],["E","圓 $C$ 上與 $P$ 的距離為整數的點共有 $20$ 個"]],"a":"CE","e":"圓心 $(-3,4)$，$r^2=9+16-0=25$，$r=5$。\n(A) 常數項是 0，原點代入左邊得 0，在圓上，不是圓內，錯。\n(B) $(0+3)^2+(9-4)^2=34>25$，在圓外，錯。\n(C) $P$ 到圓心 $d=\\sqrt{12^2+9^2}=15>5$，$P$ 在圓外，最小值 $15-5=10$，對。\n(D) 最大值 $15+5=20$；15 是 $P$ 到圓心的距離，錯。\n(E) 距離從 10 到 20：10 和 20 各 1 點，11～19 共 9 個整數各 2 點，$2+18=20$ 個，對。"},{"i":"b1934","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"m","q":"下列哪些選項正確？","o":[["A","設 $A(0,0)$、$B(3,0)$，滿足 $\\overline{PA}=2\\overline{PB}$ 的所有點 $P$ 構成圓心 $(4,0)$、半徑 $2$ 的圓"],["B","某圓拱的跨度（弦長）為 $16$ 公尺、拱高為 $4$ 公尺，則此圓拱所在圓的半徑為 $10$ 公尺"],["C","半徑為 $13$ 的圓中，長度為 $24$ 的弦與圓心的距離為 $5$"],["D","若 $x^2+y^2-4x+2y+k=0$ 的圖形是一個圓，且點 $A(1,2)$ 在此圓的外部，則 $-5<k<5$"],["E","圓心為 $(3,-4)$ 且與 $x$ 軸相切的圓，半徑為 $3$"]],"a":"ABCD","e":"(A) 直線 $AB$ 上找 $\\overline{PA}:\\overline{PB}=2:1$：內分點 $(2,0)$；外分點在 $B$ 外側，$x=2(x-3)$，$x=6$，即 $(6,0)$。兩點為直徑兩端，圓心 $(4,0)$、半徑 2，對。\n(B) $r=\\dfrac{\\text{半寬}^2+\\text{拱高}^2}{2\\times\\text{拱高}}=\\dfrac{8^2+4^2}{8}=10$，對。\n(C) 半弦 12，弦心距 $\\sqrt{13^2-12^2}=5$，對。\n(D) 是圓：圓心 $(2,-1)$，$r^2=4+1-k=5-k>0$，$k<5$。$A$ 在圓外：代入左邊 $1+4-4+4+k=5+k>0$，$k>-5$。合起來 $-5<k<5$，對。\n(E) 與 $x$ 軸相切，半徑等於圓心到 $x$ 軸的距離 $|-4|=4$；3 是到 $y$ 軸的距離，錯。"},{"i":"b1935","s":"數學","u":"單元06","t":"06-讀圓心","k":"f","q":"圓 $x^2+y^2+ax+by-3=0$ 的圓心為 $(2,-1)$，則此圓的半徑為＿＿＿＿。","a":"$2\\sqrt2$","e":"答案 $2\\sqrt2$。圓心 $\\left(-\\frac a2,-\\frac b2\\right)=(2,-1)$，得 $a=-4$、$b=2$。$r^2=2^2+(-1)^2-(-3)=8$，$r=2\\sqrt2$。"},{"i":"b1936","s":"數學","u":"單元06","t":"06-直徑圓","k":"f","q":"以 $A(-3,2)$、$B(5,-4)$ 為直徑兩端點的圓方程式為＿＿＿＿。","a":"$(x-1)^2+(y+1)^2=25$","e":"答案 $(x-1)^2+(y+1)^2=25$。圓心是中點 $\\left(\\frac{-3+5}{2},\\frac{2-4}{2}\\right)=(1,-1)$；$\\overline{AB}^2=8^2+6^2=100$，$r^2=\\frac{100}{4}=25$。"},{"i":"b1937","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"方程式 $x^2+y^2-2kx+4y+2k+7=0$ 的圖形恰為一點，則此點的坐標為＿＿＿＿。","a":"$(3,-2)$ 或 $(-1,-2)$","e":"答案 $(3,-2)$ 或 $(-1,-2)$。圓心 $(k,-2)$，$r^2=k^2+4-(2k+7)=k^2-2k-3=(k-3)(k+1)$。圖形為一點要 $r^2=0$，$k=3$ 或 $k=-1$，點就是圓心 $(k,-2)$。兩個都要寫。"},{"i":"b1938","s":"數學","u":"單元06","t":"06-讀圓心","k":"f","q":"一圓通過 $A(2,5)$、$B(6,1)$ 兩點，且圓心在直線 $2x-y=4$ 上，則此圓的方程式為＿＿＿＿。","a":"$(x-3)^2+(y-2)^2=10$","e":"答案 $(x-3)^2+(y-2)^2=10$。\n方法一（中垂線）：$\\overline{AB}$ 中點 $(4,3)$，斜率 $\\frac{1-5}{6-2}=-1$，中垂線斜率 1：$y=x-1$。與 $2x-y=4$ 聯立：$2x-(x-1)=4$，$x=3$、$y=2$。\n方法二（設圓心）：圓心 $M(t,2t-4)$，$MA^2=MB^2$：$(t-2)^2+(2t-9)^2=(t-6)^2+(2t-5)^2$，$5t^2$ 消掉後 $-40t+85=-32t+61$，$t=3$。\n半徑：$r^2=(2-3)^2+(5-2)^2=10$；驗算 $B$：$(6-3)^2+(1-2)^2=10$。"},{"i":"b1939","s":"數學","u":"單元06","t":"06-三點圓","k":"f","q":"通過 $A(5,7)$、$B(-3,3)$、$C(6,0)$ 三點的圓方程式為＿＿＿＿。","a":"$(x-2)^2+(y-3)^2=25$","e":"答案 $(x-2)^2+(y-3)^2=25$。先檢查有沒有直角：$\\overrightarrow{CA}=(-1,7)$、$\\overrightarrow{CB}=(-9,3)$，內積 $9+21\\ne0$，其他兩角也不是直角，所以用兩條中垂線。\n- $\\overline{AB}$：中點 $(1,5)$，方向 $(-8,-4)$，中垂線 $2(x-1)+(y-5)=0$，即 $2x+y=7$。\n- $\\overline{BC}$：中點 $\\left(\\frac32,\\frac32\\right)$，方向 $(9,-3)$，中垂線 $3\\left(x-\\frac32\\right)-\\left(y-\\frac32\\right)=0$，即 $3x-y=3$。\n- 相加 $5x=10$，圓心 $(2,3)$；$r^2=(5-2)^2+(7-3)^2=25$。驗算 $C$：$16+9=25$。"},{"i":"b1940","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"f","q":"點 $P(6,-2)$、$A(4,2)$、$B$ 都在圓 $x^2+y^2-2x+4y-20=0$ 上，且 $\\angle APB=90^\\circ$，則 $B$ 點坐標為＿＿＿＿。","a":"$(-2,-6)$","e":"答案 $(-2,-6)$。圓心 $M(1,-2)$，$r^2=1+4+20=25$。$\\angle APB=90^\\circ$ 表示 $\\overline{AB}$ 是直徑，$M$ 是 $\\overline{AB}$ 中點：$B=2M-A=(2-4,\\ -4-2)=(-2,-6)$。驗算：$(-2-1)^2+(-6+2)^2=25$，在圓上。"},{"i":"b1941","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"f","q":"設 $A(1,2)$、$B(1,-4)$，坐標平面上滿足 $\\overline{PA}=2\\overline{PB}$ 的所有點 $P$ 構成一個圓，此圓的方程式為＿＿＿＿。","a":"$(x-1)^2+(y+6)^2=16$","e":"答案 $(x-1)^2+(y+6)^2=16$。\n一般解：$(x-1)^2+(y-2)^2=4\\left[(x-1)^2+(y+4)^2\\right]$，整理得 $3(x-1)^2+3y^2+36y+60=0$，除以 3 並配方：$(x-1)^2+(y+6)^2=16$。\n驗算（分點）：$A$、$B$ 在直線 $x=1$ 上，$\\overline{AB}=6$。內分點離 $A$ 為 $\\frac23\\times6=4$，得 $(1,-2)$；外分點在 $B$ 外側，$\\overline{PB}=6$，得 $(1,-10)$。兩點中點 $(1,-6)$，距離的一半 4，相符。"},{"i":"b1942","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"已知點 $P(2,-1)$ 在圓 $(x-3)^2+(y+2)^2=k$ 的內部，點 $Q(-1,1)$ 在此圓的外部，則 $k$ 的範圍為＿＿＿＿。","a":"$2<k<25$","e":"答案 $2<k<25$。圓心 $(3,-2)$，$r^2=k$。$P$ 在內部：$(2-3)^2+(-1+2)^2=2<k$。$Q$ 在外部：$(-1-3)^2+(1+2)^2=25>k$。"},{"i":"b1943","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"圓 $x^2+y^2-10x-24y+160=0$ 上，與原點的距離為整數的點共有＿＿＿＿個。","a":"$12$","e":"答案 $12$。圓心 $(5,12)$，$r^2=25+144-160=9$，$r=3$；原點到圓心 $d=13>3$。距離範圍 $10$～$16$：10 和 16 各 1 點，11～15 共 5 個整數各 2 點，$2+10=12$ 個。"},{"i":"b1944","s":"數學","u":"單元06","t":"06-點圓最值","k":"f","q":"圓 $x^2+y^2-6x-8y-24=0$ 上各點與原點的距離，最大值與最小值依序為＿＿＿＿。","a":"$12$、$2$","e":"答案 $12$、$2$。圓心 $(3,4)$，$r^2=9+16+24=49$，$r=7$；原點到圓心 $d=5<7$，原點在圓內。最大值 $r+d=12$，最小值 $r-d=2$。寫成 $d-r=-2$ 的同學，是沒先判斷原點在圓內。"},{"i":"b1945","s":"數學","u":"單元06","t":"06-圓拱","k":"f","q":"某拱橋的橋拱是一段圓弧，跨度（弦長）為 $24$ 公尺，拱高為 $6$ 公尺。在與橋拱中央水平距離 $9$ 公尺處，立一根垂直於弦的支柱撐到橋拱上，則此支柱的長度為＿＿＿＿公尺。","a":"$3$","e":"答案 $3$。半寬 12、拱高 6：$r=\\dfrac{12^2+6^2}{2\\times6}=15$，圓心在弦的下方 $15-6=9$。取圓心為原點，弦在 $y=9$；支柱在 $x=9$，拱上的點 $y=\\sqrt{15^2-9^2}=12$。支柱長 $12-9=3$ 公尺。"},{"i":"b1946","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"圓 $x^2+y^2-4x+6y-12=0$ 中，通過點 $P(4,-2)$ 的所有弦裡，最短的弦長為＿＿＿＿。\n\n<div class=\"pb\"><\/div>","a":"$4\\sqrt5$","e":"答案 $4\\sqrt5$。圓心 $M(2,-3)$，$r^2=4+9+12=25$。$\\overline{MP}^2=(4-2)^2+(-2+3)^2=5<25$，$P$ 在圓內。過 $P$ 的弦中，與 $\\overline{MP}$ 垂直的那一條弦心距最大（等於 $\\overline{MP}$），所以最短。半弦 $\\sqrt{25-5}=2\\sqrt5$，弦長 $4\\sqrt5$。"},{"i":"b1989","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"孟德爾選用豌豆做遺傳實驗，下列理由何者錯誤？","o":[["A","豌豆可自花授粉，容易得到純品系"],["B","豌豆具有多對容易區分的對比性狀"],["C","豌豆生長期短、子代數量多，便於統計"],["D","豌豆的性狀多屬多基因遺傳，便於觀察連續變化"],["E","豌豆可以人工進行異花授粉"]],"a":"D","e":"答 (D)。〔關鍵〕孟德爾挑的是一對基因、二選一的性狀，不是多基因。〔判斷〕(A)(B)(C)(E) 都是選豌豆的理由。〔易錯〕「連續變化」是多基因遺傳的特徵，和豌豆的圓／皺相反。"},{"i":"b1990","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"純種圓粒豌豆與純種皺粒豌豆雜交，F1 全為圓粒，F1 自花授粉得 F2。下列敘述何者正確？","o":[["A","皺粒是顯性性狀"],["B","F1 的基因型為 RR"],["C","F2 圓粒個體中，同型合子占 1/3"],["D","F2 中皺粒約占 3/4"],["E","F2 的圓粒個體自花授粉，子代都不會出現皺粒"]],"a":"C","e":"答 (C)。〔步驟〕F1 為 Rr；F2 為 RR：Rr：rr＝1：2：1，圓粒 3 份中 RR 占 1 份 → 1/3。〔判斷〕(A) F1 表現的圓粒才是顯性；(B) F1 是 Rr；(D) 皺粒占 1/4；(E) F2 圓粒中的 Rr 自交仍會出現皺粒。〔易錯〕「圓粒中」分母只算 3。"},{"i":"b1991","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"下列哪一項實驗結果，最能說明「遺傳因子不會融合」？","o":[["A","F1 未出現的隱性性狀在 F2 重新出現，且性狀沒有改變"],["B","F1 全部表現顯性性狀"],["C","親代皆為純品系"],["D","F2 子代數量很多"],["E","豌豆可以自花授粉"]],"a":"A","e":"答 (A)。〔關鍵〕若因子會融合，F1 的隱性特徵應該消失或變成中間型；F2 隱性原樣重現，表示因子在 F1 中只是被遮蔽、沒有融合。〔判斷〕(B)～(E) 都只是實驗條件或現象，不能證明不融合。"},{"i":"b1992","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"一株高莖豌豆與一株矮莖豌豆雜交，子代高莖 52 株、矮莖 49 株。此高莖親代的基因型與這種雜交方式分別為何？（高莖 T 對矮莖 t 為顯性）","o":[["A","TT，自交"],["B","TT，試交"],["C","Tt，自交"],["D","tt，試交"],["E","Tt，試交"]],"a":"E","e":"答 (E)。〔步驟〕與矮莖（tt）雜交＝試交；子代高：矮≈1：1，表示高莖親代能產生 t 配子 → Tt。〔判斷〕若為 TT，子代應全為高莖。〔易錯〕和隱性同型合子雜交叫「試交」，不是自交。"},{"i":"b1993","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"兩對基因 A／a、B／b 位於不同對的染色體上，皆為完全顯性。AaBb × AaBb，子代表現型為「A 顯性、b 隱性」（A_bb）的比例為何？","o":[["A","1/16"],["B","3/16"],["C","1/4"],["D","9/16"],["E","3/8"]],"a":"B","e":"答 (B)。〔步驟〕Aa × Aa 得 A_ 機率 3/4；Bb × Bb 得 bb 機率 1/4；相乘 3/4 × 1/4＝3/16。〔易錯〕9/16 是 A_B_，1/16 是 aabb。"},{"i":"b1994","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"基因型為 AaBbCc 的個體，三對基因位於不同對的染色體上。此個體可產生幾種基因組合不同的配子？","o":[["A","3"],["B","6"],["C","8"],["D","9"],["E","27"]],"a":"C","e":"答 (C)。〔步驟〕每對雜合基因產生 2 種配子，三對獨立分配 → 2×2×2＝8。〔易錯〕27 是子代基因型種類（3³），不是配子種類。"},{"i":"b1995","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"一對夫妻的血型分別為 AB 型與 O 型，他們的子女可能是哪些血型？","o":[["A","只有 AB 型"],["B","AB 型或 O 型"],["C","A、B、AB、O 型都可能"],["D","A 型或 B 型"],["E","只有 O 型"]],"a":"D","e":"答 (D)。〔步驟〕AB 型＝$I^AI^B$，O 型＝$ii$；子女為 $I^Ai$（A 型）或 $I^Bi$（B 型），各 1/2。〔易錯〕子女不會是 AB 型（缺另一個顯性基因），也不會是 O 型（AB 型親代沒有 $i$）。"},{"i":"b1996","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"紅綠色盲為 X 染色體上的隱性遺傳。一位色盲女性與色覺正常的男性結婚，下列敘述何者正確？","o":[["A","兒子都是色盲，女兒都是帶因者"],["B","女兒都是色盲"],["C","兒子都色覺正常"],["D","兒子、女兒是色盲的機率各為 1/2"],["E","女兒都色覺正常且不帶因"]],"a":"A","e":"答 (A)。〔步驟〕$X^bX^b$ × $X^BY$：兒子拿母親的 $X^b$ 和父親的 Y → $X^bY$ 全色盲；女兒拿 $X^b$ 和 $X^B$ → $X^BX^b$ 全為帶因者。〔口訣〕母病子必病。"},{"i":"b1997","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"某遺傳疾病的譜系中，一對表現正常的夫妻生下一位患病的女兒。此疾病最可能是下列哪一種遺傳方式？","o":[["A","體染色體顯性遺傳"],["B","體染色體隱性遺傳"],["C","X 染色體隱性遺傳"],["D","X 染色體顯性遺傳"],["E","Y 染色體遺傳"]],"a":"B","e":"答 (B)。〔步驟〕父母正常、孩子患病＝無中生有 → 隱性，排除 (A)(D)；若是 X 隱性，患病女兒 $X^bX^b$ 的父親必為 $X^bY$ 而患病，但父親正常 → 排除 (C)；Y 遺傳不會出現在女兒 → 排除 (E)。〔口訣〕女病父必病。"},{"i":"b1998","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"s","q":"人類的膚色由多對基因共同控制。下列敘述何者正確？","o":[["A","膚色只有兩種明顯不同的類型"],["B","膚色完全不受環境影響"],["C","膚色是不完全顯性的單基因遺傳"],["D","多基因遺傳不遵守孟德爾的分離律"],["E","族群中的膚色呈連續變化"]],"a":"E","e":"答 (E)。〔關鍵〕多基因遺傳的表現型呈連續變化、鐘形分布。〔判斷〕(A) 是單基因的不連續變異；(B) 膚色受日照影響；(C) 不是單基因；(D) 每一對基因仍遵守分離律。"},{"i":"b1999","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"m","q":"（多選）有關遺傳學名詞，下列哪些正確？","o":[["A","等位基因位於同源染色體的相同位置"],["B","基因型相同的個體，表現型一定相同"],["C","同型合子自花授粉，子代不會出現性狀分離"],["D","顯性性狀在族群中一定比隱性性狀常見"],["E","基因型 Aa 的個體稱為異型合子"]],"a":"ACE","e":"答 (ACE)。〔判斷〕(B) 錯，表現型＝基因型＋環境，同卵雙胞胎也有差異；(C) 對，RR 或 rr 只產生一種配子；(D) 錯，顯性只代表雜合時表現出來的那一個，和常見與否無關。"},{"i":"b2000","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"m","q":"（多選）紫茉莉的紅花（RR）與白花（WW）雜交，F1 全為粉紅花（RW）。下列哪些正確？","o":[["A","F1 為粉紅花，證明遺傳因子會融合"],["B","F1 自花授粉，F2 紅花：粉紅花：白花＝1：2：1"],["C","此遺傳方式的 F2 表現型比等於基因型比"],["D","人類 AB 型血型也是不完全顯性的例子"],["E","粉紅花與白花雜交，子代粉紅花：白花＝1：1"]],"a":"BCE","e":"答 (BCE)。〔判斷〕(A) 錯，F2 紅花、白花原樣重現，不是融合；(B)(C) 對，RR：RW：WW＝1：2：1，三種基因型各有不同表現型；(D) 錯，AB 型是共顯性（兩種都表現），不是介於中間；(E) 對，RW × WW → RW：WW＝1：1。"},{"i":"b2001","s":"生物","u":"2-1 性狀的遺傳","t":"遺傳","k":"m","q":"（多選）有關人類性別決定與性聯遺傳，下列哪些正確？","o":[["A","人類子代的性別由精子所帶的性染色體決定"],["B","男性的 X 染色體來自父親"],["C","紅綠色盲男性多於女性，因為男性只要一個隱性基因就會表現"],["D","色盲男性的色盲基因只會傳給女兒"],["E","色覺正常男性的女兒不可能是色盲"]],"a":"ACDE","e":"答 (ACDE)。〔判斷〕(A) 對，卵都帶 X，精子帶 X 或 Y；(B) 錯，男性的 X 來自母親、Y 來自父親；(C) 對；(D) 對，父親的 X 只傳給女兒，給兒子的是 Y；(E) 對，正常父親給女兒 $X^B$，女兒最多是帶因者。"},{"i":"b2002","s":"生物","u":"2-1 性狀的遺傳","t":"2-1 性狀的遺傳-綜合","k":"m","q":"（多選）有關染色體學說，下列哪些正確？","o":[["A","薩頓觀察減數分裂，發現染色體的行為與遺傳因子的行為一致"],["B","摩根以果蠅實驗，支持基因位於染色體上"],["C","同源染色體在減數分裂時分離，可解釋分離律"],["D","不同對的同源染色體自由組合，可解釋獨立分配律"],["E","位於同一條染色體上的兩個基因，一定遵守獨立分配律"]],"a":"ABCD","e":"答 (ABCD)。〔判斷〕(E) 錯，同一條染色體上的基因傾向一起進入配子（連鎖，延伸），獨立分配律的條件是位於不同對的同源染色體上。"},{"i":"b2053","s":"數學","u":"單元06","t":"06-是圓條件","k":"s","q":"方程式 $3x^2+3y^2-12x+18y+3=0$ 的圖形是一個圓，其圓心與半徑為何？","o":[["A","圓心 $(2,-3)$，半徑 $12$"],["B","圓心 $(-2,3)$，半徑 $2\\sqrt3$"],["C","圓心 $(2,-3)$，半徑 $2\\sqrt3$"],["D","圓心 $(6,-9)$，半徑 $\\sqrt{114}$"],["E","圓心 $(2,-3)$，半徑 $\\sqrt{14}$"]],"a":"C","e":"先整式除以 3：$x^2+y^2-4x+6y+1=0$。圓心 $(2,-3)$；$r^2=2^2+(-3)^2-1=12$，$r=\\sqrt{12}=2\\sqrt3$。\n誘答：(A) 把 $r^2=12$ 當成半徑；(B) 圓心忘了變號；(D) 沒先除以 3，用 $-12$、$18$ 讀圓心，$r^2=36+81-3=114$；(E) 用 $4+9+1$，常數項 $+1$ 沒有減掉。"},{"i":"b2054","s":"數學","u":"單元06","t":"06-是圓條件","k":"s","q":"若方程式 $x^2+y^2-2kx+4y+2k^2-6k+9=0$ 的圖形是一個圓，則實數 $k$ 的範圍為何？","o":[["A","$1<k<5$"],["B","$k<1$ 或 $k>5$"],["C","$1\\le k\\le 5$"],["D","$k>5$"],["E","所有實數"]],"a":"A","e":"圓心 $(k,-2)$，$r^2=k^2+(-2)^2-(2k^2-6k+9)=-k^2+6k-5=-(k-1)(k-5)$。是圓要 $r^2>0$：$-(k-1)(k-5)>0$，兩邊乘 $-1$ 不等號反向，$(k-1)(k-5)<0$，得 $1<k<5$。\n(B) 是 $r^2<0$ 的範圍，沒有圖形；(C) 含 $k=1$、$k=5$，此時 $r^2=0$，圖形只是一點；(E) 把 $r^2$ 當成恆正。"},{"i":"b2055","s":"數學","u":"單元06","t":"06-點圓最值","k":"s","q":"設點 $(a,b)$ 在圓 $x^2+y^2+8x-6y+21=0$ 上，則 $a^2+b^2$ 的最小值為何？","o":[["A","$3$"],["B","$9$"],["C","$21$"],["D","$25$"],["E","$49$"]],"a":"B","e":"圓心 $(-4,3)$，$r^2=16+9-21=4$，$r=2$。原點到圓心 $d=\\sqrt{16+9}=5>2$，原點在圓外。圓上點到原點的距離介於 $5-2=3$ 與 $5+2=7$ 之間。$a^2+b^2$ 是距離的平方，最小值 $3^2=9$。\n誘答：(A) 3 是距離，忘了平方；(C) 21 是 $d^2-r^2$；(D) 25 是 $d^2$；(E) 49 是最大值。","d":1},{"i":"b2056","s":"數學","u":"單元06","t":"06-讀圓心","k":"m","q":"已知圓 $C:(x+1)^2+(y-2)^2=18$。下列哪些選項正確？","o":[["A","圓 $C$ 的圓心為 $(-1,2)$"],["B","圓 $C$ 的半徑為 $18$"],["C","圓 $C$ 的面積為 $18\\pi$"],["D","圓 $C$ 的周長為 $6\\sqrt2\\,\\pi$"],["E","點 $(2,-1)$ 在圓 $C$ 的外部"]],"a":"ACD","e":"圓心 $(-1,2)$，$r^2=18$，$r=\\sqrt{18}=3\\sqrt2$。\n(A) 對。(B) 18 是 $r^2$，半徑是 $3\\sqrt2$，錯。(C) 面積 $\\pi r^2=18\\pi$，對。(D) 周長 $2\\pi r=2\\pi\\cdot3\\sqrt2=6\\sqrt2\\,\\pi$，對。(E) $(2+1)^2+(-1-2)^2=9+9=18$，等於 $r^2$，點在圓上，不是外部，錯。"},{"i":"b2057","s":"數學","u":"單元06","t":"06-是圓條件","k":"m","q":"下列哪些方程式的圖形是一個圓？","o":[["A","$x^2+y^2-2x+4y+5=0$"],["B","$3x^2+3y^2-6x+12y-1=0$"],["C","$x^2+2y^2-4x+1=0$"],["D","$x^2+y^2+6x-8y+30=0$"],["E","$(x-2)(x+4)+(y-1)(y+3)=0$"]],"a":"BE","e":"(A) 圓心 $(1,-2)$，$r^2=1+4-5=0$，圖形是一點 $(1,-2)$，錯。\n(B) 除以 3：$x^2+y^2-2x+4y-\\frac13=0$，$r^2=1+4+\\frac13=\\frac{16}{3}>0$，是圓，對。\n(C) $x^2$ 與 $y^2$ 的係數不同（1 與 2），不是圓，錯。\n(D) 圓心 $(-3,4)$，$r^2=9+16-30=-5<0$，沒有圖形，錯。\n(E) 這是以 $(2,1)$、$(-4,-3)$ 為直徑兩端點的直徑式，是圓，對。"},{"i":"b2058","s":"數學","u":"單元06","t":"06-是圓條件","k":"m","q":"已知方程式 $x^2+y^2-2x+4y+k=0$。下列哪些選項正確？","o":[["A","此方程式的圖形為圓的條件是 $k\\le 5$"],["B","當 $k=1$ 時，圖形為半徑 $4$ 的圓"],["C","當 $k=-4$ 時，原點在此圓的內部"],["D","若圖形為圓且原點在圓的外部，則 $0<k<5$"],["E","當 $k=1$ 時，此圓與 $y$ 軸相切"]],"a":"CD","e":"圓心 $(1,-2)$，$r^2=1+4-k=5-k$。\n(A) 是圓要 $5-k>0$，即 $k<5$；$k=5$ 時 $r^2=0$ 只是一點，不能含等號，錯。\n(B) $k=1$ 時 $r^2=4$，半徑是 2，錯。\n(C) $k=-4$ 時 $r^2=9$；原點到圓心距離平方 $1+4=5<9$，原點在圓內，對。（也可把原點代入左式得 $k=-4<0$，代入值為負就在圓內。）\n(D) 原點代入左式得 $k$，在圓外要 $k>0$；再和圓的條件 $k<5$ 取交集，得 $0<k<5$，對。\n(E) $k=1$ 時 $r=2$，圓心到 $y$ 軸的距離是 $|1|=1\\ne2$，不相切；圓心到 $x$ 軸距離 $|-2|=2=r$，與 $x$ 軸相切，錯。"},{"i":"b2059","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"m","q":"坐標平面上有兩點 $A(-2,1)$、$B(4,-7)$。下列哪些選項正確？","o":[["A","以 $\\overline{AB}$ 為直徑的圓方程式為 $(x-1)^2+(y+3)^2=25$"],["B","以 $\\overline{AB}$ 為直徑的圓方程式可寫成 $(x+2)(x-4)+(y-1)(y+7)=0$"],["C","通過 $A$、$B$ 兩點的所有圓中，最小圓的半徑為 $10$"],["D","通過 $A$、$B$ 兩點且圓心在 $x$ 軸上的圓，半徑為 $5\\sqrt2$"],["E","圓 $(x-1)^2+(y+3)^2=25$ 上的每一點 $P$ 都滿足 $\\angle APB=90^\\circ$"]],"a":"ABD","e":"中點 $(1,-3)$，$\\overline{AB}^2=6^2+8^2=100$，$\\overline{AB}=10$，以 $\\overline{AB}$ 為直徑的圓半徑 5。\n(A) $(x-1)^2+(y+3)^2=25$，對。\n(B) 直徑式 $(x-x_1)(x-x_2)+(y-y_1)(y-y_2)=0$，代入得 $(x+2)(x-4)+(y-1)(y+7)=0$，對。\n(C) 過兩點的最小圓就是以 $\\overline{AB}$ 為直徑的圓，半徑 5；10 是直徑，錯。\n(D) $\\overline{AB}$ 斜率 $\\frac{-7-1}{4+2}=-\\frac43$，中垂線斜率 $\\frac34$，過 $(1,-3)$：$y+3=\\frac34(x-1)$。令 $y=0$ 得 $x=5$，圓心 $(5,0)$，$r^2=(5+2)^2+(0-1)^2=50$，$r=5\\sqrt2$，對。\n(E) $A$、$B$ 兩點也在這個圓上，但 $P=A$ 或 $P=B$ 時構不成角，錯。"},{"i":"b2060","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"m","q":"設 $A(0,0)$、$B(6,0)$，坐標平面上滿足 $\\overline{PA}=2\\overline{PB}$ 的所有點 $P$ 構成圓 $\\Gamma$。下列哪些選項正確？","o":[["A","圓 $\\Gamma$ 的圓心為 $(8,0)$"],["B","圓 $\\Gamma$ 的半徑為 $16$"],["C","當 $P$ 在圓 $\\Gamma$ 上移動時，$\\overline{PA}$ 的最大值為 $12$"],["D","當 $P$ 在圓 $\\Gamma$ 上移動時，$\\overline{PA}^{\\,2}$ 的最大值為 $144$"],["E","點 $(8,4)$ 在圓 $\\Gamma$ 上"]],"a":"ACDE","e":"$\\overline{PA}^2=4\\overline{PB}^2$：$x^2+y^2=4\\left[(x-6)^2+y^2\\right]$，整理得 $3x^2+3y^2-48x+144=0$，除以 3：$x^2+y^2-16x+48=0$，即 $(x-8)^2+y^2=16$。\n(A) 圓心 $(8,0)$，對。(B) 16 是 $r^2$，半徑是 4，錯。(C) $A$ 到圓心距離 8，大於 4，$A$ 在圓外，最遠 $8+4=12$，對。(D) $12^2=144$，對。(E) $(8-8)^2+4^2=16$，在圓上，對。\n驗算：$P(12,0)$ 時 $\\overline{PA}=12$、$\\overline{PB}=6$，比值 2:1。"},{"i":"b2061","s":"數學","u":"單元06","t":"06-讀圓心","k":"f","q":"圓 $x^2+y^2+ax+by+c=0$ 通過原點，且圓心為 $(-3,2)$，則此圓的半徑為＿＿＿＿。","a":"$\\sqrt{13}$","e":"答案 $\\sqrt{13}$。圓心 $(-3,2)$ 得 $a=6$、$b=-4$；通過原點，代入得 $c=0$。$r^2=(-3)^2+2^2-0=13$，$r=\\sqrt{13}$。答 13 是把 $r^2$ 當成半徑。"},{"i":"b2062","s":"數學","u":"單元06","t":"06-讀圓心","k":"f","q":"若圓 $x^2+y^2-6x+2y+k=0$ 的半徑為 $4$，則 $k=$＿＿＿＿。","a":"$-6$","e":"答案 $-6$。圓心 $(3,-1)$，$r^2=9+1-k=10-k$。半徑 4 要列 $r^2=16$：$10-k=16$，$k=-6$。誤列 $10-k=4$ 會得 $k=6$。"},{"i":"b2063","s":"數學","u":"單元06","t":"06-是圓條件","k":"f","q":"若方程式 $x^2+y^2+2kx-4y+3k+4=0$ 的圖形是一個圓，則實數 $k$ 的範圍為＿＿＿＿。","a":"$k<0$ 或 $k>3$","e":"答案 $k<0$ 或 $k>3$。圓心 $(-k,2)$，$r^2=k^2+4-(3k+4)=k^2-3k=k(k-3)$。$r^2>0$：$k(k-3)>0$，得 $k<0$ 或 $k>3$。（$k=0$ 或 $3$ 時圖形是一點。）"},{"i":"b2064","s":"數學","u":"單元06","t":"06-是圓條件","k":"f","q":"已知方程式 $x^2+y^2-4x+2y+k=0$ 的圖形是一個圓，且點 $(1,2)$ 在此圓的外部，則實數 $k$ 的範圍為＿＿＿＿。","a":"$-5<k<5$","e":"答案 $-5<k<5$。\n- 是圓：圓心 $(2,-1)$，$r^2=4+1-k=5-k>0$，得 $k<5$。\n- 點 $(1,2)$ 在圓外：代入左式 $1+4-4+4+k=5+k>0$，得 $k>-5$。（或用距離：$(1-2)^2+(2+1)^2=10>5-k$。）\n- 兩者取交集：$-5<k<5$。"},{"i":"b2065","s":"數學","u":"單元06","t":"06-直徑圓","k":"f","q":"以 $A(3,-1)$、$B(-1,5)$ 為直徑兩端點的圓方程式為＿＿＿＿。","a":"$(x-1)^2+(y-2)^2=13$","e":"答案 $(x-1)^2+(y-2)^2=13$。圓心是中點 $\\left(\\frac{3-1}{2},\\frac{-1+5}{2}\\right)=(1,2)$；$r^2=(3-1)^2+(-1-2)^2=4+9=13$。"},{"i":"b2066","s":"數學","u":"單元06","t":"06-讀圓心","k":"f","q":"一圓通過 $A(1,4)$、$B(5,2)$ 兩點，且圓心在直線 $y=x+2$ 上，則此圓的方程式為＿＿＿＿。","a":"$(x-5)^2+(y-7)^2=25$","e":"答案 $(x-5)^2+(y-7)^2=25$。\n- $\\overline{AB}$ 中點 $(3,3)$，斜率 $\\frac{2-4}{5-1}=-\\frac12$，中垂線斜率 2：$y=2x-3$。\n- 圓心在中垂線上也在 $y=x+2$ 上：$2x-3=x+2$，$x=5$，$y=7$。\n- $r^2=(5-1)^2+(7-4)^2=25$。驗算 $B$：$(5-5)^2+(7-2)^2=25$。"},{"i":"b2067","s":"數學","u":"單元06","t":"06-三點圓","k":"f","q":"通過 $(1,1)$、$(7,1)$、$(1,9)$ 三點的圓方程式為＿＿＿＿。","a":"$(x-4)^2+(y-5)^2=25$","e":"答案 $(x-4)^2+(y-5)^2=25$。$(1,1)$ 到 $(7,1)$ 是水平線，$(1,1)$ 到 $(1,9)$ 是鉛直線，兩線垂直，所以 $(1,1)$ 處是直角，斜邊兩端 $(7,1)$、$(1,9)$ 是直徑。圓心為中點 $(4,5)$，直徑 $\\sqrt{6^2+8^2}=10$，$r=5$。"},{"i":"b2068","s":"數學","u":"單元06","t":"06-阿波羅尼斯","k":"f","q":"設 $A(-1,0)$、$B(2,0)$，坐標平面上滿足 $\\overline{PA}=2\\overline{PB}$ 的所有點 $P$ 構成一個圓，則此圓所圍區域的面積為＿＿＿＿。","a":"$4\\pi$","e":"答案 $4\\pi$。$(x+1)^2+y^2=4\\left[(x-2)^2+y^2\\right]$，整理得 $3x^2+3y^2-18x+15=0$，除以 3：$x^2+y^2-6x+5=0$，即 $(x-3)^2+y^2=4$。$r=2$，面積 $\\pi\\cdot2^2=4\\pi$。誤把 $r^2=4$ 當成 $r=4$ 會得 $16\\pi$。"},{"i":"b2069","s":"數學","u":"單元06","t":"06-點圓最值","k":"f","q":"設點 $(a,b)$ 在圓 $x^2+y^2-10x+24y+144=0$ 上，則 $a^2+b^2$ 的最大值與最小值依序為＿＿＿＿。","a":"$324$、$64$","e":"答案 $324$、$64$。圓心 $(5,-12)$，$r^2=25+144-144=25$，$r=5$。原點到圓心 $d=13>5$，在圓外。距離介於 $13-5=8$ 與 $13+5=18$ 之間，平方後最大 $18^2=324$、最小 $8^2=64$。"},{"i":"b2070","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"圓 $(x-6)^2+(y-8)^2=16$ 上，與原點的距離為整數的點共有＿＿＿＿個。","a":"$16$","e":"答案 16。圓心 $(6,8)$，$r=4$，原點到圓心 $d=10>4$。圓上點到原點的距離介於 $6$ 與 $14$ 之間。最近點（距離 6）與最遠點（距離 14）各只有 1 點；$7,8,\\dots,13$ 共 7 個整數，每個整數各對應 2 點。共 $2+7\\times2=16$ 個。"},{"i":"b2071","s":"數學","u":"單元06","t":"單元06-綜合","k":"f","q":"圓 $x^2+y^2-2x-4y-20=0$ 中，通過點 $P(4,-1)$ 的所有弦裡，最短的弦長為＿＿＿＿。","a":"$2\\sqrt7$","e":"答案 $2\\sqrt7$。圓心 $M(1,2)$，$r^2=1+4+20=25$。$\\overline{MP}^2=(4-1)^2+(-1-2)^2=18<25$，$P$ 在圓內。與 $\\overline{MP}$ 垂直的弦，弦心距最大（等於 $\\overline{MP}$），所以最短：半弦 $\\sqrt{25-18}=\\sqrt7$，弦長 $2\\sqrt7$。"},{"i":"b2072","s":"數學","u":"單元06","t":"06-圓拱","k":"f","q":"某拱門的門拱是一段圓弧，兩端落在水平地面上，跨度（弦長）為 $16$ 公尺，拱高為 $4$ 公尺。在與拱門中央水平距離 $6$ 公尺處，立一根垂直於地面的支柱撐到門拱上，則此支柱的長度為＿＿＿＿公尺。\n\n<div class=\"pb\"><\/div>","a":"$2$","e":"以地面上的弦中點為原點，拱頂 $(0,4)$，圓心 $(0,4-r)$。\n- 半徑、半弦、弦心距成直角三角形：$r^2=8^2+(r-4)^2$，展開 $0=64-8r+16$，$r=10$，圓心 $(0,-6)$。\n- 圓：$x^2+(y+6)^2=100$。令 $x=6$：$(y+6)^2=64$，$y+6=8$，$y=2$。\n- 驗算：$x=8$ 時 $(y+6)^2=36$，$y=0$，正好落在地面。支柱長 2 公尺。"},{"i":"b2121","s":"化學","u":"2-2 化學式","t":"2-2-百分組成","k":"s","q":"硝酸銨 $\\mathrm{NH_4NO_3}$ 是常見的氮肥，其中氮的重量百分率為何？","o":[["A","17.5%"],["B","35%"],["C","28%"],["D","33.3%"],["E","40%"]],"a":"B"},{"i":"b2126","s":"化學","u":"2-2 化學式","t":"實驗式取整","k":"s","q":"某種鐵的氧化物含鐵 70.0%、氧 30.0%（重量百分率），其實驗式為何？","o":[["A","FeO"],["B","$\\mathrm{Fe_2O_3}$"],["C","$\\mathrm{FeO_2}$"],["D","$\\mathrm{Fe_3O_4}$"],["E","$\\mathrm{Fe_3O_2}$"]],"a":"B"},{"i":"b2127","s":"化學","u":"2-2 化學式","t":"實驗式取整","k":"s","q":"某碳氫化合物含碳 81.8%、氫 18.2%（重量百分率），其實驗式為何？","o":[["A","$\\mathrm{CH_3}$"],["B","$\\mathrm{C_2H_5}$"],["C","$\\mathrm{C_3H_7}$"],["D","$\\mathrm{C_3H_8}$"],["E","$\\mathrm{C_4H_{10}}$"]],"a":"D"},{"i":"b2128","s":"化學","u":"2-2 化學式","t":"分子式","k":"s","q":"某化合物含碳 40.0%、氫 6.7%、氧 53.3%（重量百分率），分子量為 60，其分子式為何？","o":[["A","$\\mathrm{C_2H_4O_2}$"],["B","$\\mathrm{CH_2O}$"],["C","$\\mathrm{C_3H_6O_3}$"],["D","$\\mathrm{C_2H_6O}$"],["E","$\\mathrm{C_6H_{12}O_6}$"]],"a":"A"},{"i":"b2134","s":"化學","u":"2-2 化學式","t":"實驗式取整","k":"m","q":"有關化學式的敘述，下列哪些正確？","o":[["A","實驗式相同的化合物，各元素的重量百分組成也相同"],["B","只要知道各元素的重量百分組成，就能決定分子式"],["C","氯化鈉沒有獨立的分子，只能用實驗式 NaCl 表示"],["D","葡萄糖 $\\mathrm{C_6H_{12}O_6}$ 與醋酸 $\\mathrm{C_2H_4O_2}$ 的碳重量百分率不同"],["E","分子量必為式量的正整數倍"]],"a":"ACE"},{"i":"b2135","s":"化學","u":"2-2 化學式","t":"2-2-百分組成","k":"m","q":"某碳氫化合物含碳 90.6%、氫 9.4%（重量百分率），分子量為 106。下列敘述哪些正確？","o":[["A","碳與氫的莫耳數比約為 1 : 1.25"],["B","實驗式為 CH"],["C","實驗式為 $\\mathrm{C_4H_5}$"],["D","分子式為 $\\mathrm{C_8H_{10}}$"],["E","分子中碳原子與氫原子的個數比為 5 : 4"]],"a":"ACD"},{"i":"b2138","s":"數學","u":"單元05","t":"05-平行線距離","k":"s","q":"兩平行線 $L_1:3x-4y+2=0$ 與 $L_2:6x-8y-11=0$ 的距離為何？","o":[["A","$\\dfrac{3}{10}$"],["B","$\\dfrac{13}{10}$"],["C","$\\dfrac{13}{5}$"],["D","$\\dfrac{3}{2}$"],["E","$\\dfrac{15}{2}$"]],"a":"D"},{"i":"b2139","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若圓 $C:x^2+y^2-6x+2y+k=0$ 與直線 $3x+4y+5=0$ 相切，則 $k$ 之值為何？","o":[["A","$6$"],["B","$8$"],["C","$-6$"],["D","$4$"],["E","$14$"]],"a":"A"},{"i":"b2140","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"直線 $x-y+k=0$ 與圓 $x^2+y^2=8$ 交於相異兩點，滿足此條件的整數 $k$ 共有幾個？","o":[["A","$3$"],["B","$5$"],["C","$7$"],["D","$9$"],["E","$23$"]],"a":"C"},{"i":"b2141","s":"數學","u":"單元05","t":"05-平行線距離","k":"m","q":"已知直線 $L:2x-y+3=0$，下列敘述哪些正確？","o":[["A","$L$ 的 $x$ 截距為 $\\dfrac{3}{2}$"],["B","$L$ 的斜率為 $2$"],["C","直線 $4x-2y-1=0$ 與 $L$ 平行，且兩線的距離為 $\\dfrac{7\\sqrt5}{10}$"],["D","點 $(1,1)$ 到 $L$ 的距離為 $\\dfrac{4}{5}$"],["E","過點 $(1,1)$ 且與 $L$ 垂直的直線為 $x+2y-3=0$"]],"a":"BCE"},{"i":"b2142","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"設方程式 $x^2+y^2+2kx-4y+2k+7=0$，下列敘述哪些正確？","o":[["A","$k=4$ 時圖形為圓，圓心為 $(-4,2)$、半徑為 $\\sqrt5$"],["B","$k=0$ 時圖形為圓"],["C","$k=5$ 時圖形為圓，半徑為 $12$"], w":"escalator","p":"n.[C]","z":"電扶梯","c":"take/ride the escalator","s":"R2"},{"w":"ordinary","p":"adj.","z":"普通的","c":"an ordinary day／person","s":"R2"},{"w":"motivate","p":"vt.","z":"激勵；鼓勵","c":"motivate sb. to V；be motivated to V","s":"R2"},{"w":"spark","p":"n.[C]","z":"火花","c":"add a spark to；a spark of hope","s":"R2"},{"w":"activity","p":"n.[C]","z":"活動","c":"outdoor／daily activities","s":"R2"},{"w":"promote","p":"vt.","z":"促進","c":"promote health／behavior／a product","s":"R2"},{"w":"perfect","p":"adj.","z":"完美的","c":"the perfect way to V","s":"R2"},{"w":"ignore","p":"vt.","z":"忽視","c":"ignore a signal／a message","s":"R2"},{"w":"avoid","p":"vt.","z":"避免","c":"avoid + V-ing（❌ avoid to V）","s":"R2"},{"w":"daily","p":"adj./adv.","z":"日常的／每天","c":"daily life／daily routine","s":"R2"},{"w":"reward","p":"n./vt.","z":"回報；獎賞","c":"reward sb. for／with","s":"R2"},{"w":"creative","p":"adj.","z":"有創意的","c":"a creative idea／way","s":"R2"},{"w":"perform","p":"vt./vi.","z":"表演；執行","c":"perform a dance／a task","s":"R2"},{"w":"behavior","p":"n.[U]","z":"行為","c":"positive／good behavior","s":"R2"},{"w":"eager","p":"adj.","z":"渴望的","c":"be eager to V／be eager for N","s":"R2"},{"w":"crowded","p":"adj.","z":"擁擠的","c":"a crowded station；be crowded with","s":"R2"},{"w":"obviously","p":"adv.","z":"顯然地","c":"常當插入語，前後加逗號","s":"R2"},{"w":"produce","p":"vt.","z":"生產；發出","c":"produce a sound／goods","s":"R2"},{"w":"for the better","p":"phr.","z":"好轉；往好的方向","c":"","s":"R2"},{"w":"take action","p":"phr.","z":"採取行動","c":"","s":"R2"},{"w":"put up","p":"phr.","z":"設立；設置","c":"","s":"R2"},{"w":"thanks to","p":"phr.","z":"幸虧；多虧","c":"","s":"R2"},{"w":"rather than","p":"phr.","z":"而非","c":"","s":"R2"},{"w":"turn out to be","p":"phr.","z":"結果是；原來是","c":"","s":"R2"},{"w":"head straight for","p":"phr.","z":"直奔（某處）","c":"","s":"R2"},{"w":"choose A over B","p":"phr.","z":"選 A 不選 B","c":"","s":"R2"},{"w":"be willing to V","p":"phr.","z":"願意做…","c":"","s":"R2"},{"w":"join in","p":"phr.","z":"加入（活動）","c":"","s":"R2"}],"notes":{"數學":"## 全題型速查（單元05–07，24 型）\n| 代號 | 題型 | 看到 | 就做 |\n|---|---|---|---|\n| A | 斜率、截距 | 斜率、截距 | $m=-\\dfrac ab$；截距令另一個變數為 0 |\n| B | 求直線 | 過兩點、兩截距 | 點斜式；$\\dfrac xa+\\dfrac yb=1$ |\n| C | 平行、垂直 | 平行、垂直 | 平行 $ax+by+k$；垂直 $bx-ay+k$ |\n| D | 平移 | 右移、上移 | $x\\to x-h$、$y\\to y-k$ |\n| E | 距離 | 點到線、兩平行線 | 距離公式（係數先調成一樣） |\n| F | 中垂線、對稱點 | 中垂線、對稱 | 中點＋垂直 |\n| G | 判號 | 同側、異側、相交 | 代入看正負，乘積 <0 是兩側 |\n| H | 面積、定點 | 圍成面積、恆過定點 | $\\dfrac12\\lvert ad-bc\\rvert$；整理成 (…)＋k(…)＝0 |\n| I | 讀圓 | 圓心、半徑 | 配方；括號變號 |\n| J | 是不是圓 | 「表示一圓」 | $r^2>0$ |\n| K | 直徑式 | 以 AB 為直徑、∠APB＝90° | 中點、$r^2=\\dfrac{AB^2}{4}$ |\n| L | 求圓 | 三點、圓心在某線上 | 一般式聯立；設圓心 |\n| M | 阿波羅尼斯圓 | PA:PB＝m:n | 套公式：圓心 $=\\dfrac{m^2B-n^2A}{m^2-n^2}$、$r=\\dfrac{mn\\cdot\\overline{AB}}{\\lvert m^2-n^2\\rvert}$（比例平方、交叉配點） |\n| N | 點與圓 | 圓內、圓外、切線幾條 | 代入看正負：0／1／2 條 |\n| O | 最遠最近 | 圓上的點到 P 或直線 | $\\overline{PC}\\pm r$、$d\\pm r$（相交時最近 0） |\n| P | 圓拱 | 拱橋、弓形 | $(r-h)^2+(\\tfrac L2)^2=r^2$ |\n| 07-2 | 含 k 的範圍 | 相交、相切、不相交 | 近 2、等 1、遠 0 |\n| 07-3 | 弦長 | 弦長、截得線段 | $2\\sqrt{r^2-d^2}$；反求先除以 2 |\n| 07-4 | 弦長範圍 | 過圓內一點的弦 | 最長直徑、最短 ⊥OP |\n| 07-5 | 和軸相切 | 與 x 軸／y 軸相切 | 切哪條軸看另一個坐標 |\n| 07-6 | 兩條平行線 | 兩線都相切 | 直徑＝兩線距離，圓心在中間線 |\n| 07-7 | 多選 | 多選題 | 每個選項各算一次 |\n| 07-8 | 切線 | 切線方程式 | $x_0x+y_0y=r^2$；已知斜率有兩條 |\n| 07-端點 | $x=c$、$y=c$ | 鉛直、水平線 | 看 $c$ 在不在「圓心 ± r」之間 |\n\n## 單元05 直線方程式\n> [!important] 🔑 考前核心\n> - 斜率 $m=\\dfrac{y_2-y_1}{x_2-x_1}$；點斜式 $y-y_0=m(x-x_0)$，**$x_0$ 跟 $x$ 配、$y_0$ 跟 $y$ 配**。\n> - 平行：$ax+by+c=0$ → $ax+by+k=0$；垂直：→ $bx-ay+k=0$（係數對調、改一個號），$k$ 用點代入。\n> - 點到直線 $d=\\dfrac{|ax_0+by_0+c|}{\\sqrt{a^2+b^2}}$；兩平行線 $d=\\dfrac{|c_1-c_2|}{\\sqrt{a^2+b^2}}$。\n> - 三角形面積 $\\dfrac12|ad-bc|$（先把一個頂點移到原點）。\n> - 平分三角形面積的直線＝過頂點與**對邊中點**的中線。\n\n> [!warning] ⚠️ 你的易錯（錯題紀錄）\n> - 平行線距離：**先把 $x,y$ 係數調成一樣**再減常數，分母要**開根號**（已錯 8 次）。\n> - 面積公式 $bc$ 是負的時候，$ad-bc$ 會變加。\n> - 求 $x$ 截距令 $y=0$，移項要變號；截距式 $\\dfrac xa+\\dfrac yb=1$ 的 $a,b$ 是截距不是係數。\n> - 「含邊界」要有等號。\n\n**一句話帶走**：先調係數、再代公式、分母記得根號。\n\n## 單元06 圓方程式\n> [!important] 🔑 考前核心\n> - 標準式 $(x-h)^2+(y-k)^2=r^2$：圓心 $(h,k)$——**括號裡變號**，半徑是 $\\sqrt{r^2}$。\n> - 一般式 $x^2+y^2+dx+ey+f=0$：圓心 $\\left(-\\dfrac d2,-\\dfrac e2\\right)$，$r^2=\\dfrac{d^2+e^2-4f}{4}$；**是圓 ⇔ $r^2>0$**。\n> - 直徑端點 $A,B$：圓心＝中點，$r=\\dfrac{AB}{2}$。\n> - 過兩點且圓心在某直線上：圓心＝**兩點中垂線**與該直線的交點（中點不是圓心）。\n> - 圓外（內）一點到圓上的點：最遠 $d+r$、最近 $|d-r|$。\n\n> [!warning] ⚠️ 你的易錯\n> - $(x+3)^2$ 的圓心 $x$ 坐標是 $-3$；$r^2=9$ 時 $r=3$ 不是 9。\n> - 問 $k$ 範圍先寫「是圓」條件，再看題目要的條件，兩個取交集。\n\n**一句話帶走**：看到圓先寫圓心和 $r$，兩個都寫對才往下算。\n\n## 單元07 圓與直線的關係\n> [!important] 🔑 考前核心\n> - 圓心到直線距離 $d$ 與 $r$ 比：$d<r$ 交兩點、$d=r$ 相切（1 點）、$d>r$ 不相交。\n> - 弦長 $=2\\sqrt{r^2-d^2}$（**半弦要乘 2**）。\n> - 切線段長 $=\\sqrt{(\\text{點到圓心距離})^2-r^2}$。\n> - 圓上一點的切線：法向量＝圓心指向切點的向量。\n> - $\\angle APB=90^\\circ$ ⇔ $P$ 在以 $AB$ 為直徑的圓上（要代入圓，不是直線）。\n\n| 題目說 | 列式 |\n|---|---|\n| 相切 | $d=r$（通常兩個 $k$） |\n| 交兩點 | $d<r$ |\n| 不相交 | $d>r$，再加「是圓」條件 |\n| 至少一個交點 | $d\\le r$ |\n\n> [!warning] ⚠️ 你的易錯\n> - 直線剛好在「圓心 ± r」的位置＝相切，**算 1 個交點**（已錯 10 次）。\n> - 絕對值拆開有兩個答案，$|k+a|=b$ → $k=-a\\pm b$，記得變號。\n> - 多選每個選項都要代入驗算。\n\n**一句話帶走**：所有題目都回到「$d$ 跟 $r$ 比大小」。","國文":"## L5 師說\n> [!important] 🔑 考前核心\n> - 韓愈：唐代古文運動領袖，唐宋八大家之首；蘇軾稱他「文起八代之衰」。本文贈李蟠（「不拘於時」）。\n> - 主旨：闡明從師問道的重要，批評士大夫「恥學於師」。\n> - 名句：「師者，所以傳道受業解惑也」「無貴無賤，無長無少，道之所存，師之所存也」「聞道有先後，術業有專攻」。\n> - 三組對比：古之聖人／今之眾人；為子擇師／於其身恥師；巫醫樂師百工／士大夫之族。\n> - 孔子師郯子、萇弘、師襄、老聃 → 「聖人無常師」。\n\n| 字詞 | 意思 |\n|---|---|\n| 所以傳道 | 用來…的（憑藉） |\n| 句讀（ㄉㄡˋ） | 文章斷句 |\n| 六藝經傳 | 六藝＝六經（詩書禮樂易春秋）；傳＝解釋經的文字 |\n| 不恥相師 | 不以互相學習為恥（恥：意動用法） |\n| 小學而大遺 | 小的（句讀）學了，大的（解惑）丟了 |\n| 師道之不傳 | 之：取消句子獨立性 |\n\n**一句話帶走**：有道的人就是老師，跟年紀地位無關。\n\n## L6 發現事理的樂趣\n> [!important] 🔑 考前核心\n> - 費曼：美國物理學家，1965 年諾貝爾物理獎；本文是訪談整理（對照課本題解）。\n> - 父親的教法：帶他觀察、把數字換成看得見的畫面、知道名稱不等於了解事物。\n> - 主旨：真正的樂趣來自「弄懂事情」本身，不是頭銜或獎項。\n> - 文體：口語化的說明／議論，用生活例子講道理。\n\n**一句話帶走**：知道名字不算懂，會問「為什麼」才算。\n\n## L7 范進中舉\n> [!important] 🔑 考前核心\n> - 吳敬梓《儒林外史》：清代章回體諷刺小說，沒有貫穿全書的主角，批判科舉與功名利祿。\n> - 情節：范進中秀才 → 向胡屠戶借盤纏被罵 → 中舉 → 喜極而瘋 → 胡屠戶一巴掌打醒 → 張鄉紳送銀送屋。\n> - 胡屠戶**前倨後恭**：「現世寶」「尖嘴猴腮」→「賢婿老爺」「天上的星宿」。\n> - 手法：對比（中舉前後）、誇飾（發瘋）、白描、借人物言行自己露出醜態（不直接評論）。\n> - 科舉次序：童生 →（院試）秀才 →（鄉試）舉人 →（會試）貢士 →（殿試）進士。\n\n**一句話帶走**：人沒變，變的是別人的嘴臉——諷刺的是整個社會。\n\n## L8 孔乙己\n> [!important] 🔑 考前核心\n> - 魯迅（周樹人），小說集《吶喊》；背景魯鎮咸亨酒店。\n> - 敘事者：酒店小伙計「我」，第一人稱**旁觀者**，冷眼記錄。\n> - 孔乙己是「站著喝酒而穿長衫的唯一的人」：沒進學卻放不下讀書人身分。\n> - 細節：「竊書不能算偷」、茴字四種寫法、分茴香豆給孩子、被丁舉人打斷腿、粉板上的十九個錢。\n> - 主旨：批判科舉制度對讀書人的毒害，以及眾人的冷漠（笑聲貫穿全文）。\n\n| 比較 | 范進 | 孔乙己 |\n|---|---|---|\n| 結果 | 中舉，一夕翻身 | 連秀才都沒中，潦倒而終 |\n| 眾人態度 | 前倨後恭 | 始終取笑 |\n| 筆調 | 誇張的喜劇式諷刺 | 冷靜的悲劇 |\n| 共同點 | 都是科舉制度的受害者，都寫出世態炎涼 | |\n\n**一句話帶走**：孔乙己是沒中舉的范進。","英文":"## 關係子句（L4）\n> [!important] 🔑 考前核心\n> - 人 who／whom／whose；物 which／whose；人或物都可用 that。\n> - **只能用 that**：先行詞有 the only、the first、最高級、all、人＋物。\n> - **不能用 that**：逗號後面（非限定）、介系詞後面。\n> - 關代當受詞可省略；當主詞不可省。\n> - 子句動詞單複數看**先行詞**；子句內不能再放一次代名詞（it／him）。\n\n| 用法 | 例句 | 中文 |\n|---|---|---|\n| 主格 who（人） | The boy **who** won the race is my brother. | 贏得比賽的男孩是我弟弟。 |\n| 受格 which（物，可省略） | The book (**which**) I bought is interesting. | 我買的那本書很有趣。 |\n| 所有格 whose ＋名詞 | The girl **whose** bag was stolen called the police. | 包包被偷的女孩報了警。 |\n| 非限定（有逗號） | My father**, who** is a doctor, works in Taipei. | 我爸爸是醫生，他在臺北工作。 |\n| 只能用 that | He is the only student **that** passed. | 他是唯一通過的學生。 |\n\n> [!warning] ⚠️ 你的易錯\n> - 改錯順序：先查動詞 → 再查多餘的代名詞 → 最後才查關代。\n> - whose 後面一定要緊接名詞。\n> - 合併句子時，關係子句要**緊貼**先行詞。\n\n**合併句子三步驟**：找兩句重複的名詞 → 把第二句的那個名詞換成關代、移到句首 → 整個子句插到第一句那個名詞的正後方。\n\n## 使役動詞與 because（L5）\n> [!important] 🔑 考前核心\n> - make／have／let ＋受詞＋**原形動詞**；get ＋受詞＋ **to V**。\n> - 受詞是「被做」的：have／get ＋物＋ **p.p.**（have my hair cut）。\n> - help ＋受詞＋（to）V。\n> - because ＋**子句**；because of ＋**名詞／V-ing**。\n> - because 與 so 不能同時用；although 與 but 不能同時用。\n\n| 用法 | 例句 | 中文 |\n|---|---|---|\n| make ＋人＋原形 | The movie **made** me **cry**. | 那部電影讓我哭了。 |\n| have ＋人＋原形 | I **had** my brother **carry** the box. | 我叫弟弟搬箱子。 |\n| let ＋人＋原形 | My parents **let** me **stay** up late. | 爸媽讓我熬夜。 |\n| get ＋人＋ to V | She **got** him **to help** her. | 她說服他幫忙。 |\n| have ＋物＋ p.p. | I **had** my phone **repaired**. | 我把手機送修了。 |\n| because ＋子句 | We stayed home **because** it rained. | 因為下雨，我們待在家。 |\n| because of ＋名詞 | We stayed home **because of** the rain. | 因為那場雨，我們待在家。 |\n\n**判斷受詞後面用什麼**：受詞自己做動作 → 原形（get 用 to V）；受詞是被做的 → p.p.。\n\n## 強調句與 so／such…that（L6）\n> [!important] 🔑 考前核心\n> - It is／was ＋強調部分＋ that ＋其餘：拿掉 It is…that 句子仍完整。\n> - so ＋ **adj／adv** ＋ that；such ＋（a／an）＋ adj ＋ **名詞** ＋ that。\n> - so many／much／few／little ＋名詞 ＋ that（有數量詞用 so）。\n> - too…to V（太…而不能）＝ so…that…cannot。\n\n| 用法 | 例句 | 中文 |\n|---|---|---|\n| 強調主詞 | **It was** Amy **that** called you last night. | 昨晚打給你的是 Amy。 |\n| 強調時間 | **It was** last night **that** Amy called you. | Amy 是昨晚打給你的。 |\n| 強調地點 | **It is** in this park **that** we first met. | 我們就是在這座公園初次見面。 |\n| so ＋ adj | The test was **so** hard **that** nobody passed. | 考試難到沒人及格。 |\n| such ＋名詞 | It was **such** a hard test **that** nobody passed. | 那是很難的考試，沒人及格。 |\n| too…to | The tea is **too** hot **to** drink. | 茶太燙不能喝。 |\n\n**強調句檢查法**：把 It is／was 和 that 拿掉，剩下的字重新排回去是完整句子，就是強調句。\n\n| 句型 | 後面接 |\n|---|---|\n| so | 形容詞、副詞 |\n| such | 名詞片語 |\n| because | 子句 |\n| because of | 名詞 |\n\n## 單字（L4–L6、R2、高頻字彙 Basic U3–U4）\n> [!important] 🔑 考前核心\n> - 衍生字先用中文說出「這個名詞指什麼」：人或機器 -or／-er、做的事 -ion、本事 -ity（creator／creation／creativity）。\n> - to 後面：ability／manage to ＋原形；be exposed／due／sensitive to ＋名詞或 V-ing。\n> - turn out（to be）結果是；turn into 變成；end up ＋ V-ing 最後落得。\n> - 高頻 U3：ensure ＋事（＝make sure）、assure ＋人、insure 投保；be equivalent to ＋名詞；take possession of 占有。\n> - 高頻 U4：an abundance of ＋名詞；on a tight budget 手頭緊；broaden one's horizons 擴展視野；go sightseeing（不加 to）。\n\n| 一字多義 | 意思 | 例 |\n|---|---|---|\n| take in | 欣賞、參觀／吸收、領會／欺騙 | take in the views；be taken in by sb. |\n| steep | 陡峭的／（價格）過高的／浸泡 | a steep hill；a steep price；be steeped in |\n| property | 財產／房地產／特質 | intellectual property；healing properties |\n| budget | 預算／編列預算／價格低廉的 | within budget；a budget hotel |\n\n| 易混 | 分辨 |\n|---|---|\n| ensure／assure／insure | 確保某事／向某人保證／投保 |\n| owner／ownership | 擁有的人／擁有權 |\n| rural／urban | 鄉村的／都市的 |\n| possess／possession | 動詞擁有／名詞所有物 |\n\n> [!warning] ⚠️ 你的易錯\n> - 拼字漏掉非重音的母音（locate、complete）——照音節一段一段寫。\n> - 重寫句子時漏抄 the、my、on。","化學":"> 二段範圍：**2-1～3-2**（Ch02 全章＋Ch03 的 3-1 溶液、3-2 濃度；2026-11-12 使用者確認）。莫耳換算是 2-3 的工具，照樣要會。\n\n## 2-1 化學鍵\n> [!important] 🔑 考前核心\n> - 離子鍵：金屬＋非金屬，電子**轉移**，陰陽離子靜電吸引。\n> - 共價鍵：非金屬＋非金屬，**共用**電子對；H 湊 2 個、其他湊 8 個（八隅體）。\n> - 金屬鍵：金屬陽離子＋自由電子（電子海）→ 導電、延展。\n> - 離子化合物固態不導電，熔融或水溶液導電。\n> - 共價網狀固體（鑽石、石墨、$\\mathrm{SiO_2}$、SiC）沒有獨立分子，熔點很高；分子物質熔點低。\n\n| 物質 | 共用電子對 | 孤對電子（中心原子） |\n|---|---|---|\n| $\\mathrm{CH_4}$ | 4 | 0 |\n| $\\mathrm{NH_3}$ | 3 | 1 |\n| $\\mathrm{H_2O}$ | 2 | 2 |\n| $\\mathrm{N_2}$ | 3（參鍵） | 各 1 |\n\n**離子化合物化學式**：電荷數交叉、約分；多原子離子不只一個要加括號，例如 $\\mathrm{Ca(OH)_2}$、$\\mathrm{Al_2(SO_4)_3}$。\n\n## 2-2 化學式\n> [!important] 🔑 考前核心\n> - 實驗式：最簡整數比；分子式＝（實驗式）$_n$，$n$＝分子量÷實驗式量。\n> - 求實驗式三步：質量 ÷ 原子量 → 全部除以最小值 → **有小數就整組乘倍數**。\n> - 百分組成＝下標 × 原子量 ÷ 分子量 × 100%。\n> - 離子化合物、金屬、網狀固體只有實驗式。\n\n| 除完的小數 | 整組乘 |\n|---|---|\n| .5 | 2 |\n| .33、.67 | 3 |\n| .25、.75 | 4 |\n| .2、.4、.6、.8 | 5 |\n\n> [!warning] ⚠️ 你的易錯（已錯 11 次）\n> - 1.5 不可以進位成 2、1.33 不可以捨成 1。\n> - 乘倍數是**每個數字都乘**，不是只乘有小數的那個。\n> - 除法要算到小數第二位再判斷。\n\n## 2-3 反應式與化學計量\n> [!important] 🔑 考前核心\n> - 平衡靠**原子不滅**：只能改係數，**不能改下標**；最複雜的物質先設 1，O 通常最後平衡。\n> - 係數比＝粒子數比＝莫耳數比＝（同溫同壓的氣體）體積比；**不是質量比**。\n> - 計量四步：①列式 ②平衡 ③全部換成莫耳 ④用係數比換到目標；跨物質只能走莫耳。\n> - 限量試劑：各反應物算「莫耳數 ÷ 係數」，**比值小的先用完**；產量由它決定。\n> - 〔延伸〕產率＝實際 ÷ 理論 × 100%；STP 1 mol 氣體 22.4 L（題目給哪個數字就用哪個）。\n\n| 已知 | 先做 | 再做 |\n|---|---|---|\n| 質量 | ÷ 莫耳質量 → 莫耳 | × 係數比 → 目標莫耳 → × 目標莫耳質量 |\n| 兩個反應物的量 | 各算 莫耳數 ÷ 係數 | 小的是限量試劑，用它算產量 |\n\n**例**：$\\mathrm{2H_2+O_2\\rightarrow2H_2O}$，8 g $\\mathrm{O_2}$ → 0.25 mol → 水 0.5 mol → 9 g。質量比是 1：8：9，不是 2：1：2。\n\n## 2-4 化學反應熱\n> [!important] 🔑 考前核心\n> - $\\Delta H$＝生成物熱含量－反應物熱含量（永遠後減前）。\n> - $\\Delta H>0$ 吸熱、外界變冷；$\\Delta H<0$ 放熱、外界變熱。斷鍵吸能、成鍵放能。\n> - 熱寫進式子裡：在左邊（反應物側）＝吸熱，在右邊＝放熱，數字永遠寫正的。\n> - 逆寫 → $\\Delta H$ 變號；係數 ×n → $\\Delta H$ ×n。\n> - 吸熱 ≠ 需要加熱（八水合氫氧化鋇＋氯化銨室溫就反應、讓水結冰）。\n\n| 題目給 | 動作 |\n|---|---|\n| 質量，問放多少熱 | 質量 ÷ 莫耳質量 → ÷ 係數 → × $\\lvert\\Delta H\\rvert$ |\n| 反應倒過來寫 | $\\Delta H$ 變號 |\n| 係數變成一半 | $\\Delta H$ 也除以 2 |\n| 能量圖 | $\\Delta H$＝右（生成物）高度－左（反應物）高度 |\n\n> [!note] 〔延伸〕活化能、鍵能計算、卡計 $q=ms\\Delta T$、赫斯定律：課本 2-4 沒教，對照老師上課範圍。\n\n一句話帶走：**化學計量永遠走莫耳；反應熱跟著係數走，倒過來就變號。**\n\n## 3-1 溶液的種類與特性\n> [!important] 🔑 考前核心\n> - 溶液一定是均勻的混合物，可以是液態（糖水）、固態（合金）或氣態（空氣）。\n> - 膠體粒子約 1～1000 nm：廷得耳效應（散射光）、布朗運動、帶電（加電解質會凝聚，豆漿變豆花）。\n> - 導電能力看「可移動離子的總濃度」：同濃度 $\\mathrm{K_2SO_4}$＞NaCl＞醋酸＞蔗糖。\n> - 電解質不等於離子化合物：HCl 是共價分子，溶於水才解離。\n\n| 物質類別 | 溶於水 | 例子 |\n|---|---|---|\n| 離子化合物 | 強電解質 | NaCl、$\\mathrm{K_2SO_4}$、$\\mathrm{CaCl_2}$ |\n| 強酸、強鹼 | 強電解質 | HCl、$\\mathrm{HNO_3}$、NaOH |\n| 弱酸、弱鹼 | 弱電解質（部分解離） | 醋酸、$\\mathrm{NH_3}$ |\n| 其他分子物質 | 非電解質 | 蔗糖、葡萄糖、酒精 |\n\n## 3-2 水溶液的濃度\n> [!important] 🔑 考前核心\n> - 三種濃度都是「溶質 ÷ 溶液」：重量百分率（×100）、ppm（×10⁶，水溶液就是 mg/kg）、莫耳濃度 M（mol ÷ L）。\n> - 給 % 就假設溶液 100 g；給 M 就假設溶液 1 L；給 ppm 就假設 1 kg。\n> - % 換 M：$C_M=\\dfrac{1000\\times d\\times w}{\\text{分子量}}$（d 用 g/mL，w 寫成小數）。\n> - 稀釋：溶質不變，$C_1V_1=C_2V_2$；混合：溶質相加，體積要題目說可加成才加。\n\n| 驗算 | 代入 | 結果 |\n|---|---|---|\n| 36.5% 鹽酸，d＝1.2 | $1000\\times1.2\\times0.365\\div36.5$ | 12 M |\n| 98% 濃硫酸，d＝1.84 | $1000\\times1.84\\times0.98\\div98$ | 18.4 M |\n\n> [!warning] ⚠️ 易錯\n> - 分母是溶液，不是溶劑（20 g 糖＋80 g 水是 20%，不是 25%）。\n> - mL 要換成 L 才能算 M。\n\n一句話帶走：**濃度永遠是「溶質 ÷ 溶液」；稀釋、混合都抓「溶質的量不變」。**","生物":"## 1-3 細胞週期與細胞分裂\n> [!important] 🔑 考前核心\n> - 間期（G1、S、G2）最長，**DNA 在 S 期複製**；分裂期＝有絲分裂＋細胞質分裂。\n> - 複製後一條染色體＝兩條姊妹染色分體，**染色體數不變、DNA 量加倍**。\n> - 有絲分裂：1 次分裂，2 個子細胞，2n → 2n。\n> - 減數分裂：複製 1 次、分裂 2 次，4 個子細胞，2n → n；**減 I 同源染色體分離、減 II 姊妹染色分體分離**，減 II 之前不再複製。\n> - 聯會、四分體、互換只在減 I 前期；發生在生殖腺。\n\n| 比較 | 有絲分裂 | 減數分裂 |\n|---|---|---|\n| 分裂次數 | 1 | 2 |\n| 子細胞 | 2 個、2n | 4 個、n |\n| 聯會 | 無 | 有 |\n| 功能 | 生長、修補 | 產生配子 |\n\n> [!warning] ⚠️ 你的易錯\n> - 數染色體看**著絲點**數；精原細胞 1 個 → 精子 4 個，卵原細胞 1 個 → 卵 1 個＋極體。\n\n## 2-1 性狀的遺傳\n> [!important] 🔑 考前核心\n> - 分離律：成對的等位基因在形成配子時分開；獨立分配律：不同對的基因自由組合。\n> - Aa × Aa → 基因型 1：2：1、表徵 3：1；試交＝與隱性純種交配。\n> - 不完全顯性：異型合子呈中間型；共顯性：兩種都表現（AB 血型）。\n> - ABO 血型：複等位基因（$I^A$、$I^B$、$i$），$I^A$、$I^B$ 共顯性。\n> - 性聯遺傳（紅綠色盲、血友病）：基因在 X 上，男性只要一個就表現；父親的 X 一定傳女兒。\n\n## 2-2 遺傳物質\n> [!important] 🔑 考前核心\n> - 核苷酸＝磷酸＋五碳醣＋含氮鹼基；DNA 雙股螺旋，A＝T、G≡C。\n> - DNA：去氧核糖、T、雙股；RNA：核糖、U、單股。\n> - 半保留複製：新 DNA 一股舊、一股新。\n> - 中心法則：DNA →（轉錄，細胞核）mRNA →（轉譯，核糖體）蛋白質；三個鹼基決定一個胺基酸。\n> - 基因＝DNA 上一段有遺傳訊息的片段。","地理":"## 3-2 地形\n> [!important] 🔑 考前核心\n> - 內營力（板塊運動、褶皺、斷層、火山）使地表起伏變大；外營力（風化、侵蝕、搬運、堆積）把地表削平。\n> - 板塊邊界：張裂（中洋脊、裂谷）、聚合（海溝、褶曲山脈、火山島弧）、錯動（轉形斷層）。\n> - 斷層：正斷層（張力，上盤下移）、逆斷層（壓力，上盤上移）、平移斷層。\n> - 物理風化＝崩解、成分不變（乾燥、高寒區）；化學風化＝成分改變（濕熱區）。\n> - 等高線越密坡越陡；等高線凸向高處是谷、凸向低處是稜。\n\n| 營力 | 侵蝕地形 | 堆積地形 |\n|---|---|---|\n| 河流 | V 形谷、瀑布、曲流、河階 | 沖積扇、氾濫平原、三角洲 |\n| 海岸 | 海崖、海蝕平臺、海蝕洞、海拱 | 沙灘、沙洲、潟湖、陸連島 |\n| 冰河 | U 形谷、冰斗、角峰、峽灣 | 冰磧丘、鼓丘 |\n| 風 | 蕈狀岩、風稜石、礫漠 | 沙丘、黃土 |\n| 溶蝕（石灰岩） | 滲穴、石林、峰林 | 鐘乳石、石筍 |\n\n> [!warning] ⚠️ 你的易錯\n> - 看到「沖離原位」＝侵蝕；看到「停下累積」才是堆積。\n> - 谷灣是河谷被海水淹沒；峽灣是冰河 U 形谷被海水淹沒。\n\n## 4 氣候\n> [!important] 🔑 考前核心\n> - 影響氣溫：緯度、海陸分布、高度（每升 100 m 約降 0.6 °C）、洋流、地形。\n> - 降水四類：對流雨（午後雷陣雨）、地形雨（迎風坡）、鋒面雨（梅雨）、氣旋雨（颱風）。\n> - 行星風系：赤道低壓 → 信風 ← 副熱帶高壓 → 西風 → 副極地低壓 ← 極地東風。低壓多雨、高壓少雨。\n> - 氣壓帶隨太陽直射點**季節移動** → 莽原、地中海型的乾濕季。\n> - 判讀氣候圖：最冷月在 7 月＝南半球；先看氣溫定帶，再看雨量季節定型。\n\n| 氣候 | 氣溫 | 降水 | 成因 |\n|---|---|---|---|\n| 熱帶雨林 | 全年高溫 | 全年多雨 | 全年赤道低壓 |\n| 熱帶莽原 | 全年高溫 | 夏雨冬乾 | 夏赤道低壓、冬信風或副高 |\n| 熱帶沙漠 | 日溫差大 | 全年少雨 | 副熱帶高壓、涼流、背風 |\n| 地中海型 | 夏熱冬溫 | **夏乾冬雨** | 夏副高、冬西風 |\n| 溫帶海洋性 | 夏涼冬溫 | 全年有雨 | 全年西風、暖流 |\n| 季風氣候 | 夏熱 | 夏雨集中 | 海陸性質差異 |\n\n**一句話帶走**：先氣溫、後雨量；雨量看是哪個氣壓帶或風帶在管。\n\n## 5 水文\n> [!important] 🔑 考前核心\n> - 水循環：水的總量不變，只在大氣、地表、地下、海洋之間換位置；驅動力是太陽輻射＋重力。\n> - 水平衡：多年平均 $P=E+R$；逕流係數＝逕流 ÷ 降水，越大代表入滲越少（都市＞森林）。\n> - 流量 $Q=$ 斷面積 × 流速；歷線圖問三件事：峰高不高、峰早不早、線胖還是瘦。\n> - 都市化：不透水面↑ → 入滲↓ → 洪峰變高、提前、歷線尖瘦，基流量下降。\n> - 地下水：砂礫是含水層、黏土是阻水層；超抽 → 地層下陷（幾乎不可逆）、海水入侵。\n> - 洋流：低緯 → 高緯是暖流，高緯 → 低緯是寒流；中低緯大陸東岸暖、西岸寒。漁場＝寒暖流交會或湧升流。\n\n| 看到 | 想到 |\n|---|---|\n| 支流近直角匯入、岩層軟硬相間 | 格子狀水系 |\n| 從中央高地向四周散開 | 放射狀水系 |\n| 自流井 | 受壓含水層：上下阻水層＋傾斜＋補注區較高 |\n| 沖積扇扇端 | 湧泉帶 |\n| 鹽度最高 | 副熱帶海域（蒸發＞降水） |\n| 聖嬰現象的起點 | 信風減弱 |\n\n> [!warning] ⚠️ 易錯\n> - 分水嶺是線、集水區是面；分水嶺沿山脊稜線畫，不是沿河谷。\n> - 臺灣不是雨少，是「雨多但留不住」：時間集中、空間不均、河短流急（比例數字對照課本）。\n\n一句話帶走：**水文題都是同一條因果鏈：雨下到哪裡、滲下去多少、多快流走。**","歷史":"## L3 荷西與鄭氏\n> [!important] 🔑 考前核心\n> - 荷蘭（1624–1662）在大員：熱蘭遮城、普羅民遮城；西班牙（1626–1642）在北部：雞籠、淡水。\n> - 荷蘭對原住民：**地方會議**（政治上表示歸順）、**贌社**（商人承包村社交易權，是稅收）、傳教與新港文書。\n> - 荷蘭對漢人：招募來臺耕種王田、收人頭稅 → 郭懷一事件。\n> - 鄭氏（1662–1683）：承天府、天興與萬年二縣；鄭經改東寧；陳永華建孔廟。\n> - 鄭氏土地：官田（接收王田）、文武官田（私田）、營盤田（軍屯）。\n\n| 制度 | 對象 | 性質 |\n|---|---|---|\n| 地方會議 | 原住民長老 | 政治效忠 |\n| 贌社 | 漢商承包 | 包稅 |\n| 王田 | 漢人佃農 | 土地屬公司 |\n\n## L3 清帝國統治\n> [!important] 🔑 考前核心\n> - 1684 設臺灣府（臺灣、鳳山、諸羅三縣），隸屬福建省；前期消極治臺：**防內亂**（渡臺禁令、劃界封山、班兵）。\n> - 三大民變：朱一貴（1721，後增設彰化縣、淡水廳）、林爽文（1786，諸羅改嘉義）、戴潮春（1862）。\n> - 開港（1860 前後）後，茶、糖、樟腦出口，重心北移。\n> - 後期積極治臺：**防外患**。牡丹社事件（1874）→ 沈葆楨；清法戰爭（1884–1885）→ 建省、劉銘傳。\n\n| 人物 | 契機 | 施政 |\n|---|---|---|\n| 沈葆楨 | 牡丹社事件 | 開山撫番、廢渡臺禁令、增設臺北府、建億載金城 |\n| 劉銘傳 | 清法戰爭、建省 | 鐵路、電報、郵政、清賦、西學堂 |\n\n## L4 日本殖民統治\n> [!important] 🔑 考前核心\n> - 1895 馬關條約；六三法（1896，總督有律令制定權）→ 三一法（1906）→ 法三號（1921）。\n> - 三階段：殖民地特殊統治（後藤新平：舊慣調查、警察與保甲）→ 內地延長主義（1919 起，文官總督）→ 皇民化（1937 起，皇民化、工業化、南進基地化）。\n> - 武裝抗日：西來庵事件（1915，漢人最後一次大規模）、霧社事件（1930，原住民）。\n> - 政治社會運動：臺灣議會設置請願運動（1921–1934）、臺灣文化協會（1921）、臺灣民眾黨（1927，第一個合法政黨）、臺灣地方自治聯盟（1930）。\n> - 1935 首次地方選舉：半數民選、有財產與性別限制。\n\n## L4 戰後臺灣政治\n> [!important] 🔑 考前核心\n> - 1945 行政長官公署（陳儀）→ 1947 二二八事件 → 改設省政府。\n> - 1948 動員戡亂時期臨時條款、1949 戒嚴 → 威權體制、白色恐怖。\n> - 外交：1950 韓戰後美援 → 1971 退出聯合國 → 1979 臺美斷交。\n> - 民主化：1979 美麗島事件 → 1986 民進黨成立 → 1987 解嚴 → 1991 終止動員戡亂、國會全面改選 → 1996 總統直選 → 2000 政黨輪替。\n\n**一句話帶走**：年代題先背「起點事件」，再排前後。","公民":"## 第3課 政治參與\n> [!important] 🔑 考前核心\n> - 立委 113 席：區域 **73**（單一選區相對多數）、原住民 **6**（平地、山地各 3）、不分區及僑居 **34**（政黨比例代表，5% 門檻，婦女不低於 1/2）。\n> - **並立制**：兩票分開算；聯立制：政黨票決定總席次。\n> - 罷免：就職滿 1 年；提議 **1%**、連署 **10%**；同意票多於不同意票，且同意票達原選舉區選舉人總數 **1/4**。\n> - 公投：18 歲；同意票多於不同意票且達投票權人總數 1/4；**預算、租稅、薪俸、人事**不得提案。\n> - 被選舉權：一般 23 歲，鄉鎮市長 26 歲，縣市長與直轄市長 30 歲，總統 40 歲。\n\n> [!warning] ⚠️ 你的易錯\n> - 門檻的分母都是「原選舉區選舉人總數」，不是投票人數。\n> - 不分區席次只按政黨票分配，與區域當選席次無關。\n\n## 第4課 民主治理與公平正義\n> [!important] 🔑 考前核心\n> - 治理四概念：透明（事前公開資訊）、參與（決策中納入利害關係人）、回應（針對民意作出調整）、課責（事後追究責任）。\n> - 課責：垂直（選舉、罷免）、水平（立法院質詢與不信任案、監察院彈劾、司法審查）。\n> - 審議民主：資訊充分、平等發言、理性說理、尋求共識。\n> - 程序正義看過程；分配正義看結果，標準有需要、應得（表現）、平等。\n> - 平等原則：合理差別待遇（正當目的＋手段有合理關聯）可實現實質平等。\n\n| 理論 | 主張 | 看到關鍵字 |\n|---|---|---|\n| 效益主義 | 最大多數人的最大幸福 | 整體利益、總和 |\n| 羅爾斯 | 無知之幕、差異原則（照顧最弱勢） | 最不利者受益 |\n| 自由至上主義 | 保障財產權、反對重分配 | 小政府、反對重稅 |\n| 社群主義 | 重視共同體與共善 | 社群、公共利益 |\n\n> [!warning] ⚠️ 你的易錯\n> - 讀題：選項說了題文沒寫的事（充分落實、被迫）就不選。\n> - 正義「理論」和分配「標準」是兩層，題目問哪一層先看清楚。"},"prior":{"數學|07-端點":10,"數學|06-讀圓心":7,"數學|05-平行線距離":8,"數學|06-是圓條件":6,"數學|07-位置關係":4,"數學|07-相切k":4,"數學|07-弦長":2,"數學|05-垂直線":4,"數學|05-面積":4,"數學|05-截距":6,"數學|06-點圓最值":1,"數學|07-圓上切線":1,"數學|05-點線距離":2,"數學|05-點斜式":3,"數學|05-截距式":2,"數學|06-圓心在線上":2,"數學|07-k範圍":6,"化學|實驗式取整":11,"英文|衍生字":6,"英文|動詞一致":9,"英文|合併":5,"英文|拼字":13,"英文|片語":3,"英文|比較級修飾":1,"英文|to後接法":1,"英文|關代選擇":3,"英文|多餘代名詞":3,"歷史|史1-3-荷制":3,"歷史|史1-3-鄭制":4,"歷史|史1-3-沈劉":3,"生物|13-減數":3,"生物|13-數量":3,"生物|13-圖判":2,"公民|4-5-讀題":12,"公民|4-5-正義":14,"公民|4-5-治理":14,"公民|4-5-媒體":7,"公民|3-選制席次":4,"公民|3-門檻數字":3,"公民|3-公投事項":1,"地理|侵蝕堆積":1},"scores":[{"d":"2026-10-12","s":"數學","i":"單元07 例題1-5 學測模擬卷03","p":73.0},{"d":"2026-10-13","s":"公民","i":"第二次段考模擬卷01（第4–5課）","p":69.5},{"d":"2026-10-13","s":"公民","i":"第二次段考模擬卷02（第4–5課）","p":76.0},{"d":"2026-10-13","s":"數學","i":"單元07 單選特訓卷01","p":40.0},{"d":"2026-10-14","s":"公民","i":"第二次段考模擬卷03（第4–5課）","p":78.5},{"d":"2026-10-14","s":"公民","i":"第二次段考模擬卷04（第4–5課）","p":89.0},{"d":"2026-10-14","s":"數學","i":"單元07 單選特訓卷02","p":50.0},{"d":"2026-10-14","s":"公民","i":"第二次段考模擬卷05（第4–5課）","p":90.0},{"d":"2026-10-16","s":"數學","i":"單元07 例題1-5 學測模擬卷01","p":68.0},{"d":"2026-10-16","s":"公民","i":"第二次段考模擬卷07（第4–5課）","p":92.0},{"d":"2026-10-17","s":"公民","i":"第二次段考模擬卷08（第4–5課）","p":84.5},{"d":"2026-10-17","s":"公民","i":"第二次段考模擬卷09 第一志願加深（第4–5課）","p":84.0},{"d":"2026-10-17","s":"公民","i":"第二次段考模擬卷10 第一志願加深（第4–5課）","p":87.0},{"d":"2026-10-17","s":"英文","i":"B1L4 英單默寫（32 題）","p":59.0},{"d":"2026-10-18","s":"英文","i":"B1L4 英單默寫補考（31 題）","p":87.0},{"d":"2026-10-18","s":"英文","i":"B1L4 英單默寫補考2（32 題）","p":94.0},{"d":"2026-10-18","s":"英文","i":"B1L4 關代句型（10 題）","p":50.0},{"d":"2026-10-18","s":"英文","i":"B1L4 關代句型補考（10 題）","p":80.0},{"d":"2026-10-18","s":"英文","i":"B1L4 關代句型補考2（10 題）" Q(S,U,"反應式","反應式 $\\mathrm{2H_2+O_2\\rightarrow2H_2O}$ 的係數比 2：1：2 代表下列哪一種比？",["參與反應的莫耳數比（粒子數比）","三者的質量比","三者的密度比","任何狀況下三者的體積比"],"係數比＝粒子數比＝莫耳數比。質量比要再乘分子量（$4:32:36=1:8:9$）；體積比只在同溫同壓的氣體之間成立，液態水不適用。");
Q(S,U,"2-3-平衡係數","平衡反應式時，下列做法何者正確？",["只調整各物質前面的係數","把 $\\mathrm{H_2O}$ 改寫成 $\\mathrm{H_2O_2}$ 讓氧平衡","係數和下標一起改，比較快","刪掉一個生成物讓原子數對上"],"原子不滅：只能改係數。改下標等於換成另一種物質。");
Q(S,U,"計量","$\\mathrm{2H_2+O_2\\rightarrow2H_2O}$ 中，$\\mathrm{H_2}$、$\\mathrm{O_2}$、$\\mathrm{H_2O}$ 的質量比為何？（H＝1，O＝16）",["1：8：9","2：1：2","1：16：9","2：32：18"],"$2\\times2:1\\times32:2\\times18=4:32:36=1:8:9$。係數比不是質量比。");
Q(S,U,"2-3-限量","$\\mathrm{2N_2H_4+N_2O_4\\rightarrow3N_2+4H_2O}$，取 $\\mathrm{N_2H_4}$ 與 $\\mathrm{N_2O_4}$ 各 0.5 mol 反應，何者為限量試劑？",["$\\mathrm{N_2H_4}$","$\\mathrm{N_2O_4}$","兩者剛好完全反應","條件不足，無法判斷"],"比「莫耳數 ÷ 係數」：$\\mathrm{N_2H_4}$ $0.5\\div2=0.25$，$\\mathrm{N_2O_4}$ $0.5\\div1=0.5$。$\\mathrm{N_2H_4}$ 用得快一倍，先用完。");
Q(S,U,"2-3-限量","關於限量試劑，下列敘述何者正確？",["生成物的量由限量試劑決定","莫耳數比較少的一定是限量試劑","過量試劑剩越多，生成物越多","限量試劑反應後還會有剩"],"限量試劑完全用完，產量由它決定；判斷要比「莫耳數 ÷ 係數」，不是直接比莫耳數。");
Q(S,U,"計量","同溫同壓下，$\\mathrm{N_2(g)+3H_2(g)\\rightarrow2NH_3(g)}$。10 L 的 $\\mathrm{N_2}$ 完全反應，需要多少 L 的 $\\mathrm{H_2}$？",["30 L","10 L","20 L","3 L"],"同溫同壓的氣體，體積比＝係數比＝1：3，所以是 30 L。");
Q(S,U,"反應式","$\\mathrm{2H_2(g)+O_2(g)\\rightarrow2H_2O(l)}$。下列敘述何者正確？",["同溫同壓下，$\\mathrm{H_2}$ 與 $\\mathrm{O_2}$ 反應的體積比為 2：1","$\\mathrm{H_2}$、$\\mathrm{O_2}$、$\\mathrm{H_2O}$ 的體積比為 2：1：2","三者的質量比為 2：1：2","反應前後分子總數不變"],"水是液體，不能跟氣體講體積比；分子數從 3 變成 2；質量比是 1：8：9。");
Q(S,U,"計量","$\\mathrm{CaCO_3\\rightarrow CaO+CO_2}$。10 克 $\\mathrm{CaCO_3}$ 完全分解，可得 $\\mathrm{CO_2}$ 多少克？（Ca＝40，C＝12，O＝16）",["4.4 克","10 克","5.6 克","0.1 克"],"$10\\div100=0.1$ mol，係數 1：1，$\\mathrm{CO_2}$ 0.1 mol × 44 ＝ 4.4 克。5.6 克是 CaO。");
Q(S,U,"2-3-平衡係數","$\\mathrm{aC_2H_6+bO_2\\rightarrow cCO_2+dH_2O}$ 平衡後（最簡整數），$b$ 等於多少？",["7","3.5","5","14"],"$\\mathrm{C_2H_6}$ 先設 1：C 給 $\\mathrm{CO_2}$ 2、H 給 $\\mathrm{H_2O}$ 3，O 共 $4+3=7$ 個，$\\mathrm{O_2}$ 要 3.5。整組乘 2：2、7、4、6。");
U="2-4 化學反應熱";
Q(S,U,"2-4-吸放熱","某反應的 $\\Delta H<0$，下列敘述何者正確？",["反應放熱，周圍溫度上升","反應吸熱，周圍溫度下降","生成物的熱含量比反應物高","這個反應不會自己發生"],"$\\Delta H$＝生成物－反應物。小於 0 表示生成物比較低，多的能量放到外界。");
Q(S,U,"2-4-吸放熱","八水合氫氧化鋇與氯化銨在室溫下混合攪拌，燒杯底部的水結冰。這個反應屬於？",["吸熱反應","放熱反應","既不吸熱也不放熱","需要加熱才會發生的反應"],"周圍變冷表示反應從外界吸熱。它在室溫就會自己發生，所以「吸熱」不等於「要加熱」。");
Q(S,U,"2-4-熱化學式","$\\mathrm{CH_4(g)+2O_2(g)\\rightarrow CO_2(g)+2H_2O(l)}+890.2\\ \\mathrm{kJ}$，這個反應的 $\\Delta H$ 為何？",["$-890.2$ kJ","$+890.2$ kJ","$-445.1$ kJ","0"],"熱寫在生成物那一邊表示放熱，$\\Delta H$ 取負號。寫在式子裡的熱項，數字永遠是正的。");
Q(S,U,"2-4-熱化學式","下列哪一種寫法表示的是放熱 890.2 kJ？",["$\\mathrm{CH_4+2O_2\\rightarrow CO_2+2H_2O}+890.2\\ \\mathrm{kJ}$","$\\mathrm{CH_4+2O_2\\rightarrow CO_2+2H_2O}-890.2\\ \\mathrm{kJ}$","$\\mathrm{CH_4+2O_2}+890.2\\ \\mathrm{kJ}\\rightarrow\\mathrm{CO_2+2H_2O}$","$\\mathrm{CH_4+2O_2\\rightarrow CO_2+2H_2O}$，$\\Delta H=+890.2$ kJ"],"熱項放在生成物側就是放熱；寫成「−890.2 kJ」放進式子裡是雙重否定，等於吸熱。");
Q(S,U,"能量圖","能量圖中，反應物的熱含量在 500 kJ 的高度，生成物在 150 kJ 的高度。此反應的 $\\Delta H$ 為何？",["$-350$ kJ","$+350$ kJ","$+500$ kJ","$+150$ kJ"],"$\\Delta H$＝右（生成物）減左（反應物）＝$150-500$。圖上的數字是高度，要相減。");
Q(S,U,"2-4-吸放熱","化學反應中，斷鍵和成鍵的能量變化為何？",["斷鍵吸收能量，成鍵放出能量","斷鍵放出能量，成鍵吸收能量","斷鍵、成鍵都吸收能量","斷鍵、成鍵都放出能量"],"斷鍵一定吸能、成鍵一定放能。兩者相減的結果決定整個反應吸熱或放熱。");
Q(S,U,"2-4-熱化學式","$\\mathrm{H_2(g)+\\dfrac12O_2(g)\\rightarrow H_2O(l)}$ 與 $\\mathrm{H_2(g)+\\dfrac12O_2(g)\\rightarrow H_2O(g)}$ 的反應熱不同，主要原因是？",["生成物的狀態不同","係數不同","反應物不同","兩者的反應熱其實一樣"],"反應熱會受溫度、壓力、物質狀態與莫耳數影響，所以熱化學方程式一定要標狀態。");
Q(S,U,"2-4-吸放熱","〔延伸〕紙要點火才會燃燒，但燃燒是放熱反應。這說明什麼？",["需要先提供能量（活化能），不代表是吸熱反應","燃燒其實是吸熱反應","點火提供的熱就是反應熱","放熱反應不需要任何能量就能開始"],"活化能是要「翻過去」的那座山，反應熱是起點和終點的高度差，兩者無關。");

F(S,"求直線：兩點用點斜式、截距用截距式",{t:"兩點式一步寫（高二）",p:"過 $A(x_1,y_1)$、$B(x_2,y_2)$：$(y_2-y_1)(x-x_1)-(x_2-x_1)(y-y_1)=0$。不用先算分數斜率，連鉛直線也適用。",q:"過 $A(1,3)$、$B(4,9)$ 的直線。",s:[["$(9-3)(x-1)-(4-1)(y-3)=0$","直接代"],["$6x-3y+3=0$ → $2x-y+1=0$","展開、約分"],["檢查 B：$8-9+1=0$ ✓","代另一點驗算"]]});
F(S,"過一點的垂直線與平行線",{t:"法向量內積（高二向量）",p:"$ax+by+c=0$ 的法向量是 $(a,b)$。垂直＝法向量內積為 0，所以垂直線直接寫 $bx-ay+k=0$，再代點求 k。",q:"過 $(2,-1)$ 且垂直 $3x+2y-5=0$。",s:[["設 $2x-3y+k=0$","內積 $3\\cdot2+2\\cdot(-3)=0$"],["代 $(2,-1)$：$4+3+k=0$，$k=-7$","代點"],["$2x-3y-7=0$","完成"]]});
F(S,"平移：x 換成 x−h、y 換成 y−k",{t:"平移向量（高二）",p:"平移後法向量不變，只有常數改變。最快：在原直線上挑一個好算的點，把它照平移向量移過去，再代進 $ax+by+k=0$ 求 k。",q:"$2x+y-3=0$ 沿向量 $(1,2)$ 平移。",s:[["原直線上一點 $(0,3)$，移到 $(1,5)$","挑 x=0 最好算"],["新直線 $2x+y+k=0$ 過 $(1,5)$：$k=-7$","係數不變只改常數"],["$2x+y-7=0$","和換 x、y 的答案一樣"]]});
F(S,"點到直線的距離",{t:"法向量投影（高二）",p:"距離就是向量在法向量方向的投影長：分子＝把點代進直線式的值，分母＝法向量長 $\\sqrt{a^2+b^2}$。懂了投影，公式就不會背錯。",q:"$P(3,4)$ 到 $x-2y+1=0$ 的距離。",s:[["代入：$3-8+1=-4$","分子＝代入值的絕對值"],["$\\sqrt{1+4}=\\sqrt5$","分母＝法向量長"],["$d=\\dfrac{4}{\\sqrt5}=\\dfrac{4\\sqrt5}{5}$","有理化"]]});
F(S,"兩平行線的距離",{t:"取點代入（最穩）",p:"在第一條線上取一點（令 x=0 最快），算它到第二條線的距離。用第二條自己的係數，完全不用先調係數，坑自動避開。",q:"$3x+4y-5=0$ 與 $6x+8y+5=0$ 的距離。",s:[["第一條令 $x=0$：$y=\\dfrac54$","取一點 $(0,\\dfrac54)$"],["代第二條：$0+10+5=15$，分母 $\\sqrt{36+64}=10$","用第二條的係數"],["$d=\\dfrac{15}{10}=\\dfrac32$","和公式答案一樣"]]});

var GEN={},GENH={};
(function(){
var ri=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var nz=function(a,b){var v;do{v=ri(a,b)}while(v===0);return v};
var sgn=function(){return Math.random()<.5?1:-1};
var gcd=function(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1};
function fr(n,d){if(d<0){n=-n;d=-d}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;return (n<0?'-':'')+'\\dfrac{'+Math.abs(n)+'}{'+d+'}'}
function M(s){return '$'+s+'$'}
function term(k,v,first){if(k===0)return '';var m=Math.abs(k);return (k<0?'-':(first?'':'+'))+((m===1&&v)?'':m)+v}
function lin(a,b,c){var s=term(a,'x',true);s+=term(b,'y',s==='');if(c!==0)s+=(c<0?'-':'+')+Math.abs(c);return s+'=0'}
function nlin(a,b,c){if(a===0&&b===0)return null;var g=gcd(gcd(a,b),c);a/=g;b/=g;c/=g;if(a<0||(a===0&&b<0)){a=-a;b=-b;c=-c}return lin(a,b,c)}
function sq(n){var o=1,i=n;for(var k=2;k*k<=i;k++)while(i%(k*k)===0){o*=k;i/=k*k}if(i===1)return ''+o;return (o===1?'':o)+'\\sqrt{'+i+'}'}
function sqt(v,h){if(h===0)return v+'^2';return '('+v+(h>0?'-':'+')+Math.abs(h)+')^2'}
function circ(h,k,r2){return sqt('x',h)+'+'+sqt('y',k)+'='+r2}
function pt(x,y){return '('+x+','+y+')'}
function num(x){return ''+Math.round(x*1000)/1000}
function sci(x){var e=Math.floor(Math.log10(x));var m=Math.round(x/Math.pow(10,e)*1000)/1000;if(m>=10){m=m/10;e+=1}return '$'+m+'\\times10^{'+e+'}$'}
function W(t,why){return t==null?null:[t,why]}
var PY=[[3,4,5],[4,3,5],[5,12,13],[12,5,13],[6,8,10],[8,6,10]];
function cnt(c,why){return [c].concat(['2 個','1 個','0 個'].filter(function(x){return x!==c}).map(function(x){return [x,why]})).concat([['無限多個','直線和圓最多只有 2 個交點']])}

    o:[M(fr(N,D)),W(M(fr(Math.abs(c1-c2),n)),'兩條線的係數還沒調成一樣，就直接拿常數相減'),W(M(fr(N,D*n)),'分母用了 a²+b²，忘了開根號'),W(M(fr(Math.abs(c1-c2),D)),'係數調了，常數卻沒有跟著一起乘'),W(M(fr(N,m)),'沒有除以 √(a²+b²)')],

}};

KG('wl111-01',S,'單元05','05-點斜式','f','坐標平面上，已知直線 $L$ 的斜率為 $\\dfrac23$ 且 $x$ 截距為 $-2$，求直線 $L$ 的一般式。',null,'$2x-3y+4=0$','x 截距 $-2$ 表示過 $(-2,0)$。點斜式 $y=\\dfrac23(x+2)$，兩邊乘 3：$3y=2x+4$，即 $2x-3y+4=0$。',WL);

KG('wl111-03',S,'單元05','05-判號','f','坐標平面上，已知四邊形 $ABCD$ 的四個頂點為 $A(-1,3)$、$B(3,1)$、$C(5,4)$、$D(2,5)$，若直線 $L:y=mx-1$ 與四邊形 $ABCD$ 有交點且直線 $L$ 的兩側各有 2 個頂點，求實數 $m$ 的最大可能範圍。',null,'$1<m<3$','令 $f=y-mx+1$：$f(A)=m+4$、$f(B)=2-3m$、$f(C)=5-5m$、$f(D)=6-2m$。要 A、D 同號、B、C 同號且兩組異號：$f(A),f(D)>0$ 而 $f(B),f(C)<0$，得 $m>1$ 且 $m<3$。其他分組都矛盾。',WL);
KG('wl111-04',S,'單元07','07-圓上切線','f','坐標平面上，過點 $P(4,2)$ 且與圓 $C:(x-1)^2+(y+2)^2=25$ 相切的切線方程式為何？（以一般式表示）',null,'$3x+4y-20=0$','先判斷 P：$(4-1)^2+(2+2)^2=25$，P 在圓上，只有一條切線。法向量 $\\overrightarrow{CP}=(3,4)$：$3(x-4)+4(y-2)=0$。',WL);
KG('wl111-05',S,'單元07','07-兩平行線','f','坐標平面上，將直線 $L_1:x-2y=5$ 鉛直下移 4 單位後得直線 $L_2$，若直線 $L_1$、$L_2$ 皆與圓 $C$ 相切，則圓 $C$ 的半徑為何？',null,'$\\dfrac{4\\sqrt5}{5}$','下移 4：y 換成 $y+4$，$L_2:x-2y-13=0$。兩平行切線的距離是直徑：$\\dfrac{|-5-(-13)|}{\\sqrt5}=\\dfrac{8}{\\sqrt5}$，半徑 $\\dfrac{4}{\\sqrt5}=\\dfrac{4\\sqrt5}{5}$。',WL);
KG('wl111-06',S,'單元07','07-位置關係','f','坐標平面上，已知直線 $L:x+2y+3=0$ 與圓 $C:x^2+y^2-8x-1=0$ 交於 $A$、$B$ 兩相異點，其中 $A$ 點是格子點（$x$、$y$ 坐標皆為整數），則 $A$ 點的坐標為何？',null,'$(5,-4)$','代入 $x=-2y-3$：$5y^2+28y+32=0$，$y=-4$ 或 $-\\dfrac85$。整數解 $y=-4$，$x=5$。',WL);
KG('wl111-07',S,'單元07','07-k範圍','f','坐標平面上，已知一圓方程式為 $x^2+y^2-2x-4y+k=0$，若一直線 $3x+4y-1=0$ 與該圓沒有交點，試問實數 $k$ 的最大可能範圍。',null,'$1<k<5$','圓心 $(1,2)$、$r^2=5-k$，是圓要 $k<5$。$d=\\dfrac{|3+8-1|}{5}=2$。沒有交點：$d>r$，$5-k<4$，$k>1$。兩個條件都要：$1<k<5$。',WL);
KG('wl111-08',S,'單元07','05-對稱點','f','坐標平面上，有一圓 $C$ 與直線 $L:6x+8y+5=0$ 交於 $P$、$Q$ 兩點，劣弧 $PQ$（弧長較短的弧）的中點 $M$ 坐標為 $(2,1)$，今沿 $\\overline{PQ}$ 摺起劣弧 $PMQ$ 後，發現 $M$ 與圓 $C$ 的圓心重合，則此圓 $C$ 的圓心坐標為何？',null,'$(-1,-3)$','摺起來重合＝對直線 L 對稱。$M$ 代入 L：$12+8+5=25$，$a^2+b^2=100$，對稱點 $=(2,1)-2\\cdot\\dfrac{25}{100}(6,8)=(-1,-3)$。',WL);
KG('wl111-09',S,'單元06','06-點圓位置','f','在坐標平面上，已知圓 $C$ 的圓心為 $P(x,y)$，若點 $A(0,0)$ 在圓 $C$ 的內部且點 $B(8,4)$ 在圓 $C$ 的外部，則所有點 $P(x,y)$ 所在區域的二元一次不等式為何？',null,'$2x+y<10$','A 在內、B 在外，代表圓心到 A 比到 B 近：$PA<PB$。平方：$x^2+y^2<(x-8)^2+(y-4)^2$，化簡 $16x+8y<80$，即 $2x+y<10$。',WL);
KG('wl111-10',S,'單元07','07-位置關係','f','在坐標平面上，設點 $P(a,b)$ 為圓 $C:x^2+y^2-8x-6y+20=0$ 上的動點，則滿足 $\\dfrac{b-2}{a-1}$ 為整數的 $P$ 點有幾個？',null,'5','$\\dfrac{b-2}{a-1}$ 是 P 與 $(1,2)$ 連線的斜率 m。圓心 $(4,3)$、$r=\\sqrt5$，直線 $mx-y+2-m=0$ 與圓有交點：$\\dfrac{|3m-1|}{\\sqrt{m^2+1}}\\le\\sqrt5$，得 $-\\dfrac12\\le m\\le2$，整數 $m=0,1,2$。$m=0,1$ 各交 2 點，$m=2$ 相切 1 點，共 5 個。',WL);
KG('wl111-11',S,'單元07','06-線圓最值','f','在坐標平面上，已知 $A(4,0)$、$B(0,3)$，圓 $C:(x-5)^2+(y-10)^2=25$ 上有一點 $P$，且 $\\triangle ABP$ 面積為整數，則這樣的 $P$ 點共有幾個？',null,'50','$\\overline{AB}=5$，直線 AB：$3x+4y-12=0$，圓心到它 $d=\\dfrac{43}{5}$，$r=5$。高的範圍 $\\dfrac{18}{5}$ 到 $\\dfrac{68}{5}$，面積 $=\\dfrac52\\times$高，範圍 9 到 34。9 和 34 各 1 點，10～33 共 24 個整數各 2 點：$2+48=50$。',WL);
KG('wl111-12',S,'單元07','07-弦長','s','有一圓柱形觀景臺，底部是圓形。廠商要在觀景臺底部外圍八公尺寬度的環狀區域植滿草皮（外圍的外形也是圓）。已量得外圓的弦 $\\overline{AB}=24$ 公尺，且 $\\overline{AB}$ 與內圓（觀景臺底部）相切於 $M$。草皮的面積為多少平方公尺？',[['A','$16\\pi$'],['B','$25\\pi$'],['C','$64\\pi$'],['D','$144\\pi$'],['E','$256\\pi$']],'D','外圓半徑 R、內圓半徑 r，切點 M 是 AB 中點，$R^2=r^2+12^2$。草皮面積 $=\\pi(R^2-r^2)=144\\pi$（用不到寬度 8）。',WL);
KG('wl111-13',S,'單元06','06-是圓條件','m','下列敘述何者正確？',[['1','設 $a,b,c$ 皆為實數，且 $a,b$ 不全為零，方程式 $ax+by+c=0$ 的圖形是斜率為 $-\\dfrac ab$、$y$ 截距為 $-\\dfrac cb$ 的直線'],['2','設 $k$ 為任意實數，方程式 $\\dfrac x4+\\dfrac y3=k$ 的圖形與直線 $3x+4y=5$ 沒有交點'],['3','方程式 $\\sqrt{(x-2)^2+(y-7)^2}=9$ 的圖形是一個半徑為 9 的圓'],['4','方程式 $2x^2+2y^2+4x+6y+7=0$ 的圖形是一個以 $\\left(-1,-\\dfrac32\\right)$ 為圓心的圓'],['5','過 $A(1,2)$、$B(-1,3)$ 兩點的圓中，最小的圓其半徑為 $\\dfrac{\\sqrt5}{2}$']],'35','(1) $b=0$ 時是鉛直線，沒有斜率 ✗。(2) $3x+4y=12k$，$k=\\dfrac5{12}$ 時就是同一條線 ✗。(3) 到 $(2,7)$ 距離 9 的點 ✓。(4) 除以 2 後 $r^2=1+\\dfrac94-\\dfrac72<0$，沒有圖形 ✗。(5) 最小的圓以 AB 為直徑，$\\overline{AB}=\\sqrt5$ ✓。',WL);
KG('wl111-14',S,'單元07','07-多選','m','坐標平面上，設圓 $\\Gamma:x^2+y^2-2x+2y-2=0$ 的圓心為 $C$。已知由直線 $L:3x-4y+18=0$ 上一點 $P$ 向圓 $\\Gamma$ 可作兩條切線 $L_1$ 與 $L_2$，且直線 $L$ 恰為 $L_1$ 與 $L_2$ 其中一夾角的角平分線。試選出正確的選項。',[['1','直線 $L$ 與圓 $\\Gamma$ 不相交'],['2','直線 $PC$ 與直線 $L$ 互相垂直'],['3','直線 $L_1$ 與直線 $L_2$ 互相垂直'],['4','$P$ 點的坐標為 $\\left(-3,\\dfrac94\\right)$'],['5','若圓 $\\Gamma$ 上任一點關於直線 $ax-by-15=0$ 的對稱點均仍在圓 $\\Gamma$ 上，則 $a+b=15$']],'125','$C(1,-1)$、$r=2$。(1) $d=\\dfrac{|3+4+18|}{5}=5>2$ ✓。(2) 兩切線的角平分線是 PC 和過 P 垂直 PC 的線；L 不過 C，所以 $L\\perp PC$ ✓。(3) $PC=5$，要垂直需 $PC=2\\sqrt2$ ✗。(4) P 是 C 在 L 上的垂足 $(-2,3)$ ✗。(5) 對稱後仍在圓上 → 直線過圓心：$a+b-15=0$ ✓。',WL);

KG('ss110-t4',S,'單元06','06-點圓位置','s','是非題：過點 $Q(4,-2)$ 與圓 $C:(x-2)^2+y^2=9$ 相切的直線恰有兩條。',TF,'B','代入：$(4-2)^2+(-2)^2=8<9$，Q 在圓內，沒有切線。',SS);
KG('ss110-t5',S,'單元07','07-斜率切線','s','是非題：與直線 $L:2x-5y=0$ 垂直且與圓 $C:(x-2)^2+y^2=9$ 相切的直線恰有兩條。',TF,'A','方向固定的直線，圓的兩側各有一條切線，所以恰有兩條。',SS);
KG('ss110-m1',S,'單元07','07-多選','m','坐標平面上，圓 $C:x^2+y^2-6x=0$，直線 $L:3x-4y-4=0$。試選出正確的選項。',[['A','圓 $C$ 和 $y$ 軸相切'],['B','直線 $L$ 斜率為正'],['C','直線 $M:4x-3y+4=0$ 和直線 $L$ 垂直'],['D','圓 $C$ 上的點與直線 $L$ 的最遠距離為 2'],['E','圓 $C$ 上恰有 3 個點與直線 $L$ 的距離為 2']],'ABE','$C(3,0)$、$r=3$。(A) 圓心 x 坐標 3＝r ✓。(B) 斜率 $\\dfrac34$ ✓。(C) 法向量內積 $12+12\\ne0$ ✗。(D) $d=1$，最遠 $1+3=4$ ✗。(E) 和 L 距離 2 的兩條平行線，一條離圓心 1（交 2 點）、一條離圓心 3＝r（相切 1 點），共 3 點 ✓。',SS);
KG('ss110-m2',S,'單元05','05-判號','m','設 $A(1,3)$、$B(-1,4)$ 位於直線 $y=mx+1$ 的異側，求實數 $m$ 的可能值為何？',[['A','3'],['B','1'],['C','0'],['D','$-3$'],['E','$-8$']],'AE','令 $f=y-mx-1$：$f(A)=2-m$、$f(B)=3+m$。異側：$(2-m)(3+m)<0$，$m>2$ 或 $m<-3$。$-3$ 時 B 在直線上，不算。',SS);
KG('ss110-m3',S,'單元05','05-平行線','m','下列聯立不等式或聯立方程式何者有實數解？',[['A','$3x-2y=5$ 且 $9x-6y=16$'],['B','$y=-\\dfrac12x+3$ 且 $\\dfrac x6+\\dfrac y3=1$'],['C','$3x+5y=16$ 且 $5x+3y=16$'],['D','$x+3y\\ge16$ 且 $4x-5y\\le13$'],['E','$8x+28y>40$ 且 $2x+7y<9$']],'BCD','(A) 平行不重合（$15\\ne16$）✗。(B) 第二式是 $x+2y=6$，和第一式同一條線，無限多解 ✓。(C) 不平行，交於 $(2,2)$ ✓。(D) 兩個不平行的半平面一定有重疊 ✓。(E) 第一式是 $2x+7y>10$，和 $2x+7y<9$ 矛盾 ✗。',SS);
KG('ss110-m5',S,'單元07','07-多選','m','校慶園遊會的套圈圈遊戲：九個寶特瓶排成九宮格，瓶子中心在 $(0,0)$、$(\\pm20,0)$、$(0,\\pm20)$、$(\\pm20,\\pm20)$（單位：公分），瓶身半徑 3 公分；圈圈有半徑 5 公分、7 公分兩種。瓶身整個落在圈圈裡就算套中（例如圈圈落地後為 $x^2+y^2=49$，就套中 $x^2+y^2=9$ 的瓶子）。下列為落地後的圈圈方程式，何者恰好會套中寶特瓶？',[['A','$(x+20)^2+(y-20)^2=49$'],['B','$(x-20)^2+(y-1)^2=25$'],['C','$(x-10)^2+(y-15)^2=49$'],['D','$(x+1)^2+(y+21)^2=25$'],['E','$(x-12)^2+(y+14)^2=49$']],'ABD','套中：圈圈圓心到最近瓶子中心的距離 ＋3 ≦ 圈圈半徑。(A) 距離 0 ✓。(B) 到 $(20,0)$ 距離 1，$1+3\\le5$ ✓。(C) 最近 $(0,20)$ 或 $(20,20)$，距離 $\\sqrt{125}$ ✗。(D) 到 $(0,-20)$ 距離 $\\sqrt2$，$\\sqrt2+3\\le5$ ✓。(E) 最近 $(20,-20)$，距離 10 ✗。',SS);
KG('ss110-f1a',S,'單元05','05-點斜式','f','坐標平面上有三點 $A(5,3)$、$B(-1,-2)$、$C(3,-1)$。過 $B$ 點將 $\\triangle ABC$ 的面積等分的直線方程式為何？（以一般式 $ax+by+c=0$ 表示）',null,'$3x-5y-7=0$','等分面積的線要過對邊 AC 的中點 $(4,1)$。斜率 $\\dfrac{1-(-2)}{4-(-1)}=\\dfrac35$，$y+2=\\dfrac35(x+1)$，整理得 $3x-5y-7=0$。',SS);
KG('ss110-f1b',S,'單元05','05-定點','f','坐標平面上有三點 $A(5,3)$、$B(-1,-2)$、$C(3,-1)$。設直線 $L:mx-3m-y+5=0$，若 $L$ 和 $\\triangle ABC$ 有交點，則實數 $m$ 的最大可能範圍為何？',null,'$m\\ge\\dfrac74$ 或 $m\\le-1$','L 可寫成 $y-5=m(x-3)$，恆過 $P(3,5)$。P 到 A 斜率 $-1$、到 B 斜率 $\\dfrac74$、到 C 是鉛直線（C 在 P 正下方）。從 PB 轉到鉛直、再從鉛直轉到 PA 的直線都碰得到三角形：$m\\ge\\dfrac74$ 或 $m\\le-1$。',SS);
KG('ss110-f2',S,'單元05','05-平行線','f','平面上有三直線 $L_1:ax+6y=10$、$L_2:3x-5y=-7$、$L_3:x+2y=5$，若 $L_1$、$L_2$、$L_3$ 無法圍出一個三角形，則實數 $a$ 的值為何？',null,'$-\\dfrac{18}{5}$ 或 $3$ 或 $-2$','圍不出三角形有兩種：有兩條平行，或三線共點。$L_1\\parallel L_2$：$a=-\\dfrac{18}{5}$；$L_1\\parallel L_3$：$a=3$；$L_2$、$L_3$ 交於 $(1,2)$，代入 $L_1$：$a=-2$。',SS);
KG('ss110-f3',S,'單元05','05-判號','f','坐標平面上兩點 $A(6,3)$、$B(-2,-1)$，若直線 $L:4x+7y=3$ 與 $\\overline{AB}$ 交於 $P$ 點，則 $\\dfrac{\\overline{AP}}{\\overline{BP}}$ 為何？（化為最簡）',null,'$\\dfrac73$','把 A、B 代入 $4x+7y-3$：42 與 $-18$。代入值的絕對值比就是兩點到直線的距離比，也就是 $AP:BP=42:18=7:3$。',SS);
KG('ss110-f4',S,'單元06','06-圓心在線上','f','坐標平面上，一圓通過 $A(5,-2)$，且與直線 $L:3x-y-1=0$ 相切於 $B(1,2)$，此圓的方程式為何？',null,'$(x-4)^2+(y-1)^2=10$','圓心在過 B 且垂直 L 的直線上：設 $(1+3t,2-t)$。到 A、B 一樣遠：$(3t-4)^2+(4-t)^2=10t^2$，$t=1$。圓心 $(4,1)$、$r^2=10$。',SS);
KG('ss110-f5',S,'單元07','07-圓外切線','f','坐標平面上 $A(1,6)$ 處有一光源，將圓 $C:x^2+(y-3)^2=5$ 投射到 $x$ 軸上，求其在 $x$ 軸上所形成的影長。',null,'15','影子的兩端是過 A 的兩條切線和 x 軸的交點。設切線 $y-6=m(x-1)$，$\\dfrac{|3-m|}{\\sqrt{m^2+1}}=\\sqrt5$，$m=\\dfrac12$ 或 $-2$。和 x 軸交於 $x=-11$ 與 $x=4$，影長 15。',SS);
KG('ss110-f6',S,'單元07','06-線圓最值','f','在坐標平面上，已知兩定點 $A(3,0)$、$B(0,-4)$，設點 $P$ 為圓 $C:(x-2)^2+(y-7)^2=4$ 上的動點，求 $\\triangle PAB$ 面積的最大值。',null,'$\\dfrac{35}{2}$','$\\overline{AB}=5$，直線 AB：$4x-3y-12=0$。圓心到它 $d=\\dfrac{|8-21-12|}{5}=5$，最高的高 $=5+2=7$，面積 $\\dfrac12\\times5\\times7=\\dfrac{35}{2}$。',SS);
KG('ss110-f7a',S,'單元05','05-中垂線','f','若將一張畫有直角坐標系的方格紙對摺一次，使得 $A(3,2)$ 和 $B(-1,4)$ 重合。若對摺的直線方程式為 $y=ax+b$，求數對 $(a,b)$。',null,'$(2,1)$','摺痕是 AB 的中垂線：中點 $(1,3)$，$\\overrightarrow{AB}=(-4,2)$ 當法向量：$-4(x-1)+2(y-3)=0$，即 $y=2x+1$。',SS);
KG('ss110-f7b',S,'單元05','05-對稱點','f','承上題（對摺線為 $y=2x+1$），此時圓 $C_1:(x-4)^2+(y+1)^2=2$ 會與圓 $C_2$ 重合，求圓 $C_2$ 的方程式。',null,'$(x+4)^2+(y-3)^2=2$','半徑不變，只要把圓心 $(4,-1)$ 對 $2x-y+1=0$ 作對稱：代入值 10，$(4,-1)-2\\cdot\\dfrac{10}{5}(2,-1)=(-4,3)$。',SS);
/* ---------- 基隆中山高中 109 上 高一第二次段考 化學（學校未附答案；答案與詳解為本站逐題解出） ---------- */
var KC='基隆中山高中 109 學年度上學期 高一第二次段考（本站解答）',C='化學',U1='2-1 化學鍵',U2='2-2 化學式',U3='2-3 反應式與化學計量',U4='2-4 化學反應熱';
var o5=function(a,b,c,d,e){return [['A',a],['B',b],['C',c],['D',d],['E',e]]};
KG('kl109-01',C,U1,'電子對','s','（原 108 學測）有關 $\\mathrm{NO_3^-}$ 和 $\\mathrm{CO_3^{2-}}$ 路易斯結構的敘述，下列何者正確？',o5('都只具有單鍵','$\\mathrm{NO_3^-}$ 不滿足八隅體規則','中心原子都具有孤對電子','二者的孤對電子數不同','二者的總電子數相同'),'E','總電子數：$\\mathrm{NO_3^-}$ 是 $7+3\\times8+1=32$，$\\mathrm{CO_3^{2-}}$ 是 $6+3\\times8+2=32$，相同。兩者都有一個雙鍵、都滿足八隅體、中心原子沒有孤對電子、孤對電子都是 8 對。',KC);
KG('kl109-02',C,U3,'2-3-平衡係數','s','（原 107 學測）實驗室製備 NO 時，可用銅還原稀硝酸而得，係數尚未平衡的反應式如下：$\\mathrm{Cu+HNO_3\\rightarrow Cu(NO_3)_2+H_2O+NO}$。反應式平衡後，係數均為最小整數時，NO 的係數為何？',o5('1','2','3','4','5'),'B','平衡後 $\\mathrm{3Cu+8HNO_3\\rightarrow 3Cu(NO_3)_2+4H_2O+2NO}$。檢查 N：$8=6+2$；O：$24=18+4+2$。',KC);
KG('kl109-03',C,U1,'鍵型','s','下列各組元素，何者易形成離子鍵？',o5('I 與 Na','H 與 O','N 與 F','Zn 與 Cu','C 與 H'),'A','金屬＋非金屬才是離子鍵：Na 是金屬、I 是非金屬。H–O、N–F、C–H 都是非金屬（共價鍵），Zn 與 Cu 都是金屬（金屬鍵）。',KC);
KG('kl109-04',C,U1,'電子對','s','八隅體規則：原子與原子結合時，傾向於與何種元素具有相同的電子排列，而趨向安定？',o5('鹵素','鈍氣','鹼金屬','氧族','鹼土族'),'B','鈍氣最外層已滿（He 為 2，其他為 8），最安定。',KC);
KG('kl109-05',C,U1,'鍵型','s','原子序 20 的元素 A 與原子序 17 的元素 B 形成化合物時，下列敘述何者正確？',o5('A 元素得到電子','B 元素失去電子','以共用價電子的方式形成化合物','A、B 形成的化合物有延性與展性','A、B 形成的化合物化學式應為 $\\mathrm{AB_2}$'),'E','A 是 Ca（失去 2 個電子成 $\\mathrm{A^{2+}}$），B 是 Cl（得到 1 個電子成 $\\mathrm{B^-}$），離子鍵，化學式 $\\mathrm{AB_2}$。離子化合物脆，沒有延展性。',KC);
KG('kl109-06',C,U1,'導電性','s','下表是氯化鈣、鐵、氯化氫、石墨（未按順序排列）四種物質的性質：\n\n| 編號 | 甲 | 乙 | 丙 | 丁 |\n|---|---|---|---|---|\n| 熔點（℃） | 660 | 801 | ＞3550 | －83 |\n| 導電性 | 固、液態均能導電 | 固態不導電、液態能導電 | 固態能導電 | 固、液態均不導電 |\n| 是否為電解質 | 否 | 是 | 否 | 是 |\n\n氯化鈣、鐵、氯化氫、石墨依序為何？',o5('甲乙丁丙','丙甲丁乙','乙甲丁丙','丙乙丁甲','丁乙甲丙'),'C','乙：固態不導電、熔融導電、是電解質 → 離子化合物氯化鈣。甲：固液都導電、不是電解質 → 金屬鐵。丁：熔點很低、不導電但是電解質（溶於水解離）→ 氯化氫。丙：熔點極高、固態導電 → 石墨。',KC);
KG('kl109-07',C,U2,'化學式種類','s','對於醋酸（$\\mathrm{CH_3COOH}$）及葡萄糖（$\\mathrm{C_6H_{12}O_6}$）的敘述，何者錯誤？（H＝1、C＝12、O＝16）',o5('兩者的實驗式相同','等重的醋酸及葡萄糖，兩者所含的原子總數相等','兩者所含元素的重量百分率相同','等莫耳的醋酸及葡萄糖，兩者的重量比（醋酸：葡萄糖）＝1：2','等莫耳的醋酸及葡萄糖，兩者的原子數比（醋酸：葡萄糖）＝1：3'),'D','實驗式都是 $\\mathrm{CH_2O}$，所以百分組成相同、等重時原子總數也相同。等莫耳時重量比是 $60:180=1:3$，不是 1：2。原子數比 $8:24=1:3$ 正確。',KC);
KG('kl109-08',C,U2,'分子式','s','已知尼古丁的實驗式為 $\\mathrm{C_5H_7N}$，若尼古丁的莫耳質量為 162 克，則一個尼古丁分子中的氮原子個數為多少？（C＝12、H＝1、N＝14）',o5('1','2','3','4','5'),'B','實驗式量 $60+7+14=81$，$n=162\\div81=2$，分子式 $\\mathrm{C_{10}H_{14}N_2}$，有 2 個 N。',KC);
KG('kl109-09',C,U1,'鍵型','s','（原 105 學測）X 和 Y 均為第三週期的元素，價電子數分別為 2 和 7。下列有關 X 與 Y 所形成之化合物的敘述，何者錯誤？',o5('X 與 Y 之間的鍵結屬於離子鍵','此化合物易溶於水','將此化合物加熱成熔融態，則可導電','此化合物具有延展性','此化合物的化學式可以 $\\mathrm{XY_2}$ 表示'),'D','X 是 Mg、Y 是 Cl，化合物 $\\mathrm{MgCl_2}$ 是離子化合物：易溶於水、熔融導電、化學式 $\\mathrm{XY_2}$。離子晶體受力會碎裂，沒有延展性。',KC);
KG('kl109-10',C,U2,'化學式種類','s','下列各組物質，何者是同分異構物？',o5('甲烷、乙烷','乙醇、甲醚','$\\mathrm{C_2H_2}$、$\\mathrm{C_6H_6}$','水、過氧化氫','氧氣、臭氧'),'B','同分異構物：分子式相同、結構不同。乙醇和甲醚都是 $\\mathrm{C_2H_6O}$。$\\mathrm{C_2H_2}$、$\\mathrm{C_6H_6}$ 只是實驗式相同；氧氣、臭氧是同素異形體。',KC);
KG('kl109-11',C,U3,'反應式','s','有關 $\\mathrm{2H_2(g)+O_2(g)\\rightarrow 2H_2O(g)}$ 的敘述，何者錯誤？',o5('同溫同壓下，2 mol 的氫氣與 1 mol 的氧氣作用生成 2 mol 的水蒸氣','4 克的氫與 32 克的氧作用生成 36 克的水','平衡時莫耳數比為氫：氧：水蒸氣＝2：1：2','氫氣與氧氣作用生成水蒸氣的分子數比為 2：1：2','反應過程中，反應物消耗的分子莫耳數：生成物生成的分子莫耳數＝3：2'),'C','係數比是「反應掉、生成」的量的比，不是反應後（平衡時）容器裡剩下的量的比。',KC);
KG('kl109-13',C,U3,'2-3-計量','s','哈柏法製氨的反應：$\\mathrm{N_2(g)+3H_2(g)\\rightarrow 2NH_3(g)}$。假設反應器中有 0.1 莫耳氮氣及 0.3 莫耳氫氣，經充分反應後，最多能產生多少莫耳的氨？',o5('0.22','0.20','0.11','0.30','0.42'),'B','$0.1\\div1=0.3\\div3$，剛好完全反應。氨 $=0.1\\times2=0.2$ mol。',KC);
KG('kl109-14',C,U3,'2-3-計量','s','將 X、Y、Z 三種氣體置於一密閉容器中，25℃ 時的初始量與反應後的量如下：\n\n| 化合物 | X | Y | Z |\n|---|---|---|---|\n| 初始 (mol) | 0.2 | 0.1 | 0 |\n| 反應後 (mol) | 0.05 | 0.05 | 0.1 |\n\n此反應的化學反應式為何？（係數為最簡整數比）',o5('$\\mathrm{X+Y\\rightarrow Z}$','$\\mathrm{3X+2Y\\rightarrow Z}$','$\\mathrm{3X+Y\\rightarrow Z}$','$\\mathrm{2X+Y\\rightarrow 2Z}$','$\\mathrm{3X+Y\\rightarrow 2Z}$'),'E','看變化量：X 減 0.15、Y 減 0.05、Z 增 0.1，比 $3:1:2$。係數比＝變化量比，不是剩下的量的比。',KC);
KG('kl109-16',C,U4,'2-4-熱化學式','s','3 mol 的甲醇（$\\mathrm{CH_3OH}$）和氧氣完全作用，放出 1200 kJ 的熱量，下列何者為符合此反應的熱化學反應式？',o5('$\\mathrm{CH_3OH(l)+\\dfrac32O_2(g)\\rightarrow CO_2(g)+2H_2O(l)}$，$\\Delta H=+800$ kJ','$\\mathrm{CH_3OH(l)+\\dfrac32O_2(g)\\rightarrow CO_2(g)+2H_2O(l)}$，$\\Delta H=+400$ kJ','$\\mathrm{CH_3OH(l)+\\dfrac32O_2(g)\\rightarrow CO_2(g)+2H_2O(l)}$，$\\Delta H=-400$ kJ','$\\mathrm{2CH_3OH(l)+3O_2(g)\\rightarrow 2CO_2(g)+4H_2O(l)}$，$\\Delta H=+800$ kJ','$\\mathrm{2CH_3OH(l)+6O_2(g)\\rightarrow 2CO_2(g)+4H_2O(l)}$，$\\Delta H=-800$ kJ'),'C','1 mol 放熱 $1200\\div3=400$ kJ，放熱 ΔH 取負。(D) 正負號錯；(E) 氧沒有平衡。',KC);
KG('kl109-18',C,U1,'鍵型','s','下列各化合物，何者同時具有共價鍵及離子鍵？',o5('乾冰','氯化鈉','硝酸鉀','硫酸','臭氧'),'C','$\\mathrm{KNO_3}$：$\\mathrm{K^+}$ 和 $\\mathrm{NO_3^-}$ 之間是離子鍵，$\\mathrm{NO_3^-}$ 裡 N 和 O 之間是共價鍵。',KC);
KG('kl109-19',C,U4,'2-4-反應熱計算','s','〔延伸：卡計 $q=ms\\Delta T$〕暖暖包內含 100 毫升的水，另有一塑膠袋裝 40 克氯化鈣。已知 $\\mathrm{CaCl_2(s)\\rightarrow CaCl_2(aq)}$，$\\Delta H=-82.8$ kJ/mol，水的比熱為 4.20 J/(g·K)。假設釋出的熱完全由水吸收，取出一個 5℃ 的暖暖包使用，溫度最高可升到幾℃？（Cl＝35.5，Ca＝40）',o5('36','51','63','76','91'),'D','$40\\div111\\approx0.360$ mol，放熱 $0.360\\times82.8\\approx29.8$ kJ。$\\Delta T=\\dfrac{29800}{100\\times4.20}\\approx71$，$5+71=76$℃。',KC);
KG('kl109-20',C,U1,'固體類型','s','下列何者為共價網狀固體？',o5('$\\mathrm{CO_2}$','$\\mathrm{SiF_4}$','$\\mathrm{SiO_2}$','CO','$\\mathrm{NH_3}$'),'C','$\\mathrm{SiO_2}$（石英）是 Si 和 O 以共價鍵無限延伸的網狀結構。其他都是獨立的分子。',KC);
KG('kl109-22',C,U4,'2-4-熱化學式','m','氧化汞熱分解：$\\mathrm{HgO(s)\\rightarrow Hg(l)+\\dfrac12O_2(g)}$，$\\Delta H=90.7$ kJ。下列敘述哪些正確？（應選 3 項）',o5('$\\mathrm{2HgO(s)\\rightarrow 2Hg(l)+O_2(g)}$，$\\Delta H=(90.7\\times2)$ kJ','此反應為放熱反應','若反應以反方向進行，反應熱大小不變，但符號相反','生成物（汞和氧）所含的能量高於反應物（氧化汞）','生成物（汞和氧）所含的能量低於反應物（氧化汞）'),'ACD','ΔH 為正是吸熱：生成物熱含量較高。係數乘 2，ΔH 也乘 2；逆寫變號。',KC);
KG('kl109-23',C,U4,'2-4-熱化學式','m','一個完整的熱化學反應方程式可知道哪些資訊？（應選 3 項）',o5('平衡時反應物與產物的體積比','反應物與產物的狀態','反應前後分子不滅','反應物與產物何者熱含量較高','反應前後原子不滅'),'BDE','熱化學方程式標了狀態、ΔH（看出誰的熱含量高），而且是平衡的反應式（原子不滅）。分子數在反應前後會變。',KC);

{id:"r1",title:"Daisy's Nose",text:"Daisy was an ordinary Labrador until her owner, Claire Guest, noticed something strange. Daisy kept staring at Claire and pushing her chest with her nose. Claire later went to see a doctor and found out that she had breast cancer at an early stage. Because the cancer was found early, she was able to recover after treatment.\n\nThe experience changed Claire's life. She started a charity that trains dogs to detect diseases. Since then, Daisy has helped find cancer in hundreds of samples. Scientists believe that sick cells give off chemicals with a special smell. Humans cannot notice it, but dogs, with their keen noses, can. Today, Claire's team is also training dogs to sniff out other illnesses, such as Parkinson's disease and malaria.",
qs:[["主旨","What is the passage mainly about?","How a dog's nose led to a new way of finding diseases.","Why Labradors are the most popular pets.","How doctors treat breast cancer.","Why some dogs behave strangely.","全文從 Daisy 發現主人生病，談到訓練狗偵測疾病 → 主旨是「狗鼻子帶來找出疾病的新方法」。"],

{id:"r2",title:"The Great Pacific Garbage Patch",text:"Between Hawaii and California lies an area of the Pacific Ocean that is full of trash. It is called the Great Pacific Garbage Patch. Many people imagine it as a floating island of garbage, but in fact, most of it consists of tiny pieces of plastic called microplastics, which are hard to see with the naked eye.\n\nOcean currents carry trash from many countries and gather it in this area. Fish and seabirds often mistake the plastic for food. When people eat fish, they may also take in these harmful substances. Cleaning up the patch is extremely difficult because the pieces are so small. Experts say the best solution is to stop plastic from entering the ocean in the first place.",
qs:[["細節","Why is the garbage patch hard to clean up?","Most of the plastic pieces are very small.","It is too far from any country.","The water there is too cold.","Nobody knows where it is.","Cleaning up the patch is extremely difficult because the pieces are so small。"],
["細節","Which of the following is TRUE?","Ocean currents bring trash to the area.","The patch is a solid island people can walk on.","Only one country causes the problem.","Seabirds avoid eating plastic.","Ocean currents carry trash from many countries and gather it in this area。其他選項都和文章相反。"],

["推論","What does the writer suggest?","Using less plastic is the best way to solve the problem.","People should stop eating fish.","Scientists should build more ships.","The patch will disappear soon.","最後一句：the best solution is to stop plastic from entering the ocean in the first place → 從源頭少用塑膠。"]]},
{id:"r3",title:"Lady Liberty's Secrets",text:"Most visitors to the Statue of Liberty take photos of her torch and crown, but few know about her hidden details. For example, the seven rays on her crown represent the seven continents and seven seas, showing that liberty is for the whole world. Her right foot is raised, as if she is walking forward—a symbol that America is moving toward freedom.\n\nThe torch that visitors see today is not the original one. The first torch was damaged and replaced in 1986; the old one is now displayed in the museum on the island. Visitors used to be able to climb up to the torch, but it has been closed since 1916 for safety reasons. Today, people can still climb 162 steps to the crown—if they book their tickets months in advance.",
qs:[["細節","What do the seven rays on the crown stand for?","The seven continents and seven seas.","The seven days of the week.","The first seven states of the US.","The seven people who built the statue.","the seven rays on her crown represent the seven continents and seven seas。"],
["細節","Why is the statue's right foot raised?","To show that America is moving toward freedom.","Because the statue was damaged.","To help it stand firmly.","Because the artist made a mistake.","as if she is walking forward—a symbol that America is moving toward freedom。"],

["推論","Where would this passage most likely be found?","In a travel magazine.","In a science textbook.","In a cookbook.","In a sports report.","介紹景點的小祕密、參觀與訂票資訊 → 旅遊雜誌。"]]},
{id:"r4",title:"Traveling on a Budget",text:"Traveling abroad doesn't have to be expensive. If you are on a tight budget, here are some tips. First, travel in the off-season. Prices for flights and hotels can drop by up to 50% when there are fewer tourists. Second, stay in a hostel or rent a room from a local family. Not only is it cheaper, but you can also learn about local folklore and customs from your hosts.\n\nThird, instead of joining expensive sightseeing tours, walk or ride a bike. You will be able to take in the scenery at your own pace, and you may come across places that are not in any guidebook. Finally, eat where the locals eat. Food in tourist areas is often overpriced.",

{id:"r5",title:"A Name Worth Millions",text:"In the 1990s, a young man paid only a few dollars to register a domain name. Years later, a big company wanted to use that name for its website and offered him millions of dollars. After weeks of negotiating, the two sides finally agreed on a price. Stories like this show that a domain name can be a valuable asset.\n\nHowever, buying a domain name only to sell it at a high price is not always legal. In many countries, if you register a famous company's name on purpose, the company can take the name back through the courts. Experts suggest that small businesses register their names early to ensure that no one else takes them.",

/* ---------- 統計 ---------- */
function roundsOf(s,modes){return ST.rounds.filter(function(r){return r.s===s&&modes.indexOf(r.mode)>=0})}
function eff(it){return (it.sc||0)*((it.g||it.h)?0.4:1)}
function subjStat(s){
  var rs=roundsOf(s,['new','drill','exam']),items=[];rs.forEach(function(r){(r.items||[]).forEach(function(it){items.push(it)})});
  var last=items.slice(-30),acc=last.length?avgOf(last.map(function(it){return it.sc||0})):null;
  var judged=rs.filter(function(r){return (r.mode==='new'||r.mode==='exam')&&r.n>=5}),l3=judged.slice(-3).map(function(r){return r.pct});
  var stable=l3.length===3&&l3.every(function(p){return p>=90});
  var st=acc==null?'none':(stable?'ok':(acc>=0.8?'near':'low'));
  var label=acc==null?'尚未作答':(stable?'穩定 90':(acc>=0.9?'達標，待連三輪':(acc>=0.8?'接近':'待加強')));
  return {n:items.length,acc:acc,rounds:rs.length,l3:l3,stable:stable,st:st,label:label,trend:rs.slice(-14).map(function(r){return r.pct})};
}
function tagStat(s){
  var m={};roundsOf(s,['new','drill','redo']).forEach(function(r){(r.items||[]).forEach(function(it){var o=m[it.t]||(m[it.t]={n:0,sum:0,rec:[]});o.n++;o.sum+=it.sc||0;o.rec.push(eff(it));if(o.rec.length>8)o.rec.shift()})});
  return m;
}
function weightFn(s){
  var ts=tagStat(s);
  return function(t){
    var p=Math.min(DATA.prior[s+'|'+t]||0,12),o=ts[t];
    if(!o||!o.n)return 1.5+0.25*p;
    var acc=avgOf(o.rec);
    if(o.n>=5&&acc>=0.9)return 0.6;
    return 1+(o.n<5?0.25*p:0)+(1-acc)*4;
  };
}
function weakScore(s,t,ts){
  var p=DATA.prior[s+'|'+t]||0,o=ts[t];
  if(!o||!o.n)return p*0.5;
  var acc=avgOf(o.rec);
  if(o.n>=5&&acc>=0.9)return 0;
  return (o.n<5?p*0.5:0)+(1-acc)*o.rec.length*1.5;
}
function lessonScore(l,ts){var sum=0,mx=0;l.tags.forEach(function(t){var v=weakScore(l.s,t,ts);sum+=v;if(v>mx)mx=v});return mx+0.2*(sum-mx)}
function mistakes(s){
  var m={};roundsOf(s,['new','drill','redo']).forEach(function(r){(r.items||[]).forEach(function(it){if(it.w)m[it.w]=(m[it.w]||0)+1})});
  return Object.keys(m).map(function(k){return {w:k,n:m[k]}}).sort(function(a,b){return b.n-a.n});
}
function draw(s,units,n,opt){
  opt=opt||{};var seen=ST.seen[s]||(ST.seen[s]={}),w=weightFn(s);
  var stat=QS.filter(function(q){return q.s===s&&units.indexOf(q.u)>=0&&!seen[q.id]&&(opt.old||!q.old)&&(!opt.tags||opt.tags.indexOf(q.t)>=0)&&!(opt.skip&&opt.skip[q.id])&&(!opt.src||isKG(q))});
  var gens=opt.src?[]:gensFor(s,units).filter(function(t){return !opt.tags||opt.tags.indexOf(t)>=0});
  var slots=stat.map(function(q){return {q:q,w:w(q.t)}}),Ws=0,Wg=0;
  slots.forEach(function(x){Ws+=x.w});gens.forEach(function(t){Wg+=w(t)});
  var share=opt.tags?0.6:(GSHARE[s]||0.1),scale=(Ws>0&&Wg>0)?(share/(1-share))*Ws/Wg:1;
  gens.forEach(function(t){slots.push({g:t,w:w(t)*scale,left:opt.tags?n:(share>=0.5?2:1)})});
  var out=[],local={};
  while(out.length<n&&slots.length){
    var tot=0,i;for(i=0;i<slots.length;i++)tot+=slots[i].w;
    var r=Math.random()*tot;for(i=0;i<slots.length;i++){r-=slots[i].w;if(r<=0)break}
    if(i>=slots.length)i=slots.length-1;
    var sl=slots[i];
    if(sl.q){out.push(sl.q);slots.splice(i,1)}
    else{
      var merged={},k;for(k in seen)merged[k]=1;for(k in local)merged[k]=1;
      var g=sl.g==='單字-字義'?makeVocabQ(merged):makeGen(sl.g,merged);
      if(g){out.push(g);local[g.id]=1;sl.left--}else sl.left=0;
      if(sl.left<=0)slots.splice(i,1);
    }
  }
  return shuffle(out);
}
function countNew(s,u){var seen=ST.seen[s]||{},a=0,b=0;QS.forEach(function(q){if(q.s===s&&q.u===u&&!seen[q.id]){if(q.old)b++;else a++}});return {fresh:a,old:b,gen:gensFor(s,[u]).length>0}}

}

function planFor(s){
  var ts=tagStat(s),t=today(),p=pref(s),ls=LS.filter(function(l){return l.s===s}),l=null;

    p.plan={d:t,id:l.id};

  ST.rounds.forEach(function(r){if(r.s!==s||r.d!==t)return;if(r.mode==='drill'&&l&&r.lesson===l.id)d2=true;if(r.mode==='new'&&r.n>=5)d3=true});

function aiGen(){

function prep(q){var o={};for(var k in q)o[k]=q[k];if(q.opts){var a=q.shuffle?shuffle(q.opts):q.opts.slice();o.opts=a.map(function(x,i){return {lab:x.lab||'ABCDE'[i],txt:x.txt,ok:x.ok,why:x.why}})}return o}

  R={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),s:s,units:units,mode:opt.mode||'new',n0:n,qs:qs.map(prep),i:0,items:[],t0:Date.now(),cur:newCur(),lesson:opt.lesson||null,label:opt.label||null};
