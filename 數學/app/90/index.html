14","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"年滿 25 歲的小芸想登記參選。單就年齡條件而言，她可以參選下列哪一項公職？","o":[["A","立法委員"],["B","縣市長"],["C","總統"],["D","副總統"]],"a":"A"},{"i":"b1415","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"年滿 19 歲、設籍桃園多年的大學生阿哲，可以參加下列哪一種投票？","o":[["A","總統副總統選舉"],["B","立法委員罷免投票"],["C","桃園市議員選舉"],["D","全國性公民投票"]],"a":"D"},{"i":"b1416","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某市長任內沒有任何違法紀錄，但多項政策引發民怨，市民發起罷免。下列敘述何者正確？","o":[["A","須先經法院判決市長違法，才能提出罷免"],["B","應由監察院提案罷免"],["C","罷免追究的是政治責任，不以違法為要件"],["D","市長就職滿三個月即可被罷免"]],"a":"C"},{"i":"b1417","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"監察院調查發現某部會官員違法失職，提案後移送懲戒法院審理。這屬於下列何者？","o":[["A","罷免，追究政治責任"],["B","彈劾，追究法律責任"],["C","請願，表達對政策的希望"],["D","複決，由人民投票決定"]],"a":"B"},{"i":"b1418","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某選區市民想罷免該區選出的區域立法委員。罷免案的提議與連署應由下列何者進行？","o":[["A","該立委原選區的選舉人"],["B","立法院全體立委四分之一以上"],["C","全國選舉人"],["D","中央選舉委員會"]],"a":"A"},{"i":"b1419","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某議員的罷免案投票結果為不通過。支持罷免的團體半年後想對他再發起一次罷免。下列敘述何者正確？","o":[["A","可以，只要重新完成提議與連署"],["B","可以，但須改由議會提出"],["C","不可以，因為罷免須就職滿兩年"],["D","不可以，同一任期內不得對同一人再提罷免"]],"a":"D"},{"i":"b1420","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"下列哪一項事項可以作為全國性公民投票的提案？","o":[["A","調降綜合所得稅稅率"],["B","下一年度中央政府總預算"],["C","是否推動某項重大能源政策"],["D","軍公教人員調薪"]],"a":"C"},{"i":"b1421","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"關於我國全國性公民投票，下列敘述何者正確？","o":[["A","自 2021 年起，於每兩年 8 月第 4 個星期六舉行"],["B","與總統選舉同日舉行"],["C","投票年齡為 20 歲"],["D","通過門檻為有效同意票達投票權人總額半數"]],"a":"A"},{"i":"b1422","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"三位同學討論罷免程序。甲：「罷免的第一階段是提案，人數須達原選區選舉人總數的 1%。」乙：「罷免區域立委的連署，由立法院的立委發動。」丙：「罷免案提出後就直接投票，不需要連署。」上述說法正確的有哪些？","o":[["A","甲乙"],["B","僅甲"],["C","乙丙"],["D","甲丙"]],"a":"B"},{"i":"b1423","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某全國性教師團體為反對一項教育法案，召開記者會、拜會立法委員並發起連署，但不推薦任何候選人參選。此團體屬於下列何者？","o":[["A","政黨"],["B","行政機關"],["C","選舉委員會"],["D","利益團體"]],"a":"D"},{"i":"b1424","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"甲組織推薦候選人參選縣長，並提出完整政見；乙組織是全國性工會，為修改勞動法規拜會立委、發起連署；丙組織是商業公會，捐款支持理念相近的候選人，但自己不推派任何人參選。甲、乙、丙依序屬於什麼？","o":[["A","利益團體、政黨、政黨"],["B","政黨、政黨、利益團體"],["C","政黨、利益團體、利益團體"],["D","利益團體、利益團體、政黨"]],"a":"C","d":1},{"i":"b1425","s":"公民","u":"第3課","t":"3-公投事項","k":"m","q":"關於公民投票的優缺點與沿革，下列敘述哪些正確？","o":[["A","公民投票讓人民直接決定公共事務，可補足代議政治的不足"],["B","2003 年制定《公民投票法》時門檻很高，曾被批評為「鳥籠公投」"],["C","公民投票的結果一定能保障少數人的權益"],["D","議題若過於複雜，選民可能缺乏足夠資訊做判斷"],["E","2019 年修法後，公民投票改為與全國性選舉同日舉行"]],"a":"ABD","d":1},{"i":"b1426","s":"公民","u":"第3課","t":"3-選制席次","k":"m","q":"關於我國各項公職人員的選舉制度，下列敘述哪些正確？","o":[["A","總統、副總統選舉採相對多數決，得票最多的一組當選"],["B","區域立委每一選區選出二至三席"],["C","地方議員選舉採單一選區兩票制"],["D","原住民立委採複數選區單記不可讓渡投票制"],["E","不分區立委的當選名單中，婦女不得少於二分之一"]],"a":"ADE"},{"i":"b1427","s":"公民","u":"第3課","t":"3-選制席次","k":"m","q":"關於單一選區相對多數制與比例代表制的比較，下列敘述哪些正確？","o":[["A","單一選區相對多數制下，投給落選者而未能轉為席次的票較多"],["B","比例代表制下，選民主要投給政黨"],["C","單一選區相對多數制較有利於小黨"],["D","比例代表制下，各黨席次率較接近得票率"],["E","比例代表制設定政黨得票門檻，是為了避免小黨林立"]],"a":"ABDE"},{"i":"b1428","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"關於我國的罷免制度，下列敘述哪些正確？","o":[["A","一般公職人員的罷免須經提議、連署、投票三個階段"],["B","提議門檻為 1%、連署門檻為 10%，分母都是原選區選舉人總數"],["C","罷免案通過後，被罷免人 4 年內不得再參選同一公職"],["D","區域立委的罷免，提案與連署都由該立委原選區的選舉人進行"],["E","罷免投票須投票率超過二分之一才算有效"]],"a":"ABCD"},{"i":"b1429","s":"公民","u":"第3課","t":"3-公投事項","k":"m","q":"關於我國全國性公民投票，下列敘述哪些正確？","o":[["A","投票年齡為 18 歲"],["B","公民投票不與全國性選舉同日舉行"],["C","通過須有效同意票多於不同意票，且達投票權人總額四分之一以上"],["D","公民投票的提案人數須達最近一次總統選舉選舉人總數的 1.5%"],["E","租稅事項可以提出公民投票"]],"a":"ABC"},{"i":"b1430","s":"公民","u":"第3課","t":"第3課-綜合","k":"m","q":"關於政黨與利益團體，下列敘述哪些正確？","o":[["A","政黨以推薦候選人參選、取得政權為主要目的"],["B","利益團體一定是營利組織"],["C","利益團體可以透過遊說、召開記者會等方式影響政策"],["D","利益團體以推薦候選人、組成政府為主要目的"],["E","人民可以加入政黨或利益團體，作為選舉之外參與政治的管道"]],"a":"ACE"},{"i":"b1431","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"關於丁黨，下列敘述何者正確？","o":[["A","丁黨可分得 1 席不分區"],["B","丁黨未達 5% 門檻，不參與不分區席次分配"],["C","丁黨可分得 $40 \\times 4\\% = 1.6$，四捨五入為 2 席"],["D","丁黨的政黨票自動轉給得票最高的甲黨"]],"a":"B","c":"某國國會共 100 席：區域 60 席，以單一選區相對多數制選出；不分區 40 席，依政黨票分配。該國採並立制，區域席次與不分區席次分開計算後相加。某次選舉結果如下表。\n\n| 政黨 | 區域當選席次 | 政黨票得票率 |\n|---|---|---|\n| 甲黨 | 38 | 48% |\n| 乙黨 | 20 | 32% |\n| 丙黨 | 2 | 16% |\n| 丁黨 | 0 | 4% |\n| 合計 | 60 | 100% |\n\n不分區席次的分配規則：\n1. 政黨票得票率達 5% 的政黨，才能分配不分區席次。\n2. 以「達門檻政黨的得票率合計」為分母，重新計算各黨比例，再乘以應分配席次。\n3. 先分配整數席次；剩餘席次依各黨小數部分由大到小依序分配。"},{"i":"b1432","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"乙黨可分得幾席不分區立委？","o":[["A","13 席"],["B","14 席"],["C","12 席"],["D","15 席"]],"a":"A","c":"某國國會共 100 席：區域 60 席，以單一選區相對多數制選出；不分區 40 席，依政黨票分配。該國採並立制，區域席次與不分區席次分開計算後相加。某次選舉結果如下表。\n\n| 政黨 | 區域當選席次 | 政黨票得票率 |\n|---|---|---|\n| 甲黨 | 38 | 48% |\n| 乙黨 | 20 | 32% |\n| 丙黨 | 2 | 16% |\n| 丁黨 | 0 | 4% |\n| 合計 | 60 | 100% |\n\n不分區席次的分配規則：\n1. 政黨票得票率達 5% 的政黨，才能分配不分區席次。\n2. 以「達門檻政黨的得票率合計」為分母，重新計算各黨比例，再乘以應分配席次。\n3. 先分配整數席次；剩餘席次依各黨小數部分由大到小依序分配。"},{"i":"b1433","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"依該國的並立制，甲黨在國會的總席次為何？","o":[["A","50 席"],["B","54 席"],["C","58 席"],["D","60 席"]],"a":"C","c":"某國國會共 100 席：區域 60 席，以單一選區相對多數制選出；不分區 40 席，依政黨票分配。該國採並立制，區域席次與不分區席次分開計算後相加。某次選舉結果如下表。\n\n| 政黨 | 區域當選席次 | 政黨票得票率 |\n|---|---|---|\n| 甲黨 | 38 | 48% |\n| 乙黨 | 20 | 32% |\n| 丙黨 | 2 | 16% |\n| 丁黨 | 0 | 4% |\n| 合計 | 60 | 100% |\n\n不分區席次的分配規則：\n1. 政黨票得票率達 5% 的政黨，才能分配不分區席次。\n2. 以「達門檻政黨的得票率合計」為分母，重新計算各黨比例，再乘以應分配席次。\n3. 先分配整數席次；剩餘席次依各黨小數部分由大到小依序分配。"},{"i":"b1434","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"甲黨政黨票得票率 48%，在國會的席次率卻達 58%。下列敘述何者最適當？","o":[["A","並立制下，各黨席次率一定等於政黨票得票率"],["B","甲黨席次率較高，是因為分到了丁黨的政黨票"],["C","不分區席次是依區域候選人得票分配，才造成落差"],["D","區域席次採單一選區，大黨贏得較多席次，使並立制對大黨較有利"]],"a":"D","c":"某國國會共 100 席：區域 60 席，以單一選區相對多數制選出；不分區 40 席，依政黨票分配。該國採並立制，區域席次與不分區席次分開計算後相加。某次選舉結果如下表。\n\n| 政黨 | 區域當選席次 | 政黨票得票率 |\n|---|---|---|\n| 甲黨 | 38 | 48% |\n| 乙黨 | 20 | 32% |\n| 丙黨 | 2 | 16% |\n| 丁黨 | 0 | 4% |\n| 合計 | 60 | 100% |\n\n不分區席次的分配規則：\n1. 政黨票得票率達 5% 的政黨，才能分配不分區席次。\n2. 以「達門檻政黨的得票率合計」為分母，重新計算各黨比例，再乘以應分配席次。\n3. 先分配整數席次；剩餘席次依各黨小數部分由大到小依序分配。"},{"i":"b1439","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"選舉常被稱為民主政治最基本的參與方式。下列何者最能說明原因？","o":[["A","選舉可以取代其他所有參與方式"],["B","選舉結果不必受任何法律規範"],["C","人民用選票授權政府，也能定期更換執政者"],["D","只有政黨黨員才能投票"]],"a":"C"},{"i":"b1440","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"年滿 22 歲、在戶籍地住了十幾年的小安，對今年的選舉有興趣。下列敘述何者正確？","o":[["A","他可以投票，但還不能登記參選立法委員"],["B","他可以登記參選直轄市議員"],["C","他可以登記參選縣長"],["D","他還不能投票"]],"a":"A"},{"i":"b1441","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國直轄市議員選舉採用下列哪一種制度？","o":[["A","單一選區相對多數決"],["B","複數選區相對多數決"],["C","政黨比例代表制"],["D","並立制"]],"a":"B"},{"i":"b1442","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國立法委員選舉，選民會拿到兩張選票。第二張「政黨票」的用途是什麼？","o":[["A","選出總統、副總統"],["B","決定區域立委 73 席的當選人"],["C","選出原住民立委"],["D","決定各黨不分區及僑居國外國民立委 34 席的分配"]],"a":"D"},{"i":"b1443","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國某政黨在立委選舉中，區域立委當選 20 席，政黨票依規定計算後可分得若干席不分區。依我國制度，該黨在立法院的總席次如何決定？","o":[["A","區域當選的 20 席，加上依政黨票分得的不分區席次"],["B","依政黨票比例算出全院總席次，區域不足的部分由名單補足"],["C","政黨票只用來決定區域立委的當選人"],["D","區域當選席次須先扣除，剩下的才能分配不分區"]],"a":"A"},{"i":"b1444","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某縣議員選區應選出 8 席。一位無黨籍候選人得票率只有 6%，排名第 7，最後當選。他能以這麼低的得票率當選，最主要的原因是什麼？","o":[["A","該選區採單一選區相對多數制"],["B","議員選舉依政黨票比例分配席次"],["C","複數選區一區選出多席，當選門檻較低"],["D","議員選舉採並立制"]],"a":"C"},{"i":"b1445","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"關於我國《公民投票法》的沿革，下列敘述何者正確？","o":[["A","2003 年制定時門檻就很低，人民很容易提出公投"],["B","2017 年修法，投票年齡降為 18 歲，並降低提案、連署與通過門檻"],["C","2019 年修法，公民投票改為與總統選舉同日舉行"],["D","《公民投票法》制定後從未修正"]],"a":"B"},{"i":"b1446","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某縣長的罷免案投票通過。下列敘述何者正確？","o":[["A","縣長可以立即參加該職缺的補選"],["B","罷免結果還須經法院判決確定"],["C","由監察院決定縣長是否解職"],["D","被罷免人自解職起 4 年內不得再參選同一公職"]],"a":"D"},{"i":"b1447","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某市議員原選區的選舉人總數為 32 萬人。罷免投票結果：同意票 7.6 萬票、不同意票 3 萬票。此罷免案的結果為何？","o":[["A","通過，因為同意票多於不同意票"],["B","通過，因為投票率不影響結果"],["C","不通過，因為同意票未達 8 萬票"],["D","不通過，因為不同意票未達選舉人總數的四分之一"]],"a":"C"},{"i":"b1448","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"下列哪一項事項可以作為全國性公民投票的提案？","o":[["A","某項法律的複決"],["B","行政院某部會首長人選"],["C","調高營業稅稅率"],["D","公務人員調薪幅度"]],"a":"A"},{"i":"b1449","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"某次全國性公民投票的投票權人總額為 1,960 萬人。某案有效同意票 480 萬票、不同意票 200 萬票。此案的結果為何？","o":[["A","通過，因為同意票是不同意票的兩倍以上"],["B","通過，因為同意票超過有效票的一半"],["C","不通過，因為同意票須過投票權人總額半數"],["D","不通過，因為同意票未達投票權人總額四分之一（490 萬票）"]],"a":"D"},{"i":"b1450","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"某團體提出完整的政綱，在各選區推薦候選人參選立法委員，目標是在國會取得多數並組成政府。此團體屬於下列何者？","o":[["A","利益團體"],["B","政黨"],["C","行政機關"],["D","選舉委員會"]],"a":"B"},{"i":"b1451","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"某項公投的反對者表示：「這個議題牽涉複雜的專業知識，多數人可能沒時間弄懂就去投票。」這段話是在指出公民投票的哪一項缺點？","o":[["A","選民可能缺乏足夠資訊做判斷"],["B","公投違反主權在民的原則"],["C","公投無法補足代議政治的不足"],["D","公投結果沒有任何效力"]],"a":"A"},{"i":"b1452","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣進行河川整治：縣府擬定計畫，企業認養河段，社區組成巡守隊，環保團體定期監測水質並公布結果。這個例子最能說明下列何者？","o":[["A","由上而下的統治"],["B","由專家單獨決策"],["C","市場完全取代政府"],["D","政府、市場與公民社會共同參與的治理"]],"a":"D"},{"i":"b1453","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"記者依《政府資訊公開法》申請查閱某局處的會議紀錄與經費支出資料，機關依規定提供。這最能體現民主治理的哪一項核心概念？","o":[["A","回應"],["B","課責"],["C","透明"],["D","法治"]],"a":"C"},{"i":"b1454","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"民眾在公共政策網路參與平臺提出的提案達到附議門檻後，主管機關必須在期限內具體回覆。這最能體現民主治理的哪一項核心概念？","o":[["A","透明"],["B","回應"],["C","法治"],["D","垂直課責"]],"a":"B"},{"i":"b1455","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市規定，各局處作成行政處分都必須依《行政程序法》規定的程序與要件辦理，不得任意為之。這最能體現民主治理的哪一項核心概念？","o":[["A","法治"],["B","參與"],["C","回應"],["D","社會課責"]],"a":"A"},{"i":"b1456","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某區公所撥出 500 萬元，由居民提案、討論後投票決定這筆經費的用途。這種做法最能體現下列何者？","o":[["A","垂直課責"],["B","匡正正義"],["C","由上而下的統治"],["D","公民參與"]],"a":"D"},{"i":"b1457","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市議員任內爭議不斷，原選區選民發起罷免並投票通過。這屬於哪一種課責？","o":[["A","水平課責"],["B","社會課責"],["C","垂直課責"],["D","匡正正義"]],"a":"C"},{"i":"b1458","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"審計部審核中央政府決算時，發現某計畫經費使用浮濫，並通知相關機關檢討改善。這屬於哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","程序正義"]],"a":"B"},{"i":"b1459","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某電視台以調查報導揭露一件工程弊案，引發輿論要求主管機關說明並追究責任。這屬於哪一種課責？","o":[["A","水平課責"],["B","垂直課責"],["C","匡正正義"],["D","社會課責"]],"a":"D"},{"i":"b1460","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣政府拒絕公布一項重大工程的預算與合約內容，議員與民眾都無法得知細節。這種情形最可能造成下列何種結果？","o":[["A","課責難以進行，因為透明是課責的前提"],["B","政府的回應性因此提高"],["C","政府更加符合法治"],["D","民眾更容易參與決策"]],"a":"A"},{"i":"b1461","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某獎學金審查會中，一名委員的女兒也提出申請，這名委員主動退出該案的審查。這最能體現下列何者？","o":[["A","分配正義"],["B","匡正正義"],["C","程序正義"],["D","形式平等"]],"a":"C"},{"i":"b1462","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某人被判刑入獄多年，後來經再審改判無罪，國家依法給予賠償。這最能體現下列何者？","o":[["A","程序正義"],["B","匡正正義"],["C","分配正義"],["D","實質平等"]],"a":"B"},{"i":"b1463","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲班把班費結餘平均退還給每位同學；乙校的清寒補助依學生家庭經濟狀況核發；丙隊依每位隊員的比賽表現頒發獎金。甲、乙、丙依序採用哪一種分配標準？","o":[["A","需要、平等、貢獻"],["B","貢獻、需要、平等"],["C","平等、貢獻、需要"],["D","平等、需要、貢獻"]],"a":"D"},{"i":"b1464","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"大型考試為視障考生提供點字試卷，並延長作答時間。下列評論何者最適當？","o":[["A","這是考量處境的合理差別待遇，符合實質平等"],["B","這對其他考生不公平，違反平等原則"],["C","這是對過去損害的補救，屬於匡正正義"],["D","這是所有考生適用同一規則的形式平等"]],"a":"A"},{"i":"b1465","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某公司規定，女性員工懷孕就必須離職。下列評論何者最適當？","o":[["A","這是保障女性的積極平權措施"],["B","這是考量處境差異的實質平等"],["C","這是沒有正當理由的差別待遇，屬於歧視"],["D","這是確保決定過程公平的程序正義"]],"a":"C"},{"i":"b1466","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某同學說：「如果我不知道自己會出生在富裕還是貧窮的家庭、有沒有身心障礙，我會希望社會制度能讓最弱勢的人也過得去。」這段話最接近下列哪一種主張？","o":[["A","效益主義"],["B","羅爾斯的無知之幕"],["C","自由至上主義"],["D","形式平等"]],"a":"B"},{"i":"b1467","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"關於我國各項選舉制度，下列敘述哪些正確？","o":[["A","立法委員共 113 席，任期 4 年"],["B","不分區立委的政黨票門檻為 5%"],["C","總統與縣市長選舉都採相對多數決"],["D","地方議員選舉中，同黨候選人可能互相搶票，因此政黨常呼籲配票"],["E","總統候選人須年滿 30 歲"]],"a":"ABCD"},{"i":"b1468","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"關於罷免與全國性公民投票，下列敘述哪些正確？","o":[["A","罷免與全國性公投的門檻，分母都是選舉人或投票權人「總數」，不是投票人數"],["B","罷免與全國性公投要通過，同意票都必須多於不同意票"],["C","罷免案的提案門檻為 1%、連署門檻為 10%"],["D","全國性公投的提案門檻為最近一次總統選舉選舉人總數的 1.5%"],["E","全國性公投在每兩年 8 月第 4 個星期六舉行"]],"a":"ABCE"},{"i":"b1469","s":"公民","u":"第3課","t":"第3課-綜合","k":"m","q":"關於政治參與的管道與民主治理，下列敘述哪些正確？","o":[["A","在公共政策網路參與平臺提案、附議，是人民參與公共決策的管道"],["B","利益團體一定要推薦候選人參選，才能影響政策"],["C","有時間、有資源的人較常參與，是民主治理面臨的挑戰"],["D","政黨以取得政權為目的，利益團體以影響政策為目的"],["E","公聽會與聽證只有公務員可以參加"]],"a":"ACD"},{"i":"b1470","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"關於課責，下列敘述哪些正確？","o":[["A","立法委員在立法院質詢行政院長，屬於水平課責"],["B","法院審查政府行為是否合法、合憲，屬於水平課責"],["C","選民罷免議員，屬於社會課責"],["D","公民團體發布立委問政評鑑報告，屬於社會課責"],["E","監察院彈劾違法失職的公務員，追究的是政治責任"]],"a":"ABD"},{"i":"b1471","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"關於公平正義與平等，下列敘述哪些正確？","o":[["A","冤獄賠償體現匡正正義"],["B","所有的差別待遇都違反平等原則"],["C","合理的差別待遇須有正當目的，且手段與目的有合理關聯"],["D","形式平等一定能讓起點不同的人得到公平的結果"],["E","規定委員會任一性別不得少於一定比例，屬於積極平權措施"]],"a":"ACE"},{"i":"b1472","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"關於公平正義的衝突與民主社會的處理方式，下列敘述哪些正確？","o":[["A","效益主義以整體幸福最大化作為判斷標準"],["B","羅爾斯主張社會經濟上的不平等，必須對最不利者最有利"],["C","自由至上主義支持國家進行大規模的財富重分配"],["D","只要經過多數決，就可以限制少數人的基本權利"],["E","民主社會可透過公開審議、立法與司法程序及妥協，處理正義爭議"]],"a":"ABE"},{"i":"b1473","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"甲黨共贏得幾席？","o":[["A","1 席"],["B","2 席"],["C","3 席"],["D","4 席"]],"a":"D","c":"某國國會只有 5 席，全國劃分為 5 個單一選區，每區選出 1 名議員，採相對多數決。每區有效票都是 10 萬票，各黨得票如下表（單位：萬票）。\n\n| 選區 | 甲黨 | 乙黨 | 丙黨 |\n|---|---|---|---|\n| 第 1 區 | 4.5 | 4.0 | 1.5 |\n| 第 2 區 | 4.0 | 3.5 | 2.5 |\n| 第 3 區 | 3.0 | 5.0 | 2.0 |\n| 第 4 區 | 4.2 | 3.8 | 2.0 |\n| 第 5 區 | 3.8 | 3.6 | 2.6 |\n| 合計 | 19.5 | 19.9 | 10.6 |"},{"i":"b1474","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"根據表中資料，下列敘述何者正確？","o":[["A","乙黨全國總得票最多，卻只得到 1 席"],["B","甲黨在每一個選區的得票都過半"],["C","丙黨全國得票率超過二成，因此至少可得 1 席"],["D","甲黨的席次率與全國得票率十分接近"]],"a":"A","c":"某國國會只有 5 席，全國劃分為 5 個單一選區，每區選出 1 名議員，採相對多數決。每區有效票都是 10 萬票，各黨得票如下表（單位：萬票）。\n\n| 選區 | 甲黨 | 乙黨 | 丙黨 |\n|---|---|---|---|\n| 第 1 區 | 4.5 | 4.0 | 1.5 |\n| 第 2 區 | 4.0 | 3.5 | 2.5 |\n| 第 3 區 | 3.0 | 5.0 | 2.0 |\n| 第 4 區 | 4.2 | 3.8 | 2.0 |\n| 第 5 區 | 3.8 | 3.6 | 2.6 |\n| 合計 | 19.5 | 19.9 | 10.6 |"},{"i":"b1475","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"若該國改採全國單一選區的比例代表制：5 席依各黨全國得票率分配，不設門檻；先分配整數席次，剩餘席次依小數部分由大到小依序分配。丙黨可得幾席？","o":[["A","0 席"],["B","1 席"],["C","2 席"],["D","3 席"]],"a":"B","c":"某國國會只有 5 席，全國劃分為 5 個單一選區，每區選出 1 名議員，採相對多數決。每區有效票都是 10 萬票，各黨得票如下表（單位：萬票）。\n\n| 選區 | 甲黨 | 乙黨 | 丙黨 |\n|---|---|---|---|\n| 第 1 區 | 4.5 | 4.0 | 1.5 |\n| 第 2 區 | 4.0 | 3.5 | 2.5 |\n| 第 3 區 | 3.0 | 5.0 | 2.0 |\n| 第 4 區 | 4.2 | 3.8 | 2.0 |\n| 第 5 區 | 3.8 | 3.6 | 2.6 |\n| 合計 | 19.5 | 19.9 | 10.6 |"},{"i":"b1476","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"在第 2 區，投給落選候選人、沒有轉為任何席次的票共有幾萬票？","o":[["A","2.5 萬票"],["B","3.5 萬票"],["C","6.0 萬票"],["D","4.0 萬票"]],"a":"C","c":"某國國會只有 5 席，全國劃分為 5 個單一選區，每區選出 1 名議員，採相對多數決。每區有效票都是 10 萬票，各黨得票如下表（單位：萬票）。\n\n| 選區 | 甲黨 | 乙黨 | 丙黨 |\n|---|---|---|---|\n| 第 1 區 | 4.5 | 4.0 | 1.5 |\n| 第 2 區 | 4.0 | 3.5 | 2.5 |\n| 第 3 區 | 3.0 | 5.0 | 2.0 |\n| 第 4 區 | 4.2 | 3.8 | 2.0 |\n| 第 5 區 | 3.8 | 3.6 | 2.6 |\n| 合計 | 19.5 | 19.9 | 10.6 |"},{"i":"b1481","s":"數學","u":"單元05","t":"05-垂直線","k":"s","q":"通過點 $(-3,2)$，且與直線 $2x+y-5=0$ 垂直的直線方程式為下列哪一個選項？","o":[["1","$x-2y-7=0$"],["2","$2x+y+4=0$"],["3","$2x-y+8=0$"],["4","$x-2y+7=0$"],["5","$x+2y-1=0$"]],"a":"4"},{"i":"b1482","s":"數學","u":"單元06","t":"06-是圓條件","k":"s","q":"方程式 $2x^2+2y^2-8x+12y+18=0$ 的圖形為一圓，其圓心與半徑為下列哪一個選項？","o":[["1","圓心 $(-2,3)$，半徑 $2$"],["2","圓心 $(2,-3)$，半徑 $2$"],["3","圓心 $(2,-3)$，半徑 $4$"],["4","圓心 $(4,-6)$，半徑 $\\sqrt{34}$"],["5","圓心 $(-4,6)$，半徑 $\\sqrt{34}$"]],"a":"2"},{"i":"b1483","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"已知圓 $C:(x-2)^2+(y-1)^2=16$ 與直線 $L:3x-4y+k=0$。若圓 $C$ 上與直線 $L$ 的距離為 $1$ 的點恰有 $3$ 個，則 $k$ 的所有可能值為下列哪一個選項？","o":[["1","$13$"],["2","$3$ 或 $-7$"],["3","$23$ 或 $-27$"],["4","$17$ 或 $-13$"],["5","$13$ 或 $-17$"]],"a":"5"},{"i":"b1484","s":"數學","u":"單元05","t":"05-平移","k":"m","q":"已知直線 $L_1:3x-4y+2=0$ 與 $L_2:6x-8y-11=0$，下列敘述哪些正確？","o":[["1","$L_1$ 的斜率為 $\\frac34$"],["2","$L_1$ 與 $L_2$ 的距離為 $\\frac32$"],["3","原點與點 $(1,2)$ 位於 $L_1$ 的同側"],["4","$L_1$ 與兩坐標軸所圍成的三角形面積為 $\\frac16$"],["5","將 $L_1$ 向右平移 $2$ 單位，所得直線為 $3x-4y-4=0$"]],"a":"1245"},{"i":"b1485","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"設 $k$ 為實數，圖形 $S:x^2+y^2+2x-6y+k=0$。下列敘述哪些正確？","o":[["1","$S$ 為一圓的充要條件是 $k\\le10$"],["2","當 $k=1$ 時，$S$ 與 $x$ 軸相切"],["3","當 $k=9$ 時，$S$ 與 $y$ 軸交於相異兩點"],["4","$S$ 為一圓且原點在 $S$ 的外部的充要條件是 $0<k<10$"],["5","當 $k=6$ 時，$S$ 的半徑為 $2$"]],"a":"245"},{"i":"b1486","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上兩點 $A(0,0)$、$B(6,0)$，下列敘述哪些正確？","o":[["1","以 $\\overline{AB}$ 為直徑的圓方程式為 $(x-3)^2+y^2=9$"],["2","通過 $A$、$B$ 兩點且圓心在直線 $y=x-1$ 上的圓，其圓心為 $(3,2)$"],["3","滿足 $\\overline{PA}=2\\overline{PB}$ 的所有點 $P$ 形成一圓，其圓心為 $(8,0)$"],["4","承 (3)，此圓的半徑為 $8$"],["5","滿足 $\\overline{PA}=\\overline{PB}$ 的所有點 $P$ 形成直線 $y=3$"]],"a":"123"},{"i":"b1487","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-2x+4y-20=0$，下列敘述哪些正確？","o":[["1","點 $(7,6)$ 到圓 $C$ 上各點距離的最大值為 $10$"],["2","點 $(7,6)$ 到圓 $C$ 上各點距離的最小值為 $5$"],["3","直線 $3x+4y-10=0$ 被圓 $C$ 所截的弦長為 $8$"],["4","通過點 $(1,1)$ 的所有弦中，最短的弦長為 $6$"],["5","通過點 $(6,-2)$ 可作兩條與圓 $C$ 相切的直線"]],"a":"23"},{"i":"b1488","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-4x+2y=0$，下列敘述哪些正確？","o":[["1","圓 $C$ 在點 $(3,1)$ 的切線方程式為 $x+2y-5=0$"],["2","直線 $x-2y+k=0$ 與圓 $C$ 相切，則 $k=-1$ 或 $9$"],["3","直線 $2x-y+k=0$ 與圓 $C$ 不相交的充要條件是 $k>0$ 或 $k<-10$"],["4","與直線 $2x+y=0$ 平行且與圓 $C$ 相切的兩條直線，兩線之間的距離為 $\\sqrt5$"],["5","圓 $C$ 通過原點，且圓 $C$ 在原點的切線方程式為 $2x-y=0$"]],"a":"135"},{"i":"b1501","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-名詞","k":"s","q":"有關染色質與染色體的敘述，下列何者正確？","o":[["A","染色質主要由 DNA 與醣類組成，染色體則由 DNA 與蛋白質組成"],["B","染色質只存在於植物細胞，染色體只存在於動物細胞"],["C","細胞進行分裂時，染色體會鬆開成為染色質"],["D","染色質複製完成後，立即成為兩條獨立的染色體"],["E","兩者成分相同，差別在於纏繞的緊密程度"]],"a":"E","e":"答 (E)。〔關鍵〕染色質與染色體成分都是 DNA＋蛋白質，差在纏繞鬆緊。〔判斷〕(A) 兩者都不是醣類；(B) 動植物細胞都有；(C) 方向相反——分裂時是「纏緊」成染色體，分裂完才鬆開；(D) 複製後兩條分體仍在中節相連，只算 1 條。〔易錯〕看到「複製完」就以為變 2 條。","d":1},{"i":"b1502","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-名詞","k":"s","q":"某條染色體已完成複製，由兩條姊妹染色分體在中節處相連。下列敘述何者正確？","o":[["A","此構造稱為四分體"],["B","此構造算作 2 條染色體"],["C","兩條姊妹染色分體分別來自父方與母方"],["D","中節上的著絲點可與紡錘絲相連"],["E","此構造只會出現在減數分裂過程中"]],"a":"D","e":"答 (D)。〔關鍵〕這是二分體：1 條染色體＝2 條姊妹染色分體＋1 個中節，中節上有 2 個著絲點接紡錘絲。〔判斷〕(A) 四分體是兩條同源二分體並排；(B) 只算 1 條；(C) 那是同源染色體，姊妹分體是自己的影本；(E) 有絲分裂也有二分體。〔易錯〕把「姊妹」和「同源」講反。","d":1},{"i":"b1503","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"某動物體細胞的染色體數為 2n＝24。下列敘述何者正確？","o":[["A","其體細胞有 12 對同源染色體"],["B","其體細胞有 24 對染色體"],["C","其精子有 12 條染色體，且具有成對的同源染色體"],["D","其卵細胞有 24 條染色體"],["E","其減數分裂 I 時可觀察到 24 個四分體"]],"a":"A","e":"答 (A)。〔步驟〕2n＝24 → 24 條＝12 對；n＝12。〔判斷〕(B) 24 條不是 24 對；(C) 精子 12 條對，但配子沒有成對同源；(D) 卵是 n＝12；(E) 四分體數＝同源對數＝12。〔易錯〕題目問「對」還是「條」先圈起來。","d":1},{"i":"b1504","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"有關同源染色體與姊妹染色分體的比較，下列何者正確？","o":[["A","同源染色體的兩條由同一條染色體複製而來"],["B","姊妹染色分體一條來自父方、一條來自母方"],["C","同源染色體大小、形狀相同，一條來自父方、一條來自母方"],["D","姊妹染色分體在減數分裂 I 時分離"],["E","有絲分裂時，同源染色體會配對形成四分體"]],"a":"C","e":"答 (C)。〔關鍵〕同源＝父母各給一條、大小形狀相同；姊妹＝同一條複製出來的影本。〔判斷〕(A)(B) 兩者定義對調；(D) 減 I 分同源、減 II 才分姊妹；(E) 有絲分裂沒有聯會、沒有四分體。","d":1},{"i":"b1505","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-週期","k":"s","q":"有關細胞週期的敘述，下列何者正確？","o":[["A","間期是細胞休息、不進行任何活動的時期"],["B","間期時細胞會製造酵素與蛋白質、複製染色質並合成胞器"],["C","間期約占整個細胞週期時間的 10%"],["D","染色質的複製發生在細胞分裂期"],["E","人體內所有細胞都會持續進行細胞週期"]],"a":"B","e":"答 (B)。〔關鍵〕間期三件事：製造酵素與蛋白質、染色質複製、合成胞器。〔判斷〕(A) 間期是最忙的一段；(C) 占約 90%；(D) 複製在間期；(E) 只有部分細胞持續分裂（例：肝臟幹細胞受傷時才分裂）。","d":1},{"i":"b1506","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"以顯微鏡觀察洋蔥根尖生長點的玻片，視野中大多數細胞處於哪一個時期？原因為何？","o":[["A","二分體排列，因為此步驟最容易觀察"],["B","姊妹染色分體分離，因為根尖生長快速"],["C","子細胞形成，因為形成細胞板需要較長時間"],["D","減數分裂，因為根尖是產生配子的部位"],["E","間期，因為間期占細胞週期的大部分時間"]],"a":"E","e":"答 (E)。〔關鍵〕間期約占細胞週期 90% 的時間 → 隨機抓一個瞬間，大部分細胞都在間期。〔判斷〕(D) 根尖是體細胞，只進行有絲分裂。〔易錯〕以為生長點「一直在分裂」所以畫面上都是分裂期。","d":1},{"i":"b1507","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-名詞","k":"s","q":"下列為課本描述的有絲分裂步驟：甲.姊妹染色分體分離，向細胞兩端移動；乙.二分體排列於細胞中央；丙.染色質複製；丁.子細胞形成；戊.二分體形成，出現紡錘絲。正確的先後順序為何？","o":[["A","丙戊乙甲丁"],["B","戊丙乙甲丁"],["C","丙乙戊甲丁"],["D","丙戊甲乙丁"],["E","戊乙丙甲丁"]],"a":"A","e":"答 (A)。〔步驟〕課本六步驟：染色質複製（丙）→ 二分體形成、出現紡錘絲（戊）→ 二分體排列於中央（乙）→ 姊妹染色分體分離（甲）→ 子細胞形成（丁）→ 細胞生長。〔易錯〕「先排隊才分開」：排列一定在分離之前。","d":1},{"i":"b1508","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"細胞分裂期中，負責「把染色體分配給子細胞」以及「把胞器分配給子細胞」的過程，依序為下列何者？","o":[["A","細胞質分裂；有絲分裂"],["B","有絲分裂；細胞質分裂"],["C","間期；有絲分裂"],["D","有絲分裂；間期"],["E","減數分裂；細胞質分裂"]],"a":"B","e":"答 (B)。〔關鍵〕有絲分裂（細胞核分裂）分配染色體；細胞質分裂分配胞器。〔易錯〕間期不屬於細胞分裂期。","d":1},{"i":"b1509","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"1-3 細胞週期與細胞分裂-綜合","k":"s","q":"有關動物細胞與植物細胞有絲分裂的比較，下列何者正確？","o":[["A","動物細胞以細胞板將細胞一分為二"],["B","植物細胞以細胞膜向內凹陷形成分裂溝"],["C","植物細胞一般不具中心粒，因此分裂時沒有紡錘絲"],["D","動物細胞的紡錘絲在中心粒附近出現"],["E","植物細胞有細胞壁，所以不進行細胞質分裂"]],"a":"D","e":"答 (D)。〔判斷〕(A)(B) 對調了——動物是分裂溝（細胞膜向內凹陷），植物是細胞板（產生新的細胞膜與細胞壁）；(C) 植物沒有中心粒仍有紡錘絲；(E) 植物用細胞板完成細胞質分裂。","d":1},{"i":"b1510","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"1-3 細胞週期與細胞分裂-綜合","k":"s","q":"有關中心粒的敘述，下列何者正確？","o":[["A","所有植物細胞都不具中心粒"],["B","中心粒是植物細胞形成細胞板的構造"],["C","開花植物細胞不具中心粒，但蘚苔類、蕨類的雄配子具有中心粒"],["D","細胞必須具有中心粒才能形成紡錘絲"],["E","中心粒位於細胞核內"]],"a":"C","e":"答 (C)。〔關鍵〕課本：開花植物不具中心粒；蘚苔類、蕨類及部分裸子植物的雄配子有中心粒（與鞭毛形成有關）。〔判斷〕(A) 少了「一般」兩字就錯；(B) 細胞板與中心粒無關；(D) 植物無中心粒仍有紡錘絲；(E) 中心粒在細胞質中。","d":1},{"i":"b1511","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"某動物細胞在顯微鏡下呈現：核膜、核仁已消失，6 條染色體整齊排列在細胞中央，每條皆為二分體；其中可找到 3 對大小、形狀相同的染色體，但它們沒有兩兩並排配對。此細胞最可能處於下列哪一個時期？","o":[["A","間期"],["B","有絲分裂的二分體排列"],["C","減數分裂 I 的四分體排列"],["D","減數分裂 II 的二分體排列"],["E","子細胞形成"]],"a":"B","e":"答 (B)。〔步驟〕用圖判 SOP：①有沒有四分體？沒有（未並排配對）→ 排除減 I；②位置：排在中央 → 排列步驟；③數成對：找得到 3 對同源 → 仍是 2n → 有絲分裂，不是減 II（減 II 只剩一套、找不到成對）。〔易錯〕看到「有同源」就以為是減數分裂——關鍵是有沒有「並排配對」。","d":1},{"i":"b1512","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"與有絲分裂相比，下列何者是減數分裂獨有的現象？","o":[["A","染色質複製"],["B","出現紡錘絲"],["C","姊妹染色分體分離"],["D","核膜、核仁消失"],["E","同源染色體聯會形成四分體"]],"a":"E","e":"答 (E)。〔關鍵〕聯會、四分體只在減數分裂 I 出現。〔判斷〕(A)(B)(C)(D) 有絲分裂也都有；姊妹染色分體分離出現在有絲分裂與減 II。","d":1},{"i":"b1513","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"有關減數分裂的敘述，下列何者正確？","o":[["A","染色質複製兩次、細胞分裂兩次"],["B","減數分裂 I 分離的是姊妹染色分體"],["C","減數分裂 I 結束後，染色質會再複製一次才進入減數分裂 II"],["D","減數分裂 I 結束後，子細胞內的染色體仍為二分體"],["E","一個母細胞經減數分裂，可產生 2 個與母細胞相同的子細胞"]],"a":"D","e":"答 (D)。〔關鍵〕只複製 1 次、分裂 2 次；減 I 後不再複製，染色體仍為二分體直接進減 II。〔判斷〕(A) 複製 1 次；(B) 減 I 分同源；(C) 不再複製；(E) 產生 4 個 n 的子細胞。","d":1},{"i":"b1514","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"某生物 2n＝8，其細胞在間期染色質複製前的 DNA 相對量為 8 單位。下列敘述何者正確？","o":[["A","有絲分裂中姊妹染色分體分離時，細胞內染色體數為 16 條，DNA 為 16 單位"],["B","有絲分裂中姊妹染色分體分離時，細胞內染色體數為 8 條，DNA 為 16 單位"],["C","染色質複製完成後，染色體數為 16 條"],["D","減數分裂 I 同源染色體分離時，細胞內染色體數為 16 條"],["E","減數分裂 II 產生的每個子細胞，染色體數為 4 條，DNA 為 8 單位"]],"a":"A","e":"答 (A)。〔步驟〕起點：8 條、DNA 8。複製後：8 條（中節數不變）、DNA 16。有絲分裂姊妹分離：中節一分為二 → 16 條，細胞還沒分家 → DNA 仍 16。〔判斷〕(B) 忘了染色體數暫時加倍；(C) 複製後仍 8 條；(D) 減 I 同源分離中節沒分裂，仍 8 條；(E) 配子 4 條、DNA 4。〔易錯〕染色體數看中節、DNA 看分體總數。","d":1},{"i":"b1515","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"某雄性動物 2n＝6。有關其精子形成過程的敘述，下列何者正確？","o":[["A","初級精母細胞有 3 條染色體"],["B","減數分裂 I 時可觀察到 6 個四分體"],["C","次級精母細胞有 3 條染色體，且每條仍為二分體"],["D","精細胞有 6 條染色體"],["E","減數分裂 I 同源染色體分離時，細胞內染色體數暫時加倍為 12 條"]],"a":"C","e":"答 (C)。〔步驟〕初級精母細胞（減 I 前）2n＝6；減 I 四分體數＝3；減 I 後次級精母細胞 n＝3，每條仍是二分體；精細胞 3 條。〔判斷〕(E) 減 I 同源分離時中節沒分裂，染色體數不加倍（仍 6）。","d":1},{"i":"b1516","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"一個精原細胞與一個卵原細胞分別完成減數分裂，最後可得到「具受精能力的配子」數目依序為何？","o":[["A","4；4"],["B","4；1"],["C","2；1"],["D","1；1"],["E","4；3"]],"a":"B","e":"答 (B)。〔關鍵〕1 精原細胞 → 4 精細胞 → 特化成 4 精子；1 卵原細胞 → 1 卵細胞＋2 極體，極體無受精能力。〔易錯〕(E) 把極體也算成配子。","d":1},{"i":"b1517","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"卵細胞形成時，細胞質集中分給一個細胞，其餘形成極體。這種分配方式最主要的意義為何？","o":[["A","使卵細胞的染色體數比極體多"],["B","使卵細胞具有鞭毛，便於移動"],["C","使極體也能與精子受精"],["D","使卵細胞保有足夠的養分與胞器，供受精卵早期發育"],["E","使卵細胞維持 2n"]],"a":"D","e":"答 (D)。〔關鍵〕受精卵早期發育所需的養分與胞器幾乎全由卵提供，所以細胞質集中給一個。〔判斷〕(A) 卵與極體染色體數相同（都是 n）；(B) 鞭毛是精子的；(C) 極體無受精能力；(E) 卵是 n。","d":1},{"i":"b1518","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"人體的神經細胞、肌肉細胞、白血球形態與功能差異很大。下列解釋何者正確？","o":[["A","它們都是 2n＝46，差異來自細胞分化"],["B","它們的染色體數目各不相同"],["C","神經細胞由減數分裂產生，所以染色體數只有一半"],["D","肌肉細胞的遺傳物質是其他細胞的兩倍"],["E","白血球不具細胞核，因此與其他細胞不同"]],"a":"A","e":"答 (A)。〔關鍵〕體細胞都是受精卵經有絲分裂而來，都是 2n＝46、遺傳訊息相同；形態功能不同來自細胞分化。〔判斷〕(C) 減數分裂只產生配子；(E) 白血球有細胞核（沒有細胞核的是成熟紅血球）。","d":1},{"i":"b1519","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"進行洋蔥根尖觀察實驗時，選擇根尖生長點的主要原因為何？","o":[["A","生長點細胞體積最大，容易觀察"],["B","生長點細胞進行減數分裂，可觀察到四分體"],["C","生長點細胞具有葉綠體，顏色明顯"],["D","生長點細胞沒有細胞壁，容易染色"],["E","生長點細胞持續進行有絲分裂，容易觀察到染色體"]],"a":"E","e":"答 (E)。〔關鍵〕根尖、莖頂生長點持續進行有絲分裂，才容易看到染色體。〔判斷〕(A) 生長點細胞較小、方正、排列緊密、核比例大；(B) 根尖不進行減數分裂；(C)(D) 與事實不符。","d":1},{"i":"b1520","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"有關癌症的敘述，下列何者正確？","o":[["A","癌細胞的細胞週期比正常細胞受到更嚴格的控制"],["B","癌症的成因多數直接遺傳自父母"],["C","負責細胞週期調控與 DNA 修復的基因（如 BRCA1）突變，可能使細胞分裂失去控制"],["D","癌細胞只會停留在原器官，不會轉移到其他器官"],["E","癌細胞以減數分裂的方式大量增生"]],"a":"C","e":"答 (C)。〔關鍵〕癌症＝細胞分裂失去控制，起因是細胞週期調控與 DNA 修復相關基因突變（如 BRCA1）。〔判斷〕(B) 約 5% 直接遺傳、約 95% 與環境因素有關；(D) 可隨血液或淋巴轉移；(E) 癌細胞是不受控制的有絲分裂。","d":1},{"i":"b1521","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"某細胞分裂過程中，每個細胞核的 DNA 相對量依序為：2 → 4 → 2 → 1。此細胞進行的是下列何者？","o":[["A","有絲分裂"],["B","減數分裂"],["C","受精作用"],["D","細胞分化"],["E","先減數分裂再受精"]],"a":"B","e":"答 (B)。〔步驟〕2 → 4：複製；4 → 2：第一次分裂；2 → 1：第二次分裂，且中間沒有再複製。複製 1 次、分裂 2 次、最後只剩一半 → 減數分裂。〔易錯〕有絲分裂只會 2 → 4 → 2，回到原本的量。","d":1},{"i":"b1522","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"（多選）下列哪些是有絲分裂與減數分裂的共同點？","o":[["A","染色質都只複製 1 次"],["B","都只分裂 1 次"],["C","都有姊妹染色分體分離的過程"],["D","都會發生同源染色體聯會"],["E","子細胞的染色體數都與母細胞相同"]],"a":"AC","e":"答 (AC)。〔判斷〕(A) 兩者都只複製 1 次 ✔；(B) 減數分裂 2 次 ✘；(C) 有絲分裂與減 II 都有姊妹分離 ✔；(D) 只有減數 ✘；(E) 減數使染色體數減半 ✘。","d":1},{"i":"b1523","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"（多選）某動物細胞的觀察結果如下：染色體正往細胞兩端移動，移向同一端的染色體共 3 條，大小形狀各不相同，且每條仍是二分體。下列推論哪些正確？","o":[["A","此細胞正在進行有絲分裂"],["B","此時分離的是同源染色體"],["C","分裂完成後，每個子細胞有 3 條染色體，且具成對的同源染色體"],["D","此細胞正在進行減數分裂 I"],["E","此生物體細胞的染色體數 2n＝6"]],"a":"BDE","e":"答 (BDE)。〔步驟〕移動中的染色體「仍是二分體」→ 分開的不是姊妹，而是同源 → 減 I。一端 3 條、大小各異 → 一端拿到一套 n＝3 → 2n＝6。〔判斷〕(A) 有絲分裂分開後每條是單股，且一端仍有成對同源；(C) 子細胞為 n，沒有成對同源。","d":1},{"i":"b1524","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"m","q":"（多選）某生物 2n＝4。下列哪些時期，一個細胞內的染色體數為 4 條？","o":[["A","有絲分裂間期，染色質複製後"],["B","有絲分裂姊妹染色分體分離時"],["C","減數分裂 I 同源染色體分離時"],["D","減數分裂 II 姊妹染色分體分離時"],["E","減數分裂 II 產生的子細胞"]],"a":"ACD","e":"答 (ACD)。〔步驟〕2n＝4：(A) 複製後中節數不變 → 4 ✔；(B) 姊妹分離 → 8 ✘；(C) 同源分離中節沒分裂 → 4 ✔；(D) 減 II 細胞原有 2 條，姊妹分離暫時加倍 → 4 ✔；(E) 配子 2 條 ✘。","d":1},{"i":"b1525","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"（多選）以人體為例，下列哪些細胞具有成對的同源染色體？","o":[["A","初級精母細胞"],["B","次級精母細胞"],["C","精子"],["D","受精卵"],["E","皮膚的上皮細胞"]],"a":"ADE","e":"答 (ADE)。〔關鍵〕減 I 之前（含所有體細胞、受精卵、初級精母細胞）都是 2n、有成對同源；減 I 之後（次級精母細胞、精細胞、精子）都是 n。〔易錯〕次級精母細胞的染色體仍是二分體，但已經沒有成對同源。","d":1},{"i":"b1526","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"1-3 細胞週期與細胞分裂-綜合","k":"m","q":"（多選）有關有絲分裂的意義與發生部位，下列哪些正確？","o":[["A","受精卵發育成個體需經過多次有絲分裂"],["B","有絲分裂產生的子細胞與母細胞遺傳訊息幾乎完全相同"],["C","有絲分裂主要發生在睪丸與卵巢，用以產生配子"],["D","傷口癒合、組織修補需要有絲分裂"],["E","根尖、莖頂的生長點可持續進行有絲分裂"]],"a":"ABDE","e":"答 (ABDE)。〔關鍵〕有絲分裂負責生長、修補、更新，子細胞與母細胞幾乎相同。〔判斷〕(C) 睪丸、卵巢產生配子靠的是減數分裂。","d":1},{"i":"b1527","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"（多選）有關減數分裂的敘述，下列哪些正確？","o":[["A","發生於生殖母細胞"],["B","人體中發生於睪丸與卵巢"],["C","具有週期性，屬於細胞週期的一部分"],["D","減數分裂 I 可觀察到聯會現象"],["E","產生的精細胞不需特化即可受精"]],"a":"ABD","e":"答 (ABD)。〔判斷〕(C) 課本重點整理註明減數分裂沒有週期性；(E) 精細胞要特化成具鞭毛的精子才完成。","d":1},{"i":"b1665","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"某國過去以單一選區相對多數決選出國會議員，數十年來都是兩大黨輪流執政；改採政黨比例代表制後，國會中出現了五個政黨。這個現象最能說明下列何者？","o":[["A","選舉制度會影響一國政黨體系的發展"],["B","選舉權年齡會決定政黨的數量"],["C","比例代表制會使廢票大量增加"],["D","單一選區制度對小黨最有利"]],"a":"A","e":"同一個國家換了選制，政黨數量就跟著改變，說明選制會影響政黨體系：單一選區容易形成兩大黨，比例代表制讓小黨有機會。","d":1},{"i":"b1666","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"有關「單一選區」的敘述，下列何者正確？","o":[["A","一個選區選出兩名以上的代表"],["B","對小黨與無黨籍候選人最有利"],["C","投給落選者的票數很少，幾乎沒有廢票"],["D","一區只選出 1 人、得票最高者當選，較容易形成兩大黨競爭"]],"a":"D","e":"單一選區一區選 1 人、最高票當選，有利大黨、容易走向兩大黨。(A) 是複數選區；(B) 對大黨較有利；(C) 投給落選者的票都沒有轉成席次，廢票反而多。","d":1},{"i":"b1667","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"下列何者是政黨比例代表制的主要優點？","o":[["A","選民與個別代表的連結最緊密"],["B","政黨的得票率與席次率較接近，小黨也有機會進入國會"],["C","當選名單的排序完全由選民決定"],["D","一定能避免國會中小黨林立"]],"a":"B","e":"比例代表制按政黨得票比例分配席次，得票率與席次率接近，小黨有機會。(A) 選民投黨不投人，與個別代表的連結較弱；(C) 名單排序由政黨決定；(D) 反而容易小黨林立，所以才設 5% 門檻。","d":1},{"i":"b1668","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"某市將舉行市長選舉。下列四人中，誰具有在該市投票的資格？\n甲：19 歲，在該市住了 10 年\n乙：21 歲，上個月才從外縣市遷入該市\n丙：22 歲，在該市住滿 2 年\n丁：30 歲，在該市住了 5 年，目前受監護宣告","o":[["A","甲、丙"],["B","乙、丙"],["C","丙"],["D","丙、丁"]],"a":"C","e":"選舉權要件：年滿 20 歲、未受監護宣告、在選舉區繼續居住 4 個月以上。甲未滿 20 歲；乙遷入未滿 4 個月；丁受監護宣告。只有丙符合。","d":1},{"i":"b1669","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"28 歲的林先生想參選公職。依我國規定，下列哪一項是他可以登記參選的？","o":[["A","立法委員"],["B","縣市長"],["C","直轄市長"],["D","總統"]],"a":"A","e":"被選舉權：立委、議員 23 歲；直轄市長、縣市長 30 歲；總統 40 歲。28 歲只能選立委。","d":1},{"i":"b1670","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"剛滿 19 歲的小芸，可以參與下列哪一項政治活動的投票？","o":[["A","總統、副總統選舉"],["B","縣長罷免案"],["C","直轄市議員選舉"],["D","全國性公民投票"]],"a":"D","e":"公投投票年齡 18 歲；選舉與罷免都要 20 歲。(B) 罷免也是 20 歲，容易誤選。","d":1},{"i":"b1671","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"有關我國公職人員的選舉權，下列敘述何者正確？","o":[["A","須年滿 18 歲"],["B","須在選舉區繼續居住 4 個月以上"],["C","受監護宣告者仍可投票"],["D","各種公職的被選舉權年齡都相同"]],"a":"B","e":"(A) 選舉權是 20 歲，18 歲是公投；(C) 受監護宣告者沒有選舉權；(D) 各公職年齡不同。","d":1},{"i":"b1672","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"某縣長選舉有甲、乙、丙三人參選，得票率分別為 42%、35%、23%。依我國制度，選舉結果為何？","o":[["A","無人過半，由甲、乙兩人進行第二輪投票"],["B","依得票比例，由三人分享縣長職權"],["C","甲當選，因為縣長選舉採相對多數決，不須過半"],["D","甲、乙兩人共同當選"]],"a":"C","e":"縣長採單一選區相對多數決，得票最高就當選，不必過半。(A) 是兩輪投票制，我國沒有採用。","d":1},{"i":"b1673","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"有關我國總統、副總統的選舉方式，下列何者正確？","o":[["A","採兩輪決選制，須得票過半才能當選"],["B","由立法委員間接選出"],["C","依各政黨得票比例分配"],["D","全國為一個選區，得票最多的一組當選"]],"a":"D","e":"總統由全國選民直接選出，全國為一個選區，相對多數決。","d":1},{"i":"b1674","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"行政首長選舉採相對多數決，當多位候選人實力接近時，最可能出現下列哪一種情形？","o":[["A","當選者可能未獲過半選民的支持"],["B","一個選區同時選出多名首長"],["C","當選者一定擁有過半民意"],["D","必須依政黨得票比例分配職位"]],"a":"A","e":"相對多數決只看誰最高票，三強鼎立時可能 40% 左右就當選，當選者不一定有過半民意。","d":1},{"i":"b1675","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國立法委員選舉，選民的第二票投給政黨。這一票決定了立法院中多少席次的分配？","o":[["A","73 席"],["B","6 席"],["C","34 席"],["D","113 席"]],"a":"C","e":"$73+6+34=113$：第一票投區域候選人決定 73 席；第二票投政黨決定不分區 34 席；原住民 6 席另外投。","d":1},{"i":"b1676","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"有關我國原住民立法委員，下列敘述何者正確？","o":[["A","由政黨票的得票比例分配"],["B","平地、山地各 3 席，採複數選區單記不可讓渡投票"],["C","包含在區域立委 73 席之中"],["D","由總統提名、立法院同意"]],"a":"B","e":"原住民立委平地、山地各 3 席，採複數選區單記不可讓渡投票。(A) 不由政黨票決定；(C) 不在區域 73 席內；(D) 是選出的，不是提名。","d":1},{"i":"b1677","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"某市議員選區應選出 5 席議員，選民只能投一票給一位候選人，最後由得票前五名的候選人當選。這種選舉制度稱為下列何者？","o":[["A","單一選區相對多數決"],["B","政黨比例代表制"],["C","兩輪投票制"],["D","複數選區相對多數決（單記不可讓渡投票）"]],"a":"D","e":"一區選多席、每人一票、前幾名當選，就是概念圖說的「複數選區相對多數決」，也就是單記不可讓渡投票，用在地方議員選舉。","d":1},{"i":"b1679","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"我國不分區立委規定政黨得票須達 5% 才能分配席次。設計這個門檻最主要的目的是什麼？","o":[["A","保障婦女參政"],["B","增加區域立委的席次"],["C","避免小黨林立、國會過度分散"],["D","讓無黨籍候選人更容易當選"]],"a":"C","e":"比例代表制容易讓小黨林立，設 5% 門檻是為了避免國會過度分散。(A) 保障婦女的是「名單婦女不得少於 1/2」。","d":1},{"i":"b1680","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國立委選舉中，區域席次由各選區候選人得票決定，不分區席次則依政黨票比例另外分配，兩者分別計算後再相加。這種計算方式稱為下列何者？","o":[["A","聯立制"],["B","並立制"],["C","兩輪投票制"],["D","絕對多數決"]],"a":"B","e":"並立制是區域與不分區分開算再相加；聯立制是政黨票決定總席次，區域當選者先填入。我國採並立制。","d":1},{"i":"b1681","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"某政黨在立委選舉中分得 9 席不分區立委。依規定，其當選名單中婦女至少應有幾人？","o":[["A","3 人"],["B","4 人"],["C","5 人"],["D","9 人"]],"a":"C","e":"婦女不得少於二分之一：$9\\times\\frac12=4.5$，人數要取整數且不能少於 4.5，所以至少 5 人。選 (B) 的人是直接捨去小數。","d":1},{"i":"b1682","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某市長任內施政滿意度持續低落，雖然沒有任何違法紀錄，選民仍發起罷免。下列敘述何者正確？","o":[["A","罷免必須先證明市長違法失職"],["B","罷免是追究政治責任，選民不滿意施政即可發動"],["C","罷免只能由監察院提出"],["D","罷免是追究刑事責任，通過後須移送法院"]],"a":"B","e":"罷免追究的是政治責任，不必對方違法，選民不滿意就能依程序發動。(C) 監察院提出的是彈劾；(D) 罷免與刑事責任無關。","d":1},{"i":"b1683","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某市議員就職 8 個月後，選民因不滿其問政表現而想發起罷免。依規定，下列何者正確？","o":[["A","可以，只要連署人數達原選區選舉人總數 10%"],["B","可以，議員不受任何時間限制"],["C","不可以，罷免只能針對行政首長"],["D","不可以，就職未滿 1 年不得罷免"]],"a":"D","e":"就職未滿 1 年不得罷免，這個限制適用所有民選公職人員。","d":1},{"i":"b1684","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某縣長的原選舉區選舉人總數為 30 萬人。選民要對縣長提出罷免案，提議人數與連署人數至少各應達多少人？","o":[["A","提議 3,000 人；連署 30,000 人"],["B","提議 300 人；連署 3,000 人"],["C","提議 3,000 人；連署 15,000 人"],["D","提議 30,000 人；連署 75,000 人"]],"a":"A","e":"提議 $300{,}000\\times1\\%=3{,}000$；連署 $300{,}000\\times10\\%=30{,}000$。分母都是原選舉區選舉人總數。","d":1},{"i":"b1685","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"罷免案的通過門檻是「同意票多於不同意票，且同意票達○○的四分之一以上」。○○應為下列何者？","o":[["A","投票人數"],["B","有效票數"],["C","原選舉區選舉人總數"],["D","全國選舉人總數"]],"a":"C","e":"罷免的 1%、10%、1/4，分母都是「原選舉區選舉人總數」，不是投票人數。","d":1},{"i":"b1686","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"依我國《公民投票法》，下列哪一項不得作為公民投票的提案？","o":[["A","某一項法律的複決"],["B","調降營業稅的稅率"],["C","某一項重大政策的創制"],["D","某一項立法原則的創制"]],"a":"B","e":"預算、租稅、薪俸、人事不得作為公投提案，營業稅屬於租稅。其他三項都是可提案的事項。","d":1},{"i":"b1687","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"有關我國全國性公民投票的舉行日期，下列何者正確？","o":[["A","一律與總統大選同日舉行"],["B","每年 1 月第一個星期六舉行"],["C","由中央選舉委員會隨時決定"],["D","2021 年起每兩年於 8 月第 4 個星期六舉行，不與選舉同日"]],"a":"D","e":"2019 年修法規定：2021 年起每兩年在 8 月第 4 個星期六舉行公投，不與選舉同日。","d":1},{"i":"b1688","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"下列是全國性公民投票的部分程序：\n甲、連署　乙、提案　丙、投票　丁、中央選舉委員會審核　戊、成案公告與意見發表會\n依先後順序排列應為何？","o":[["A","乙丁甲戊丙"],["B","乙甲丁戊丙"],["C","丁乙甲戊丙"],["D","乙丁戊甲丙"]],"a":"A","e":"提案（乙）→ 中選會審核（丁）→ 連署（甲）→ 成案公告與意見發表會（戊）→ 投票（丙）。先審核提案才進入連署，(B) 把順序顛倒了。","d":1},{"i":"b1689","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"下列何者屬於公民投票制度可能的缺點？","o":[["A","人民能直接對重大議題表達意見"],["B","可以補足代議政治的不足"],["C","議題複雜時，選民不易判斷，可能受情緒動員影響"],["D","能提升人民的政治參與意願"]],"a":"C","e":"(A)(B)(D) 都是公投的優點。缺點包括議題複雜時選民不易判斷、可能被情緒或民粹動員、成本高。","d":1},{"i":"b1690","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"有關我國公民投票制度的沿革，下列何者正確？","o":[["A","2003 年制定《公民投票法》時門檻很低，被稱為「開放公投」"],["B","2017 年修法把投票年齡降為 18 歲，並放寬通過門檻"],["C","2017 年起，公投一律與全國性選舉同日舉行"],["D","《公民投票法》自制定起就沒有任何通過門檻"]],"a":"B","e":"2003 年制定時門檻很高，被稱為「鳥籠公投」；2017 年修法降低門檻，投票年齡降為 18 歲，通過改為同意多於不同意且達 1/4；2019 年再修法訂公投日，不與選舉同日。","d":1},{"i":"b1691","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"甲團體推薦候選人參選市議員，希望未來取得執政機會；乙協會為了維護會員權益，持續遊說立法委員修法，但從不推出候選人。下列判斷何者正確？","o":[["A","甲、乙都是利益團體"],["B","甲、乙都是政黨"],["C","甲是利益團體，乙是政黨"],["D","甲是政黨，乙是利益團體"]],"a":"D","e":"政黨推薦候選人、以取得政權為目的；利益團體以影響政策、維護特定利益為目的，不直接參選執政。","d":1},{"i":"b1692","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"下列何者是利益團體影響公共政策最主要的方式？","o":[["A","遊說民意代表、提供政策資訊"],["B","推出候選人參加總統選舉"],["C","組成政府、直接執政"],["D","審理法律是否違憲"]],"a":"A","e":"利益團體主要靠遊說、提供資訊、陳情來影響政策。(B)(C) 是政黨；(D) 是憲法法庭的職權。","d":1},{"i":"b1693","s":"公民","u":"第3課","t":"3-選制席次","k":"m","q":"有關我國立法委員選舉制度，下列哪些正確？","o":[["A","立法委員共 113 席，任期 3 年"],["B","區域立委採單一選區相對多數決"],["C","不分區立委依區域候選人的得票數分配"],["D","政黨票須達 5% 才能分配不分區席次"],["E","我國採聯立制，政黨票決定各黨的總席次"]],"a":"BD","e":"(A) 任期 4 年；(C) 不分區依政黨票分配；(E) 我國採並立制，政黨票只決定 34 席。","d":1},{"i":"b1694","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"比較罷免與全國性公民投票，下列哪些正確？","o":[["A","罷免的投票年齡為 20 歲，公投為 18 歲"],["B","兩者通過都須同意票多於不同意票，且同意票達法定總數（選舉人總數或投票權人總額）的四分之一以上"],["C","罷免須先證明公職人員違法"],["D","罷免案經投票否決後，同一任期內不得再對其提出罷免"],["E","全國性公投不與全國性選舉同日舉行"]],"a":"ABDE","e":"(B) 罷免是同意票達原選區選舉人總數 1/4，公投是有效同意票達投票權人總額 1/4，兩者都是「同意多於不同意＋四分之一」。(C) 罷免追究政治責任，不必違法。(D) 罷免被否決後，同一任期內不得再對同一人提罷免。","d":1},{"i":"b1695","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"有關各種選舉制度的比較，下列哪些正確？","o":[["A","單一選區制度對小黨較有利"],["B","複數選區單記不可讓渡投票制當選門檻較低，小黨與無黨籍較有機會"],["C","比例代表制下，選民投票的對象是政黨"],["D","並立制下，政黨票決定各黨在國會的總席次"],["E","單一選區制度不會產生廢票"]],"a":"BC","e":"(A) 單一選區有利大黨；(D) 那是聯立制；(E) 單一選區投給落選者的票全部沒有轉成席次，廢票多。","d":1},{"i":"b1696","s":"公民","u":"第3課","t":"3-公投事項","k":"m","q":"有關我國全國性公民投票，下列哪些正確？","o":[["A","提案人數須達最近一次總統選舉選舉人總數的萬分之一以上"],["B","連署人數須達最近一次總統選舉選舉人總數的 1.5% 以上"],["C","投票年齡為 20 歲"],["D","薪俸、人事事項可以作為公投提案"],["E","通過門檻為有效同意票多於不同意票，且有效同意票達投票權人總額的四分之一以上"]],"a":"ABE","e":"(C) 公投投票年齡是 18 歲；(D) 薪俸、人事不得提案。注意提案、連署的分母是「最近一次總統選舉的選舉人總數」，和罷免的分母不一樣。","d":1},{"i":"b1697","s":"公民","u":"第3課","t":"第3課-綜合","k":"m","q":"有關政黨與利益團體，下列哪些正確？","o":[["A","政黨以取得政權、推行政策為目的"],["B","利益團體會推薦候選人參選，以取得執政權"],["C","利益團體可透過遊說影響政府政策"],["D","政黨會推薦候選人參加選舉"],["E","參加政黨或利益團體，都是人民參與政治的管道"]],"a":"ACDE","e":"(B) 推薦候選人、取得執政權是政黨的特徵，利益團體不直接參選。","d":1},{"i":"b1698","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"下列哪些屬於「選舉之外」的政治參與？","o":[["A","在家收看電視綜藝節目"],["B","在公共政策網路參與平臺提案並附議"],["C","加入利益團體，向立法委員遊說"],["D","參與公民投票的連署"],["E","參加罷免案的投票"]],"a":"BCDE","e":"(A) 收看綜藝節目沒有影響公共決策，不是政治參與。罷免、公投連署、網路平臺提案、透過利益團體遊說，都屬於選舉之外的政治參與。","d":1},{"i":"b1699","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"此罷免案的提議人數與連署人數，至少各應達多少人？","o":[["A","提議 240 人；連署 2,400 人"],["B","提議 2,400 人；連署 60,000 人"],["C","提議 24,000 人；連署 60,000 人"],["D","提議 2,400 人；連署 24,000 人"]],"a":"D","c":"某立法委員選區的選舉人總數為 240,000 人。部分選民不滿該立委的問政表現，準備依法對其提出罷免。罷免程序為：提議（提議人數須達原選舉區選舉人總數 1% 以上）→ 連署（連署人數須達原選舉區選舉人總數 10% 以上）→ 投票。罷免案通過須「同意票多於不同意票，且同意票達原選舉區選舉人總數四分之一以上」。","e":"提議 $240{,}000\\times1\\%=2{,}400$ 人；連署 $240{,}000\\times10\\%=24{,}000$ 人。","d":1},{"i":"b1700","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"此罷免案若要通過，同意票至少須達多少票？","o":[["A","24,000 票"],["B","48,000 票"],["C","60,000 票"],["D","120,000 票"]],"a":"C","c":"某立法委員選區的選舉人總數為 240,000 人。部分選民不滿該立委的問政表現，準備依法對其提出罷免。罷免程序為：提議（提議人數須達原選舉區選舉人總數 1% 以上）→ 連署（連署人數須達原選舉區選舉人總數 10% 以上）→ 投票。罷免案通過須「同意票多於不同意票，且同意票達原選舉區選舉人總數四分之一以上」。","e":"$240{,}000\\times\\frac14=60{,}000$ 票。","d":1},{"i":"b1701","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"若投票結果為同意票 58,000 票、不同意票 41,000 票，下列判斷何者正確？","o":[["A","不通過，因為同意票未達選舉人總數四分之一"],["B","不通過，因為投票率未過半"],["C","通過，因為同意票多於不同意票"],["D","通過，因為已達提議門檻"]],"a":"A","c":"某立法委員選區的選舉人總數為 240,000 人。部分選民不滿該立委的問政表現，準備依法對其提出罷免。罷免程序為：提議（提議人數須達原選舉區選舉人總數 1% 以上）→ 連署（連署人數須達原選舉區選舉人總數 10% 以上）→ 投票。罷免案通過須「同意票多於不同意票，且同意票達原選舉區選舉人總數四分之一以上」。","e":"兩個條件都要過：同意 58,000＞不同意 41,000，第一關通過；同意 58,000＜60,000，第二關沒過。所以不通過。(B) 罷免沒有投票率門檻。","d":1},{"i":"b1702","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"若投票結果改為同意票 65,000 票、不同意票 70,000 票，下列判斷何者正確？","o":[["A","通過，因為同意票已達選舉人總數四分之一"],["B","不通過，因為同意票未多於不同意票"],["C","不通過，因為同意票未達選舉人總數四分之一"],["D","須重新投票，直到同意票過半"]],"a":"B","c":"某立法委員選區的選舉人總數為 240,000 人。部分選民不滿該立委的問政表現，準備依法對其提出罷免。罷免程序為：提議（提議人數須達原選舉區選舉人總數 1% 以上）→ 連署（連署人數須達原選舉區選舉人總數 10% 以上）→ 投票。罷免案通過須「同意票多於不同意票，且同意票達原選舉區選舉人總數四分之一以上」。","e":"同意 65,000 已達 60,000，第二關過了；但同意 65,000＜不同意 70,000，第一關沒過，不通過。","d":1},{"i":"b1703","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"哪些政黨可以分配不分區席次？","o":[["A","甲、乙"],["B","甲、乙、丙"],["C","甲、乙、丙、丁"],["D","甲、乙、丙、丁、戊"]],"a":"C","c":"某次立委選舉，不分區及僑居國外國民立委共 34 席，政黨票有效票共 1,000 萬票，各黨得票如下表。分配規則：只有得票率達 5% 以上的政黨可以分配；各黨席次＝34 ×（該黨得票 ÷ 達門檻各黨得票總和），先取整數部分，剩下的席次依小數部分由大到小，每黨各補一席。\n\n| 政黨 | 甲 | 乙 | 丙 | 丁 | 戊 | 其他 |\n|---|---|---|---|---|---|---|\n| 得票（萬票） | 420 | 360 | 100 | 60 | 40 | 20 |","e":"得票率：甲 42%、乙 36%、丙 10%、丁 6%、戊 4%、其他 2%。達 5% 的是甲、乙、丙、丁。","d":1},{"i":"b1704","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"計算各黨席次時，公式中的「達門檻各黨得票總和」是多少？","o":[["A","1,000 萬票"],["B","選舉人總數"],["C","34 席"],["D","940 萬票"]],"a":"D","c":"某次立委選舉，不分區及僑居國外國民立委共 34 席，政黨票有效票共 1,000 萬票，各黨得票如下表。分配規則：只有得票率達 5% 以上的政黨可以分配；各黨席次＝34 ×（該黨得票 ÷ 達門檻各黨得票總和），先取整數部分，剩下的席次依小數部分由大到小，每黨各補一席。\n\n| 政黨 | 甲 | 乙 | 丙 | 丁 | 戊 | 其他 |\n|---|---|---|---|---|---|---|\n| 得票（萬票） | 420 | 360 | 100 | 60 | 40 | 20 |","e":"分母只算達門檻的政黨：$420+360+100+60=940$ 萬票。用 1,000 萬票是常見錯誤。","d":1},{"i":"b1705","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"甲黨最後分得幾席？","o":[["A","14 席"],["B","15 席"],["C","16 席"],["D","17 席"]],"a":"B","c":"某次立委選舉，不分區及僑居國外國民立委共 34 席，政黨票有效票共 1,000 萬票，各黨得票如下表。分配規則：只有得票率達 5% 以上的政黨可以分配；各黨席次＝34 ×（該黨得票 ÷ 達門檻各黨得票總和），先取整數部分，剩下的席次依小數部分由大到小，每黨各補一席。\n\n| 政黨 | 甲 | 乙 | 丙 | 丁 | 戊 | 其他 |\n|---|---|---|---|---|---|---|\n| 得票（萬票） | 420 | 360 | 100 | 60 | 40 | 20 |","e":"各黨計算：\n- 甲 $34\\times\\frac{420}{940}\\approx15.19$\n- 乙 $34\\times\\frac{360}{940}\\approx13.02$\n- 丙 $34\\times\\frac{100}{940}\\approx3.62$\n- 丁 $34\\times\\frac{60}{940}\\approx2.17$\n\n整數部分 $15+13+3+2=33$ 席，剩 1 席給小數最大的丙（0.62）。甲得 15 席。誤用 1,000 萬票當分母會算出 $34\\times0.42\\approx14.28$，選成 (A)。","d":1},{"i":"b1706","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"丙黨最後分得幾席？其當選名單中婦女至少應有幾人？","o":[["A","3 席；2 人"],["B","3 席；1 人"],["C","4 席；1 人"],["D","4 席；2 人\n\n<div class=\"pb\"><\/div>"]],"a":"D","c":"某次立委選舉，不分區及僑居國外國民立委共 34 席，政黨票有效票共 1,000 萬票，各黨得票如下表。分配規則：只有得票率達 5% 以上的政黨可以分配；各黨席次＝34 ×（該黨得票 ÷ 達門檻各黨得票總和），先取整數部分，剩下的席次依小數部分由大到小，每黨各補一席。\n\n| 政黨 | 甲 | 乙 | 丙 | 丁 | 戊 | 其他 |\n|---|---|---|---|---|---|---|\n| 得票（萬票） | 420 | 360 | 100 | 60 | 40 | 20 |","e":"丙 3 席加補的 1 席，共 4 席；婦女不得少於 $4\\times\\frac12=2$ 人。驗算：$15+13+4+2=34$ 席。","d":1},{"i":"b1730","s":"數學","u":"單元05","t":"05-面積","k":"s","q":"坐標平面上，$\\triangle ABC$ 的三頂點為 $A(3,4)$、$B(-3,0)$、$C(5,-2)$。通過 $B$ 點且將 $\\triangle ABC$ 分成面積相等的兩部分之直線方程式為下列哪一個選項？","o":[["1","$x-3y+3=0$"],["2","$2x-3y+6=0$"],["3","$x-7y+3=0$"],["4","$x+4y+3=0$"],["5","$5x-2y-7=0$"]],"a":"3","e":"〔關鍵〕平分面積的直線就是中線，要過頂點 $B$ 與 $B$ 的對邊中點。\n\n〔步驟〕$B$ 的對邊：$A$、$B$、$C$ 拿掉 $B$，剩下 $\\overline{AC}$。中點 $M\\left(\\frac{3+5}2,\\frac{4-2}2\\right)=(4,1)$。$BM$ 斜率 $\\dfrac{1-0}{4-(-3)}=\\dfrac17$，$y=\\frac17(x+3)$，即 $x-7y+3=0$。驗算 $M$：$4-7+3=0$。\n\n〔易錯〕(1) 是過 $B$ 的高（和 $AC$ 垂直），高不過中點；(2) 是直線 $AB$；(4) 是直線 $BC$；(5) 是過 $A$ 的中線。"},{"i":"b1731","s":"數學","u":"單元05","t":"05-面積","k":"s","q":"坐標平面上，以 $A(-2,1)$、$B(3,-1)$、$C(1,4)$ 為頂點的三角形面積為下列哪一個選項？","o":[["1","$\\frac92$"],["2","$21$"],["3","$\\frac{15}2$"],["4","$3$"],["5","$\\frac{21}2$"]],"a":"5","e":"〔關鍵〕面積 $=\\frac12|ad-bc|$，$bc$ 是負數時減掉要變加。\n\n〔步驟〕$B-A=(5,-2)$，$C-A=(3,3)$。$ad=5\\times3=15$，$bc=(-2)\\times3=-6$，$ad-bc=15-(-6)=21$，面積 $\\frac{21}2$。\n\n〔易錯〕(1) 是 $15-6=9$，$bc$ 沒變號；(2) 忘了除以 2。"},{"i":"b1732","s":"數學","u":"單元05","t":"05-平行線距離","k":"s","q":"坐標平面上，兩平行線 $3x-4y+6=0$ 與 $-6x+8y+3=0$ 的距離為下列哪一個選項？","o":[["1","$\\frac32$"],["2","$\\frac35$"],["3","$\\frac3{20}$"],["4","$\\frac9{10}$"],["5","$3$"]],"a":"1","e":"〔關鍵〕先把兩式的 $x$、$y$ 係數調成完全一樣，再用 $\\dfrac{|c_1-c_2|}{\\sqrt{a^2+b^2}}$。\n\n〔步驟〕第二式的 $x$ 係數是 $-6$，所以第一式乘 $-2$：$-6x+8y-12=0$。$d=\\dfrac{|-12-3|}{\\sqrt{36+64}}=\\dfrac{15}{10}=\\dfrac32$。\n\n〔易錯〕(2) 係數沒調：$\\frac{|6-3|}5$；(3) 分母沒開根號；(4) 只乘 2 沒變號：$\\frac{|12-3|}{10}$；(5) 分子調了、分母沒調。"},{"i":"b1733","s":"數學","u":"單元05","t":"05-對稱點","k":"s","q":"坐標平面上，點 $P(-3,0)$ 關於直線 $L:x+2y-2=0$ 的對稱點坐標為下列哪一個選項？","o":[["1","$(-2,2)$"],["2","$(-5,-4)$"],["3","$(1,8)$"],["4","$(-1,4)$"],["5","$(-1,-4)$"]],"a":"4","e":"〔關鍵〕代入值 $t=\\dfrac{ax_0+by_0+c}{a^2+b^2}$（分母不開根號），對稱點 $=(x_0-2at,\\ y_0-2bt)$。\n\n〔步驟〕$t=\\dfrac{-3+0-2}{1+4}=-1$。$x'=-3-2\\times1\\times(-1)=-1$，$y'=0-2\\times2\\times(-1)=4$，得 $(-1,4)$。驗算：中點 $(-2,2)$，$-2+4-2=0$。\n\n〔易錯〕(1) 是垂足，忘了乘 2；(2) 減寫成加；(3) 乘了 4 倍；(5) $y$ 那格的正負號錯。"},{"i":"b1734","s":"數學","u":"單元05","t":"05-兩軸面積","k":"m","q":"坐標平面上，直線 $L$ 通過 $(-3,6)$、$(3,2)$ 兩點。試選出正確的選項。","o":[["1","$L$ 的截距式為 $\\dfrac x6+\\dfrac y4=1$"],["2","$L$ 的斜率為 $\\frac23$"],["3","通過點 $(1,-1)$ 且與 $L$ 垂直的直線為 $3x-2y-5=0$"],["4","直線 $4x+6y+1=0$ 與 $L$ 平行"],["5","$L$ 與兩坐標軸所圍成的三角形面積為 $24$"]],"a":"134","e":"〔關鍵〕下坡斜率為負；平行保留 $ax+by$，垂直係數對調改一個號。\n\n〔步驟〕斜率 $\\dfrac{2-6}{3-(-3)}=-\\dfrac23$，$y-2=-\\frac23(x-3)$，即 $2x+3y-12=0$，$x$ 截距 6、$y$ 截距 4。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 對 | $\\frac x6+\\frac y4=1$ |\n| (2) 錯 | 下坡，斜率 $-\\frac23$ |\n| (3) 對 | 垂直：$3x-2y+c=0$，代 $(1,-1)$：$3+2+c=0$，$c=-5$ |\n| (4) 對 | $4x+6y$ 是 $2x+3y$ 的 2 倍，常數 $1\\ne-24$，平行不重合 |\n| (5) 錯 | $\\frac12\\times6\\times4=12$，24 是忘了乘 $\\frac12$ |"},{"i":"b1735","s":"數學","u":"單元05","t":"05-面積","k":"m","q":"坐標平面上，$\\triangle ABC$ 的三頂點為 $A(-2,4)$、$B(-4,-2)$、$C(4,0)$。試選出正確的選項。","o":[["1","通過 $A$ 點且與直線 $BC$ 垂直的直線，會將 $\\triangle ABC$ 分成面積相等的兩部分"],["2","通過 $A$ 點且將 $\\triangle ABC$ 分成面積相等的兩部分之直線為 $5x+2y+2=0$"],["3","通過 $B$ 點且將 $\\triangle ABC$ 分成面積相等的兩部分之直線，會通過點 $(1,2)$"],["4","通過 $C$ 點且將 $\\triangle ABC$ 分成面積相等的兩部分之直線為 $x+7y-4=0$"],["5","$\\triangle ABC$ 的面積為 $22$"]],"a":"2345","e":"〔關鍵〕過哪個頂點，就取那個頂點的對邊中點。高和中線是兩條不同的線。\n\n〔步驟〕$\\overline{BC}$ 中點 $(0,-1)$，$\\overline{AC}$ 中點 $(1,2)$，$\\overline{AB}$ 中點 $(-3,1)$。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 錯 | 過 $A$ 的高為 $4x+y+4=0$，代 $(0,-1)$：$3\\ne0$，不過中點 |\n| (2) 對 | $A(-2,4)$ 與 $(0,-1)$：斜率 $-\\frac52$，$5x+2y+2=0$ |\n| (3) 對 | $B$ 的對邊是 $\\overline{AC}$，中點 $(1,2)$ |\n| (4) 對 | $C(4,0)$ 與 $(-3,1)$：$4+0-4=0$，$-3+7-4=0$ |\n| (5) 對 | $B-A=(-2,-6)$，$C-A=(6,-4)$；$ad=8$，$bc=-36$，$ad-bc=44$，面積 22 |"},{"i":"b1736","s":"數學","u":"單元05","t":"05-平行線距離","k":"m","q":"坐標平面上，已知直線 $L:8x-6y+5=0$。試選出正確的選項。","o":[["1","點 $(1,2)$ 到 $L$ 的距離為 $\\frac1{100}$"],["2","原點到 $L$ 的距離為 $\\frac12$"],["3","直線 $4x-3y-5=0$ 與 $L$ 的距離為 $\\frac32$"],["4","直線 $4x-3y-5=0$ 與 $L$ 的距離為 $2$"],["5","與 $L$ 平行且距離為 $1$ 的直線為 $8x-6y+15=0$ 或 $8x-6y-5=0$"]],"a":"235","e":"〔關鍵〕點到直線距離分母要開根號；兩平行線先調係數。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 錯 | $\\frac{\\lvert 8-12+5\\rvert}{\\sqrt{100}}=\\frac1{10}$，$\\frac1{100}$ 是沒開根號 |\n| (2) 對 | $\\frac{5}{10}=\\frac12$ |\n| (3) 對 | 乘 2：$8x-6y-10=0$，$\\frac{\\lvert 5-(-10)\\rvert}{10}=\\frac32$ |\n| (4) 錯 | 係數沒調：$\\frac{\\lvert 5-(-5)\\rvert}5=2$ |\n| (5) 對 | $\\frac{\\lvert c-5\\rvert}{10}=1$，$c=15$ 或 $-5$ |"},{"i":"b1737","s":"數學","u":"單元05","t":"05-面積","k":"m","q":"坐標平面上，三直線 $x+y-2=0$、$x-2y-2=0$、$2x-y+2=0$ 所圍成的三角形區域（含邊界）記為 $R$。試選出正確的選項。","o":[["1","$R$ 的一個頂點為 $(-2,-2)$"],["2","點 $(1,1)$ 在 $R$ 上"],["3","$R$ 的面積為 $12$"],["4","$R$ 可用聯立不等式 $x+y-2\\le0$、$x-2y-2\\ge0$、$2x-y+2\\ge0$ 表示"],["5","點 $(-1,1)$ 在 $R$ 上"]],"a":"12","e":"〔關鍵〕兩兩聯立求頂點；不等式方向用「第三個頂點代入」決定；含邊界要有等號。\n\n〔步驟〕頂點 $(2,0)$、$(0,2)$、$(-2,-2)$。代第三頂點：$x+y-2$ 代 $(-2,-2)$ 得 $-6$，取 $\\le0$；$x-2y-2$ 代 $(0,2)$ 得 $-6$，取 $\\le0$；$2x-y+2$ 代 $(2,0)$ 得 $6$，取 $\\ge0$。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 對 | $x-2y=2$、$2x-y=-2$ 聯立得 $(-2,-2)$ |\n| (2) 對 | $1+1-2=0$（在邊上，含邊界算）、$1-2-2=-3\\le0$、$2-1+2=3\\ge0$ |\n| (3) 錯 | 以 $(2,0)$ 為基準：$(-2,2)$、$(-4,-2)$；$ad=4$，$bc=-8$，$ad-bc=12$，面積 6 |\n| (4) 錯 | 第二式方向反了，應為 $x-2y-2\\le0$ |\n| (5) 錯 | $2(-1)-1+2=-1$，不滿足 $\\ge0$ |"},{"i":"b1738","s":"數學","u":"單元05","t":"05-對稱點","k":"m","q":"坐標平面上，已知點 $P(1,6)$ 與直線 $L:x-2y+1=0$，點 $P'$ 為 $P$ 關於 $L$ 的對稱點。試選出正確的選項。","o":[["1","$P$ 到 $L$ 的垂足為 $(-1,10)$"],["2","$P'$ 的坐標為 $(5,-2)$"],["3","直線 $PP'$ 的方程式為 $2x+y-8=0$"],["4","$\\overline{PP'}=4\\sqrt5$"],["5","$P$ 到 $L$ 的距離為 $2$"]],"a":"234","e":"〔關鍵〕$t=\\dfrac{1-12+1}{1+4}=-2$；垂足減 $at$、$bt$，對稱點減 $2at$、$2bt$。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 錯 | 垂足 $(1+2,\\ 6-4)=(3,2)$；$(-1,10)$ 是減寫成加 |\n| (2) 對 | $(1+4,\\ 6-8)=(5,-2)$ |\n| (3) 對 | 和 $L$ 垂直：$2x+y+c=0$，代 $P$：$c=-8$；$P'$ 也在線上 |\n| (4) 對 | $\\sqrt{4^2+8^2}=4\\sqrt5$ |\n| (5) 錯 | $\\frac{\\lvert -10\\rvert}{\\sqrt5}=2\\sqrt5$；2 是分母沒開根號 |"},{"i":"b1739","s":"數學","u":"單元05","t":"05-斜率","k":"m","q":"坐標平面上，已知直線 $L:ax+by+c=0$ 通過第一、三、四象限，且不通過原點。試選出正確的選項。","o":[["1","$L$ 的斜率為正"],["2","$ab<0$"],["3","$bc<0$"],["4","$ac>0$"],["5","直線 $bx+ay+c=0$ 不通過第四象限"]],"a":"125","e":"〔關鍵〕過一、三、四象限 → 斜率正、$y$ 截距負、$x$ 截距正。斜率 $-\\frac ab$，$y$ 截距 $-\\frac cb$，$x$ 截距 $-\\frac ca$。\n\n| 選項 | 判斷 |\n|---|---|\n| (1) 對 | 往右上升 |\n| (2) 對 | $-\\frac ab>0$ → $ab<0$ |\n| (3) 錯 | $-\\frac cb<0$ → $\\frac cb>0$ → $bc>0$ |\n| (4) 錯 | $-\\frac ca>0$ → $ac<0$ |\n| (5) 對 | 斜率 $-\\frac ba>0$，$y$ 截距 $-\\frac ca>0$，通過一、二、三象限 |\n\n可用 $x-y-1=0$（$a=1$，$b=-1$，$c=-1$）代入驗算每一個選項。"},{"i":"b1740","s":"數學","u":"單元05","t":"05-截距","k":"f","q":"坐標平面上，已知直線 $L$ 的斜率為 $\\frac23$ 且 $x$ 截距為 $-2$，則直線 $L$ 的一般式為 $\\boxed{11\\text{-}1}\\,x-\\boxed{11\\text{-}2}\\,y+\\boxed{11\\text{-}3}=0$。（係數化為最簡整數）","a":"$2x-3y+4=0$","e":"〔步驟〕$x$ 截距 $-2$ 表示通過 $(-2,0)$。$y=\\frac23(x+2)$，乘 3：$3y=2x+4$，即 $2x-3y+4=0$。\n\n〔易錯〕把 $x$ 截距 $-2$ 當成通過 $(0,-2)$。","r":"武陵高中 111 學年第一學期第二次期中考 填充 1（修改：改為選填）"},{"i":"b1741","s":"數學","u":"單元05","t":"05-平行線","k":"f","q":"坐標平面上，兩直線 $L_1:kx+2y-1=0$ 及 $L_2:x+(k+1)y-1=0$，若 $L_1$ 與 $L_2$ 平行，則實數 $k=\\boxed{12\\text{-}1}\\,\\boxed{12\\text{-}2}$。（只有一解）","a":"$-2$","e":"〔關鍵〕平行：$x$、$y$ 係數成比例，但常數不成比例（不能重合）。\n\n〔步驟〕$\\frac k1=\\frac2{k+1}$，$k^2+k-2=0$，$k=1$ 或 $-2$。$k=1$ 時兩式都是 $x+2y-1=0$，重合，不合。$k=-2$ 時 $L_1:-2x+2y-1=0$、$L_2:x-y-1=0$，平行。答 $-2$。\n\n〔易錯〕沒有檢查重合，兩個解都寫。","r":"武陵高中 111 學年第一學期第二次期中考 填充 2（修改：改為選填）"},{"i":"b1742","s":"數學","u":"單元05","t":"05-面積","k":"f","q":"坐標平面上，$\\triangle ABC$ 的三頂點為 $A(1,5)$、$B(5,-1)$、$C(-3,-3)$。通過 $C$ 點且將 $\\triangle ABC$ 分成面積相等的兩部分之直線方程式為 $\\boxed{13\\text{-}1}\\,x-\\boxed{13\\text{-}2}\\,y-\\boxed{13\\text{-}3}=0$。（係數化為最簡整數）","a":"$5x-6y-3=0$","e":"〔步驟〕$C$ 的對邊是 $\\overline{AB}$，中點 $(3,2)$。斜率 $\\dfrac{2-(-3)}{3-(-3)}=\\dfrac56$，$y-2=\\frac56(x-3)$，乘 6：$6y-12=5x-15$，即 $5x-6y-3=0$。驗算 $C$：$-15+18-3=0$。\n\n〔易錯〕取了 $\\overline{AC}$ 或 $\\overline{BC}$ 的中點。"},{"i":"b1743","s":"數學","u":"單元05","t":"05-面積","k":"f","q":"坐標平面上，以 $A(-1,-3)$、$B(4,1)$、$C(-3,2)$ 為頂點的三角形面積為 $\\dfrac{\\boxed{14\\text{-}1}\\,\\boxed{14\\text{-}2}}{\\boxed{14\\text{-}3}}$。","a":"$\\frac{33}2$","e":"〔步驟〕$B-A=(5,4)$，$C-A=(-2,5)$。$ad=5\\times5=25$，$bc=4\\times(-2)=-8$，$ad-bc=25-(-8)=33$，面積 $\\frac{33}2$。\n\n〔易錯〕$25-8=17$，得 $\\frac{17}2$。"},{"i":"b1744","s":"數學","u":"單元05","t":"05-平行線距離","k":"f","q":"坐標平面上，兩平行線 $5x+12y-4=0$ 與 $-10x-24y+5=0$ 的距離為 $\\dfrac{\\boxed{15\\text{-}1}}{\\boxed{15\\text{-}2}\\,\\boxed{15\\text{-}3}}$。","a":"$\\frac3{26}$","e":"〔步驟〕第二式 $x$ 係數 $-10$，第一式乘 $-2$：$-10x-24y+8=0$。$d=\\dfrac{|8-5|}{\\sqrt{100+576}}=\\dfrac3{26}$。\n\n〔易錯〕只乘 2 沒變號，用 $\\frac{|-8-5|}{26}=\\frac12$。"},{"i":"b1745","s":"數學","u":"單元05","t":"05-對稱點","k":"f","q":"坐標平面上，已知點 $P(2,-3)$ 與直線 $L:3x-y+1=0$，則點 $P$ 關於直線 $L$ 的對稱點坐標為 $\\left(\\boxed{16\\text{-}1}\\,\\boxed{16\\text{-}2},\\ \\boxed{16\\text{-}3}\\,\\boxed{16\\text{-}4}\\right)$。","a":"$(-4,-1)$","e":"〔步驟〕$t=\\dfrac{6+3+1}{9+1}=1$。$x'=2-2\\times3\\times1=-4$，$y'=-3-2\\times(-1)\\times1=-1$，得 $(-4,-1)$。驗算：中點 $(-1,-2)$，$-3+2+1=0$。\n\n〔易錯〕$b=-1$ 的負號漏掉，$y'$ 算成 $-5$。"},{"i":"b1746","s":"數學","u":"單元05","t":"05-判號","k":"f","q":"坐標平面上，已知四邊形 $ABCD$ 的四個頂點為 $A(-1,3)$、$B(3,1)$、$C(5,4)$、$D(2,5)$，若直線 $L:y=mx-1$ 與四邊形 $ABCD$ 有交點，且直線 $L$ 的兩側各有 2 個頂點，則實數 $m$ 的最大可能範圍為 $\\boxed{17\\text{-}1}<m<\\boxed{17\\text{-}2}$。\n\n<div style=\"page-break-before:always\"><\/div>","a":"$1<m<3$","e":"〔關鍵〕把四個頂點代入 $y-mx+1$，看正負：兩正兩負才是「兩側各 2 個」。\n\n〔步驟〕$A$：$m+4$；$B$：$2-3m$；$C$：$5-5m$；$D$：$6-2m$。\n\n| $m$ 的範圍 | $A$ | $B$ | $C$ | $D$ | 正負個數 |\n|---|---|---|---|---|---|\n| $\\frac23<m<1$ | 正 | 負 | 正 | 正 | 3 比 1 |\n| $1<m<3$ | 正 | 負 | 負 | 正 | 2 比 2 |\n| $m>3$ | 正 | 負 | 負 | 負 | 1 比 3 |\n\n$m=1$ 時直線過 $C$，$m=3$ 時過 $D$，都不算兩側各 2 個。答 $1<m<3$。\n\n〔快解〕直線恆過 $(0,-1)$，算 $(0,-1)$ 到四個頂點的斜率：$A$ 為 $-4$、$B$ 為 $\\frac23$、$C$ 為 $1$、$D$ 為 $3$。要把 $B$、$C$ 和 $A$、$D$ 分在兩側，斜率夾在 $C$ 與 $D$ 之間。","r":"武陵高中 111 學年第一學期第二次期中考 填充 3（修改：改為選填）"},{"i":"b1748","s":"數學","u":"單元05","t":"單元05-綜合","k":"f","q":"$P$ 點的坐標為 $\\left(\\boxed{19\\text{-}1},\\ \\boxed{19\\text{-}2}\\right)$。（選填題，4 分）","a":"$(4,0)$","c":"坐標平面上，一面平面鏡位於直線 $L:x+2y-4=0$ 上。從點 $A(4,5)$ 射出一道光線，射到鏡面上的 $P$ 點後反射，反射光線通過點 $B(8,3)$。已知光線反射時入射角等於反射角，因此 $P$ 點就是直線 $L$ 上使 $\\overline{PA}+\\overline{PB}$ 最小的點。","e":"〔步驟〕直線 $A'B$：$(0,-3)$ 到 $(8,3)$，斜率 $\\frac68=\\frac34$，$y=\\frac34x-3$，即 $3x-4y-12=0$。與 $L$ 聯立：由 $L$ 得 $x=4-2y$，代入 $12-6y-4y-12=0$，$y=0$，$x=4$。$P(4,0)$。"},{"i":"b1750","s":"數學","u":"單元05","t":"單元05-綜合","k":"s","q":"已知實數 $a,b,c$ 滿足 $ab>0$ 且 $bc<0$，則直線 $ax+by+c=0$ 不通過哪一個象限？","o":[["A","第一象限"],["B","第二象限"],["C","第三象限"],["D","第四象限"],["E","四個象限都通過"]],"a":"C","e":"斜率 $-\\frac{a}{b}$：$ab>0$ 表示 $a,b$ 同號，斜率為負。$y$ 截距 $-\\frac{c}{b}$：$bc<0$ 表示 $\\frac{c}{b}<0$，所以 $y$ 截距為正。斜率負、$y$ 截距正的直線經過第一、二、四象限，不過第三象限。"},{"i":"b1751","s":"數學","u":"單元05","t":"05-平行線","k":"s","q":"設直線 $L_1:x+ky=2$ 與 $L_2:kx+4y=4$ 互相平行（不重合），則 $k=$？","o":[["A","$2$"],["B","$-2$"],["C","$\\pm 2$"],["D","$4$"],["E","不存在"]],"a":"B","e":"平行條件：$1\\cdot4-k\\cdot k=0$，$k=\\pm2$。檢查重合：$k=2$ 時 $L_2:2x+4y=4$ 即 $x+2y=2$，與 $L_1$ 完全相同，是重合，要刪掉。$k=-2$ 時 $L_1:x-2y=2$、$L_2:x-2y=-2$，平行不重合。選 (C) 的人漏了「排除重合」這一步。"},{"i":"b1752","s":"數學","u":"單元05","t":"05-平行線距離","k":"s","q":"兩平行線 $L_1:3x-4y+2=0$ 與 $L_2:6x-8y-11=0$ 之間的距離為何？","o":[["A","$\\dfrac{3}{2}$"],["B","$\\dfrac{3}{10}$"],["C","$\\dfrac{13}{10}$"],["D","$\\dfrac{13}{5}$"],["E","$\\dfrac{15}{2}$"]],"a":"A","e":"第一步先把 $L_2$ 的 $x,y$ 係數調成和 $L_1$ 一樣：$L_2$ 除以 2 得 $3x-4y-\\frac{11}{2}=0$。第二步代公式 $d=\\dfrac{|c_1-c_2|}{\\sqrt{a^2+b^2}}=\\dfrac{|2+\\frac{11}{2}|}{\\sqrt{9+16}}=\\dfrac{15/2}{5}=\\dfrac32$。\n誘答：(D) $\\frac{13}{5}$ 是沒調係數直接拿 $|2-(-11)|$；(B) $\\frac{3}{10}$ 是分母用 $25$ 沒開根號；(C) $\\frac{13}{10}$ 是沒調係數又用 $L_2$ 的 $\\sqrt{100}$。"},{"i":"b1753","s":"數學","u":"單元05","t":"05-面積","k":"m","q":"直線 $L$ 通過點 $(2,3)$，且與 $x$ 軸、$y$ 軸的正向部分圍成面積為 $12$ 的三角形。下列哪些選項正確？","o":[["A","$L$ 的 $x$ 截距為 $4$"],["B","$L$ 的斜率為 $-\\dfrac{3}{2}$"],["C","$L$ 的 $y$ 截距為 $-6$"],["D","$L$ 不通過第三象限"],["E","原點到 $L$ 的距離為 $\\dfrac{12}{13}$"]],"a":"ABD","e":"設 $\\frac{x}{a}+\\frac{y}{b}=1$（$a,b>0$）。過 $(2,3)$：$\\frac2a+\\frac3b=1$，即 $2b+3a=ab$；面積 $\\frac12ab=12$，$ab=24$。所以 $3a+2b=24$、$ab=24$，代入得 $b^2-12b+36=0$，$b=6$、$a=4$。$L:3x+2y=12$。\n(A) 對。(B) 斜率 $-\\frac32$，對。(C) $y$ 截距是 $6$，錯。(D) 斜率負、$y$ 截距正，不過第三象限，對。(E) 距離 $\\frac{|-12|}{\\sqrt{9+4}}=\\frac{12}{\\sqrt{13}}$，分母 $13$ 是忘了開根號，錯。"},{"i":"b1754","s":"數學","u":"單元05","t":"05-中垂線","k":"m","q":"坐標平面上有兩點 $A(1,2)$、$B(5,4)$。下列哪些選項正確？","o":[["A","直線 $AB$ 的斜率為 $\\dfrac{1}{2}$"],["B","線段 $AB$ 的中垂線方程式為 $2x+y=9$"],["C","過原點且與直線 $AB$ 垂直的直線為 $x-2y=0$"],["D","點 $(1,7)$ 到 $A$、$B$ 兩點等距離"],["E","線段 $AB$ 的長為 $2\\sqrt{5}$"]],"a":"ABDE","e":"(A) $\\frac{4-2}{5-1}=\\frac12$，對。(B) 中點 $(3,3)$，中垂線斜率 $-2$：$y-3=-2(x-3)$，即 $2x+y=9$，對。(C) 與 $AB$ 垂直的斜率是 $-2$，應為 $2x+y=0$；$x-2y=0$ 斜率 $\\frac12$，是平行線，錯。(D) $(1,7)$ 代入 $2x+y=2+7=9$，在中垂線上，所以到 $A$、$B$ 等距，對。(E) $\\sqrt{4^2+2^2}=2\\sqrt5$，對。"},{"i":"b1755","s":"數學","u":"單元05","t":"05-判號","k":"m","q":"設直線 $L:2x-y+1=0$，點 $A(1,2)$、$B(-1,3)$、$C(2,7)$。下列哪些選項正確？","o":[["A","$A$、$B$ 兩點在 $L$ 的異側"],["B","$B$、$C$ 兩點在 $L$ 的異側"],["C","原點與 $A$ 在 $L$ 的同側"],["D","線段 $BC$ 與 $L$ 相交"],["E","不等式 $2x-y+1\\ge 0$ 所表示的區域包含點 $(1,3)$"]],"a":"ACE","e":"令 $f(x,y)=2x-y+1$：$f(A)=1$、$f(B)=-4$、$f(C)=-2$、$f(0,0)=1$、$f(1,3)=0$。\n(A) 一正一負，異側，對。(B) 都是負，同側，錯。(C) 同為正，同側，對。(D) $B$、$C$ 同側，線段不會碰到 $L$，錯。(E) $f(1,3)=0$ 在直線上，「$\\ge$」包含邊界，對。"},{"i":"b1756","s":"數學","u":"單元05","t":"05-面積","k":"m","q":"坐標平面上 $\\triangle ABC$ 的頂點為 $A(1,1)$、$B(5,2)$、$C(2,6)$。下列哪些選項正確？","o":[["A","$\\triangle ABC$ 的面積為 $\\dfrac{21}{2}$"],["B","過 $A$ 的中線通過點 $\\left(\\dfrac{7}{2},4\\right)$"],["C","過 $A$ 的中線方程式為 $6x-5y-1=0$"],["D","$BC$ 邊上的高的方程式為 $4x-3y-1=0$"],["E","$\\overline{BC}=5$"]],"a":"BCE","e":"(A) $\\overrightarrow{AB}=(4,1)$、$\\overrightarrow{AC}=(1,5)$，面積 $\\frac12|ad-bc|=\\frac12|4\\times5-1\\times1|=\\frac{19}{2}$。$\\frac{21}{2}$ 是把 $-bc$ 寫成 $+bc$，錯。(B) 過 $A$ 的中線要接對邊 $BC$ 的中點 $\\left(\\frac{5+2}{2},\\frac{2+6}{2}\\right)=\\left(\\frac72,4\\right)$，對。(C) 代 $A$：$6-5-1=0$；代 $\\left(\\frac72,4\\right)$：$21-20-1=0$，兩點都在線上，對。(D) $BC$ 斜率 $\\frac{6-2}{2-5}=-\\frac43$，高的斜率 $\\frac34$，過 $A$ 得 $3x-4y+1=0$；$4x-3y-1=0$ 斜率 $\\frac43$，錯。(E) $\\sqrt{3^2+4^2}=5$，對。"},{"i":"b1757","s":"數學","u":"單元05","t":"05-對稱點","k":"m","q":"下列哪些選項正確？","o":[["A","對任意實數 $k$，直線 $(k+1)x+(k-1)y-2k-4=0$ 恆通過點 $(3,-1)$"],["B","點 $P(-1,3)$ 關於直線 $2x+y-6=0$ 的對稱點為 $(1,4)$"],["C","點 $P(-1,3)$ 到直線 $2x+y-6=0$ 的垂足為 $(1,4)$"],["D","點 $P(-1,3)$ 到直線 $2x+y-6=0$ 的距離為 $\\sqrt{5}$"],["E","點 $(3,-1)$ 到直線 $2x+y-6=0$ 的距離為 $\\dfrac{1}{5}$"]],"a":"ACD","e":"(A) 整理成 $k(x+y-2)+(x-y-4)=0$，解 $x+y=2$、$x-y=4$ 得 $(3,-1)$，對。\n(B)(C)(D) 用代入值法：$t=\\dfrac{2(-1)+3-6}{2^2+1^2}=\\dfrac{-5}{5}=-1$。垂足 $=(x_0-at,\\ y_0-bt)=(-1+2,\\ 3+1)=(1,4)$；對稱點 $=(x_0-2at,\\ y_0-2bt)=(3,5)$。所以 (B) 把垂足當對稱點，錯；(C) 對。距離 $\\frac{|-5|}{\\sqrt5}=\\sqrt5$，(D) 對。\n(E) $\\frac{|6-1-6|}{\\sqrt5}=\\frac{1}{\\sqrt5}=\\frac{\\sqrt5}{5}$；$\\frac15$ 是分母用 $5$ 沒開根號，錯。"},{"i":"b1758","s":"數學","u":"單元05","t":"05-斜率","k":"f","q":"通過點 $(-2,5)$ 且斜率為 $-\\dfrac{3}{4}$ 的直線方程式為＿＿＿＿。","a":"$3x+4y-14=0$","e":"答案 $3x+4y-14=0$。$y-5=-\\frac34(x+2)$，兩邊乘 4：$4y-20=-3x-6$，移項 $3x+4y-14=0$。"},{"i":"b1759","s":"數學","u":"單元05","t":"05-截距","k":"f","q":"通過 $(1,7)$、$(4,-2)$ 兩點的直線，其 $x$ 截距為＿＿＿＿。","a":"$\\frac{10}{3}$","e":"答案 $\\frac{10}{3}$。斜率 $\\frac{-2-7}{4-1}=-3$（每個數加括號再減）。$y-7=-3(x-1)$，即 $y=-3x+10$；令 $y=0$，$x=\\frac{10}{3}$。"},{"i":"b1760","s":"數學","u":"單元05","t":"05-兩軸面積","k":"f","q":"直線 $3x-5y=15$ 與兩坐標軸所圍成的三角形面積為＿＿＿＿。","a":"$\\frac{15}{2}$","e":"答案 $\\frac{15}{2}$。令 $y=0$ 得 $x$ 截距 $5$；令 $x=0$ 得 $y$ 截距 $-3$。面積 $\\frac12\\times5\\times|-3|=\\frac{15}{2}$（截距是負的，面積要取絕對值）。"},{"i":"b1761","s":"數學","u":"單元05","t":"05-垂直線","k":"f","q":"通過點 $(2,-1)$ 且與直線 $2x-5y+7=0$ 垂直的直線方程式為＿＿＿＿。","a":"$5x+2y-8=0$","e":"答案 $5x+2y-8=0$。與 $2x-5y+7=0$ 垂直：$x,y$ 係數互換、其中一個變號，設 $5x+2y+c=0$。代 $(2,-1)$：$10-2+c=0$，$c=-8$。"},{"i":"b1762","s":"數學","u":"單元05","t":"05-垂直線","k":"f","q":"設直線 $L_1:(a-1)x+2y=3$ 與 $L_2:3x+(a+4)y=1$ 互相垂直，則 $a=$＿＿＿＿。","a":"$-1$","e":"答案 $-1$。垂直條件 $a_1a_2+b_1b_2=0$：$3(a-1)+2(a+4)=0$，$5a+5=0$，$a=-1$。"},{"i":"b1763","s":"數學","u":"單元05","t":"05-點線距離","k":"f","q":"點 $P(4,-1)$ 到直線 $5x+12y+6=0$ 的距離為＿＿＿＿。","a":"$\\frac{14}{13}$","e":"答案 $\\frac{14}{13}$。$d=\\dfrac{|5(4)+12(-1)+6|}{\\sqrt{25+144}}=\\dfrac{14}{13}$。"},{"i":"b1764","s":"數學","u":"單元05","t":"05-平行線距離","k":"f","q":"兩平行線 $x+2y-3=0$ 與 $2x+4y+9=0$ 之間的距離為＿＿＿＿。","a":"$\\frac{3\\sqrt5}{2}$","e":"答案 $\\frac{3\\sqrt5}{2}$。第二式除以 2：$x+2y+\\frac92=0$。$d=\\dfrac{|-3-\\frac92|}{\\sqrt{1+4}}=\\dfrac{15/2}{\\sqrt5}=\\dfrac{3\\sqrt5}{2}$。驗算：分母是 $\\sqrt5$ 不是 $5$。"},{"i":"b1765","s":"數學","u":"單元05","t":"05-平行線距離","k":"f","q":"與直線 $3x+4y-1=0$ 平行且距離為 $2$ 的直線有兩條，寫成 $3x+4y+c=0$，則 $c$ 的所有可能值為＿＿＿＿。","a":"$9$ 或 $-11$","e":"答案 $9$ 或 $-11$。$\\dfrac{|c-(-1)|}{\\sqrt{9+16}}=2$，$|c+1|=10$，$c+1=\\pm10$，$c=9$ 或 $c=-11$。兩條都要寫，只寫一個不給分。"},{"i":"b1766","s":"數學","u":"單元05","t":"05-對稱點","k":"f","q":"點 $A(5,0)$ 關於直線 $x-y+1=0$ 的對稱點坐標為＿＿＿＿。","a":"$(-1,6)$","e":"答案 $(-1,6)$。$t=\\dfrac{5-0+1}{1^2+(-1)^2}=3$。對稱點 $=(5-2\\cdot1\\cdot3,\\ 0-2\\cdot(-1)\\cdot3)=(-1,6)$。驗算：中點 $(2,3)$ 代入 $2-3+1=0$ 在線上；連線斜率 $\\frac{6-0}{-1-5}=-1$，與直線斜率 $1$ 垂直。"},{"i":"b1767","s":"數學","u":"單元05","t":"05-面積","k":"f","q":"三直線 $x-y+1=0$、$x+2y-8=0$、$2x+y-1=0$ 所圍成的三角形面積為＿＿＿＿。","a":"$6$","e":"答案 $6$。兩兩聯立求頂點：\n- $x-y+1=0$、$x+2y-8=0$：得 $(2,3)$\n- $x-y+1=0$、$2x+y-1=0$：相加 $3x=0$，得 $(0,1)$\n- $x+2y-8=0$、$2x+y-1=0$：得 $(-2,5)$\n\n以 $(0,1)$ 為起點：向量 $(2,2)$、$(-2,4)$。$ad=2\\times4=8$，$bc=2\\times(-2)=-4$，$ad-bc=8-(-4)=12$。面積 $\\frac12\\times12=6$。這題的陷阱就在 $bc$ 是負數，減負要變加。"},{"i":"b1768","s":"數學","u":"單元05","t":"單元05-綜合","k":"f","q":"設 $\\triangle ABC$ 的頂點 $A(2,5)$、$B(-2,1)$、$C(4,-1)$，則過 $A$ 的中線方程式為＿＿＿＿。","a":"$5x-y-5=0$","e":"答案 $5x-y-5=0$。過 $A$ 的中線接對邊 $BC$ 的中點：拿掉 $A$ 剩 $B$、$C$，中點 $\\left(\\frac{-2+4}{2},\\frac{1-1}{2}\\right)=(1,0)$。斜率 $\\frac{5-0}{2-1}=5$，$y=5(x-1)$，即 $5x-y-5=0$。"},{"i":"b1769","s":"數學","u":"單元05","t":"單元05-綜合","k":"f","q":"承第 19 題，$AB$ 邊上的高（過 $C$）的方程式為＿＿＿＿。\n\n<div class=\"pb\"><\/div>","a":"$x+y-3=0$","e":"答案 $x+y-3=0$。$AB$ 斜率 $\\frac{5-1}{2-(-2)}=1$，高垂直 $AB$，斜率 $-1$，且過對頂點 $C(4,-1)$：$y+1=-(x-4)$，即 $x+y-3=0$。"},{"i":"b1770","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"1683 年鄭克塽降清後，清廷內部有不少官員主張放棄臺灣。最後清廷決定將臺灣納入版圖，關鍵因素是下列何者？","o":[["A","荷蘭願意協助清朝治理臺灣"],["B","臺灣漢人聯名要求設省"],["C","施琅上疏，力陳臺灣在海防上的重要性"],["D","日本要求清朝接管臺灣"]],"a":"C","e":"清廷原本認為臺灣是「彈丸之地」，主張放棄者眾，是施琅上疏力爭臺灣的戰略地位，才在 1684 年決定留臺。"},{"i":"b1771","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-鄭制","k":"s","q":"1684 年清廷在臺灣設立的行政區，下列何者正確？","o":[["A","臺灣府，下轄臺灣、鳳山、諸羅三縣"],["B","承天府，下轄天興、萬年二縣"],["C","臺北府，下轄淡水、新竹、宜蘭三縣"],["D","臺灣府，下轄彰化、淡水、噶瑪蘭三縣"]],"a":"A","e":"1684 年設臺灣府，下轄臺灣、鳳山、諸羅三縣。(B) 是鄭氏時期；(C) 是 1875 年沈葆楨增設的臺北府；(D) 是後來陸續增設的行政區。"},{"i":"b1772","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"清領前期的治臺政策，最能用下列哪一句話概括？","o":[["A","開山撫番，積極開發臺灣"],["B","以臺灣作為反攻大陸的基地"],["C","以臺灣作為轉口貿易的據點，賺取利潤"],["D","為防臺而治臺，以防範臺灣成為亂源為優先"]],"a":"D","e":"清領前期所有政策都是一個「防」字，怕臺灣成為反清或民變的基地。(A) 是後期；(B) 是鄭氏；(C) 是荷蘭。"},{"i":"b1773","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"清初規定臺灣「不許築城」。此一規定最主要的考量是什麼？","o":[["A","節省國庫，把經費用於開港"],["B","避免民變發生時亂民據城頑抗"],["C","保護原住民的獵場"],["D","繼續使用荷蘭留下的城堡"]],"a":"B","e":"三大禁令都是「防」：渡臺防人、販鐵防武器、築城防據守。不許築城是怕亂民占城頑抗。"},{"i":"b1774","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清廷自 1684 年起實施渡臺禁令。此一政策在臺灣社會造成的結果，下列何者正確？","o":[["A","臺灣人口大幅減少，土地荒廢"],["B","偷渡盛行、男女比例失衡，出現大量羅漢腳"],["C","移民多為攜家帶眷的家族"],["D","漢人與原住民的衝突完全消失"]],"a":"B","e":"禁止攜眷、限制渡臺，結果是偷渡盛行、男多女少，單身無業的羅漢腳大量出現，成為械鬥與民變的來源。"},{"i":"b1775","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"有關清領前期的班兵制，下列敘述何者正確？","o":[["A","在臺灣就地招募士兵，熟悉地方"],["B","士兵終身駐守臺灣"],["C","兵員由原住民組成"],["D","由福建各營輪調來臺，約三年一換"]],"a":"D","e":"班兵由福建各營輪調、約三年一換、不在臺募兵，目的是防止軍隊在地化後與地方勾結造反。"},{"i":"b1776","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"班兵制在實行後產生的問題，下列何者最正確？","o":[["A","士兵人地生疏、士氣低落、與民爭利，本身也成為治安問題"],["B","兵力過強，地方官無法管理"],["C","士兵與原住民大量通婚，使番界消失"],["D","造成臺灣茶葉出口大增"]],"a":"A","e":"班兵人地生疏、素質差、與民爭利，不但戰力不足，本身也是民變的原因之一。"},{"i":"b1777","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清代臺灣的「土牛」與「番界」，下列敘述何者正確？","o":[["A","土牛是地圖上的紅線，番界是地上的土堆"],["B","兩者都是開港以後才出現"],["C","土牛是地上的土堆與壕溝，番界是官方地圖上標示的界線"],["D","兩者都是用來劃分漳州人與泉州人的居住區"]],"a":"C","e":"口訣「土在地上、界在紙上」：土牛是地上的土堆加壕溝，番界是官方地圖上的紅線、藍線。(A) 兩者說反。"},{"i":"b1778","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清廷在臺灣劃設番界，最主要的目的是什麼？","o":[["A","隔離漢人與原住民，降低治理成本"],["B","鼓勵漢人進入山區開墾"],["C","方便洋行收購樟腦"],["D","劃定與日本之間的國界"]],"a":"A","e":"劃界是為了漢番隔離、減少衝突、降低治理成本，屬於消極治理，不是為了開發，也不是單純保護原住民。"},{"i":"b1779","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清代流傳「三年一小反，五年一大亂」的俗諺。對這句俗諺的解讀，下列何者最恰當？","o":[["A","清代臺灣每三年必定發生一次民變"],["B","這句俗諺是官方的統計資料"],["C","它證明清代臺灣的民變次數全國最少"],["D","它反映當時吏治不佳、治安混亂的印象，不宜直接當作事件次數的證據"]],"a":"D","e":"這是俗諺，反映的是治安混亂的印象，不是統計數字，不能拿來當作事件次數的證據。"},{"i":"b1780","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清領時期臺灣規模最大的民變是下列何者？","o":[["A","郭懷一事件"],["B","朱一貴事件"],["C","林爽文事件"],["D","施九緞事件"]],"a":"C","e":"林爽文事件（1786～88）是清領時期規模最大的民變。(A) 郭懷一事件在荷蘭時期；(B) 朱一貴事件（1721）是民變第一大波；(D) 施九緞事件是清賦引起的。"},{"i":"b1781","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"林爽文事件平定後，清廷為褒獎協助守城的居民，將「諸羅」改為新的地名。此新地名為何？","o":[["A","彰化"],["B","嘉義"],["C","恆春"],["D","新竹"]],"a":"B","e":"林爽文事件時諸羅城居民協助守城，事後清廷改諸羅為「嘉義」，取嘉獎忠義之意，這也是事件後的行政區調整之一。"},{"i":"b1782","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"s","q":"清代臺灣開港通商的法律依據是下列何者？","o":[["A","馬關條約"],["B","南京條約"],["C","清日在牡丹社事件後簽訂的條約"],["D","天津條約與北京條約"]],"a":"D","e":"1858 年天津條約、1860 年北京條約是臺灣開港的法律依據。(A) 馬關條約是 1895 年割臺；(B) 南京條約開放的是中國沿海五口。"},{"i":"b1783","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"s","q":"有關清代臺灣開港的通商口岸，下列何者正確？","o":[["A","正口為安平、淡水；副口為打狗、雞籠"],["B","正口為打狗、雞籠；副口為安平、淡水"],["C","只開放鹿港一港"],["D","正口為鹿港、艋舺"]],"a":"A","e":"安平、淡水為正口，打狗、雞籠為副口。(B) 正、副口說反。"},{"i":"b1784","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"s","q":"開港以後臺灣的三大出口商品，其主要產地何者正確？","o":[["A","茶與糖都集中在南部"],["B","茶與樟腦主要產於北部，糖主要產於南部"],["C","樟腦主要產於澎湖"],["D","糖主要產於北部丘陵"]],"a":"B","e":"茶與樟腦產於北部丘陵山區，糖產於南部平原。這是判斷開港後經濟方位的第一步。"},{"i":"b1785","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"s","q":"開港以後，臺灣的經濟與人口重心出現什麼變化？原因為何？","o":[["A","重心南移，因為清廷把府城遷到打狗"],["B","重心南移，因為北部茶業衰退"],["C","重心北移，因為北部茶與樟腦外銷興盛"],["D","重心北移，因為荷蘭重新占領南部"]],"a":"C","e":"茶與樟腦外銷興盛，北部快速發展，經濟與人口重心北移，1875 年增設臺北府，政治中心也隨之北移。"},{"i":"b1786","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"1867 年美國商船羅妹號在南臺灣觸礁，船員遭當地原住民殺害。此事件後衍生出下列哪一種說法，日後成為外國出兵的藉口？","o":[["A","臺灣應立即建省"],["B","原住民地區屬於日本"],["C","原住民居住地區不在清朝實際管轄內的「番地無主」說法"],["D","臺灣應割讓給美國"]],"a":"C","e":"羅妹號事件後，外國人主張原住民地區不在清朝實際管轄之內，也就是「番地無主」，這成為日後日本出兵的伏筆。"},{"i":"b1787","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"1874 年牡丹社事件的導火線是下列何者？","o":[["A","清法戰爭時法軍攻擊基隆"],["B","1871 年琉球宮古島民漂流到南臺灣遇害"],["C","林爽文事件"],["D","劉銘傳推行清賦"]],"a":"B","e":"1871 年琉球宮古島民漂流到南臺灣遇害，日本以此為藉口，在 1874 年出兵。"},{"i":"b1788","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"牡丹社事件對清廷治臺政策最重要的影響是什麼？","o":[["A","由消極治理轉為積極治理"],["B","立即將臺灣割讓給日本"],["C","恢復並加強渡臺禁令"],["D","由荷蘭與清朝共同管理臺灣"]],"a":"A","e":"牡丹社事件暴露臺灣國防空虛，是清廷治臺由消極轉積極的轉捩點。"},{"i":"b1789","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"下列哪一項不是沈葆楨在臺灣推動的措施？","o":[["A","開山撫番"],["B","廢除渡臺禁令"],["C","增設臺北府"],["D","清賦，實施減四留六"]],"a":"D","e":"清賦、減四留六是劉銘傳的施政。沈葆楨四件事是「開、廢、增、建」：開山撫番、廢渡臺禁令、增設府縣、建砲臺。"},{"i":"b1790","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"臺南的億載金城（二鯤鯓砲臺）是在什麼背景下興建的？","o":[["A","荷蘭為防備鄭成功而建"],["B","鄭氏為反清復明而建"],["C","清初為防範民變而建"],["D","牡丹社事件後，沈葆楨為加強海防而建"]],"a":"D","e":"億載金城是牡丹社事件後沈葆楨為加強海防所建的砲臺。(A) 荷蘭建的是熱蘭遮城，兩者差了兩百多年。"},{"i":"b1791","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"清領後期的「開山撫番」，其內容最接近下列何者？","o":[["A","開闢通往山區的道路、招募墾民，把原住民地區納入統治"],["B","劃定土牛界線，禁止漢人越界"],["C","把原住民遷往澎湖"],["D","禁止漢人進入山區"]],"a":"A","e":"開山撫番是開路、招墾，把原住民地區納入統治，與前期「劃界隔離」相反。(B)(D) 是前期政策。"},{"i":"b1792","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"1884–85 年清法戰爭期間，法軍攻擊基隆、滬尾。此戰對臺灣最重要的影響是什麼？","o":[["A","臺灣割讓給法國"],["B","清廷更加認識臺灣的國防地位，1885 年下詔臺灣建省"],["C","清廷恢復消極治理"],["D","清廷廢除臺灣巡撫"]],"a":"B","e":"清法戰爭再次證明臺灣是國防前線，1885 年清廷下詔臺灣建省，劉銘傳任首任巡撫。"},{"i":"b1793","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"有關劉銘傳的敘述，下列何者正確？","o":[["A","1874 年來臺處理牡丹社事件"],["B","建造億載金城"],["C","擔任首任臺灣巡撫，推動鐵路、電報、郵政與新式學堂"],["D","頒布渡臺禁令"]],"a":"C","e":"劉銘傳四件事是「賦、路、電、學」：清賦、鐵路、電報郵政、新式學堂。(A)(B) 是沈葆楨；(D) 是清初政策。"},{"i":"b1794","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"劉銘傳推行「清賦」的主要目的是什麼？","o":[["A","清查田畝、整理賦稅，以增加財政收入"],["B","免除所有人民的田賦"],["C","把全臺土地收歸國有"],["D","把稅收交給洋行管理"]],"a":"A","e":"清賦是清查田畝、整理賦稅，以增加財政收入支應新政。"},{"i":"b1795","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"1888 年臺灣爆發施九緞事件，其主要起因為何？","o":[["A","日本出兵南臺灣"],["B","渡臺禁令造成移民不滿"],["C","法軍攻打臺灣"],["D","清賦丈量田地引發民怨"]],"a":"D","e":"清賦需要丈量田地，觸動地方利益，引發施九緞事件，說明改革也帶來反彈。"},{"i":"b1796","s":"歷史","u":"L3 荷鄭到清","t":"L3 荷鄭到清-綜合","k":"s","q":"比較清領前期與後期治臺的主要動機，下列何者正確？","o":[["A","前期防外患，後期防內亂"],["B","前期防內亂，後期防外患"],["C","兩期都以賺取貿易利潤為主"],["D","兩期都以傳教為主"]],"a":"B","e":"前期怕臺灣內部亂起來，所以「防內亂」；後期是被日本、法國打上門，所以「防外患」。"},{"i":"b1797","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"一份清代地方官的奏摺寫道：「臺民好亂，宜嚴加管束。」若要用這份史料研究清代臺灣社會，最需要注意下列何者？","o":[["A","奏摺是外國人所寫，不可採信"],["B","奏摺由官員撰寫，必定完全客觀"],["C","奏摺代表官方立場，可能看不到民眾的觀點與民變的原因"],["D","奏摺只記錄荷蘭時期的事"]],"a":"C","e":"史料三問：誰寫的、寫給誰看、看不到什麼。奏摺是官員寫給皇帝看的，代表官方立場，看不到民眾的觀點與民變真正的原因。"},{"i":"b1798","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"m","q":"下列哪些屬於清領前期的消極治臺措施？","o":[["A","實施渡臺禁令"],["B","班兵在臺灣就地招募"],["C","開山撫番"],["D","劃定番界"],["E","禁止築城"]],"a":"ADE","e":"(B) 班兵是由福建輪調，不在臺灣招募。(C) 開山撫番是後期積極政策。"},{"i":"b1799","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"m","q":"有關清代臺灣開港的影響，下列哪些正確？","o":[["A","鹿皮成為臺灣最主要的出口商品"],["B","洋行與買辦在臺灣活躍"],["C","北部因茶與樟腦而興起"],["D","臺灣經濟被捲入世界市場"],["E","開港的依據是馬關條約"]],"a":"BCD","e":"(A) 鹿皮是荷蘭時期的主要出口，開港後的三大出口是茶、糖、樟腦。(E) 開港依據是天津條約與北京條約。"},{"i":"b1800","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"m","q":"有關牡丹社事件，下列哪些正確？","o":[["A","導火線是 1871 年琉球宮古島民遇害"],["B","日軍於 1874 年出兵南臺灣"],["C","事後清廷派沈葆楨來臺處理善後"],["D","事件直接導致清廷割讓臺灣"],["E","羅妹號事件後衍生的「番地無主」說法，是背景之一"]],"a":"ABCE","e":"(D) 牡丹社事件之後清廷改採積極治理，割臺是 1895 年甲午戰爭後的馬關條約。"},{"i":"b1801","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"m","q":"有關劉銘傳在臺灣的施政，下列哪些正確？","o":[["A","1874 年來臺處理牡丹社事件"],["B","推動清賦"],["C","建造億載金城"],["D","架設電報、興建鐵路"],["E","改革觸動地方利益，引發施九緞事件"]],"a":"BDE","e":"(A)(C) 都是沈葆楨，劉銘傳是 1884 年清法戰爭時來臺。"},{"i":"b1802","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"m","q":"有關清領前期臺灣社會的狀況，下列哪些正確？","o":[["A","羅漢腳大量出現"],["B","械鬥只發生在漢人與原住民之間"],["C","民變頻繁"],["D","班兵戰力強大，有效維持治安"],["E","官員任期短，常視臺灣為畏途"]],"a":"ACE","e":"(B) 械鬥也發生在漢人不同祖籍的族群之間（分類械鬥）。(D) 班兵戰力不足，正是治安不佳的原因。"},{"i":"b1803","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"m","q":"比較清領前期與後期的治臺政策，下列哪些正確？","o":[["A","前期對原住民採劃界隔離"],["B","後期對原住民採開山撫番"],["C","前期的經濟重心在北部"],["D","後期增設臺北府，並於 1885 年下詔建省"],["E","後期轉向積極治理，主要動機是國防"]],"a":"ABDE","e":"(C) 前期的經濟重心在南部（府城），北部是開港後才興起。"},{"i":"b1804","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"資料中「外人藉口番地無主而出兵」，最可能是指哪一個事件？","o":[["A","清法戰爭"],["B","牡丹社事件"],["C","林爽文事件"],["D","郭懷一事件"]],"a":"B","c":"下列資料為命題者依清末官員奏議的大意改寫而成：\n「番地雖然偏僻，仍是我國版圖所及。如今外人藉口番地無主而出兵，若不開路招墾、設官治理，日後終將被他人占據。」","e":"「番地無主」加上「外人出兵」，對應 1874 年日本以琉球島民遇害為藉口出兵的牡丹社事件。"},{"i":"b1805","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"依資料內容，這位官員最可能主張下列哪一項政策？","o":[["A","恢復渡臺禁令"],["B","加強班兵輪調"],["C","劃定新的土牛界線"],["D","開山撫番"]],"a":"D","c":"下列資料為命題者依清末官員奏議的大意改寫而成：\n「番地雖然偏僻，仍是我國版圖所及。如今外人藉口番地無主而出兵，若不開路招墾、設官治理，日後終將被他人占據。」","e":"資料主張「開路招墾、設官治理」，就是開山撫番。(A)(B)(C) 都是前期的消極政策。"},{"i":"b1806","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"資料中的主張，與清領前期的原住民政策相比，最大的差異是什麼？","o":[["A","前期劃界隔離、限制越界；此時主張開路招墾、納入統治"],["B","前期鼓勵漢人入山；此時主張禁止入山"],["C","前期由荷蘭管理原住民；此時改由清廷管理"],["D","兩者並無差異"]],"a":"A","c":"下列資料為命題者依清末官員奏議的大意改寫而成：\n「番地雖然偏僻，仍是我國版圖所及。如今外人藉口番地無主而出兵，若不開路招墾、設官治理，日後終將被他人占據。」","e":"前期劃設土牛與番界，限制漢人越界；後期改為開路招墾，把原住民地區納入統治。"},{"i":"b1807","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"若以這份奏議研究當時的原住民處境，最大的限制是什麼？","o":[["A","奏議寫於日治時期，年代不符"],["B","奏議是外國人所寫"],["C","奏議代表官方立場，看不到原住民自己的觀點"],["D","奏議記載的是西班牙時期的事"]],"a":"C","c":"下列資料為命題者依清末官員奏議的大意改寫而成：\n「番地雖然偏僻，仍是我國版圖所及。如今外人藉口番地無主而出兵，若不開路招墾、設官治理，日後終將被他人占據。」","e":"奏議是清朝官員的立場，關心的是國防與版圖，看不到原住民自己怎麼看開山撫番。"},{"i":"b1808","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"從設臺灣府到下詔建省，大約經過多少年？","o":[["A","約 100 年"],["B","約 200 年"],["C","約 250 年"],["D","約 300 年"]],"a":"B","c":"下表為清領時期臺灣的部分大事：\n\n| 年代 | 1684 | 1721 | 1786 | 1860 年代 | 1867 | 1874 | 1884 | 1885 | 1895 |\n|---|---|---|---|---|---|---|---|---|---|\n| 事件 | 設臺灣府 | 朱一貴事件 | 林爽文事件 | 陸續開港 | 羅妹號事件 | 牡丹社事件 | 清法戰爭 | 下詔建省 | 割讓日本 |","e":"$1885-1684=201$ 年，約 200 年。"},{"i":"b1809","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"清廷統治臺灣的期間（1684～1895），以牡丹社事件為界分成前後兩期。前期大約占整個清領時期的多少？","o":[["A","約 50%"],["B","約 70%"],["C","約 90%"],["D","約 98%"]],"a":"C","c":"下表為清領時期臺灣的部分大事：\n\n| 年代 | 1684 | 1721 | 1786 | 1860 年代 | 1867 | 1874 | 1884 | 1885 | 1895 |\n|---|---|---|---|---|---|---|---|---|---|\n| 事件 | 設臺灣府 | 朱一貴事件 | 林爽文事件 | 陸續開港 | 羅妹號事件 | 牡丹社事件 | 清法戰爭 | 下詔建省 | 割讓日本 |","e":"前期 $1874-1684=190$ 年，全期 $1895-1684=211$ 年，$190\\div211\\approx0.90$，約 90%。也就是說，清朝統治臺灣兩百多年，九成的時間都是消極治理。"},{"i":"b1810","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"某人生於 1855 年。下列哪一件事發生時，他已年滿 20 歲並可能親身經歷？","o":[["A","朱一貴事件"],["B","林爽文事件"],["C","牡丹社事件"],["D","下詔建省"]],"a":"D","c":"下表為清領時期臺灣的部分大事：\n\n| 年代 | 1684 | 1721 | 1786 | 1860 年代 | 1867 | 1874 | 1884 | 1885 | 1895 |\n|---|---|---|---|---|---|---|---|---|---|\n| 事件 | 設臺灣府 | 朱一貴事件 | 林爽文事件 | 陸續開港 | 羅妹號事件 | 牡丹社事件 | 清法戰爭 | 下詔建省 | 割讓日本 |","e":"1855 年出生：\n- 牡丹社事件（1874）時 $1874-1855=19$ 歲，未滿 20 歲\n- 下詔建省（1885）時 $1885-1855=30$ 歲，符合\n\n(A)(B) 發生在他出生以前。"},{"i":"b1811","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"將下列事件依發生先後排序：甲、羅妹號事件　乙、清法戰爭　丙、陸續開港　丁、牡丹社事件","o":[["A","丙甲丁乙"],["B","甲丙丁乙"],["C","丙丁甲乙"],["D","甲丁丙乙\n\n<div class=\"pb\"><\/div>"]],"a":"A","c":"下表為清領時期臺灣的部分大事：\n\n| 年代 | 1684 | 1721 | 1786 | 1860 年代 | 1867 | 1874 | 1884 | 1885 | 1895 |\n|---|---|---|---|---|---|---|---|---|---|\n| 事件 | 設臺灣府 | 朱一貴事件 | 林爽文事件 | 陸續開港 | 羅妹號事件 | 牡丹社事件 | 清法戰爭 | 下詔建省 | 割讓日本 |","e":"開港（1860 年代）→ 羅妹號事件（1867）→ 牡丹社事件（1874）→ 清法戰爭（1884）。"},{"i":"b1812","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"某動物細胞進行有絲分裂，在二分體排列於細胞中央時，可觀察到 8 個中節、共 16 條染色分體。此時細胞的染色體數與 DNA 相對量各為何？","o":[["A","16 條；16 單位"],["B","8 條；8 單位"],["C","8 條；16 單位"],["D","16 條；8 單位"],["E","4 條；16 單位"]],"a":"C","e":"染色體數看中節數：8 個中節＝8 條染色體（每條是二分體）。DNA 相對量看染色分體數：16 條染色分體＝16 單位。(A) 把染色分體當成染色體；(B) 忘了複製後 DNA 已加倍。"},{"i":"b1813","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-名詞","k":"s","q":"有關中節與著絲點的敘述，下列何者正確？","o":[["A","中節是蛋白質構造，著絲點是染色體上的一個位置"],["B","一個中節上有 2 個著絲點，著絲點可與紡錘絲相連"],["C","著絲點只在減數分裂時出現"],["D","中節只存在於染色質，染色體上沒有中節"],["E","紡錘絲直接接在中心粒上，再把染色體拉向兩端"]],"a":"B","e":"中節是兩條姊妹染色分體相連的「位置」，中節上有 2 個由蛋白質組成的著絲點，著絲點與紡錘絲相連。(A) 兩者說反；(C) 有絲分裂也有著絲點；(D) 二分體就是在中節處相連；(E) 紡錘絲是在中心粒附近出現，接的是著絲點。"},{"i":"b1814","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"某植物體細胞的染色體數為 2n＝16。其生殖母細胞進行減數分裂 I 時，可觀察到幾個四分體？形成的配子含幾條染色體？","o":[["A","8 個；8 條"],["B","16 個；8 條"],["C","8 個；16 條"],["D","4 個；8 條"],["E","16 個；16 條"]],"a":"A","e":"2n＝16 表示有 8 對同源染色體。四分體由一對同源的二分體聯會形成，所以四分體數＝對數＝8 個。配子為 n＝8 條。(B) 把條數當成四分體數。"},{"i":"b1815","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-週期","k":"s","q":"有關細胞週期中「間期」的敘述，下列何者正確？","o":[["A","間期細胞處於休息狀態，幾乎不進行代謝"],["B","間期約占細胞週期時間的 10%"],["C","間期時核膜與核仁消失"],["D","減數分裂也具有週期性，可畫入細胞週期"],["E","間期會製造酵素與蛋白質、複製染色質並合成胞器"]],"a":"E","e":"間期做三件事：製造酵素與蛋白質、染色質複製、合成胞器。(A) 間期是最忙的時期；(B) 間期約占 90%；(C) 核膜與核仁消失是在分裂期；(D) 減數分裂沒有週期性。"},{"i":"b1816","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-名詞","k":"s","q":"下列為有絲分裂過程的六個步驟：\n甲、二分體排列於細胞中央　乙、染色質複製　丙、姊妹染色分體分離，向兩端移動\n丁、二分體形成，中心粒附近出現紡錘絲　戊、子細胞形成　己、細胞生長\n正確順序為何？","o":[["A","乙甲丁丙戊己"],["B","丁乙甲丙戊己"],["C","乙丁丙甲戊己"],["D","乙丁甲丙戊己"],["E","乙丁甲戊丙己"]],"a":"D","e":"課本順序：染色質複製（乙）→ 二分體形成、中心粒附近出現紡錘絲（丁）→ 二分體排列於中央（甲）→ 姊妹染色分體分離（丙）→ 子細胞形成（戊）→ 細胞生長（己）。"},{"i":"b1817","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"1-3 細胞週期與細胞分裂-綜合","k":"s","q":"有關動物細胞與植物細胞的細胞質分裂，下列何者正確？","o":[["A","植物細胞在細胞中央形成細胞板，產生新的細胞膜與細胞壁"],["B","動物細胞在細胞中央形成細胞板"],["C","植物細胞因不具中心粒，分裂時不會出現紡錘絲"],["D","動物細胞的細胞膜由細胞中央向外長出新膜"],["E","動、植物細胞的細胞質分裂方式相同"]],"a":"A","e":"植物細胞形成細胞板，產生新的細胞膜與細胞壁；動物細胞是細胞膜向內凹陷形成分裂溝。(B) 細胞板是植物的；(C) 植物一般不具中心粒，但仍有紡錘絲；(D) 動物細胞是往內凹，方向說反；(E) 兩者不同。"},{"i":"b1818","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"某動物體細胞染色體數為 2n＝4。其初級精母細胞完成減數分裂 I 後，每一個次級精母細胞內的情形為何？","o":[["A","有 4 條染色體，皆為單分體"],["B","有 2 條染色體，皆為二分體"],["C","有 2 條染色體，皆為單分體"],["D","仍有 2 對同源染色體"],["E","會先進行染色質複製，再進入減數分裂 II"]],"a":"B","e":"減 I 分開的是同源染色體，每個子細胞得到 2 條，而且減 I 後不再複製，每條仍是二分體。(A)(C) 錯在單分體；(D) 減 I 後已沒有同源染色體；(E) 減 I 完成後不再複製，這正是染色體數能減半的原因。"},{"i":"b1819","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"下列哪一事件在有絲分裂與減數分裂中都會發生？","o":[["A","聯會"],["B","形成四分體"],["C","同源染色體分離"],["D","子細胞染色體數減半"],["E","姊妹染色分體分離"]],"a":"E","e":"姊妹染色分體分離發生在有絲分裂與減數分裂 II。聯會、四分體、同源分離都是減 I 獨有的；子細胞染色體數減半只發生在減數分裂。"},{"i":"b1820","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"人類體細胞進行有絲分裂。在姊妹染色分體剛分離、細胞質尚未分裂時，此細胞內的染色體數為何？","o":[["A","23"],["B","46"],["C","69"],["D","92"],["E","184"]],"a":"D","e":"人類體細胞 46 條，複製後仍是 46 條（二分體）。姊妹染色分體一分開，中節變成兩倍，染色體數暫時變為 92 條；細胞質分裂後，每個子細胞回到 46 條。"},{"i":"b1821","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"比較有絲分裂與減數分裂，下列何者正確？","o":[["A","有絲分裂複製 1 次、分裂 1 次；減數分裂複製 2 次、分裂 2 次"],["B","有絲分裂只發生在生殖母細胞"],["C","減數分裂產生 4 個子細胞，染色體數由 2n 變為 n"],["D","減數分裂產生的子細胞與母細胞遺傳物質完全相同"],["E","有絲分裂產生的子細胞染色體數為母細胞的一半"]],"a":"C","e":"課本比較表：有絲分裂複製 1 次、分裂 1 次、2 個子細胞、2n→2n、體細胞；減數分裂複製 1 次、分裂 2 次、4 個子細胞、2n→n、生殖母細胞。(A) 減數分裂也只複製 1 次；(B) 有絲分裂發生在體細胞；(D) 減數分裂子細胞與母細胞不同；(E) 有絲分裂染色體數不變。"},{"i":"b1822","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"人類一個初級卵母細胞完成減數分裂後，結果為何？","o":[["A","產生 4 個卵細胞"],["B","產生 2 個卵細胞與 2 個極體"],["C","減數分裂 I 後形成 2 個大小相同的次級卵母細胞"],["D","產生的極體也可與精子受精"],["E","只產生 1 個卵細胞，極體無受精能力"]],"a":"E","e":"初級卵母細胞經減 I 形成 1 個次級卵母細胞與 1 個極體，再經減 II 形成 1 個卵細胞；極體無受精能力。(C) 次級卵母細胞與極體大小不同。"},{"i":"b1823","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"人類精子形成過程中，下列哪一種細胞的染色體數為 n，且每條染色體都是二分體？","o":[["A","精原細胞"],["B","初級精母細胞"],["C","次級精母細胞"],["D","精細胞"],["E","受精卵"]],"a":"C","e":"依路線逐一判斷：精原細胞 2n、單分體；初級精母細胞 2n、二分體（已複製）；次級精母細胞 n、二分體（減 I 後不再複製）；精細胞 n、單分體；受精卵 2n。"},{"i":"b1824","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"s","q":"以洋蔥根尖進行細胞分裂觀察，下列敘述何者正確？","o":[["A","根尖生長點的細胞正在進行減數分裂"],["B","視野中大多數細胞處於細胞分裂期"],["C","生長點細胞體積較大、排列鬆散"],["D","間期細胞可觀察到核膜、核仁及染色質"],["E","進行有絲分裂的細胞，核膜與核仁清楚可見"]],"a":"D","e":"間期可觀察到核膜、核仁及染色質。(A) 根尖是體細胞，只進行有絲分裂；(B) 間期占 90%，視野中大多數細胞在間期；(C) 生長點細胞體積較小、排列緊密；(E) 分裂時核膜與核仁消失。"},{"i":"b1825","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-週期","k":"s","q":"有關癌症與細胞週期的敘述，下列何者正確？","o":[["A","負責細胞週期調控與 DNA 修復的基因（如 BRCA1）發生突變，可能導致癌症"],["B","約 95% 的癌症相關突變直接遺傳自父母"],["C","癌細胞的細胞週期受到更嚴格的控制"],["D","紫外線與病毒不會增加基因突變的機率"],["E","癌症是減數分裂異常所造成"]],"a":"A","e":"癌症是細胞分裂失去控制，起因是負責細胞週期調控與 DNA 修復的基因突變，例如 BRCA1。(B) 遺傳只占約 5%，其餘約 95% 與環境因素有關；(C) 癌細胞是失去控制；(D) 紫外線、病毒都是環境因素；(E) 與減數分裂無關。"},{"i":"b1826","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-數量","k":"s","q":"某動物（2n＝4）的一個細胞正在分裂，觀察到細胞兩端各有 2 條二分體正被紡錘絲拉往該端，而且同一端的 2 條染色體大小、形狀都不相同。此細胞最可能處於下列何者？","o":[["A","有絲分裂，姊妹染色分體分離"],["B","減數分裂 I，同源染色體分離"],["C","減數分裂 II，姊妹染色分體分離"],["D","有絲分裂，二分體排列於細胞中央"],["E","減數分裂 I，四分體排列於細胞中央"]],"a":"B","e":"先看移動中的染色體是不是二分體：是二分體，表示被拉開的是同源染色體，屬於減數分裂 I。再驗證：2n＝4 有 2 對同源染色體，同源分離後每端各得 2 條、而且彼此不同源，和題目相符。若是有絲分裂或減 II，移動中的應該是單分體。"},{"i":"b1827","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"有關同源染色體與姊妹染色分體，下列哪些正確？","o":[["A","同源染色體一條來自父方、一條來自母方"],["B","姊妹染色分體由同一條染色質複製而來"],["C","同源染色體上攜帶的遺傳訊息必定完全相同"],["D","姊妹染色分體在減數分裂 I 時分離"],["E","人類的精子不具成對的同源染色體"]],"a":"ABE","e":"(C) 同源染色體只是大小形狀相同，訊息不必相同（一條來自父方、一條來自母方）。(D) 姊妹染色分體在有絲分裂與減 II 分離，減 I 分的是同源染色體。(E) 精子為 n，不具成對的同源染色體。"},{"i":"b1828","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"比較有絲分裂與減數分裂，下列哪些正確？","o":[["A","有絲分裂染色質複製一次，減數分裂染色質複製兩次"],["B","只有減數分裂會出現聯會"],["C","有絲分裂產生的子細胞，染色體數與母細胞相同"],["D","減數分裂 II 的過程與有絲分裂相似，但細胞中已無同源染色體"],["E","減數分裂具有週期性，屬於細胞週期的一部分"]],"a":"BCD","e":"(A) 兩者都只複製一次，差別在分裂次數。(D) 減 I 已把同源染色體分開，所以減 II 的細胞中沒有同源染色體。(E) 減數分裂沒有週期性。"},{"i":"b1829","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"某動物體細胞染色體數 2n＝8，其生殖母細胞在染色質複製前的 DNA 相對量為 8 單位。下列有關其減數分裂的敘述，哪些正確？","o":[["A","染色質複製後，染色體數為 8 條、DNA 相對量為 16 單位"],["B","減數分裂 I 時可觀察到 8 個四分體"],["C","減數分裂 I 完成後，每個子細胞染色體數為 4 條、DNA 相對量為 8 單位"],["D","減數分裂 II 姊妹染色分體分離後、細胞質分裂前，每個細胞的染色體數暫時變為 8 條"],["E","最後形成的每個子細胞，染色體數為 4 條、DNA 相對量為 8 單位"]],"a":"ACD","e":"2n＝8，複製前 8 單位。\n- (A) 複製後染色體數不變仍為 8 條，DNA 加倍為 16 單位，對。\n- (B) 8 條＝4 對，所以只有 4 個四分體，錯。\n- (C) 減 I 同源分離：每個細胞 4 條（仍為二分體）、DNA 8 單位，對。\n- (D) 減 II 姊妹分離後，4 條變 8 條，對（細胞尚未分家，DNA 仍為 8 單位）。\n- (E) 最後子細胞 4 條、DNA 4 單位；8 單位是忘了減 II 後 DNA 還要再減半，錯。"},{"i":"b1830","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"有關人體配子形成與受精卵發育，下列哪些正確？","o":[["A","一個精原細胞經減數分裂可產生 4 個精子"],["B","精細胞就是具有鞭毛的精子，不需再特化"],["C","受精卵經多次有絲分裂與細胞分化，形成組織與器官"],["D","神經細胞與白血球的染色體數不同"],["E","極體不具受精能力"]],"a":"ACE","e":"(B) 精細胞還要經過特化，才形成具有鞭毛的精子。(D) 分化後的體細胞染色體數都是 2n＝46，差別在形態與功能。"},{"i":"b1831","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-週期","k":"m","q":"有關細胞週期與細胞質分裂，下列哪些正確？","o":[["A","有絲分裂負責把胞器分配給子細胞"],["B","人體所有體細胞都持續進行細胞週期"],["C","植物細胞一般不具中心粒，但分裂時仍會出現紡錘絲"],["D","動物細胞以細胞膜向內凹陷的方式形成分裂溝"],["E","皮膚的幹細胞終生都可進行分裂"]],"a":"CDE","e":"(A) 有絲分裂分配染色體，細胞質分裂分配胞器，說反了。(B) 只有部分細胞持續進行細胞週期，例如肝臟幹細胞要受傷時才分裂。"},{"i":"b1832","s":"生物","u":"1-3 細胞週期與細胞分裂","t":"13-減數","k":"m","q":"有關洋蔥根尖觀察活動與癌症，下列哪些正確？","o":[["A","根尖與莖頂的生長點可持續進行有絲分裂"],["B","生長點細胞的細胞核占細胞的比例較大"],["C","觀察根尖時，可同時看到減數分裂的各個階段"],["D","癌症相關的基因突變，約 5% 直接遺傳自父母"],["E","紫外線、亞硝酸鹽、特定病毒都屬於可能引發突變的環境因素"]],"a":"ABDE","e":"(C) 根尖是體細胞，只進行有絲分裂，不會出現減數分裂。"},{"i":"b1835","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Dogs have a ______ sense of smell; they can pick up odors that humans cannot notice at all.","o":[["A","sensible"],["B","keen"],["C","specific"],["D","complete"]],"a":"B","e":"a keen sense of smell＝敏銳的嗅覺。sensible 是「明智的」。"},{"i":"b1836","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"My skin is very ______ to sunlight, so I always put on sunscreen before going out.","o":[["A","sensible"],["B","creative"],["C","alert"],["D","sensitive"]],"a":"D","e":"be sensitive to＝對……敏感。sensible 是「明智的、合理的」，是本課最常考的形近字。"},{"i":"b1837","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The new machine can ______ tiny amounts of gas leaking from the pipes.","o":[["A","detect"],["B","assign"],["C","reward"],["D","perform"]],"a":"A","e":"detect＝偵測到。題意是機器測出少量漏氣。"},{"i":"b1838","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"After months of hard work, the club finally ______ its goal of raising enough money for the animal shelter.","o":[["A","predicted"],["B","exposed"],["C","accomplished"],["D","located"]],"a":"C","e":"accomplish a goal＝達成目標。"},{"i":"b1839","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The farmer cut down the ______ trees to stop the disease from spreading to the healthy ones.","o":[["A","infected"],["B","alert"],["C","keen"],["D","specific"]],"a":"A","e":"infected trees＝受感染的樹，砍掉是為了不讓病傳到健康的樹。"},{"i":"b1840","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"With the help of a map app, we were able to ______ the tiny noodle shop hidden in the old street.","o":[["A","predict"],["B","infect"],["C","create"],["D","locate"]],"a":"D","e":"locate＝找到……的位置。"},{"i":"b1841","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The police are offering a ______ of $50,000 for any information about the missing child.","o":[["A","prize"],["B","award"],["C","reward"],["D","creation"]],"a":"C","e":"為提供線索、找回東西而給的錢是 reward（a reward of $50,000）。award、prize 是比賽或評選得到的獎。"},{"i":"b1842","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Weather experts ______ that the typhoon will hit northern Taiwan this weekend.","o":[["A","assign"],["B","predict"],["C","perform"],["D","expose"]],"a":"B","e":"predict that S＋V＝預測……。"},{"i":"b1843","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Parents should not ______ young children to violent video games.","o":[["A","expose"],["B","detect"],["C","manage"],["D","reward"]],"a":"A","e":"expose sb. to sth.＝讓某人接觸某事物。"},{"i":"b1844","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Each student was ______ a different topic for the oral report next week.","o":[["A","located"],["B","predicted"],["C","assigned"],["D","infected"]],"a":"C","e":"assign sb. sth. 改成被動：sb. be assigned sth.＝某人被分配到某事。"},{"i":"b1845","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Please give me a ______ reason for being late. \"I was busy\" is too general.","o":[["A","special"],["B","specific"],["C","sensible"],["D","keen"]],"a":"B","e":"後句說 \"I was busy\" 太籠統，所以要的是「具體、特定的」理由，用 specific。special 是「特別的」。"},{"i":"b1846","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Rescue dogs are trained to bark as an ______ when they find someone trapped under a fallen building.","o":[["A","item"],["B","ability"],["C","behavior"],["D","alert"]],"a":"D","e":"as an alert＝作為警示。"},{"i":"b1847","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"The puppy's strange ______, such as refusing to eat and hiding under the bed, worried its owner.","o":[["A","behavior"],["B","reward"],["C","location"],["D","disease"]],"a":"A","e":"拒吃、躲起來都是「行為」behavior。"},{"i":"b1848","s":"英文","u":"L4 綜合","t":"L4 綜合-綜合","k":"s","q":"Once the project is ______, the whole team will celebrate with a big dinner.","o":[["A","se
