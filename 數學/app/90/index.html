<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>二段九十練習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<script>
window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code','input']},
startup:{typeset:false,ready:function(){MathJax.startup.defaultReady();MathJax.startup.promise.then(function(){window.__mj=true;document.dispatchEvent(new Event('mjready'))})}}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.min.js" async></script>
<style>
/* layout: 單欄考卷寬（860px）。首頁＝今日任務＋八科卡片格；作答頁＝進度點＋題卡＋貼底動作列。所有進度都畫一條 90 分紅線；科目用印章式的單字標記分色。 */
:root{
  --bg:#eef1f6; --sheet:#ffffff; --ink:#152033; --ink2:#4d586e; --line:#d3d9e5; --soft:#e8ecf4;
  --pen:#1b3fa6; --pen-soft:#e2e9fb; --on-pen:#ffffff;
  --ok:#0c7446; --ok-soft:#dcf2e6; --bad:#c01f2b; --bad-soft:#fbe3e4; --warn:#8f5b00; --warn-soft:#fbeed0;
  --s0:#1b3fa6; --s0s:#e2e9fb; --s1:#a3312b; --s1s:#f8e4e2; --s2:#0b6b6b; --s2s:#d9f0ef; --s3:#6f3a9c; --s3s:#eee3f8;
  --s4:#2a742a; --s4s:#dff1df; --s5:#94580a; --s5s:#f7ead2; --s6:#6a4a2c; --s6s:#efe5da; --s7:#0a5c88; --s7s:#dbeaf5;
  --sj:var(--pen); --sjs:var(--pen-soft);
  --disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --sheet:#171c27; --ink:#e6eaf2; --ink2:#a2acc0; --line:#2c3446; --soft:#1f2634;
  --pen:#93abff; --pen-soft:#1c2748; --on-pen:#0e121a;
  --ok:#52d196; --ok-soft:#113223; --bad:#ff7f86; --bad-soft:#3a171b; --warn:#f1bb58; --warn-soft:#382c10;
  --s0:#93abff; --s0s:#1c2748; --s1:#ff9a92; --s1s:#3a1c1a; --s2:#5fd4d1; --s2s:#0f3030; --s3:#c9a0f0; --s3s:#2b1c3d;
  --s4:#7ed87e; --s4s:#153015; --s5:#f0b860; --s5s:#382a0f; --s6:#d6b08a; --s6s:#2f2418; --s7:#7cc4ee; --s7s:#10293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --sheet:#171c27; --ink:#e6eaf2; --ink2:#a2acc0; --line:#2c3446; --soft:#1f2634;
  --pen:#93abff; --pen-soft:#1c2748; --on-pen:#0e121a;
  --ok:#52d196; --ok-soft:#113223; --bad:#ff7f86; --bad-soft:#3a171b; --warn:#f1bb58; --warn-soft:#382c10;
  --s0:#93abff; --s0s:#1c2748; --s1:#ff9a92; --s1s:#3a1c1a; --s2:#5fd4d1; --s2s:#0f3030; --s3:#c9a0f0; --s3s:#2b1c3d;
  --s4:#7ed87e; --s4s:#153015; --s5:#f0b860; --s5s:#382a0f; --s6:#d6b08a; --s6s:#2f2418; --s7:#7cc4ee; --s7s:#10293a; color-scheme:dark}
.sj-0{--sj:var(--s0);--sjs:var(--s0s)}.sj-1{--sj:var(--s1);--sjs:var(--s1s)}.sj-2{--sj:var(--s2);--sjs:var(--s2s)}.sj-3{--sj:var(--s3);--sjs:var(--s3s)}
.sj-4{--sj:var(--s4);--sjs:var(--s4s)}.sj-5{--sj:var(--s5);--sjs:var(--s5s)}.sj-6{--sj:var(--s6);--sjs:var(--s6s)}.sj-7{--sj:var(--s7);--sjs:var(--s7s)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.seal{flex:none;font:900 19px/1 var(--disp);color:var(--bad);border:2.5px solid var(--bad);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;transform:rotate(-8deg)}
.brand-t{font:700 17px/1.2 var(--disp);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.count b{color:var(--bad);font:900 18px/1 var(--disp);margin:0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 14px;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--sj)}
.chip[aria-current="true"]{background:var(--sj);border-color:var(--sj);color:var(--on-pen);font-weight:700}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.chip .dot.ok{background:var(--ok)}.chip .dot.near{background:var(--warn)}.chip .dot.low{background:var(--bad)}
.chip[aria-current="true"] .dot{outline:2px solid var(--sheet)}
.focus .chips{display:none}

/* 基本 */
main.wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:18px;min-height:64vh}
h1{font:900 28px/1.35 var(--disp);margin:0;text-wrap:balance}
h2{font:700 19px/1.4 var(--disp);margin:0 0 6px;text-wrap:balance}
h3{font:700 17px/1.5 var(--body);margin:16px 0 4px}
h4{font:700 15px/1.5 var(--body);margin:10px 0 2px;color:var(--ink2)}
p{margin:6px 0}
.muted{color:var(--ink2);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.eyebrow,.sec-h{font:700 12.5px/1.2 var(--body);letter-spacing:.14em;color:var(--sj);margin:0 0 8px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.page{display:flex;flex-direction:column;gap:18px;min-width:0}
.page section.card{scroll-margin-bottom:96px;scroll-margin-top:110px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 18px;font-weight:500;min-height:44px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--pen);color:var(--pen)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen);font-weight:700}
.btn.primary:hover:not(:disabled){color:var(--on-pen);filter:brightness(1.1)}
.btn.sm{padding:4px 13px;min-height:34px;font-size:14px;border-radius:8px}
.btn.link{border:0;background:none;color:var(--pen);padding:4px 2px;min-height:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:700;line-height:1.85;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.near{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--bad-soft);color:var(--bad)}.pill.none{background:var(--soft);color:var(--ink2)}.pill.pen{background:var(--pen-soft);color:var(--pen)}
.seal2{flex:none;width:42px;height:42px;border-radius:9px;border:2px solid var(--sj);background:var(--sjs);color:var(--sj);display:grid;place-items:center;font:900 21px/1 var(--disp)}
.seal2.sm{width:30px;height:30px;font-size:15px;border-radius:7px;border-width:1.5px}
.seal2.lg{width:56px;height:56px;font-size:28px;border-radius:12px}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:8px;padding:0 14px;font:900 21px/1.6 var(--disp);letter-spacing:.22em;text-indent:.22em;transform:rotate(-6deg)}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}

/* 90 分線 */
.meter{display:block;position:relative;height:9px;background:var(--soft);border-radius:5px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--pen)}
.meter i.ok{background:var(--ok)}.meter i.low{background:var(--bad)}.meter i.near{background:var(--warn)}
.meter::after{content:"";position:absolute;left:90%;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:var(--line);stroke-width:8}
.rp{fill:none;stroke:var(--pen);stroke-width:8;stroke-linecap:round}
.rp.ok{stroke:var(--ok)}.rp.near{stroke:var(--warn)}.rp.low{stroke:var(--bad)}.rp.none{stroke:none}
.rk{fill:none;stroke:var(--bad);stroke-width:2.5}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c b{font:900 32px/1 var(--disp)}
.ring-c span{font-size:11.5px;color:var(--ink2)}

/* 首頁 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.hero-main{min-width:0}
.hero>.muted{grid-column:1/-1;margin:0}
.hero h1{font-size:30px}
.hn{color:var(--bad);font-size:1.5em;line-height:1;margin:0 .06em}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task-t{min-width:0;flex:1}
.task-t b{display:block;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:840px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}}
.scard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.scard:hover{border-color:var(--sj)}
.sc-h{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sc-name{font:700 19px/1.3 var(--disp)}
.scard .meter,.scard .sc-info{grid-column:1/3}
.sc-info{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 12px}
.lrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;flex-wrap:wrap}
.lrow.first,.lrow:first-child{border-top:0}
.lrow .lt{font-weight:700;min-width:0}
button.lrow:hover .lt{color:var(--pen)}

/* 科目頁 */
.shead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shead-m{min-width:0;flex:1}
.pstep{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.pstep:first-of-type{border-top:0}
.pno{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--soft);color:var(--ink2)}
.pstep.next .pno{background:var(--sj);color:var(--on-pen)}
.pstep.done .pno{background:var(--ok-soft);color:var(--ok)}
.pstep.done .pt b{color:var(--ink2);font-weight:500}
.pt{min-width:0;flex:1}
.pt b{display:block;line-height:1.45}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 16px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--sj);border-bottom-color:var(--sj)}
.uchip{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:7px 13px;text-align:left;font-size:15px;line-height:1.4}
.uchip small{display:block;color:var(--ink2);font-size:12px}
.uchip[aria-pressed="true"]{border-color:var(--sj);background:var(--sjs)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 18px;border-left:1px solid var(--line);min-height:40px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--on-pen);font-weight:700}

/* 作答 */
.rbar{display:flex;gap:10px;align-items:center}
.dots{display:flex;gap:4px}
.dots i{flex:1;max-width:48px;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--pen)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pen)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--ink2)}
.ctx{background:var(--soft);border-radius:10px;padding:12px 16px;font-size:15px}
.stem{font-size:17.5px;line-height:1.9;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:11px 14px;width:100%;line-height:1.7;overflow-wrap:anywhere;min-height:50px}
.opt .lab{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .txt{min-width:0;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--pen);background:var(--pen-soft)}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.opt.sel .lab{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lab{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lab{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default;color:inherit}
.opt.dim{opacity:.62}
.fb{border-radius:10px;padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;scroll-margin-bottom:96px;scroll-margin-top:96px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .verdict{font-weight:700;font-size:17px}
.fb.good .verdict{color:var(--ok)}.fb.bad .verdict{color:var(--bad)}
.diag{background:var(--sheet);border:1px dashed var(--bad);border-radius:8px;padding:8px 12px}
.diag-l{display:block;font:700 12px/1.4 var(--body);letter-spacing:.12em;color:var(--bad)}
.hintbox{border:1px dashed var(--pen);border-radius:10px;padding:12px 14px;background:var(--pen-soft)}
.actbar{position:sticky;bottom:0;z-index:5;margin-top:-6px;background:var(--bg);border-top:1px solid var(--line);padding-block:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actbar-in{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.actbar .btn.primary{flex:1 1 180px;max-width:320px}
.score{font:900 54px/1.05 var(--disp)}
.score small{font-size:20px;margin-left:4px}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}

/* 筆記與教學 */
.co{border-left:4px solid var(--pen);background:var(--pen-soft);border-radius:0 10px 10px 0;padding:10px 16px;margin:12px 0}
.co-warning{border-left-color:var(--bad);background:var(--bad-soft)}
.co-t{font-weight:700}
.co ul,.notes ul{margin:4px 0;padding-left:1.3em}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;white-space:nowrap}
mark{background:var(--warn-soft);color:inherit;padding:0 2px}
code{font-family:var(--mono);background:var(--soft);padding:0 4px;border-radius:4px;font-size:.92em}
.stepper{display:flex;gap:6px}
.stepper span{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink2);padding:6px 4px;border-bottom:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper span.on{color:var(--sj);border-bottom-color:var(--sj)}
.stepper span.done{color:var(--ok);border-bottom-color:var(--ok)}
.plain{font-size:17px;line-height:1.9}
.stepno{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sj);color:var(--on-pen);display:grid;place-items:center;font-size:13px;font-weight:700}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.step.first,.step:first-child{border-top:0}
.step .why{color:var(--ink2);font-size:14px}
.qc{border-top:1px solid var(--line)}
.qc-h{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 2px;flex-wrap:wrap}
.qc-h:hover b{color:var(--pen)}
.qc-b{padding:0 2px 14px}

/* 單字 */
.vcard{border:2px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center;background:var(--sheet);min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.vword{font:700 34px/1.2 var(--body);overflow-wrap:anywhere}
.vzh{font:700 25px/1.35 var(--disp)}
.vhint{font:500 22px/1.4 var(--mono);letter-spacing:.14em}
.spell{font:500 24px/1.3 var(--mono);flex:1 1 220px;min-width:0;max-width:420px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sheet);color:var(--ink);text-align:center}
.spell:focus{border-color:var(--pen);outline:none}
.diff{font:500 22px/1.5 var(--mono)}
.diff b{color:var(--bad);text-decoration:underline}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:4px 14px;font-size:14px}
.wl div{display:flex;gap:6px;align-items:baseline;min-width:0;border-bottom:1px dotted var(--line)}
.wl b{white-space:nowrap}.wl span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.bx.b1{background:var(--bad)}.bx.b2{background:var(--warn)}.bx.b3{background:var(--ok)}

/* 紀錄 */
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;position:relative;border-bottom:1px solid var(--line)}
.spark i{flex:1;max-width:20px;background:var(--pen);border-radius:2px 2px 0 0;min-height:2px}
.spark i.ok{background:var(--ok)}.spark i.low{background:var(--bad)}
.spark::after{content:"90";position:absolute;left:0;right:0;bottom:90%;border-top:1px dashed var(--bad);font-size:10px;color:var(--bad);text-align:right;line-height:0}
.foot{border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
.foot-in{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;padding-block:12px}

.chart .ax{fill:var(--ink);font-size:12px}.chart .tick{fill:var(--ink2);font-size:10px}.chart .tick.ref{fill:var(--bad)}
.chart .val{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}.chart .na{fill:var(--ink2);font-size:10px}
.chart .sr-site{fill:var(--pen);fill-opacity:.14;stroke:var(--pen);stroke-width:2;stroke-linejoin:round}
.chart .sr-paper{fill:none;stroke:var(--ink2);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}

.chart .bar-site{fill:var(--pen)}.chart .bar-paper{fill:url(#hatch);stroke:var(--ink2);stroke-width:1}
.chart .hatch-bg{fill:var(--soft)}.chart .hatch-ln{stroke:var(--ink2);stroke-width:2}
.chart .hit:hover rect,.chart .hit:hover circle{opacity:.8}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2);margin:4px 0 6px}
.lgd span{display:inline-flex;align-items:center;gap:6px}.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.sw-site{background:var(--pen)}.sw-paper{background:repeating-linear-gradient(45deg,var(--ink2) 0 2px,var(--soft) 2px 5px);border:1px solid var(--ink2)}
.sw-90{height:0;border-top:2px dashed var(--bad);border-radius:0}
.seg-wrap .seg{flex-wrap:wrap}
td.good{color:var(--ok);font-weight:600}
.chart .val{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.chart .ax.off{fill:var(--ink2);opacity:.55}

選名單中婦女不得少於二分之一"],["D","分配結果依各政黨區域立委的當選席次決定"]],"a":"C"},{"i":"b47","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國直轄市議員、縣市議員的選舉，多採一個選區選出數名、每位選民只投一票的制度。此制度稱為：","o":[["A","單一選區相對多數制"],["B","政黨比例代表制"],["C","兩輪投票制"],["D","複數選區單記不可讓渡投票制"]],"a":"D"},{"i":"b48","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"某政黨在應選 5 席的縣議員選區推出 3 名候選人，選前透過簡訊請支持者「依身分證末碼分配投票對象」。該政黨採取此一做法的主要原因是：","o":[["A","選民可以把一票分給同黨數名候選人"],["B","同黨候選人會互相瓜分選票，票源分配不均可能導致全部落選"],["C","該選區採政黨比例代表制，須先確定政黨票數"],["D","法律規定政黨必須公告配票方式"]],"a":"B"},{"i":"b49","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"關於單一選區相對多數制的影響，下列敘述何者正確？","o":[["A","投給落選人的選票不會造成浪費"],["B","席次比例與得票比例大致相符"],["C","有利於大黨，容易形成兩大黨競爭的局面"],["D","小黨只要得票率達百分之五即可分得席次"]],"a":"C"},{"i":"b50","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"我國立法委員選舉採單一選區兩票制，其席次計算方式與德國不同。關於我國所採的「並立制」，下列敘述何者正確？","o":[["A","政黨票決定該黨在立法院的總席次"],["B","區域席次與不分區席次分開計算後相加"],["C","區域當選席次不足時，由政黨名單補足"],["D","比例代表性較聯立制更高"]],"a":"B"},{"i":"b51","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某州執政黨在重劃選區時，刻意把反對黨的支持者平均打散到各個選區，使其在每一選區都無法過半。此種操作稱為：","o":[["A","棄保效應"],["B","配票"],["C","傑利蠑螈"],["D","門檻效應"]],"a":"C"},{"i":"b52","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"關於我國公職人員的參選與投票年齡，下列敘述何者正確？","o":[["A","年滿 18 歲即可投票選舉立法委員"],["B","年滿 20 歲且在選區繼續居住 4 個月以上，始得行使該選區的選舉權"],["C","年滿 20 歲即可登記為縣市長候選人"],["D","民法已將成年年齡下修為 18 歲，選舉權年齡亦隨之改為 18 歲"]],"a":"B"},{"i":"b53","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"下列關於罷免與彈劾的比較，何者正確？","o":[["A","罷免追究政治責任，彈劾追究違法失職的法律責任"],["B","兩者都必須證明當事人有違法失職的事實"],["C","罷免由監察院提案，彈劾由選民投票決定"],["D","兩者的對象都限於民選公職人員"]],"a":"A"},{"i":"b54","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某立法委員的選區選舉人總數為 20 萬人。依現行公職人員選舉罷免法，下列關於罷免該名立委的敘述，何者正確？","o":[["A","提議人數須達 2 萬人"],["B","罷免投票須有二分之一以上選舉人投票才算成立"],["C","同意票須達 10 萬票以上才能通過"],["D","連署人數須達 2 萬人"]],"a":"D"},{"i":"b55","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"關於罷免的限制，下列敘述何者正確？","o":[["A","公職人員就職未滿一年者，不得罷免"],["B","罷免案一旦被否決，半年後可再提出"],["C","罷免須經法院裁定後才能舉行投票"],["D","不分區立法委員亦得由原選區選民罷免"]],"a":"A"},{"i":"b56","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"下列何者**不得**作為全國性公民投票的提案事項？","o":[["A","法律的複決"],["B","重大政策的創制或複決"],["C","預算、租稅、薪俸及人事事項"],["D","立法原則的創制"]],"a":"C"},{"i":"b57","s":"公民","u":"第3課","t":"3-公投事項","k":"s","q":"關於我國全國性公民投票，下列敘述何者正確？","o":[["A","投票權人年滿 20 歲"],["B","有效同意票多於不同意票，且達投票權人總額四分之一以上即通過"],["C","自 2021 年起與全國性選舉同日舉行"],["D","通過後須再經立法院同意始生效力"]],"a":"B"},{"i":"b58","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"關於憲法修正案的複決，下列敘述何者正確？","o":[["A","人民得直接提出憲法修正案，交由公民複決"],["B","複決門檻與一般公民投票相同，均為投票權人總額四分之一"],["C","經立法院三分之一出席、出席委員過半數決議即可提案"],["D","僅立法院得提出憲法修正案，經公告半年後交由公民複決"]],"a":"D"},{"i":"b59","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"關於請願與集會遊行，下列敘述何者正確？","o":[["A","人民得就審判中的個案向法院請願，要求改判"],["B","請願的對象限於行政機關，不包括民意機關"],["C","集會遊行屬於憲法保障的表意自由，但不得妨害他人權利與公共安全"],["D","集會遊行一律無須事先申請"]],"a":"C"},{"i":"b60","s":"公民","u":"第3課","t":"第3課-綜合","k":"s","q":"甲團體長期倡議修改《勞動基準法》，並在選舉期間公開表態支持特定候選人，但不推派人選參選；乙組織則提名候選人參與各級選舉，爭取執政。關於甲、乙的性質，下列敘述何者正確？","o":[["A","甲為利益團體，乙為政黨"],["B","甲為政黨，乙為利益團體"],["C","兩者都是政黨，差別只在規模"],["D","兩者都是利益團體，差別只在議題"]],"a":"A"},{"i":"b61","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"某研究指出，偏鄉居民、身心障礙者與新住民的政治參與率明顯偏低。下列何者最能回應此一「參與不平等」的問題？","o":[["A","提高罷免案的連署門檻"],["B","限制利益團體遊說，避免資源集中"],["C","提高不分區立委的政黨門檻"],["D","提供多語選舉公報、無障礙投票設施與交通協助"]],"a":"D"},{"i":"b62","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市政府針對河川整治，邀請環保團體、沿岸社區居民與相關企業共同開會研商方案，並將會議紀錄公開於網站。此一做法最符合下列何種概念？","o":[["A","由上而下的統治"],["B","多元社會的同化"],["C","多方參與的治理"],["D","行政一體的集權"]],"a":"C"},{"i":"b63","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"政府將各部會預算書、決算書公開於網站供民眾查閱。此一制度最直接體現民主治理的哪一項核心概念？","o":[["A","透明"],["B","回應"],["C","法治"],["D","參與"]],"a":"A"},{"i":"b64","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"下列何者屬於「垂直課責」的機制？","o":[["A","立法院刪減行政院所提預算"],["B","監察院對失職公務員提出彈劾"],["C","審計部審核政府決算"],["D","選民以投票使執政黨下台"]],"a":"D"},{"i":"b65","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"下列何者屬於「水平課責」的機制？","o":[["A","媒體以調查報導揭露弊案"],["B","憲法法庭宣告法律違憲"],["C","民間團體發布施政評鑑報告"],["D","選民連署發動罷免案"]],"a":"B"},{"i":"b66","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某報社長期追蹤報導政府採購弊案，促使檢調單位展開調查。此屬於下列何種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","司法課責"]],"a":"C"},{"i":"b67","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校教師評審委員會審查甲教師的申訴案時，與甲有親屬關係的委員主動迴避，並在作成決定前通知甲到場陳述意見。此一程序最符合下列何者？","o":[["A","分配正義"],["B","匡正正義"],["C","實質平等"],["D","程序正義"]],"a":"D"},{"i":"b68","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列關於正義類型的敘述，哪些正確？","o":[["A","累進稅率屬於分配正義的設計"],["B","冤獄賠償與國家賠償屬於匡正正義"],["C","審查委員利益迴避屬於分配正義"],["D","分配正義處理的是資源、機會與負擔如何分配"],["E","匡正正義關心的是決定過程是否公開透明"]],"a":"ABD"},{"i":"b69","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"關於形式平等與實質平等，下列敘述哪些正確？","o":[["A","所有考生使用同一份試卷，屬於形式平等"],["B","身心障礙考生延長作答時間，屬於合理的差別待遇"],["C","合理的差別待遇必須有正當目的，且手段與目的間具有合理關聯"],["D","只要是差別待遇，都構成歧視"],["E","原住民族升學優待與身心障礙者定額進用，都屬於積極平權措施"]],"a":"ABCE"},{"i":"b70","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"關於公平正義的不同立場，下列敘述哪些正確？","o":[["A","效益主義以整體幸福最大化作為判斷標準"],["B","自由至上主義支持國家大幅提高稅率進行重分配"],["C","羅爾斯主張在無知之幕後設計制度"],["D","羅爾斯的差異原則主張，不平等必須對處境最不利者最有利"],["E","民主社會處理正義衝突時，多數決不得侵害少數者的基本權利"]],"a":"ACDE"},{"i":"b71","s":"公民","u":"第3課","t":"3-選制席次","k":"m","q":"關於我國立法委員選舉制度，下列敘述哪些正確？","o":[["A","選民可投兩票，一票投區域候選人，一票投政黨"],["B","原住民立委 6 席採複數選區單記不可讓渡投票制"],["C","政黨票得票率未達百分之五者，不分配不分區席次"],["D","區域立委採單一選區相對多數制，一區選出一名"],["E","不分區席次依各政黨區域立委當選人數比例分配"]],"a":"ABCD"},{"i":"b72","s":"公民","u":"第3課","t":"3-門檻數字","k":"m","q":"關於罷免與全國性公民投票，下列敘述哪些正確？","o":[["A","罷免總統、副總統，由原選區選民提議與連署"],["B","罷免的投票權人年齡為 20 歲，公民投票為 18 歲"],["C","罷免與公投的通過，都要求同意票多於不同意票"],["D","罷免須經提議與連署兩階段，才能舉行投票"],["E","公民投票得對憲法修正案進行複決"]],"a":"BCDE"},{"i":"b73","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"關於民主治理與課責，下列敘述哪些正確？","o":[["A","治理強調政府、企業與公民社會共同處理公共問題"],["B","公共政策網路參與平臺（Join）的提案附議制度，體現參與與回應"],["C","參與式預算由行政機關全權決定經費用途"],["D","政府資訊公開是課責的前提，缺乏資訊便難以追究責任"],["E","課責機制包括垂直、水平與社會三種途徑"]],"a":"ABDE"},{"i":"b74","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"依現行規定，下列哪一個政黨**無法**分配不分區席次？","o":[["A","乙黨"],["B","丙黨"],["C","丁黨"],["D","戊黨"]],"a":"D"},{"i":"b77","s":"公民","u":"第3課","t":"3-選制席次","k":"s","q":"若我國改採德國式的聯立制，下列推論何者最合理？","o":[["A","政黨票將只用於決定不分區席次"],["B","政黨票將決定各政黨在國會的總席次，區域當選者先行計入"],["C","區域立委將改由政黨名單產生"],["D","不分區席次的婦女保障名額將因此取消"]],"a":"B"},{"i":"b81","s":"公民","u":"第3課","t":"3-門檻數字","k":"s","q":"綜合兩則資料，下列敘述何者最恰當？","o":[["A","罷免與公投的通過門檻，分母都是實際投票人數"],["B","罷免與公投都設有投票率門檻，未達門檻即不通過"],["C","罷免與公投都要求同意票多於不同意票，並另設最低同意票數"],["D","罷免案的門檻高於憲法修正案的複決門檻"]],"a":"C"},{"i":"b162","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市政府為整治市區河濱，邀請社區發展協會、在地企業與學校共同規劃，並開放居民提案、票選優先施作的區段。此做法最能體現下列哪一項概念？","o":[["A","由政府由上而下下達命令的統治"],["B","以市場機制取代政府的角色"],["C","政府、企業與公民社會協力處理公共問題的治理"],["D","由專家單獨決定政策的菁英決策"]],"a":"C","e":"政府、企業、學校與居民一起規劃、提案、票選，是多元行動者協力的治理，不是由上而下的統治。","d":1},{"i":"b163","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣政府將所有採購案的決標金額與得標廠商名單上網公告，供民眾隨時查詢。此做法最直接落實民主治理的哪一項核心概念？","o":[["A","透明"],["B","回應"],["C","法治"],["D","效率"]],"a":"A","e":"把資訊公開讓民眾查詢，是透明；透明也是課責的前提。","d":1},{"i":"b164","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某國最近爆發食安問題，輿論認為主管機關管理監督不周，嚴重失職，強烈要求主責的閣揆應該下台。依據我國政府體制，若上述事件發生在我國，國會可行使下列何項職權加以課責？","o":[["A","質詢與調查後對該首長提出罷免案"],["B","凍結行政預算並重新任命行政首長"],["C","對該首長進行失職調查並提出彈劾"],["D","對失職的行政首長提出不信任投票"]],"a":"D","e":"我國立法院可對行政院院長提出不信任案。罷免由選民提出；彈劾是監察院的職權；行政院院長由總統任命。","r":"114 學測社會第 2 題","d":1},{"i":"b165","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"監察院對違法失職的部會首長提出彈劾，屬於下列哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","市場課責"]],"a":"B","e":"政府機關之間互相監督是水平課責；人民透過選舉、罷免追究是垂直課責。","d":1},{"i":"b166","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"我國政府機關曾因新冠肺炎疫情將土地徵收審議小組等實體審查會議改為線上舉行。有學者批評若無相關配套，恐嚴重侵害民眾權利，尤其偏鄉民眾、長者及經濟處境不利群體的需求較難被重視。以下哪項情況和該學者的批評最相關？","o":[["A","從實體轉為線上討論，讓科技業者從中不當獲利"],["B","民眾間存在數位落差，易造成參與線上討論門檻"],["C","辦理線上審查會議時，容易造成個人資訊的外洩"],["D","社會議題有其複雜度，處境不利者缺乏討論動機"]],"a":"B","e":"偏鄉民眾、長者不一定有設備或能力上線，數位落差提高了參與門檻。","r":"111 分科公民與社會第 3 題","d":1},{"i":"b167","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某國連續發生磯釣客遭海浪捲走的憾事。該國主管機關旋即逕自在海岸設立告示牌，內容如下：「本區禁止釣魚及水上活動，違者將視違反行為之情節輕重處以不同罰鍰」，遂引發某公民團體不滿。該團體提出質疑：民主國家的人民，卻僅能在政府核准的前提下始得進行水上活動，此作法違反民主治理原則。針對該公民團體的質疑，該國政府事前應採取下列哪項作為最適當？","o":[["A","鼓勵民眾提出公民投票案以決定政策方向"],["B","召開公聽會讓各界民眾參與政策制訂過程"],["C","委託專家研究並提出政策制訂的專業建議"],["D","明文公告該政策相當期間後始予正式實施"]],"a":"B","e":"民主治理重視人民在決策前能表達意見，事前召開公聽會讓民眾參與最符合。","r":"114 分科公民與社會第 41 題","d":1},{"i":"b168","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校設立獎助學金，規定依學生家庭收入由低到高依序核發，收入越低者優先獲得。此分配方式主要依據下列哪一項標準？","o":[["A","平等"],["B","貢獻"],["C","需要"],["D","程序"]],"a":"C","e":"誰最缺就先給誰，是依「需要」分配。","d":1},{"i":"b169","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市政府舉辦工程評選，一位評審委員是投標廠商負責人的配偶，卻未迴避且參與評分。此情況最直接違反下列哪一項？","o":[["A","程序正義"],["B","分配正義"],["C","匡正正義"],["D","差異原則"]],"a":"A","e":"有利害關係卻不迴避，違反程序正義的利益迴避要求。","d":1},{"i":"b170","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某國研究指出：障礙兒童就學期間鮮少參與畢業旅行，因為學校規劃畢旅時，常習慣性略過討論障礙兒童需要的支持措施，而障礙兒童也少有參與意願。從社會規範之作用來檢視此現象，下列敘述何者最適切？","o":[["A","將障礙兒童的不願參與視為理所當然，將限縮其自我發展"],["B","校方未能輔導障礙兒童提升人際互動之自信心，顯有失職"],["C","若校方強迫障礙兒童須參加畢旅，反而未能尊重其自主性"],["D","學校未提供畢業旅行替代選項，已構成對障礙兒童的歧視"]],"a":"A","e":"把障礙兒童「不想參加」當成理所當然，是社會規範讓他們的發展機會被限縮。","r":"113 分科公民與社會第 1 題","d":1},{"i":"b171","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據題文，該國政府採取的措施及所欲達成的目標，最適合以下列哪項論述加以闡釋？","o":[["A","透過政策措施提升原住民族的經濟處境"],["B","藉由修正制度設計以落實平等公民權利"],["C","減少族群間的學歷落差以拉近族群隔閡"],["D","強化原住民族教育以保障少數族群文化"]],"a":"B","c":"某國一份研究報告顯示，過去該國原住民族具有高等教育學歷的比例，明顯低於非原住民，最主要是受到早期許多不利於原住民族的社會、經濟及文化因素所導致。後來該國政府修正制度，針對原住民族設置外加錄取保障名額，且這些名額不會影響其他非原住民學生。該國有學者撰文評論上述政策，文中指出：政府推動該項政策，長期而言，可增強該族群成員的自信心，建立正面的自我形象，有助於扭轉該族群的不利處境。","e":"外加名額是為了讓起點不利的群體得到真正公平的機會，屬於落實平等的制度設計。","r":"114 分科公民與社會第 13、14 題","d":1},{"i":"b172","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"學者對該項升學制度政策的評論，其所反映之價值理念與下列哪項主張最接近？","o":[["A","提供身心障礙生個別化教育計畫與資源，降低障礙處境對其學習的影響"],["B","求學生涯中經常獲得數理老師鼓勵的學生，未來更有機會選擇理工領域"],["C","實施肯認多元身分以吸引優秀人才的政策，有助於提升國家整體競爭力"],["D","為維護國民教育機會平等，可對任教偏鄉的老師提供較高薪資補貼誘因"]],"a":"A","c":"某國一份研究報告顯示，過去該國原住民族具有高等教育學歷的比例，明顯低於非原住民，最主要是受到早期許多不利於原住民族的社會、經濟及文化因素所導致。後來該國政府修正制度，針對原住民族設置外加錄取保障名額，且這些名額不會影響其他非原住民學生。該國有學者撰文評論上述政策，文中指出：政府推動該項政策，長期而言，可增強該族群成員的自信心，建立正面的自我形象，有助於扭轉該族群的不利處境。","e":"學者重視的是降低不利處境的影響，與為身心障礙生提供個別化資源的理念相同。","r":"114 分科公民與社會第 13、14 題","d":1},{"i":"b173","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"許多人相信學生成績和家長社經地位具正相關。小辛想驗證此說法，因此蒐集周遭同學成績及相關資料，同時加入「補習」及「家長參與子女教育活動」二項因素一併分析，結果如下表。小辛從表中可得到的最合理推論為何？\n\n| 學生成績依表現分組 | 補習科目數 | 家長參與子女教育 | 家長社經地位 |\n|---|---|---|---|\n| 優異 | 少 | 積極 | 高 |\n| 中上 | 適中 | 積極 | 中 |\n| 普通 | 偏多 | 普通 | 高 |\n| 不佳 | 多 | 很少 | 低 |","o":[["A","不論家長社經地位為何，補習越多越能提升學生的成績表現"],["B","家長對子女教育活動的參與，對子女學業成績影響相當有限"],["C","家長社經地位較高，會促使其子女學業成績表現也較為優異"],["D","高社經地位的家長若較少參與子女教育活動仍不利子女學業"]],"a":"D","e":"「普通」組的家長社經地位高，但參與子女教育只是普通，成績也普通，表示參與程度很重要。","r":"112 分科公民與社會第 2 題","d":1},{"i":"b174","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某民主國家為舉辦國際級運動會，決定在首都興建全新的大型主場館，場館預定地內的一座社會住宅因而須強制拆除。該社宅的居民大多是高齡人士，且該國政府並未提出合宜的安置計畫，許多居民因而拒絕搬遷。此社會住宅拆遷爭議，若以社會階層化的觀點而言，與下列哪個情境最接近？","o":[["A","某社區因人口外流與高齡化，商店街爆發倒閉潮，失業者發動集體抗議"],["B","某老舊眷村面臨文資保存議題，市政府未取得住戶共識即強行拆除屋舍"],["C","某捷運預定路線將行經貧民區，未先與該地的居民溝通便著手進行施作"],["D","某地區因鄰近機場故承受起降噪音與其他限制，卻未獲政府發予回饋金"]],"a":"C","e":"弱勢的高齡居民在缺乏溝通與安置下被迫承擔開發代價；施作經過貧民區卻未溝通的情境最相近。","r":"112 分科公民與社會第 27 題","d":1},{"i":"b175","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"各國皆有老年犯罪現象，據媒體報導，有些高齡犯罪者因貧窮無法養活自己，或因其他社會、經濟原因流落街頭，迫使他們以犯罪換取監獄的免費生活與照顧。某學者指出，此犯罪現象的出現，印證某學派的主張：社會結構之運作往往偏向維護優勢群體利益，忽略處境不利群體需求，使其處境更惡化。下列何者最可能是該學者引用之學派特別重視的主張？","o":[["A","能力屬弱勢之群體，往往在社會競爭中落入不利處境"],["B","市場競爭有助提升動機，將促使能力較佳者更有成就"],["C","確保才能優異者獲得高報酬工作，始可促進社會發展"],["D","看似合理的社會資源分配，常潛藏機會的壟斷與排除"]],"a":"D","e":"該學派認為社會結構偏向優勢群體，看似合理的分配其實排除了處境不利者。","r":"113 分科公民與社會第 17 題","d":1},{"i":"b176","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"小安主張：「社會可以容許貧富差距存在，但前提是這些差距必須能讓社會中處境最不利的人獲得最大的利益。」小安的主張最接近下列何者？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的差異原則"],["D","形式平等"]],"a":"C","e":"允許不平等，但必須讓最不利者獲得最大利益，是羅爾斯的差異原則。","d":1},{"i":"b177","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"大學入學考試讓視障考生使用點字試卷，並延長作答時間。此措施最能體現下列何者？","o":[["A","形式平等"],["B","實質平等"],["C","匡正正義"],["D","效益主義"]],"a":"B","e":"考量考生的不利處境給予合理差別待遇，是實質平等。","d":1},{"i":"b178","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"我國的《司法院釋字第七四八號解釋施行法》保障同性婚姻，使同性戀者與異性戀者皆擁有結婚的權利。另外，在現行制度下，我國國民的同性伴侶若為外國人，且其所屬國家的法律不承認同性婚姻，則伴侶雙方在我國便無法結婚。因此有公民團體倡議，應進一步修法保障跨國同性伴侶，但這項倡議，也引發不同立場團體的質疑。未來若要透過修法解決同性伴侶跨國婚姻的爭議，下列哪項作法最符合審議民主的精神？","o":[["A","由政府部門邀集學者召開公聽會，彙整學者專業意見與共識作為修法的重要依據"],["B","由公民團體發起公投並舉行辯論會，讓正反立場代表辯論且實況轉播後交付公投"],["C","由大法官以憲法法庭進行言詞辯論後做出憲法裁判，再由立法院依裁判意見修法"],["D","由不同立場的民眾開會並諮詢專家，形成共識結論後交由政府作為修法重要參考"]],"a":"D","e":"審議民主重視不同立場的公民彼此討論、形成共識；(A) 只有學者、(B) 直接投票、(C) 由司法決定，都不是公民審議。","r":"111 分科公民與社會第 20 題","d":1},{"i":"b179","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據題文，該國政府採取哪個方法最有助於解決乙指出的問題？","o":[["A","教育其國民瞭解 AI 潛藏的族群與性別偏頗"],["B","制定嚴格的法規以監管業者使用 AI 的範圍"],["C","發展本國資料庫以提供國際訓練 AI 的數據"],["D","監測及調查國際上 AI 出現歧視該國的頻率"]],"a":"C","c":"人工智慧（簡稱 AI）看似能與人們溝通、提供各種回答，但其運作仰賴大量素材供其學習。若素材本身就有偏頗，AI 的答案就可能強化這些偏頗。例如，因既有科學家圖片幾乎都是白人男性，當 AI 收到「畫出科學家」指令時，就極可能畫出白人男性圖像。\n學者乙指出 AI 的偏頗使某個國家的人民常被視為潛在恐怖分子，以致參加國際活動時受到不公平的對待，甚至失去話語權。\n學者丙認為上述偏頗也會影響司法公正，如法院或行政機關使用 AI 評估受刑人再犯風險，以做出假釋決定，結果顯示 AI 會認定有色人種有更高再犯風險。由於 AI 的訓練資料不公開，外界無法監督，且其演算邏輯不易理解，故難以對評估結果提出質疑。","e":"AI 的偏頗來自訓練資料，提供本國資料讓訓練數據更完整，最能直接改善。","r":"114 學測社會第 43、44 題","d":1},{"i":"b180","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"根據題文，丙對於以 AI 為依據決定是否假釋的疑慮，最可能是基於下列哪一法律原則？","o":[["A","平等原則"],["B","比例原則"],["C","誠實信用原則"],["D","信賴保護原則"]],"a":"A","c":"人工智慧（簡稱 AI）看似能與人們溝通、提供各種回答，但其運作仰賴大量素材供其學習。若素材本身就有偏頗，AI 的答案就可能強化這些偏頗。例如，因既有科學家圖片幾乎都是白人男性，當 AI 收到「畫出科學家」指令時，就極可能畫出白人男性圖像。\n學者乙指出 AI 的偏頗使某個國家的人民常被視為潛在恐怖分子，以致參加國際活動時受到不公平的對待，甚至失去話語權。\n學者丙認為上述偏頗也會影響司法公正，如法院或行政機關使用 AI 評估受刑人再犯風險，以做出假釋決定，結果顯示 AI 會認定有色人種有更高再犯風險。由於 AI 的訓練資料不公開，外界無法監督，且其演算邏輯不易理解，故難以對評估結果提出質疑。","e":"AI 對有色人種給予較高風險評估，是無正當理由的差別對待，違反平等原則。","r":"114 學測社會第 43、44 題","d":1},{"i":"b181","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某網紅在自己的粉絲專頁發起線上投票，結果九成參與者反對某項政策，他據此宣稱「全民都反對」。下列評論何者最適當？","o":[["A","線上投票參與人數多，足以代表全民意見"],["B","只要投票者以實名登入，結果就能代表全民"],["C","參與者多為其粉絲且自願參加，樣本缺乏代表性"],["D","網路投票必然比電話民調更能反映民意"]],"a":"C","e":"自願參加的粉絲樣本不能代表全體民眾。","d":1},{"i":"b182","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲的支持度為 41%，乙為 39%，抽樣誤差為正負 3 個百分點。下列解讀何者正確？","o":[["A","甲已確定領先乙"],["B","乙已確定落後甲 2 個百分點"],["C","兩人差距在誤差範圍內，無法斷定誰領先"],["D","誤差範圍只影響支持度較低的乙"]],"a":"C","e":"兩人差距 2 個百分點，小於誤差範圍，不能斷定領先。","d":1},{"i":"b183","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"媒體「評論事實」功能是指媒體對於新聞事件會提供不同分析觀點，並可能提出相關改善措施，以發揮媒體的公共角色。下列何種情境最能說明媒體此種角色？","o":[["A","媒體連續揭發有毒食品並報導其對人體之傷害，引發各界關注食安議題"],["B","新聞報導英國公投脫離歐盟結果，提供各區域不同年齡之投票率等資訊"],["C","媒體播報土耳其政變消息並報導外交部已因此調升旅遊警示至紅色燈號"],["D","媒體針對年金改革採訪立場相異團體，並探討此改革對國家人民的影響"]],"a":"D","e":"採訪不同立場並分析影響，是提供分析觀點的評論功能；(A) 是揭露、(B)(C) 是報導事實。","r":"110 學測社會第 4 題","d":1},{"i":"b184","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民主國家的知名政治人物甲，參與該國一項選舉以尋求第五次連任。在各項民調中，甲本來皆領先同選區的對手，但對手陣營捏造不實訊息，指控甲涉嫌貪汙與不倫事件，經新聞媒體大肆報導，使甲的支持度急劇下降，最終落選。依據題文，新聞媒體在甲競選過程所扮演的角色，最適合以下列哪項敘述來闡釋？","o":[["A","媒體再現和資訊不對稱是新聞偏頗的根源"],["B","媒體所有權者常使特定政治人物處境不利"],["C","媒體近用機會是影響民意形成的重要因素"],["D","媒體報導特定議題的強度會引導公共意見"]],"a":"D","e":"媒體大量報導不實指控，使支持度急降，說明報導強度會引導公共意見。","r":"114 分科公民與社會第 21 題","d":1},{"i":"b185","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某新聞台連續一週都以同一起校園事件作為頭條，使該事件成為全國熱烈討論的話題。此現象最能說明媒體的哪一種作用？","o":[["A","議題設定"],["B","守門"],["C","框架"],["D","置入性行銷"]],"a":"A","e":"媒體反覆報導使某事件成為大家關心的焦點，是議題設定。","d":1},{"i":"b186","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"同一場罷工，甲報的標題為「勞工團結爭取合理工時」，乙報的標題為「罷工癱瘓交通　民眾怨聲載道」。兩報的差異最能以下列哪一個概念說明？","o":[["A","媒體近用"],["B","媒體框架"],["C","所有權集中"],["D","議題設定"]],"a":"B","e":"同一事件選擇不同角度報導，是框架。","d":1},{"i":"b187","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某移工權益協會倡議合理工時之立法，但一直未獲輿論支持。學者指出，行動成效不彰原因，除記者常引述不實資訊且不理會移工團體澄清之要求外，移工製作的議題短片，也幾乎無媒體頻道可播出。依據前述，倡議行動成效有限的原因最可能為下列何者？","o":[["A","媒體近用權保障未能落實而影響公共意見"],["B","記者偏頗報導使得移工團體飽受輿論指責"],["C","移工缺乏媒體資訊故未能分析政策之影響"],["D","移工群體不具公民身分故無從發揮行動力"]],"a":"A","e":"移工團體無法透過媒體澄清與發聲，是媒體近用權未落實。","r":"111 分科公民與社會第 1 題","d":1},{"i":"b188","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某財團陸續併購多家電視台與報社，學者擔心此現象對公共意見的影響。學者最可能的理由為何？","o":[["A","媒體數量減少，新聞就會更加正確"],["B","財團經營必然提升新聞品質"],["C","報導取向可能趨於一致，壓縮多元觀點"],["D","讀者將因此無法取得任何新聞"]],"a":"C","e":"所有權集中可能使報導取向趨於一致，壓縮多元觀點。","d":1},{"i":"b189","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某新聞節目在報導中刻意安排特定品牌商品入鏡，並以新聞形式介紹其功效，但未揭露其為廣告。此做法最可能屬於下列何者？","o":[["A","媒體近用"],["B","議題設定"],["C","公共新聞"],["D","置入性行銷"]],"a":"D","e":"把廣告包裝成新聞內容且未揭露，是置入性行銷。","d":1},{"i":"b190","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某報記者經過半年調查，揭露某機關的採購弊案，促成檢調偵辦與首長下台。此例最能說明媒體的哪一項角色？","o":[["A","第四權的監督角色"],["B","娛樂大眾的角色"],["C","文化霸權的形成"],["D","媒體壟斷的結果"]],"a":"A","e":"調查報導揭弊、促成課責，是媒體監督三權的第四權角色。","d":1},{"i":"b191","s":"公民","u":"第5課","t":"4-5-讀題","k":"s","q":"下列哪一則網路訊息，最需要先查證再決定是否轉傳？","o":[["A","中央氣象署官網發布的颱風警報"],["B","標題寫著「震驚！喝這個三天就痊癒，快轉給家人」且未註明來源的貼文"],["C","附有原始研究出處與作者的科普文章"],["D","地方政府官方帳號公告的停水通知"]],"a":"B","e":"來源不明、標題聳動、要求快轉，是假訊息的典型特徵。","d":1},{"i":"b192","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某國政府以「打擊假訊息」為由，未經法律授權即要求網路平台刪除批評政府的貼文。依民主法治原則，下列評論何者最適當？","o":[["A","假訊息危害大，政府刪文不必受任何限制"],["B","只要平台同意，政府即可要求刪除任何貼文"],["C","批評政府的言論本來就不受言論自由保障"],["D","處理假訊息應依法進行，不得成為壓制批評的工具"]],"a":"D","e":"打擊假訊息也要依法並兼顧言論自由，不能成為壓制批評的工具。","d":1},{"i":"b193","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調題目為：「您是否支持政府浪費公帑興建大型巨蛋？」此題目最主要的問題為何？","o":[["A","抽樣人數不足"],["B","誤差範圍過大"],["C","題目用字帶有引導性"],["D","調查時間過短"]],"a":"C","e":"「浪費公帑」帶有立場，會引導受訪者回答。","d":1},{"i":"b194","s":"公民","u":"第5課","t":"4-5-讀題","k":"s","q":"某議題剛發生時，多數民眾支持甲方案；一個月後，在更多資訊揭露下，支持乙方案的民眾轉為多數。此現象最能說明公共意見的哪一項特性？","o":[["A","多元"],["B","變動"],["C","強度不同"],["D","必然理性"]],"a":"B","e":"民意隨資訊與事件改變，是變動的特性。","d":1},{"i":"b195","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"某民主國家一些城市政府，開發推動數位民主創新 APP，讓市民可隨時透過 APP，在個資保障下，匿名針對市政府執行的政策進行滿意度評價，並可提出自己的想法，在 APP 平台上相互討論，作為市政府政策檢討與精進的依據。這些城市政府推動前述數位服務，對公民參與可以發揮哪些助益？","o":[["A","完整呈現城市轄區民眾的評價與想法"],["B","有效提升民眾和城市政府的即時互動"],["C","鼓勵民眾透過多元管道積極參與公共事務"],["D","兼顧不同地區與社經背景民眾的參與權益"],["E","降低民眾表達市政建言的顧慮及參與成本"]],"a":"BCE","e":"(A) 使用 APP 的人不一定涵蓋全體市民，不能「完整」呈現；(D) 不熟悉數位工具的群體可能被排除，難以兼顧。","r":"114 分科公民與社會第 27 題","d":1},{"i":"b196","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"某高中老師安排全班同學到音樂廳聆聽交響樂演出。從未去過音樂廳的甲生很緊張，除事前煩惱當天應如何穿著才「得體」外，欣賞過程中也擔心自己表現不適當，連何時該拍手都怕抓錯時機。相對地，乙生因常跟家人購票去音樂廳觀賞演出，故活動過程中從容不迫，事後老師也讚揚乙生舉止優雅、具備良好音樂欣賞素養。若從社會階層化角度分析上述事件中「資本與社會平等」的關係，下列哪些為適當之論點？","o":[["A","即使老師事前提供解說，也難以完全消除同學文化資本的落差"],["B","學生們具備的文化資本高低，決定於教育機構的資源分配多寡"],["C","文化資本的獲取如同習慣養成，會讓學生內化特定的生活風格"],["D","具備豐富文化資本有助於突破階層化現象，進而實現社會平等"],["E","經濟資本有時可轉換為主流認可的文化資本，因而再製不平等"]],"a":"ACE","e":"(B) 文化資本主要來自家庭的長期薰陶，不是只看學校資源；(D) 文化資本的落差反而會再製不平等。","r":"111 分科公民與社會第 29 題","d":1},{"i":"b197","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關民主治理的制度與核心概念的配對，哪些正確？","o":[["A","監察院彈劾違法失職的公務員—垂直課責"],["B","立法院刪減行政部門的預算—社會課責"],["C","《政府資訊公開法》—透明"],["D","行政程序中的聽證—參與"],["E","地方政府辦理參與式預算—參與"]],"a":"CDE","e":"(A) 監察院彈劾是政府機關之間的水平課責；(B) 立法院刪減預算也是水平課責。","d":1},{"i":"b198","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關公平正義的敘述，哪些正確？","o":[["A","冤獄賠償屬於匡正正義"],["B","形式平等一定能讓起點不同的人得到公平的結果"],["C","羅爾斯主張只要社會總效益最大，任何不平等都可以接受"],["D","累進稅率涉及分配正義"],["E","行政機關作成處分前給予當事人陳述意見的機會，屬於程序正義的要求"]],"a":"ADE","e":"(B) 形式平等忽略起點不同；(C) 羅爾斯要求不平等必須對最不利者最有利，「總效益最大」是效益主義。","d":1},{"i":"b199","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關公共意見與民意調查的敘述，哪些正確？","o":[["A","公共意見具有多元、變動的特性"],["B","網路按讚數多，就代表多數民意"],["C","民調題目的用字可能影響受訪者的回答"],["D","兩位候選人的支持度差距在誤差範圍內，不能斷定誰領先"],["E","只要樣本數夠多，抽樣方法就不重要"]],"a":"ACD","e":"(B) 網路聲量大不等於多數民意；(E) 抽樣方法決定樣本是否具代表性，比數量更重要。","d":1},{"i":"b200","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體產製過程的敘述，哪些正確？","o":[["A","框架只影響報導篇幅，不影響閱聽人的看法"],["B","守門人決定哪些訊息能成為新聞"],["C","置入性行銷可提升新聞的客觀性"],["D","媒體所有權集中，可能壓縮多元觀點"],["E","議題設定會影響大眾關心哪些議題"]],"a":"BDE","e":"(A) 框架會影響閱聽人怎麼想；(C) 置入性行銷損害新聞的客觀性。","d":1},{"i":"b201","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體識讀與假訊息的敘述，哪些正確？","o":[["A","只要是親友轉傳的訊息，就可以直接相信"],["B","標題聳動、要求趕快轉傳，是假訊息的常見特徵"],["C","查證時應交叉比對其他來源"],["D","區分事實與意見是媒體識讀的一環"],["E","政府處理假訊息時不必兼顧言論自由"]],"a":"BCD","e":"(A) 親友轉傳也可能是假訊息，仍要查證；(E) 政府處理假訊息必須兼顧言論自由。","d":1},{"i":"b202","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某公民團體每年發布立法委員問政評鑑報告，評比出席率與提案品質，供選民參考。此做法屬於下列哪一種課責？","o":[["A","社會課責"],["B","水平課責"],["C","垂直課責"],["D","不屬於任何課責"]],"a":"A","e":"媒體、公民團體監督政府與民意代表，是社會課責。","d":1},{"i":"b203","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列有關罷免與彈劾的敘述，何者正確？","o":[["A","罷免必須以公職人員違法為前提"],["B","選民可以對市長提出彈劾案"],["C","彈劾是針對違法失職追究法律責任"],["D","監察院可以罷免立法委員"]],"a":"C","e":"彈劾由監察院對違法失職者提出，追究法律責任；罷免由選民提出，不需要對方違法。","d":1},{"i":"b204","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"公共政策網路參與平臺上的提案，在期限內達到附議門檻時，主管機關必須具體回應。此設計最直接體現民主治理的哪一項核心概念？","o":[["A","法治"],["B","透明"],["C","效率"],["D","回應"]],"a":"D","e":"提案達門檻、政府必須回應，是「回應」民意。","d":1},{"i":"b205","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"根據調查，某國人民近年來參與結社比例明顯成長，但整體比例仍偏低，且大多偏向參與宗教團體與校友會。若根據公民社會促進民主政治發展的觀點，下列何者是對該國結社參與的最適切評論？","o":[["A","宗教不該干預政治，因此政府應對宗教團體參與政治予以限制"],["B","若政府能補助與扶植該國結社團體，可有效提升人民參與比例"],["C","校友會是基於參與者的畢業學校而設立，因此不能算志願結社"],["D","該國近年來不僅累積社會資本，公民參與結社技能也可能提升"]],"a":"D","e":"參與結社能累積社會資本、培養公民參與的能力，宗教團體與校友會也屬於志願結社。","r":"110 學測社會第 3 題","d":1},{"i":"b206","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"小艾擔任高中學生會會長，根據相關規定，她得以學生會會長身分，出席校務會議為學生發聲，並擁有表決權。小艾認為這些規定和實踐，展現校園民主精神，因此從未缺席且積極參與。前述校園民主的實踐，與下列哪項政府落實民主治理的理念最相近？","o":[["A","政府機關應對公投案提出意見書，告知人民通過與否的法律效果"],["B","政府計畫在某地興建焚化爐前，於該地舉辦公聽會聽取居民意見"],["C","主管機關建置大專校院校務資訊公開平臺，公布各校新生註冊率"],["D","地方行政首長須定期到議會作施政報告，並接受議員的監督質詢"]],"a":"B","e":"讓利害關係人在決策前表達意見並參與決定，與興建前舉辦公聽會最相近；(D) 是課責。","r":"113 分科公民與社會第 8 題","d":1},{"i":"b207","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某區辦理參與式預算，但參與提案與投票者多為退休長者，年輕上班族與學生很少參加。此現象反映民主治理實踐上的哪一項挑戰？","o":[["A","參與者的代表性不足"],["B","政府資訊不夠透明"],["C","缺乏水平課責機制"],["D","法治原則未落實"]],"a":"A","e":"參與者集中在特定群體，決策就難以代表整體居民，這是參與式治理常見的挑戰。","d":1},{"i":"b208","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"依據題文，部分公民參加會議後的改變，最能反映出此種會議模式與傳統民主制度運作的哪項差異？","o":[["A","以少數服從多數原則達成群體共識"],["B","以多數尊重少數原則避免多數暴力"],["C","以溝通和共識彌補單純的投票表決"],["D","以符合程序正義方式作成民主決定"]],"a":"C","c":"某市政府欲規劃重要的濕地公園，舉辦三場審議會議。會議進行時，專家先報告該濕地相關知識和涉及的各種利益與意見。在討論階段，主持人讓每位參加的公民有相同的發言時間與次數，也提醒大家以平等的稱謂進行交流。部分公民參加審議會議後，改變原本立場；但也有某位參與者批評主持人當時的主持方式，忽略處於不同社會位置對參與者所帶來的影響，有違積極平權理念。","e":"審議會議讓公民透過資訊與討論改變立場，以溝通形成共識，彌補單純投票的不足。","r":"114 分科公民與社會第 15、16 題","d":1},{"i":"b209","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"依據題文，該位公民不滿主持人的主持方式，最可能是基於以下哪項理由？","o":[["A","以平等稱謂進行交流的形式和提醒，無法有效解決權力不對等問題"],["B","參與者對議題的理解程度存在落差，有價值的意見需更多發言時間"],["C","文化資本導致表達和論述能力不同，統一的發言規則難以顧及差異"],["D","參與者的言論自由應獲得平等保障，應讓多元意見皆有表達的機會"]],"a":"C","c":"某市政府欲規劃重要的濕地公園，舉辦三場審議會議。會議進行時，專家先報告該濕地相關知識和涉及的各種利益與意見。在討論階段，主持人讓每位參加的公民有相同的發言時間與次數，也提醒大家以平等的稱謂進行交流。部分公民參加審議會議後，改變原本立場；但也有某位參與者批評主持人當時的主持方式，忽略處於不同社會位置對參與者所帶來的影響，有違積極平權理念。","e":"處境不同的人表達能力不同，形式上相同的發言規則忽略了這種差異，不符積極平權。","r":"114 分科公民與社會第 15、16 題","d":1},{"i":"b210","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某人遭判刑入獄多年後，經再審改判無罪，國家依法給予補償。此做法最能體現下列哪一種正義？","o":[["A","匡正正義"],["B","分配正義"],["C","程序正義"],["D","差異原則"]],"a":"A","e":"對不法侵害給予補償，是匡正正義。","d":1},{"i":"b211","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某學者主張：「個人合法取得的財產應受尊重，國家不應以高額稅負強制重分配。」此主張最接近下列哪一種立場？","o":[["A","自由至上主義"],["B","效益主義"],["C","羅爾斯的平等主義"],["D","多元文化主義"]],"a":"A","e":"重視個人財產、反對國家強制重分配，是自由至上主義。","d":1},{"i":"b212","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市政府評估後決定在郊區興建焚化爐，理由是全市居民獲得的整體效益，大於附近少數居民承受的損失。此決策最符合下列哪一種觀點？","o":[["A","自由至上主義"],["B","羅爾斯的差異原則"],["C","效益主義"],["D","匡正正義"]],"a":"C","e":"以整體效益大於少數人的損失作為判斷，是效益主義。","d":1},{"i":"b213","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某社區以多數決通過「禁止特定宗教團體在社區活動中心聚會」的規約。依民主社會解決公平正義衝突的原則，下列評論何者最適當？","o":[["A","多數決是民主程序，結果必然符合正義"],["B","多數決不能侵害少數者的基本權利"],["C","少數者應服從多數，不得提出救濟"],["D","只要投票率夠高，結果就應被接受"]],"a":"B","e":"多數決不能侵害少數者的宗教自由等基本權利。","d":1},{"i":"b214","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"政府對特定群體給予差別待遇時，下列哪一項條件最能使其成為合理的差別待遇，而非歧視？","o":[["A","具有正當目的，且手段與目的有合理關聯"],["B","只要受益群體的人數夠多"],["C","只要經過行政機關首長同意"],["D","只要差別待遇實施的期間夠短"]],"a":"A","e":"合理的差別待遇要有正當目的，手段與目的之間也要有合理關聯。","d":1},{"i":"b215","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"甲是我國平地原住民，向來關注地方公共事務與原住民族權益保障的議題，並考慮參選立法委員。依現行制度，在全國立委總席次中，平地原住民立委應選名額為 3 席，約占 2.7% 的國會席次，超過我國平地原住民人口占全國人口的比例（約為 1.2%）。我國平地原住民立委應選名額的規劃，最主要是植基於下列哪項人權理念？","o":[["A","保障平地原住民的個人權利"],["B","促進原漢族群間的實質平等"],["C","維護平地原住民的自決權利"],["D","實現不同族群的無差別對待"]],"a":"B","e":"保障名額考量原住民族的不利處境，追求原漢之間的實質平等。","r":"113 分科公民與社會第 20 題","d":1},{"i":"b216","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某國原住民族部落附近有一重大開發案引發地方議論，該部落成員在報紙投書指出：為落實憲法對人民基本權利之保障，政府單位到部落的公有土地從事開發前，應諮商並取得原住民族或部落的同意或參與。從平等原則及人權的觀點檢視該部落成員的投書意見，以下評論何者最適切？","o":[["A","國家應無差別對待全體國民，故不應該採納其意見"],["B","為尊重多元文化與原住民族權利，故應採納其意見"],["C","為落實保障個別原住民的權利，故應該採納其意見"],["D","公有地開發應由全民公投決定，故不應採納其意見"]],"a":"B","e":"原住民族對土地有集體權利，尊重其諮商同意權，符合多元文化與群體權利的保障。","r":"112 分科公民與社會第 14 題","d":1},{"i":"b217","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"19 世紀婦女運動興起時，便訴求女性參政與就業之平等。甲學者提醒，各國重要政治職務（如國會議員等）的性別比率仍是男高於女。為改善此問題，許多國家在各種公職選舉訂定女性保障名額。但乙學者批評保障名額雖增加女性出任公職的機會，卻對未受保障者形成另一種歧視。有人認為乙的批評是對法律上平等原則的誤解，下列何項論述最能反駁乙學者？","o":[["A","立法機關依民主程序議決法律適用於所有人民，即已落實法律上平等原則"],["B","在婦女擁有包括出任公職等選擇職業的自由時，即已落實法律上平等原則"],["C","保障名額制度未直接造成其他性別參選者的不利，不違反法律上平等原則"],["D","制度設計按照性別社會處境的不同給予差別待遇，可實現法律上平等原則"]],"a":"D","e":"依不同處境給予合理差別待遇，正是實質平等的要求，不是歧視。","r":"111 分科公民與社會第 41 題","d":1},{"i":"b218","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"小嘉讀到教育有助階級流動的理論，之後查閱資料時發現，某個經濟起飛國家晚近高等教育人口比例明顯增加，於是主張「該國已突破階級複製成為開放社會」；但小文提出另一份該國資料，質疑小嘉主張難以成立。下列何者最可能是小文的資料？","o":[["A","家庭處境不利的子女甄選入學比例較低，多由筆試取得入學資格"],["B","家庭處境不利的子女就讀大學比例上升，但學費仍多數仰賴補助"],["C","公立大學學生多來自中產階級，且畢業生月收入較私校畢業者高"],["D","公立大學學生多來自中產階級，且其大學國際排名更勝私立大學"]],"a":"C","e":"高等教育擴張但好的公立大學仍由中產階級子女占多數、畢業後收入較高，代表階級仍在複製。","r":"111 分科公民與社會第 2 題","d":1},{"i":"b219","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"在一場社會不平等的研討會中，某非裔學者指出：為抵抗白人的汙名化，許多非裔社會運動者喜歡強調非裔與白人一樣強健、具職場生產力，甚至比白人優秀；但這種強調非裔強健意象的說法，卻讓人們忽略非裔群體中身心障礙者的困境。此學者對不平等的主張最可能是下列何者？","o":[["A","非裔群體的身心障礙者因白人我族中心主義遭受汙名化"],["B","身心障礙者在職場不被接受會導致任何族群皆受到傷害"],["C","媒體常將非裔群體塑造為體育運動細胞發達之刻板印象"],["D","即使同屬非裔群體也可能因為處境不同而形成內在壓迫"]],"a":"D","e":"強調強健意象使群體內部的身心障礙者被忽略，是群體內部處境不同造成的壓迫。","r":"111 分科公民與社會第 5 題","d":1},{"i":"b220","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"以下四段摘要，出自某國一份公民會議實施狀況的研究報告：\n甲、受到政策影響的公民，應有相同權利和有效機會來表達其觀點和利益，以形成共識。\n乙、某些社會群體的成員即使進入公共審議的場域，也常因發言訴諸個人經驗或無法清楚提出論點，而引起聽者的不耐與忽視。\n丙、女性或低教育程度者發言次數較少，發言時間較短，不常在對話過程質疑或批評他人，也較難以引導議題討論。\n丁、兩性在不同爭議議題公民會議的參與情形如下表。\n\n| 議題 | 參與人數女（%） | 參與人數男（%） | 發言次數女（%） | 發言次數男（%） | 成為共識的意見數女（%） | 成為共識的意見數男（%） |\n|---|---|---|---|---|---|---|\n| 通姦除罪 | 9（45） | 11（55） | 75（24） | 238（76） | 10（37） | 17（63） |\n| 代理孕母 | 12（60） | 8（40） | 87（42.4） | 118（57.6） | 18（34.6） | 34（65.4） |\n\n綜合上述四段摘要內容，該研究報告的主題最可能為下列何者？","o":[["A","性別化的爭議議題討論：以公民會議為例"],["B","不同議題對於兩性在公民會議參與的影響"],["C","公民會議參與歷程及影響意見發言的因素"],["D","公民會議過程的言說互動及其不平等樣貌"]],"a":"D","e":"四段都在描述審議過程中，誰能發言、誰的意見被重視的不平等。","r":"112 分科公民與社會第 34 題","d":1},{"i":"b221","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"我國某市立音樂廳需要整修，基於身心障礙者權利公約（CRPD）的要求，民間團體主張應增加身障座位，但也有反對聲浪。市政府也接獲三項整修方案建議。在與各界交換意見後，市政府確立以「障礙者文化平權」做為整修原則，並決定採取最符合 CRPD「共融模式」的方案。依據題文資訊及民主治理的核心概念，該音樂廳整修方案的決策歷程，與下列哪項公共參與案例最相似？","o":[["A","縣市政府與律師公會合作，提供身心障礙者免費法律諮詢服務"],["B","縣市長候選人徵詢民間團體意見，再提出無障礙福利政策政見"],["C","立法院接受民間團體遊說，修法納入身心障礙者個人協助服務"],["D","教育部召開公聽會，規劃全國校園整體無障礙環境的相關指引"]],"a":"D","e":"市政府與各界交換意見後才決策，與教育部召開公聽會、讓各方參與規劃最相似。","r":"112 分科公民與社會第 42 題","d":1},{"i":"b222","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某議題的民調顯示，支持者略多於反對者，但反對者多願意上街抗議、持續投書，支持者則多表示無所謂。此現象最能說明公共意見的哪一項特性？","o":[["A","強度不同"],["B","必然理性"],["C","完全一致"],["D","不會改變"]],"a":"A","e":"支持與反對的人在意的程度不同，是民意強度的差異。","d":1},{"i":"b223","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"下列哪一種民調抽樣方式，所得樣本最能代表全國成年人？","o":[["A","在某政黨粉絲專頁上發起投票"],["B","依全國人口結構，隨機抽選住宅電話與手機號碼訪問"],["C","在某車站隨意攔問通勤族"],["D","請各校學生填寫線上問卷"]],"a":"B","e":"依人口結構隨機抽樣，樣本最能代表母體。","d":1},{"i":"b224","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"小美的社群首頁幾乎都是和她立場相同的貼文，讓她以為大家都支持某政策，直到公投結果出爐才發現並非如此。此現象最能以下列哪一個概念解釋？","o":[["A","媒體近用"],["B","議題設定"],["C","演算法造成的同溫層效應"],["D","置入性行銷"]],"a":"C","e":"演算法只推送相似立場的內容，形成同溫層，讓人誤以為大家都這樣想。","d":1},{"i":"b225","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"依據我國法律，經營電信、廣播或電視頻道等媒體需領有國家通訊傳播委員會（NCC）發給有一定年限的經營執照，到期前須申請換照，核准後才能繼續經營。某廣播電台甲申請換照，但 NCC 指出該電台的報導經常與事實不符而遭民眾投訴，且其大股東直接介入新聞製播，顯示該電台內控與自律機制失靈，故在其執照到期後，決議不予換照。題文中 NCC 駁回換照申請的理由，與下列哪項主張最接近？","o":[["A","大眾未必具有媒體識讀能力，需要政府適時介入以確保人民知的權利"],["B","基於黨政軍退出媒體的理念，媒體對新聞事件的評論應保持中立立場"],["C","媒體惡性競爭可能造成劣幣驅逐良幣，政府介入是保障新聞自由的必要之惡"],["D","媒體的守門過程可能遭受不當干擾且違反專業倫理，新聞自由不應無限上綱"]],"a":"D","e":"大股東介入新聞製播、報導常與事實不符，是守門過程受到不當干擾，新聞自由仍有界限。","r":"112 分科公民與社會第 15 題","d":1},{"i":"b226","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"我國負責監理通訊傳播事業的國家通訊傳播委員會（NCC），在組織上屬於下列何者？","o":[["A","立法院的內部單位"],["B","依法獨立行使職權的獨立機關"],["C","總統府的幕僚單位"],["D","民間的媒體自律組織"]],"a":"B","e":"NCC 是依法獨立行使職權的獨立機關。","d":1},{"i":"b227","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某報刊登與事實不符的報導，損及當事人名譽，當事人依法要求該報刊登更正與答辯。這主要是行使下列哪一項權利？","o":[["A","媒體近用權"],["B","著作權"],["C","隱私權"],["D","集會遊行權"]],"a":"A","e":"要求媒體刊登更正與答辯，是使用媒體表達意見的媒體近用權。","d":1},{"i":"b228","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"新冠肺炎疫情爆發後，曾有電視節目針對某三代同堂七口之家，做了病毒擴散的模擬實驗。結果顯示：有六人在兩小時內接觸到的模擬病毒量就已達危險等級，唯獨奶奶平安無事。事後分析發現，由於家務主要由奶奶負責，她的雙手一直與水為伍，模擬病毒的螢光劑就一直被水沖掉。節目最後盛讚奶奶家事做得完美，不僅善盡家庭責任，也是防疫表率。然而，評論者指出，這種稱讚僅片面選擇、歌頌特定現象，可謂透過媒體再現強化了性別不平等。依據題文，評論者認為節目的稱讚強化性別不平等，最可能基於下列哪項理由？","o":[["A","將女性作為防疫表率，強化性別差異且忽略男性的防疫責任"],["B","將女性承擔家務視為理所當然，忽略討論家庭勞務合理分工"],["C","僅稱讚女性為防疫表率，未探討男性在疫情中的付出與貢獻"],["D","實驗顯示女性不易被傳染，節目卻未討論所涉及的性別差異"]],"a":"B","e":"節目把奶奶負責所有家務當成美德，忽略了家務應如何合理分工。","r":"111 分科公民與社會第 24 題","d":1},{"i":"b229","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某偶像劇中的外籍配偶角色，總被安排成語言不通、處處需要他人救濟的可憐形象。此現象最能說明下列何者？","o":[["A","媒體近用的不平等"],["B","媒體所有權集中"],["C","媒體再現的刻板印象"],["D","議題設定"]],"a":"C","e":"把某群體固定呈現成單一的負面形象，是媒體再現的刻板印象。","d":1},{"i":"b230","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"政府設立原住民族電視台、客家電視台，最主要的用意為何？","o":[["A","改善少數群體在媒體近用上的不平等"],["B","以政府預算取代所有商業媒體"],["C","統一各族群的語言與文化"],["D","提高電視台的廣告收入"]],"a":"A","e":"族群電視台讓少數群體有自己的發聲管道，改善近用的不平等。","d":1},{"i":"b231","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"一般人使用網路後通常會留下數位紀錄，稱為網路「足跡」。某大型網路平台商除經營社交媒體，也跨足各種服務。該平台商自稱擁有用戶的基本資料，當串連到用戶瀏覽紀錄、搜尋關鍵詞、消費行為、社群媒體活動等足跡，就可預知使用者的價值偏好與習慣，進而能幫其客戶向使用者投放準確的廣告或政治宣傳，獲利豐厚。某資訊人權監督團體提出警告：「該平台商的行為經常沒有使用者的充分授權，也未充分告知，但卻擁有左右使用者認知與行為的能力」。依資訊人權監督團體所提出的警告，顯示其最擔心網路平台商下列哪項行為？","o":[["A","蒐集並分析使用者的網路足跡"],["B","提供政黨關於民意走向的分析"],["C","製作廣告資訊影響消費者偏好"],["D","持續監視並且操縱使用者行為"]],"a":"D","e":"團體警告的重點是平台未經充分授權，卻能「左右使用者認知與行為」，也就是監視並操縱。","r":"111 學測社會第 47 題","d":1},{"i":"b232","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"小凱在群組看到一則宣稱「某地即將停電三天」的訊息。依媒體識讀的查證步驟，他最先應該做的是什麼？","o":[["A","查看發布者與原始出處"],["B","立即轉傳提醒親友"],["C","依訊息內容囤積物資"],["D","在社群上發文評論"]],"a":"A","e":"查證第一步是看來源：誰發布的、有沒有原始出處。","d":1},{"i":"b233","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列哪一句屬於「事實陳述」，而非「意見表達」？","o":[["A","「這是史上最糟糕的市長」"],["B","「該市去年人口減少 1,200 人」"],["C","「這項政策根本是在浪費錢」"],["D","「年輕人都不關心政治」"]],"a":"B","e":"人口減少 1,200 人可以查證，是事實；其他三句都是評價。","d":1},{"i":"b234","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"下列何者不屬於公共意見影響政府政策的途徑？","o":[["A","公民團體發起連署倡議"],["B","媒體報導形成輿論壓力"],["C","法院依法獨立審判個案"],["D","政府參考民意調查調整政策"]],"a":"C","e":"法院依法獨立審判，不應受輿論左右，不屬於民意影響政策的途徑。","d":1},{"i":"b235","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"某國長期存在歧視國際移工的社會問題。某日下午，移工甲於 ATM 領錢時，便衣員警依甲容貌而懷疑是「逃逸移工」，要求甲交出居留證供警察查驗。甲表示未隨身攜帶，員警認為甲不服從盤查且無居留證，顯有犯罪嫌疑，乃將甲上銬帶回警局，連夜詢問，直到隔天早上始釋放甲。此事經當地媒體報導，引發輿論批評。某移工權益團體特別關切政府應解決警察對移工的偏見和歧視性執法問題。若該國政府著手回應移工權益團體的關切，下列哪些作為較能彰顯審議民主的精神？","o":[["A","邀集民意代表開會協商、共同審議歧視移工的罰則"],["B","提出保障移工積極平權的措施，交由公民投票決定"],["C","廣邀利害關係者開會，以研議相關的移工保障措施"],["D","諮詢移工仲介機構的意見，強化移工增能訓練方案"],["E","邀請移工參與協商對話，擬訂防止歧視性執法規範"]],"a":"CE","e":"審議民主要讓利害關係人（包括移工本人）參與討論；(A) 只有民意代表、(B) 直接公投、(D) 只問仲介，都缺少利害關係人的對話。","r":"113 分科公民與社會第 35 題","d":1},{"i":"b236","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"《原住民身分法》要求原住民與非原住民結婚所生之子女，須跟著具有原住民身分的父親或母親的姓氏，或取原住民傳統名字，才能取得原住民身分。這導致部分有原住民血統的民眾，因為隨著非原住民的漢人父親取了漢姓，而無法取得原住民身分。憲法法庭認定，此種情形違反憲法所保障有關原住民身分認同之人格權，亦牴觸種族平等及性別平等。下列有關性別平等原則的判斷，哪些符合本件憲法判決的精神？","o":[["A","原母漢父的子女登記為原住民的比例遠低於原父漢母，呈現性別實質不平等"],["B","該法規定原住民之身分須經國家認定登記才能取得，故造成性別實質不平等"],["C","原住民子女不選擇從原母姓氏而選擇從漢父姓氏之行為，牴觸憲法性別平等"],["D","唯有登記原住民傳統名字，才得以超越性別且有效保障原住民種族平等與身分認同"],["E","取得原住民身分須跟從具原住民身分父母的姓氏，使身分認定受主流性別文化影響"]],"a":"AE","e":"憲法判決指出，跟從原住民父或母姓氏的規定，在漢姓父系文化下使原母漢父的子女較難取得身分，造成性別上的實質不平等。","r":"111 分科公民與社會第 31 題","d":1},{"i":"b237","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"下列有關課責的敘述，哪些正確？","o":[["A","罷免必須以公職人員違法為前提"],["B","選民罷免民意代表，屬於垂直課責"],["C","審計部審核政府決算，屬於水平課責"],["D","政府不公開資訊，也不影響課責的進行"],["E","媒體的調查報導，屬於社會課責"]],"a":"BCE","e":"(A) 罷免是政治責任，不需要違法；(D) 透明是課責的前提。","d":1},{"i":"b238","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關實質平等與積極平權措施的敘述，哪些正確？","o":[["A","原住民族升學優待屬於積極平權措施"],["B","所有差別待遇都違反平等原則"],["C","身心障礙者定額進用屬於積極平權措施"],["D","委員會任一性別不少於一定比例，屬於實質平等的設計"],["E","只要對每個人適用相同規則，就一定能讓起點不同的人得到公平結果"]],"a":"ACD","e":"(B) 合理的差別待遇不違反平等原則；(E) 形式平等可能忽略起點的不同。","d":1},{"i":"b239","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關公平正義理論的敘述，哪些正確？","o":[["A","多數決的結果必然符合正義"],["B","效益主義追求最大多數人的最大幸福"],["C","自由至上主義反對國家過度重分配"],["D","羅爾斯的第一原則是平等的基本自由"],["E","羅爾斯主張在無知之幕下選擇正義原則"]],"a":"BCDE","e":"(A) 多數決不等於正義，不能侵害少數者的基本權利。","d":1},{"i":"b240","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體近用與媒體再現的敘述，哪些正確？","o":[["A","媒體近用權屬於言論自由的保障範圍"],["B","媒體再現的不平等，是指某群體無法使用媒體發聲"],["C","原住民族電視台有助於改善近用的不平等"],["D","讓當事人參與節目製作，可改善再現的不平等"],["E","戲劇總把外籍配偶描繪成可憐角色，屬於再現的問題"]],"a":"ACDE","e":"(B) 無法使用媒體發聲是近用的不平等，再現是指被媒體怎麼呈現。","d":1},{"i":"b241","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關社群媒體與媒體角色的敘述，哪些正確？","o":[["A","國家通訊傳播委員會（NCC）隸屬於總統府"],["B","演算法推送相似內容，可能形成同溫層"],["C","同溫層有助於理解不同立場的意見"],["D","回音室效應會強化既有的看法"],["E","媒體被稱為第四權，是因為它能監督行政、立法、司法"]],"a":"BDE","e":"(A) NCC 是獨立機關；(C) 同溫層讓人只接觸相似意見，不利理解不同立場。","d":1},{"i":"b242","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市政府把所有工程標案的預算、得標廠商與驗收結果公布在網站上，民眾隨時可以查詢。此做法最直接體現民主治理的哪一項原則？","o":[["A","透明"],["B","回應"],["C","課責"],["D","效率"]],"a":"A","e":"把資料公開讓人民查詢，是透明。","d":1},{"i":"b243","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某市政府在網路平台蒐集市民對公車路線的意見，三個月後依據意見調整路線，並公告調整理由。此做法最直接體現民主治理的哪一項原則？","o":[["A","透明"],["B","回應"],["C","課責"],["D","效率"]],"a":"B","e":"人民先提出意見，政府據此調整並說明理由，是回應。","d":1},{"i":"b244","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某部會首長的弊案經媒體調查報導揭露後，輿論沸騰，公民團體連署要求下台，該首長最後請辭。此過程最能體現下列哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","市場課責"]],"a":"C","e":"媒體與公民團體追究官員責任，是社會課責。","d":1},{"i":"b245","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"下列哪一項敘述，最能說明「治理」與傳統「統治」的差異？","o":[["A","政府單方面制定並執行所有政策"],["B","由最高行政首長決定一切公共事務"],["C","由民意代表代替人民做出所有決定"],["D","政府與企業、非營利組織及社區協力處理公共事務"]],"a":"D","e":"治理強調政府與企業、非營利組織、社區等多元行動者協力；(A)(B)(C) 都是由上而下的統治。","d":1},{"i":"b246","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"行政院客家委員會曾自 2002 年起，每年 4、5 月間在部分客籍居民分布區辦理「客家桐花祭」活動，由「中央籌劃、企業加盟、地方執行、社區營造」的公私協力夥伴關係，達到一定的政策成效，不僅為客庄地區帶來經濟效益，也強化客家族群的在地認同。客委會辦理的「客家桐花祭」活動最可能是下列何種概念的具體實踐？","o":[["A","地方自治"],["B","地方治理"],["C","地方分權化"],["D","全球在地化"]],"a":"B","e":"中央、企業、地方、社區公私協力推動地方發展，是地方治理。","r":"110 學測社會第 71 題（題文節錄）","d":1},{"i":"b247","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市政府保留一部分預算，由居民自行提案、公開討論後投票決定用途。此做法最能體現民主治理的哪一項原則？","o":[["A","參與"],["B","透明"],["C","法治"],["D","效率"]],"a":"A","e":"居民提案、討論、投票決定預算用途，是參與。","d":1},{"i":"b248","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"公民與社會課堂中老師介紹幾種民主理論如下：\n甲：多數決無法顧及公共政策品質，重視決策過程的對話與討論才能提升決策品質。\n乙：人人都具有理性且平等，因此應讓所有人積極參與政治並藉此培養德行。\n丙：人人參與政治在實務上有困難，因此應將政府決策權力交給專業政治人物。\n丁：利益團體是民主政治的主角，應由各團體競爭爭取選票，以獲得決策權力。\n政府與民間團體針對較具爭議性的公共議題，近年來曾舉辦過多次公民會議。此做法與上述何者最為接近？","o":[["A","甲"],["B","乙"],["C","丙"],["D","丁"]],"a":"A","e":"公民會議重視對話與討論，與甲（審議民主）最接近。","r":"110 學測社會第 6 題","d":1},{"i":"b249","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣政府針對垃圾焚化爐選址，隨機抽選二十位背景多元的縣民，讓他們閱讀正反資料、諮詢專家後分組討論，最後提出共識建議供縣府參考。此做法最接近下列哪一種民主模式？","o":[["A","直接民主"],["B","代議民主"],["C","審議民主"],["D","菁英民主"]],"a":"C","e":"背景多元的公民閱讀資料、諮詢專家、討論後形成共識，是審議民主。","d":1},{"i":"b250","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某政治人物主張大幅調降遺產稅，理由是：「遺產是被繼承人合法取得的財產，國家不應以高稅率強制拿走。」此主張最接近下列哪一種立場？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的平等主義"],["D","多元文化主義"]],"a":"B","e":"尊重合法財產、反對國家強制拿走，是自由至上主義。","d":1},{"i":"b251","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"政府評估興建新機場後認為：雖然周邊少數居民會受到噪音影響，但能讓全國多數人受益、整體經濟效益最大，因此決定興建。此思考方式最接近下列何者？","o":[["A","自由至上主義"],["B","羅爾斯的差異原則"],["C","匡正正義"],["D","效益主義"]],"a":"D","e":"以整體效益大於少數人的損失作為判斷，是效益主義。","d":1},{"i":"b252","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"「在不知道自己將生在什麼家庭、擁有什麼能力的情況下，理性的人會選擇讓社會中處境最不利者得到最大利益的制度。」此說法最接近下列哪一種主張？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的正義理論"],["D","功能論"]],"a":"C","e":"無知之幕下選擇讓最不利者得到最大利益，是羅爾斯。","d":1},{"i":"b253","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"國家對遭到冤獄的人給予刑事補償，最能體現下列哪一種正義？","o":[["A","匡正正義"],["B","分配正義"],["C","程序正義"],["D","差異原則"]],"a":"A","e":"對受到不法侵害的人給予補償，是匡正正義。","d":1},{"i":"b254","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"醫院急診室依病情的嚴重程度決定看診順序，而不是依掛號先後。此做法所依據的分配標準是下列何者？","o":[["A","貢獻"],["B","需要"],["C","平均"],["D","能力"]],"a":"B","e":"依病情緊急程度決定順序，是依「需要」分配。","d":1},{"i":"b255","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校選拔校隊時，事前公開評審名單與評分標準，且與選手有親屬關係的老師一律迴避評分。此做法最符合下列何者？","o":[["A","分配正義"],["B","匡正正義"],["C","效益主義"],["D","程序正義"]],"a":"D","e":"標準公開、利益迴避，重視過程公正，是程序正義。","d":1},{"i":"b256","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"大學入學考試為視障考生提供點字試卷，並延長作答時間。此措施最能體現下列哪一項概念？","o":[["A","形式平等"],["B","齊頭式平等"],["C","實質平等"],["D","多數決原則"]],"a":"C","e":"依處境不同給予協助，讓視障考生有公平的機會，是實質平等。","d":1},{"i":"b257","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列哪一項規定，最可能構成不合理的差別待遇（歧視）？","o":[["A","某公司以「傳統上由男性擔任」為由，規定業務主管職缺只限男性報考"],["B","為保障身心障礙者就業，規定一定規模的機關須進用一定比例的身心障礙者"],["C","消防員體能測驗要求所有考生都要達到相同的負重標準"],["D","原住民族學生升學採外加名額保障，不影響一般考生名額"]],"a":"A","e":"「傳統上由男性擔任」不是正當目的，排除女性屬於不合理的差別待遇；(B)(D) 是改善弱勢處境的積極平權；(C) 依職務需求設相同標準，不是差別待遇。","d":1},{"i":"b258","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"對於疫情如何影響社會，有兩種不同觀點。甲觀點主張：疫情影響廣、且無人倖免，所以是「公平」的；乙觀點則認為疫情的影響程度，會因個人所處的社會、經濟地位而有不同。表 1 是某國有關不同族群的疫情數據。請問下列有關該資料的解釋敘述，何者最正確？\n\n| 族群 | 占新冠肺炎確診數的百分比 | 占總人口的百分比 |\n|---|---|---|\n| 優勢族群 | Ⅰ　52 | Ⅱ　60 |\n| 邊緣族群 | Ⅲ　27 | Ⅳ　12 |","o":[["A","支持甲觀點，因Ⅰ大於Ⅲ"],["B","支持乙觀點，因Ⅱ大於Ⅲ"],["C","支持甲觀點，因Ⅰ小於Ⅱ"],["D","支持乙觀點，因Ⅲ大於Ⅳ"]],"a":"D","e":"邊緣族群占確診的比例（Ⅲ 27%）高於占人口的比例（Ⅳ 12%），表示受影響程度較大，支持乙觀點。\n〔易錯〕要比同一族群「確診占比」與「人口占比」，不是跨族群比確診數。","r":"113 分科公民與社會第 2 題（原題附圖）","d":1},{"i":"b259","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"有學者想了解就讀不同類型大學之學生政治參與度，並進一步分析其對高等教育政策的啟示。表 2 為該學者的調查結果，依據表 2 資料，下列哪項分析最適切？\n\n| 就讀的大學類型 | 政治參與度低（%） | 中（%） | 高（%） | 總和 |\n|---|---|---|---|---|\n| 公立一般大學 | 2.5 | 39.8 | 57.7 | 100 |\n| 私立一般大學 | 4.7 | 41.1 | 54.2 | 100 |\n| 公立技職大學 | 6.9 | 58.7 | 34.4 | 100 |\n| 私立技職大學 | 8.1 | 67.3 | 24.6 | 100 |","o":[["A","公立大學學生政治參與度較私立大學高，凸顯出高等教育並未能促進政治平等"],["B","一般大學比技職大學學生政治參與度較高，這是高等教育資源分配不均的結果"],["C","私立大學學生的政治參與度都較低，顯見私立大學學費負擔過重造成負面影響"],["D","技職大學學生的政治參與度都較低，反映技職大學宜強化民主公民養成之規劃"]],"a":"D","e":"無論公私立，技職大學學生「高」參與度都明顯較低，最直接的啟示是技職大學宜加強民主公民養成；(A)(B)(C) 的因果推論，表中資料無法支持。","r":"113 分科公民與社會第 3 題","d":1},{"i":"b261","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"小華求職時，透過父親朋友的介紹，順利進入一家大企業工作。從社會階層化的角度，這主要是運用了下列哪一種資本？","o":[["A","文化資本"],["B","經濟資本"],["C","社會資本"],["D","象徵資本"]],"a":"C","e":"透過人際關係網絡取得機會，是社會資本。","d":1},{"i":"b262","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"根據表 3 的數據，關於社會環境條件對不同地區飲食與疾病的影響，下列哪項推論最能精確說明？","o":[["A","食物沙漠地區居民受疾病的影響會因經濟資本高低而有差異"],["B","食物沙漠地區經濟資本的弱勢人口較多而導致疾病偏多現象"],["C","經濟資本的高低影響食物沙漠和非食物沙漠地區的飲食差異"],["D","經濟資本低者相較於經濟資本高者更常居住在食物沙漠地區"]],"a":"A","c":"某國有一項疾病的盛行率較高，推測與國民食用過多不利健康的加工食品有關。因該項疾病加重健保財政負擔，該國政府因而提高加工食品稅率，試圖減少國民對該類食品的消費量。\n\n然而，一位學者主張：加稅只是把疾病問題看成是國民個人責任，忽略國家應承擔的責任，政府應優先改善食物供給的社會環境條件，例如，有些地區面臨生鮮食物不易送達的情況，當地居民因此常難以買到或因價格高而買不起，這些地區因而充斥很多廉價的加工食品。該學者形容這些地區為「食物沙漠」地區，並提出表 3 的研究調查數據以支持其論點。\n\n表 3　某項疾病盛行率（罹病人口的百分比）\n\n| 收入＼地區 | 食物沙漠地區 | 非食物沙漠地區 |\n|---|---|---|\n| 高收入人口 | 29% | 29% |\n| 中低及低收入人口 | 36% | 29% |","e":"表 3 中，食物沙漠地區的中低收入者罹病率（36%）高於高收入者（29%），非食物沙漠地區則沒有差異，表示在食物沙漠地區，受影響程度會因經濟資本而不同。\n〔易錯〕表中沒有「人口分布」資料，(B)(D) 無法推得。","r":"114 分科公民與社會第 25、26 題","d":1},{"i":"b263","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列關於國家與政府角色的論述，何者最能與該學者的主張相互呼應？","o":[["A","政府應致力改善財政收支的條件以照顧國民健康"],["B","政府應確保食品增稅政策可以有效提升國民健康"],["C","國家健保政策應以提升國民健康水準為主要考量"],["D","國家統治權的實踐意義應包括保障國民健康權利"]],"a":"D","c":"某國有一項疾病的盛行率較高，推測與國民食用過多不利健康的加工食品有關。因該項疾病加重健保財政負擔，該國政府因而提高加工食品稅率，試圖減少國民對該類食品的消費量。\n\n然而，一位學者主張：加稅只是把疾病問題看成是國民個人責任，忽略國家應承擔的責任，政府應優先改善食物供給的社會環境條件，例如，有些地區面臨生鮮食物不易送達的情況，當地居民因此常難以買到或因價格高而買不起，這些地區因而充斥很多廉價的加工食品。該學者形容這些地區為「食物沙漠」地區，並提出表 3 的研究調查數據以支持其論點。\n\n表 3　某項疾病盛行率（罹病人口的百分比）\n\n| 收入＼地區 | 食物沙漠地區 | 非食物沙漠地區 |\n|---|---|---|\n| 高收入人口 | 29% | 29% |\n| 中低及低收入人口 | 36% | 29% |","e":"學者主張國家應承擔改善環境條件的責任，保障國民的健康權。","r":"114 分科公民與社會第 25、26 題","d":1},{"i":"b264","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某國媒體報導，該國原住民族罹患心理疾病比率、自殺率、平均壽命與全國之比較，如表 4。該報導在未詳查原住民族生活困境的情形下，即宣稱這是因為原住民族不注重身心健康，例如偏好高脂肪、高甜度垃圾食物所致。類似此種缺乏同理與理解的報導，最可能引導社會大眾對原住民個人或民族形成何種更加不利的社會印象？\n\n| | 原住民族 | 全國 |\n|---|---|---|\n| 罹患心理疾病比率（%） | 14.2 | 9.0 |\n| 自殺率（人／每十萬人） | 15.7 | 8.8 |\n| 平均壽命（歲） | 69.3 | 76.1 |","o":[["A","原住民個人常缺少改變傳統習慣的意願"],["B","原住民個人缺少為自己健康負責的態度"],["C","原住民族缺少傳統飲食文化的知識傳承"],["D","原住民族缺少改變現代生活步調的策略"]],"a":"B","e":"報導把健康問題歸咎於原住民「不注重身心健康」，會讓人以為原住民個人不為自己的健康負責。","r":"111 學測社會第 1 題","d":1},{"i":"b265","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某族群團體認為電視台對其報導失實，要求電視台提供時段讓他們說明立場。此主張最直接涉及下列哪一項權利？","o":[["A","媒體近用權"],["B","新聞自由"],["C","著作權"],["D","隱私權"]],"a":"A","e":"要求媒體提供時段說明立場，是媒體近用權。","d":1},{"i":"b266","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"連續數週各大媒體大幅報導食安事件，之後的民調顯示，多數民眾認為食安是當前最重要的社會問題。這最能說明媒體的哪一種作用？","o":[["A","守門"],["B","議題設定"],["C","框架"],["D","置入性行銷"]],"a":"B","e":"媒體大量報導，使民眾認為某議題最重要，是議題設定（影響人們「想什麼」）。","d":1},{"i":"b267","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"同一場抗議活動，甲報以「警民衝突、交通癱瘓」為標題，乙報以「數萬人和平表達訴求」為標題。這最能說明下列哪一個概念？","o":[["A","議題設定"],["B","守門"],["C","框架"],["D","媒體近用"]],"a":"C","e":"同一事件選擇不同角度呈現，是框架（影響人們「怎麼想」）。","d":1},{"i":"b268","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"報社編輯從上百則記者來稿中挑選十則刊登，其餘不予報導。這個過程稱為下列何者？","o":[["A","框架"],["B","議題設定"],["C","媒體再現"],["D","守門"]],"a":"D","e":"決定哪些訊息能成為新聞，是守門。","d":1},{"i":"b269","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲支持度 48%、乙 45%，抽樣誤差為正負 3 個百分點。下列解讀何者正確？","o":[["A","兩人支持度的範圍有重疊，無法斷定誰領先"],["B","甲確定領先乙"],["C","乙確定落後甲 3 個百分點"],["D","抽樣誤差只影響支持度較低的乙"]],"a":"A","e":"甲 45～51%，乙 42～48%，範圍重疊，無法斷定誰領先。","d":1},{"i":"b270","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某項政策在發生重大事件後，民眾支持度從三成上升到六成。這最能說明民意的哪一項特性？","o":[["A","多元性"],["B","強度"],["C","可變性"],["D","一致性"]],"a":"C","e":"支持度隨事件發展大幅改變，是民意的可變性。","d":1},{"i":"b271","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"媒體被稱為「第四權」，最主要的原因是下列何者？","o":[["A","媒體由國家第四個部門負責管理"],["B","媒體能監督行政、立法、司法"],["C","媒體擁有制定法律的權力"],["D","媒體能代替法院做出判決"]],"a":"B","e":"媒體監督行政、立法、司法三權，所以被稱為第四權。","d":1},{"i":"b272","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關民主治理的敘述，哪些正確？","o":[["A","透明是課責的前提"],["B","回應是指政府主動公開所有施政資訊"],["C","參與式預算是讓人民參與決策的方式之一"],["D","監察院彈劾失職官員屬於垂直課責"],["E","治理強調政府與多元行動者協力"]],"a":"ACE","e":"(B) 主動公開資訊是透明，回應是對人民的意見做出處理；(D) 監察院彈劾是政府機關之間的水平課責。","d":1},{"i":"b273","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關公平正義理論的敘述，哪些正確？","o":[["A","自由至上主義主張國家應大幅重分配財富"],["B","效益主義以整體效益是否最大來判斷政策"],["C","羅爾斯認為社會的不平等必須對最不利者最有利"],["D","程序正義重視決策過程的公正，例如利益迴避"],["E","匡正正義是指依照每個人的貢獻分配資源"]],"a":"BCD","e":"(A) 自由至上主義反對國家過度重分配；(E) 匡正正義是對不法侵害給予補償。","d":1},{"i":"b274","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等原則的敘述，哪些正確？","o":[["A","形式平等要求對所有人一視同仁"],["B","合理的差別待遇須有正當目的，且手段與目的有合理關聯"],["C","所有的差別待遇都違反平等原則"],["D","積極平權措施的目的在改善弱勢群體的不利處境"],["E","實質平等忽略每個人起點的不同"]],"a":"ABD","e":"(C) 合理的差別待遇不違反平等原則；(E) 實質平等正是考量每個人起點的不同。","d":1},{"i":"b275","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關社會不平等的敘述，哪些正確？","o":[["A","社會階層化是指社會資源分配不均而形成高低位階"],["B","文化資本可以透過家庭長期薰陶取得"],["C","教育擴張一定能消除階級複製"],["D","同一群體內部的成員，可能因處境不同而遭受不同的壓迫"],["E","經濟資本有可能轉換為文化資本"]],"a":"ABDE","e":"(C) 教育擴張不保證能消除階級複製，好的教育資源仍可能集中在優勢階級。","d":1},{"i":"b276","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"某國有倡議團體認為，由政府經費補助私立大學學費的政策，有助於減少社會不平等。依據以下該國 2024 年公私立大學的相關統計資料（表 5），該倡議團體應串連哪些資料，最能夠支持其主張？\n\n| 資料 | 公立大學 | 私立大學 |\n|---|---|---|\n|","o":[["A","在學的學生人數 | 約 27 萬人 | 約 44 萬人 |\n|"],["B","就學貸款學生比例 | 約 21% | 約 32% |\n|"],["C","休學的學生人數 | 約 8,800 人 | 約 11,000 人 |\n|"],["D","學生家庭年收入 | 約 112 萬元 | 約 80 萬元 |\n|"],["E","畢業初職的月薪 | 約 35,000 元 | 約 29,000 元 |"]],"a":"BD","e":"私立大學學生家庭年收入較低（D），且就學貸款比例較高（B），表示私校學生經濟處境較不利，補助私校學費有助減少不平等。(A)(C)(E) 無法說明學生的經濟處境。","r":"114 分科公民與社會第 29 題（原題附圖）","d":1},{"i":"b277","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體產製過程的敘述，哪些正確？","o":[["A","守門人決定哪些訊息能成為新聞"],["B","框架不會影響閱聽人對事件的理解"],["C","置入性行銷應明確揭露，以免誤導閱聽人"],["D","媒體所有權集中，可能減少多元觀點"],["E","議題設定是指媒體決定閱聽人對事件的看法"]],"a":"ACD","e":"(B) 框架會影響閱聽人對事件的理解；(E) 議題設定影響的是閱聽人關心哪些議題，不是決定看法。","d":1},{"i":"b278","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","其他條件不變時，樣本數越大，抽樣誤差通常越小"],["B","樣本應依人口結構隨機抽取，才具有代表性"],["C","問卷用字帶有立場，可能引導受訪者的回答"],["D","信心水準 95%，代表有 95% 的民眾支持"],["E","民意具有可變性，會隨事件發展而改變"]],"a":"ABCE","e":"(D) 信心水準是指「結果 ± 誤差」這個範圍的可靠程度，與支持度無關。","d":1},{"i":"b279","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體識讀與社群媒體的敘述，哪些正確？","o":[["A","演算法推送相似內容，可能形成同溫層"],["B","同溫層有助於接觸多元的意見"],["C","接收訊息時，應查證來源並交叉比對"],["D","族群電視台有助於改善少數群體的媒體近用"],["E","區分事實與意見是媒體識讀的一環"]],"a":"ACDE","e":"(B) 同溫層讓人只接觸相似意見，不利於接觸多元意見。","d":1},{"i":"b286","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"在 COVID-19 疫情嚴峻時期，中央流行疫情指揮中心經常召開記者會，報告疫情數據，說明防疫政策與醫療資源概況等。如就「民主課責」而言，政府相關首長經常舉行記者會向各界說明疫情，和下列哪項政府定期措施的性質最相近？","o":[["A","公布治安狀況，並提出主管機關的因應措施"],["B","發布死刑存廢的民意調查數據，供人民參考"],["C","公告食品衛生標準，定期邀請學者討論修正"],["D","提供健康飲食生活標準，要求各界廣為宣導"]],"a":"A","e":"記者會向人民報告施政狀況並說明作為，與定期公布治安狀況並提出因應措施一樣，都是向人民交代、接受檢驗。","r":"113 學測社會第 23 題（題文節錄）","d":1},{"i":"b287","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"立法委員在院會質詢行政院長，要求說明能源政策的成效與預算執行情形。這屬於下列哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","透明原則"]],"a":"B","e":"立法機關監督行政機關，是政府部門之間的水平課責。","d":1},{"i":"b288","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市長任內施政滿意度很低，選民在下一次選舉中不再投票給他，使他落選。這屬於下列哪一種課責？","o":[["A","水平課責"],["B","社會課責"],["C","垂直課責"],["D","回應原則"]],"a":"C","e":"人民透過選舉決定執政者去留，是垂直課責。","d":1},{"i":"b289","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"媒體以調查報導揭露某官員浪費公帑，公民團體隨後發起連署，要求官員說明並下台。這屬於下列哪一種課責？","o":[["A","社會課責"],["B","垂直課責"],["C","水平課責"],["D","參與原則"]],"a":"A","e":"媒體、公民團體追究官員責任，是社會課責。","d":1},{"i":"b290","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣政府把年度預算書、重大工程的會議紀錄全部上網，任何人都能下載查詢。這最能體現民主治理的哪一項原則？","o":[["A","回應"],["B","透明"],["C","課責"],["D","效能"]],"a":"B","e":"主動公開資訊，是透明。","d":1},{"i":"b291","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市府收到大量居民陳情，指出公車路線不便，市府隨後修改路線，並公開說明調整的理由。這最能體現民主治理的哪一項原則？","o":[["A","透明"],["B","參與"],["C","回應"],["D","法治"]],"a":"C","e":"依人民意見調整政策並說明理由，是回應。","d":1},{"i":"b292","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"南投縣仁愛鄉南豐村的賽德克族部落，近年與政府合作一項計畫，由部落族人參與討論公共資源分配，最後透過投票選出最需要投入經費在族語、弓箭等傳統文化的傳承。此外族人也以集體名義，申請原住民族傳統智慧創作專用權，讓該計畫充分發揮強化族人自治與文化復振的功效。該部落與政府合作的計畫，最能凸顯以下哪項民主治理的理念？","o":[["A","由地方政府推動資源分配計畫，最能代表在地意見"],["B","經民眾投票產生的多數決，最符合公平的決策模式"],["C","民眾直接參與決策比由議會決定，更符合公共利益"],["D","開放地方民眾參與決策過程，更能回應在地的需求"]],"a":"D","e":"讓部落族人參與資源分配的討論與投票，政府據此投入經費，體現開放參與、回應在地需求。(B) 題文重點不在多數決是否公平；(C) 題文沒有和議會決定比較。","r":"112 學測社會第 44 題（題文節錄）","d":1},{"i":"b293","s":"公民","u":"第5課","t":"4-5-讀題","k":"s","q":"某大學決定將運動場改建為停車場以增闢財源，學生認為校方犧牲學生權益而抗議。籃球校隊的練習場地也受影響，但籃球校隊隊員因已有其他眾多學生抗議，決定不參加行動。學生持續抗爭終於讓校方檢討改建計畫。上述事件中，籃球隊員所做的決定對應抗爭的結果，最能呼應下列何項公民參與常遭遇的難題？","o":[["A","抗爭必須匯聚公民力量，但要靠有效行動策略才能促使政府改變政策"],["B","要提升公民參與，須突破網路萬人喊讚但行動時僅有百人到場之困境"],["C","為提升勞工權益，要思考如何確保非工會會員不能共享工會抗爭成果"],["D","要促進環保運動之成效，必須突破政府與公民僅偏重經濟利益之不足"]],"a":"C","e":"籃球隊員不參加抗爭，卻能分享抗爭成果，是「搭便車」的難題，與非工會會員共享工會成果相同。","r":"110 學測社會第 2 題","d":1},{"i":"b294","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某社區要決定公園改建方向，先隨機邀請背景不同的居民，閱讀專家提供的資料後分組討論、交換理由，最後形成共同建議交給區公所。這種做法最接近下列何者？","o":[["A","直接民主"],["B","審議民主"],["C","代議民主"],["D","菁英決策"]],"a":"B","e":"多元公民閱讀資料、討論交換理由後形成共識，是審議民主。","d":1},{"i":"b295","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲主張：「人民合法取得的財產應受到完全尊重，國家不應以重稅拿走富人的財產去補助他人。」甲的主張最接近下列哪一種正義理論？","o":[["A","效益主義"],["B","羅爾斯的正義論"],["C","自由至上主義"],["D","多數決原則"]],"a":"C","e":"尊重合法財產、反對國家強制重分配，是自由至上主義。","d":1},{"i":"b296","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市規劃焚化爐的位置時，以「能使全市最多居民獲得最大好處」作為決策標準，即使少數居民的權益受損。這最接近下列哪一種正義理論？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的正義論"],["D","匡正正義"]],"a":"A","e":"以最多數人的最大好處為標準，是效益主義。","d":1},{"i":"b297","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某學者主張：「假如人們在不知道自己將出生在什麼家庭、擁有什麼能力的情況下選擇制度，會希望社會的不平等安排，能讓處境最不利的人得到最大的好處。」此主張屬於：","o":[["A","自由至上主義"],["B","羅爾斯的正義論"],["C","效益主義"],["D","形式平等"]],"a":"B","e":"無知之幕與照顧最不利者，是羅爾斯的正義論（差異原則）。","d":1},{"i":"b298","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某機關甄選人員時，事先公開評分標準，與應試者有親屬關係的委員一律迴避。這最重視下列哪一種正義？","o":[["A","分配正義"],["B","匡正正義"],["C","實質正義"],["D","程序正義"]],"a":"D","e":"公開標準、利益迴避，重視決策過程的公正，是程序正義。","d":1},{"i":"b299","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某人遭冤獄多年，經再審判決無罪後，國家依法給予賠償。這屬於下列哪一種正義？","o":[["A","匡正正義"],["B","程序正義"],["C","分配正義"],["D","形式正義"]],"a":"A","e":"對受到不法侵害的人給予補償，是匡正正義。","d":1},{"i":"b300","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"學測時，考試單位為視障考生提供點字試卷，並延長作答時間。這最能體現下列何者？","o":[["A","形式平等"],["B","實質平等"],["C","效益主義"],["D","程序正義"]],"a":"B","e":"依處境不同給予協助，讓起點趨於公平，是實質平等。","d":1},{"i":"b301","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列何者屬於合理的差別待遇？","o":[["A","公司只因應徵者是女性，就拒絕錄用她擔任駕駛"],["B","公司規定女性員工結婚後必須離職"],["C","政府規定一定規模的機關須進用一定比例的身心障礙者"],["D","房東因房客是外籍人士而拒絕出租"]],"a":"C","e":"身障者定額進用是為了改善長期弱勢處境，有正當目的且手段合理。(A)(B)(D) 都只因性別、婚姻、國籍就差別對待，沒有正當目的。","d":1},{"i":"b302","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"研究指出人們常忽略 AI 的運作須仰賴許多勞工辛苦將海量資料加以分類、標註，提供給機器學習。例如東非標註者每週工作 45 小時，時薪僅約 1 美元，該研究強調，相較於 AI 產業的鉅額投資與回報，目前標註工作薪資極低廉。從題文判斷，下列何者為該研究最可能表達的觀點？","o":[["A","高科技的發展，常忽視全球經濟不平等的現象"],["B","人們推崇科技，卻常忽略其運作仍需人類智慧"],["C","人們過度仰賴科技，忽略使用科技帶來的傷害"],["D","科技未發展區域，賺取薪資比勞動權益更重要"]],"a":"A","e":"題文強調標註勞工薪資極低，與 AI 產業的鉅額回報形成對比，指出科技發展忽視全球經濟不平等。","r":"115 學測社會第 2 題","d":1},{"i":"b303","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"小安的父母常帶他參觀博物館、聽音樂會，家中藏書豐富，他從小就養成閱讀習慣，在學校的語文表現特別好。這最能說明下列哪一種資本對學習的影響？","o":[["A","經濟資本"],["B","文化資本"],["C","社會資本"],["D","政治資本"]],"a":"B","e":"家庭長期培養的閱讀習慣、藝文素養，是文化資本。","d":1},{"i":"b304","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"阿凱畢業後，透過學長介紹順利進入知名企業工作。阿凱運用的資源主要是下列何者？","o":[["A","社會資本"],["B","文化資本"],["C","經濟資本"],["D","人力資本"]],"a":"A","e":"透過人際關係網絡取得機會，是社會資本。","d":1},{"i":"b305","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"研究發現，父母教育程度與收入較高的家庭，子女進入頂尖大學的比例也較高，而這些子女日後又較容易取得高收入工作。這種現象最常被稱為：","o":[["A","向上流動"],["B","積極平權"],["C","階級複製"],["D","形式平等"]],"a":"C","e":"上一代的優勢透過教育傳給下一代，是階級複製。","d":1},{"i":"b306","s":"公民","u":"第5課","t":"4-5-正義","k":"s","q":"晚近，美國某大學的原住民族學生積極在校園內建立原住民族社群、舉辦原住民族週活動。一位參與的原住民學生表示：我們在校園中非常辛苦，主流社會否定我們的存在、看不見我們。我們需要一個能看見彼此、相互共鳴的原住民族社群，一起打造美好未來。根據題文，學生建立社群的主要目的，最可能為下列何者？","o":[["A","保存快要被消滅和流失的原住民文化"],["B","矯正和補償過去曾發生的歷史不正義"],["C","要求國家政策平等尊重原住民族文化"],["D","凝聚原住民族群體身分肯認與行動力"]],"a":"D","e":"學生說主流社會「看不見我們」，需要「看見彼此、相互共鳴」的社群，目的是讓群體身分被肯認並凝聚行動力。","r":"114 學測社會第 48 題（題文節錄）","d":1},{"i":"b307","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某電視台報導某民間團體涉及詐騙，該團體認為報導不實，要求電視台提供時段讓他們說明，並刊登更正。該團體主張的是下列哪一項權利？","o":[["A","新聞自由"],["B","媒體近用權"],["C","隱私權"],["D","著作權"]],"a":"B","e":"要求媒體提供時段說明、刊登更正，是媒體近用權。","d":1},{"i":"b308","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"各大媒體連續一週以頭版報導青少年使用手機成癮的問題，之後的民調顯示，認為「手機成癮是最重要教育問題」的民眾比例明顯上升。這最能說明媒體的哪一種效果？","o":[["A","議題設定"],["B","框架效果"],["C","守門"],["D","第四權"]],"a":"A","e":"媒體大量報導，使民眾認為某議題最重要，是議題設定（影響「想什麼」）。","d":1},{"i":"b309","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"同一場抗議活動，甲報標題是「抗議癱瘓交通，市民怨聲載道」，乙報標題是「數千人上街，要求政府正視訴求」。兩報呈現方式的差異，最能說明下列何者？","o":[["A","議題設定"],["B","守門"],["C","媒體近用"],["D","框架"]],"a":"D","e":"同一事件選擇不同角度呈現，是框架（影響「怎麼想」）。","d":1},{"i":"b311","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"社群網站已成為民眾接觸新聞與政治意見的重要管道，然而網站平台多以分析並預測使用者偏好進行內容排序，持續提供使用者相似立場資訊，形成同溫層現象，此一現象不利於民主政治中多元意見交流。在不需由平台管理者判定內容立場或價值，以最小化限制言論自由疑慮的考量下，下列作法何者最可能改善上述狀況？","o":[["A","促使平台朝向公共媒體的方向轉型，以承擔公共責任"],["B","促使平台依不同立場分類內容，並主動呈現多元觀點"],["C","促使平台篩選各種「優質」的內容，並予以優先曝光"],["D","促使平台調整排序邏輯，增加隨機性與異質性的資訊"]],"a":"D","e":"調整排序、增加隨機與異質資訊，不必由平台判定內容立場，最能兼顧言論自由。(B)(C) 都要平台判斷立場或品質。","r":"115 學測社會第 3 題","d":1},{"i":"b312","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"報社編輯每天從上百則稿件中，決定哪些新聞刊在頭版、哪些不刊登。這是媒體的哪一種功能？","o":[["A","議題設定"],["B","框架"],["C","守門"],["D","媒體近用"]],"a":"C","e":"決定哪些訊息能成為新聞，是守門。","d":1},{"i":"b313","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲支持度 47%、乙 44%，抽樣誤差為正負 3 個百分點。下列解讀何者正確？","o":[["A","甲領先乙 3 個百分點，可確定甲領先"],["B","兩人支持度範圍重疊，無法斷定誰領先"],["C","乙一定落後，因為支持度較低"],["D","抽樣誤差越大，結果越精確"]],"a":"B","e":"甲 44～50%，乙 41～47%，範圍重疊，無法斷定誰領先。","d":1},{"i":"b314","s":"公民","u":"第4課","t":"4-5-民調","k":"s","q":"下列哪一種調查方式，所得結果最能代表全國民眾的意見？","o":[["A","依人口結構隨機抽樣，以電話訪問 1,000 人"],["B","在熱門網站讓網友自由投票，共 5 萬人參加"],["C","在某大學門口訪問 2,000 名大學生"],["D","請某政黨的支持者填寫線上問卷"]],"a":"A","e":"依人口結構隨機抽樣的樣本才具代表性；(B)(C)(D) 都是自願參加或特定群體。","d":1},{"i":"b315","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調註明「信心水準 95%，抽樣誤差 ±3 個百分點」。下列對「信心水準 95%」的解讀，何者最正確？","o":[["A","有 95% 的受訪者支持該候選人"],["B","該候選人有 95% 的機率當選"],["C","受訪者中有 95% 願意回答問題"],["D","以同樣方法重複調查，大約 95% 的結果範圍會包含真實的支持度"]],"a":"D","e":"信心水準是指「結果 ± 誤差」這個範圍的可靠程度，不是支持度、也不是當選機率。","d":1},{"i":"b316","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"下列有關民主治理的敘述，哪些正確？","o":[["A","政府主動公開預算資訊，屬於透明"],["B","立法院審查預算、質詢官員，屬於水平課責"],["C","媒體揭露官員弊案，屬於社會課責"],["D","定期選舉讓人民決定是否讓執政者連任，屬於垂直課責"],["E","治理強調由政府單獨決策，以提高效率"]],"a":"ABCD","e":"(E) 治理強調政府與民間、社區等多元行動者協力，不是政府單獨決策。","d":1},{"i":"b317","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義理論的敘述，哪些正確？","o":[["A","羅爾斯主張社會不平等的安排，應使最不利者獲得最大利益"],["B","效益主義重視最大多數人的最大幸福"],["C","自由至上主義主張國家應大量課稅，以縮小貧富差距"],["D","無知之幕是指人們在不知道自己社會地位的情況下選擇正義原則"],["E","效益主義可能為了整體利益而犧牲少數人的權益"]],"a":"ABDE","e":"(C) 自由至上主義反對國家以重稅重分配。","d":1},{"i":"b318","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義類型的敘述，哪些正確？","o":[["A","依考試成績錄取學生，是依「表現」分配資源"],["B","法院對犯罪者處以刑罰，屬於匡正正義"],["C","公開招標、利益迴避，屬於程序正義"],["D","匡正正義是指依「需要」分配資源"],["E","分配正義只能依「平均」一種標準"]],"a":"ABC","e":"(D) 依需要分配是分配正義的一種標準，匡正正義是對不法侵害的補償或懲罰；(E) 分配正義可依需要、表現、平均等不同標準。","d":1},{"i":"b319","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等原則的敘述，哪些正確？","o":[["A","形式平等是指所有人一律相同對待"],["B","實質平等會考量個人處境的差異"],["C","只要有差別待遇，就違反平等原則"],["D","合理的差別待遇須有正當目的，且手段與目的有合理關聯"],["E","積極平權措施的目的，是改善弱勢群體長期處於不利的處境"]],"a":"ABDE","e":"(C) 有正當目的、手段合理的差別待遇，不違反平等原則。","d":1},{"i":"b320","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關社會不平等的敘述，哪些正確？","o":[["A","文化資本包括品味、知識與學歷"],["B","社會資本是指個人的存款與房產"],["C","經濟資本較多的家庭，較能購買補習等教育資源"],["D","父母的教育程度可能影響子女的學業表現"],["E","社會不平等可能透過家庭代代相傳"]],"a":"ACDE","e":"(B) 存款與房產是經濟資本；社會資本是人際關係網絡。","d":1},{"i":"b321","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體功能與影響的敘述，哪些正確？","o":[["A","議題設定影響民眾「想什麼」"],["B","框架影響民眾「怎麼想」"],["C","守門是指政府事先審查新聞內容"],["D","媒體近用權包括民眾要求媒體更正與答辯"],["E","媒體被稱為第四權，是因為它是政府的第四個部門"]],"a":"ABD","e":"(C) 守門是記者、編輯篩選訊息，不是政府審查；(E) 第四權是指媒體監督行政、立法、司法三權，不是政府部門。","d":1},{"i":"b322","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","抽樣誤差越大，結果越不精確"],["B","網路自由投票的人數很多，就能代表全體民意"],["C","兩位候選人支持度的範圍重疊時，無法判斷誰領先"],["D","信心水準 95% 表示有 95% 的人支持該候選人"],["E","問卷題目帶有評價用語，可能引導受訪者的回答"]],"a":"ACE","e":"(B) 自願參加的網路投票不具代表性；(D) 信心水準與支持度無關。","d":1},{"i":"b323","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關網路時代資訊環境的敘述，哪些正確？","o":[["A","演算法推薦相似內容，容易形成同溫層"],["B","平台調整排序、增加異質資訊，有助於改善同溫層"],["C","判斷訊息真偽，應查證來源與證據"],["D","社群平台上的轉傳次數越多，表示訊息越可信"],["E","媒體識讀能力有助於民主社會的公共討論"]],"a":"ABCE","e":"(D) 轉傳多不等於真實，仍須查證來源與證據。","d":1},{"i":"b330","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市讓市民提出方案、分組討論，再投票決定部分預算的用途。這最能體現民主治理的哪一項原則？","o":[["A","參與"],["B","透明"],["C","課責"],["D","效能"]],"a":"A","e":"市民提案、討論、投票決定預算，是參與。","d":1},{"i":"b331","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"監察院對違法失職的官員提出彈劾。這屬於下列哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","社會課責"],["D","回應原則"]],"a":"B","e":"監察院監督行政官員，是政府部門之間的水平課責。","d":1},{"i":"b332","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某協會受政府委託舉辦教師進修課程，但課程中不僅塑造「男女應有舉止」的性別刻板角色，且有歧視同性戀者的內容。某公民團體發現上述情況後，透過各社群媒體，批判該課程違反性別平等理念。在引發關注後，又進一步邀請民意代表共同召開記者會，呼籲政府正視問題嚴重性。下列有關社會運動如何運作並產生作用的敘述，何者最能說明該公民團體的行動？","o":[["A","社會運動強調由下而上，因而致力批判政府施政且避免與官方合作"],["B","社會運動目標在於改變法規，故重視爭取輿論支持以取得執政權力"],["C","社會運動無論能否立即改變政策，若能引發公眾討論即屬發揮成效"],["D","社會運動重視減少社會成本，應盡量透過媒體推動以避免街頭衝突"]],"a":"C","e":"公民團體透過社群媒體與記者會引發關注，促成主管機關檢視，說明社會運動能引發公眾討論、推動改變。(A) 題文中團體邀民意代表合作，不是避免合作；(B) 目標不是取得執政權。","r":"113 分科公民與社會第 18 題（題文節錄）","d":1},{"i":"b333","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"下列何者最能說明審議民主與單純多數決的不同？","o":[["A","審議民主完全不需要投票"],["B","審議民主只讓專家參與討論"],["C","審議民主以人數多寡決定結果"],["D","審議民主重視參與者在充分資訊下交換理由、相互說服"]],"a":"D","e":"審議民主重視在充分資訊下交換理由；它最後仍可能投票，但不是只看人數。","d":1},{"i":"b334","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"政府與企業、非營利組織、社區居民共同規劃河川整治，各方分工合作。這種公共事務的處理模式稱為：","o":[["A","治理"],["B","統治"],["C","威權"],["D","代議"]],"a":"A","e":"政府與企業、非營利組織、居民協力處理公共事務，是治理。","d":1},{"i":"b335","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"下列有關透明與課責關係的敘述，何者最正確？","o":[["A","透明與課責彼此沒有關係"],["B","課責是透明的前提"],["C","政府資訊公開透明，人民才能據以監督、要求政府負責"],["D","只要定期選舉，政府就不需要公開資訊"]],"a":"C","e":"透明是課責的前提：資訊公開，人民才能監督、要求政府負責。","d":1},{"i":"b336","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市長表示：「興建這座焚化爐雖然會影響附近居民，但能解決全市大多數人的垃圾問題，使整體幸福最大。」市長的說法最接近下列哪一種正義理論？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的正義論"],["D","程序正義"]],"a":"A","e":"以整體幸福最大為標準，是效益主義。","d":1},{"i":"b337","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"「如果我不知道自己會生在富有或貧窮的家庭，我會選擇一個讓處境最不利的人得到最多照顧的制度。」這段話最接近下列哪一種主張？","o":[["A","效益主義"],["B","自由至上主義"],["C","形式平等"],["D","羅爾斯的正義論"]],"a":"D","e":"不知道自己出身（無知之幕）、照顧最不利者，是羅爾斯的正義論。","d":1},{"i":"b338","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲說：「我努力工作合法賺來的錢，國家不應該用重稅拿去補貼別人。」甲的主張最接近下列哪一種正義理論？","o":[["A","效益主義"],["B","自由至上主義"],["C","羅爾斯的正義論"],["D","匡正正義"]],"a":"B","e":"尊重合法財產、反對以重稅重分配，是自由至上主義。","d":1},{"i":"b339","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"醫院急診依病情輕重決定看診順序。這是分配正義中依據哪一種標準？","o":[["A","平均"],["B","表現"],["C","需要"],["D","先來後到"]],"a":"C","e":"依病情輕重，是依「需要」分配。","d":1},{"i":"b340","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"學校依學業成績高低頒發獎學金。這是分配正義中依據哪一種標準？","o":[["A","表現"],["B","需要"],["C","平均"],["D","抽籤"]],"a":"A","e":"依成績高低，是依「表現」（功績）分配。","d":1},{"i":"b341","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲開車撞傷乙，法院判決甲須賠償乙的醫藥費與精神損失。這屬於下列哪一種正義？","o":[["A","分配正義"],["B","程序正義"],["C","效益主義"],["D","匡正正義"]],"a":"D","e":"對受到不法侵害的人給予賠償，是匡正正義。","d":1},{"i":"b342","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某縣政府辦理工程招標，事先公告評選標準，評審委員與廠商有利害關係者一律迴避。這最符合下列哪一種正義？","o":[["A","分配正義"],["B","程序正義"],["C","匡正正義"],["D","效益主義"]],"a":"B","e":"公開標準、利益迴避，重視過程公正，是程序正義。","d":1},{"i":"b343","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"許多國家在各種公職選舉訂定女性保障名額。有學者提醒，基於選舉制度差異，有些公職選舉適合規劃保障名額，有些並不適合。考量這位學者的提醒，下列我國公職選舉中，哪項適合採取女性保障名額且論據最為合理？","o":[["A","縣市議員：地方自治最基層民意代表，可落實性別平等並深化基層民主"],["B","區域立委：歷年大多由男性候選人當選，可矯正制度所構成的性別歧視"],["C","直轄市長：最高層級地方政府首長，可彰顯女性參政意義及其政治地位"],["D","不分區立委：應選出的總席次為複數，可以兼顧反映民意以及性別平等"]],"a":"D","e":"保障名額要能在複數席次中「保留」給女性才能運作；不分區立委應選席次為複數，適合採行。(B)(C) 單一席次的選舉無法分配保障名額。","r":"111 分科公民與社會第 42 題（題文節錄）","d":1},{"i":"b344","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"政府對原住民學生升學給予加分優待，目的在改善其長期處於不利的處境。下列敘述何者正確？","o":[["A","這是積極平權措施，追求實質平等"],["B","這是形式平等的表現"],["C","這是違反平等原則的不合理差別待遇"],["D","這是效益主義的具體做法"]],"a":"A","e":"針對長期處於不利處境的群體給予協助，是積極平權，追求實質平等。","d":1},{"i":"b345","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某研究指出，與過去相較，男性願意承擔家務勞動的比例明顯上升；然而，雙薪家庭裡，女性仍是家務勞動的主要貢獻者。多數女性期待均等分工，但僅有薪資高的女性得以如願。根據上述發現，從關切性別平權的角度，下列推論何者最適切？","o":[["A","人的精力有限，故市場勞動貢獻越多者越無法對家務勞動有貢獻"],["B","職場的性別平等雖已充分落實，但家庭領域的性別平等仍待加強"],["C","男性的性別平權意識已有顯著提升，但女性卻仍然受限於傳統觀念之束縛"],["D","性平觀念雖普及，但雙薪家庭的市場勞動貢獻仍多立基於女性再生產勞動"]],"a":"D","e":"女性仍是家務主要貢獻者，雙薪家庭的市場勞動仍建立在女性的家務（再生產）勞動上。(B) 題文沒有說職場性平已充分落實。","r":"112 分科公民與社會第 1 題","d":1},{"i":"b346","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某國過去助產與育後照顧皆由助產士負責，醫師只在產婦難產時才介入協助。但後來人們認為新生兒應由醫師在醫院接生，才是進步的醫療，政府因而規定助產士須在醫師監督下才能從事助產工作，助產士與相關教育幾近消失。為解釋助產士的專業技術何以一度受輕視，乙學者指出：除了國家政策影響外，另一個重要原因是該職業向來由女性擔任，而以女性為主的職業專業性也經常被社會低估，人們對護理師的觀點即是一個明顯例子。依據題文，乙學者對於技術專業定位與性別密切相關的看法，最適合以何項論述表示？","o":[["A","要判斷新舊技術的專業性高低，有必要衡量其對於不同性別的影響"],["B","新舊技術的專業性高低判斷，會受到性別之社會階層化體制所影響"],["C","傳統性別角色使女性僅能從事照顧工作，導致其薪資與職業聲望皆較低"],["D","助產工作雖屬傳統技術，但並非專屬女性而是無論男女皆應能平等參與"]],"a":"B","e":"乙學者認為以女性為主的職業專業性常被低估，表示專業性高低的判斷受到性別階層化影響。","r":"113 分科公民與社會第 30 題（題文節錄）","d":1},{"i":"b347","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"阿恩與小新結婚，兩人原本都是上班族，但小新年邁的父親出現身體失能問題，經協商後共同決定由阿恩辭職照顧小新的父親。然而，阿恩母親卻認為她放棄工作的決定，其實是限縮女性的自我實現。下列哪項論述，最能呼應阿恩母親對她放棄工作的感想？","o":[["A","在父權文化的思考下，使居家照顧的工作與男性幾乎無關"],["B","社會規範形塑理想媳婦形象，女性被迫承擔照顧長輩責任"],["C","職場充斥性別不平等，女性常因遭受壓迫而選擇回歸家庭"],["D","相較於男性，女性職涯發展更常受到無形社會規範的制約"]],"a":"D","e":"阿恩母親認為辭職照顧是「限縮女性的自我實現」，呼應女性職涯更常受到無形社會規範的制約。","r":"114 分科公民與社會第 34 題（題文節錄）","d":1},{"i":"b348","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某民主國家為舉辦國際級運動會，決定在首都興建全新的大型主場館，場館預定地內的一座社會住宅因而須強制拆除。該社宅的居民大多是高齡人士，且該國政府並未提出合宜的安置計畫，許多居民因而拒絕搬遷。該社會住宅拆遷爭議，若以社會階層化的觀點而言，與下列哪個情境最接近？","o":[["A","某社區因人口外流與高齡化，商店街爆發倒閉潮，失業者發動集體抗議"],["B","某老舊眷村面臨文資保存議題，市政府未取得住戶共識即強行拆除屋舍"],["C","某捷運預定路線將行經貧民區，未先與該地的居民溝通便著手進行施作"],["D","某地區因鄰近機場故承受起降噪音與其他限制，卻未獲政府發予回饋金"]],"a":"C","e":"社宅居民多是高齡、經濟弱勢者，政府未提出安置就強制拆遷；與捷運經過貧民區卻未與居民溝通最接近，都是弱勢階層承擔發展的代價。","r":"112 分科公民與社會第 27 題（題文節錄）","d":1},{"i":"b349","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"小美說話得體、熟悉各種藝術作品，這些素養主要來自家庭從小的耳濡目染。這屬於下列哪一種資本？","o":[["A","經濟資本"],["B","社會資本"],["C","文化資本"],["D","政治資本"]],"a":"C","e":"家庭長期薰陶的素養與品味，是文化資本。","d":1},{"i":"b350","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某人透過參加校友會、同鄉會建立人脈網絡，因而取得創業資金與第一批客戶。他運用的主要是下列哪一種資本？",
