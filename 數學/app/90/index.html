4","$6$"],["5","$8$"]],"a":"4","e":"$(x-1)^2+(y+2)^2=25$，$d=\\frac{\\lvert3-8+25\\rvert}5=4$，弦長 $2\\sqrt{25-16}=6$。","d":1},{"i":"b855","s":"數學","u":"單元07","t":"07-弦長","k":"s","q":"直線 $x+y=2$ 被圓 $x^2+y^2=10$ 所截的弦長為多少？","o":[["1","$\\sqrt2$"],["2","$2\\sqrt2$"],["3","$4$"],["4","$8$"],["5","$4\\sqrt2$"]],"a":"5","e":"$d=\\frac2{\\sqrt2}=\\sqrt2$，弦長 $2\\sqrt{10-2}=2\\sqrt8=4\\sqrt2$。\n〔易錯〕$d^2=2$，不是 4。","d":1},{"i":"b856","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"直線 $x-y=1$ 與圓 $x^2+y^2=25$ 的交點為下列哪一個選項？","o":[["1","$(3,4)$、$(-4,-3)$"],["2","$(4,-3)$、$(-3,4)$"],["3","$(4,3)$、$(-3,-4)$"],["4","$(1,0)$、$(0,-1)$"],["5","$(5,4)$、$(-4,-5)$"]],"a":"3","e":"$y=x-1$ 代入：$x^2-x-12=0$，$x=4$ 或 $-3$，對應 $y=3$、$-4$。","d":1},{"i":"b857","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若一圓同時與直線 $x-2y=4$ 及 $x-2y=-6$ 相切，則此圓的半徑為多少？","o":[["1","$2\\sqrt5$"],["2","$10$"],["3","$5$"],["4","$\\sqrt{10}$"],["5","$\\sqrt5$"]],"a":"5","e":"兩平行切線距離＝直徑：$\\frac{\\lvert4-(-6)\\rvert}{\\sqrt5}=\\frac{10}{\\sqrt5}=2\\sqrt5$，半徑 $\\sqrt5$。\n〔易錯〕要除以 $\\sqrt{1^2+2^2}$；算出的是直徑，還要再除以 2。","d":1},{"i":"b858","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若一圓同時與直線 $3x+4y=7$ 及 $3x+4y=-13$ 相切，且圓心在 $x$ 軸上，則此圓的方程式為下列哪一個選項？","o":[["1","$(x-1)^2+y^2=4$"],["2","$(x+1)^2+y^2=16$"],["3","$x^2+(y+1)^2=4$"],["4","$(x+1)^2+y^2=4$"],["5","$(x+3)^2+y^2=4$"]],"a":"4","e":"直徑 $\\frac{20}5=4$，$r=2$。圓心在兩線正中間的線 $3x+4y=-3$ 上，又在 $x$ 軸上，$y=0$ 得 $x=-1$。","d":1},{"i":"b859","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上兩點 $A(-2,0)$、$B(4,0)$，點 $P$ 在直線 $x+y=6$ 上且 $\\angle APB=90^\\circ$，則滿足條件的 $P$ 點有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","無限多個"]],"a":"1","e":"$P$ 在以 $\\overline{AB}$ 為直徑的圓上：圓心 $(1,0)$，$r=3$；到 $x+y=6$ 的 $d=\\frac5{\\sqrt2}\\approx3.5>3$，不相交，0 個。","d":1},{"i":"b860","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"若直線 $3x-4y=k$ 與圓 $x^2+y^2=4$ 交於相異兩點，則滿足條件的整數 $k$ 共有幾個？","o":[["1","19"],["2","20"],["3","21"],["4","9"],["5","10"]],"a":"1","e":"交兩點 $\\frac{\\lvert k\\rvert}5<2$，$\\lvert k\\rvert<10$，$-9$～9 共 19 個。\n〔易錯〕「交於相異兩點」不含相切，用小於；卷 01 第 20 題是「有交點」，含等號。","d":1},{"i":"b861","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"通過點 $(5,1)$ 可作幾條與圓 $(x-2)^2+(y+3)^2=25$ 相切的直線？","o":[["1","0 條"],["2","1 條"],["3","2 條"],["4","3 條"],["5","無限多條"]],"a":"2","e":"差：$3^2+4^2=25$，剛好等於 $r^2$，點在圓上，只有 1 條切線。"},{"i":"b862","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"通過點 $(-1,2)$ 可作幾條與圓 $x^2+y^2-4x+2y-20=0$ 相切的直線？","o":[["1","0 條"],["2","1 條"],["3","2 條"],["4","3 條"],["5","無限多條"]],"a":"1","e":"$(x-2)^2+(y+1)^2=25$。差：$3^2+3^2=18<25$，點在圓內，0 條。"},{"i":"b863","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"若原點在圓 $x^2+y^2+6x-8y+c=0$ 上，則此圓的半徑為多少？","o":[["1","$3$"],["2","$4$"],["3","$5$"],["4","$\\sqrt7$"],["5","$25$"]],"a":"3","e":"原點代入只剩 $c$，在圓上 $c=0$；$r^2=9+16-0=25$，$r=5$。"},{"i":"b864","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"若點 $(1,-1)$ 在圓 $x^2+y^2-2x+ky-3=0$ 的內部，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$k>-3$"],["2","$k<-3$"],["3","$k>3$"],["4","$k<3$"],["5","$-3<k<3$"]],"a":"1","e":"代入：$1+1-2-k-3<0$，$-k<3$，$k>-3$。\n〔易錯〕兩邊同除以 $-1$，不等號要反向。"},{"i":"b865","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"圓 $x^2+y^2=25$ 上，與直線 $3x-4y=15$ 的距離為 2 的點共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"4","e":"$d=\\frac{15}5=3$，$r=5$。落點 $3-2=1$（中，2 點）、$3+2=5$（邊，1 點），共 3 個。"},{"i":"b866","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"圓 $(x-1)^2+(y-1)^2=8$ 上，與直線 $x+y=0$ 的距離為 $3\\sqrt2$ 的點共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"2","e":"圓心代入 $x+y$ 得 2，$d=\\frac2{\\sqrt2}=\\sqrt2$，$r=2\\sqrt2$。落點 $\\sqrt2-3\\sqrt2=-2\\sqrt2$（邊，1 點）、$4\\sqrt2$（外，0 點），共 1 個。"},{"i":"b867","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"圓 $x^2+y^2=16$ 上，與直線 $y=1$ 的距離為 2 的點共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"5","e":"$d=1$，$r=4$。落點 $-1$、$3$，都在中間，共 4 個。"},{"i":"b868","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"圓 $x^2+y^2=9$ 上，與直線 $x=5$ 的距離為 1 的點共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"1","e":"$d=5$，$r=3$。落點 4、6，都超過 3，0 個。"},{"i":"b869","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上有三點 $A(0,0)$、$B(0,6)$、$C(4,0)$。若動點 $P$ 滿足 $\\overline{PA}=\\overline{PB}$ 且 $\\overline{PA}=\\frac12\\overline{PC}$，則動點 $P$ 所成的圖形為下列何者？","o":[["1","1 個點"],["2","2 個點"],["3","一直線"],["4","一圓"],["5","不存在"]],"a":"5","e":"中垂線 $y=3$；$4(x^2+y^2)=(x-4)^2+y^2$ 整理成 $\\left(x+\\frac43\\right)^2+y^2=\\frac{64}9$，$r=\\frac83$。上下範圍 $-\\frac83$～$\\frac83$，$y=3$ 在外面，不存在。"},{"i":"b870","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上有三點 $A(0,0)$、$B(2,0)$、$C(0,3)$。若動點 $P$ 滿足 $\\overline{PA}=\\overline{PB}$ 且 $\\overline{PA}=\\frac12\\overline{PC}$，則動點 $P$ 所成的圖形為下列何者？","o":[["1","1 個點"],["2","2 個點"],["3","一直線"],["4","一圓"],["5","不存在"]],"a":"2","e":"中垂線 $x=1$；整理成 $x^2+(y+1)^2=4$，左右範圍 $-2$～2，$x=1$ 在中間，2 點。"},{"i":"b871","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若圓 $x^2+y^2-6x+2y+k=0$ 與 $y$ 軸相切，則 $k$ 的值為何？","o":[["1","$10$"],["2","$9$"],["3","$1$"],["4","$-1$"],["5","$3$"]],"a":"3","e":"圓心 $(3,-1)$，$r^2=10-k$。與 $y$ 軸相切：$r=3$，$10-k=9$，$k=1$。"},{"i":"b872","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"若圓 $x^2+y^2+4x-6y+k=0$ 與 $x$ 軸不相交，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$k>4$"],["2","$k<13$"],["3","$4<k<13$"],["4","$k<4$"],["5","$9<k<13$"]],"a":"3","e":"圓心 $(-2,3)$，$r^2=13-k$，到 $x$ 軸 $d=3$。不相交 $13-k<9$，$k>4$；是圓 $k<13$。"},{"i":"b873","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若直線 $5x-12y+k=0$ 與圓 $(x-2)^2+(y+1)^2=4$ 相切，則 $k$ 的所有可能值為下列哪一個選項？","o":[["1","$-4$ 或 $48$"],["2","$26$ 或 $-26$"],["3","$48$"],["4","$4$ 或 $-48$"],["5","$22$ 或 $-22$"]],"a":"4","e":"圓心代入 $5x-12y$ 得 22，$r\\times13=26$，$-k=22\\pm26$，$-k=48$ 或 $-4$，$k=-48$ 或 4。\n〔易錯〕最後變號；(1) 是忘了變號。"},{"i":"b874","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若直線 $x+y=k$ 與圓 $(x-1)^2+(y-2)^2=2$ 相切，則 $k$ 的所有可能值為下列哪一個選項？","o":[["1","$1$ 或 $5$"],["2","$-1$ 或 $-5$"],["3","$\\pm2$"],["4","$3\\pm\\sqrt2$"],["5","$1$ 或 $-5$"]],"a":"1","e":"$x+y-k=0$，圓心代入 $x+y$ 得 3，$\\frac{\\lvert3-k\\rvert}{\\sqrt2}=\\sqrt2$，$\\lvert3-k\\rvert=2$，$k=1$ 或 5。"},{"i":"b875","s":"數學","u":"單元07","t":"07-弦長","k":"s","q":"直線 $3x+4y=0$ 被圓 $x^2+y^2-8x-4y-5=0$ 所截的弦長為多少？","o":[["1","$3$"],["2","$8$"],["3","$4$"],["4","$2\\sqrt{21}$"],["5","$6$"]],"a":"5","e":"$(x-4)^2+(y-2)^2=25$，$d=\\frac{12+8}5=4$，弦長 $2\\sqrt{25-16}=6$。"},{"i":"b876","s":"數學","u":"單元07","t":"07-弦長","k":"s","q":"直線 $x-y=0$ 被圓 $(x-3)^2+(y-1)^2=10$ 所截的弦長為多少？","o":[["1","$2\\sqrt2$"],["2","$8$"],["3","$4$"],["4","$2$"],["5","$4\\sqrt2$"]],"a":"5","e":"$d=\\frac{\\lvert3-1\\rvert}{\\sqrt2}=\\sqrt2$，弦長 $2\\sqrt{10-2}=4\\sqrt2$。"},{"i":"b877","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若一圓同時與直線 $2x+y=1$ 及 $2x+y=11$ 相切，則此圓的半徑為多少？","o":[["1","$2\\sqrt5$"],["2","$5$"],["3","$10$"],["4","$\\sqrt5$"],["5","$\\sqrt{10}$"]],"a":"4","e":"兩線距離 $\\frac{10}{\\sqrt5}=2\\sqrt5$ 是直徑，半徑 $\\sqrt5$。"},{"i":"b878","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若一圓同時與直線 $5x-12y=3$ 及 $5x-12y=-23$ 相切，則此圓的半徑為多少？","o":[["1","$2$"],["2","$26$"],["3","$13$"],["4","$1$"],["5","$\\frac12$"]],"a":"4","e":"兩線距離 $\\frac{\\lvert3-(-23)\\rvert}{13}=2$ 是直徑，半徑 1。\n〔易錯〕(1) 是忘了除以 2。"},{"i":"b879","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上兩點 $A(1,0)$、$B(5,0)$，點 $P$ 在直線 $y=2$ 上且 $\\angle APB=90^\\circ$，則滿足條件的 $P$ 點有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","無限多個"]],"a":"2","e":"以 $\\overline{AB}$ 為直徑的圓：圓心 $(3,0)$、$r=2$；到 $y=2$ 的距離 2，剛好相切，1 個 $(3,2)$。"},{"i":"b880","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"若直線 $x-2y=k$ 與圓 $x^2+y^2=5$ 有交點，則滿足條件的整數 $k$ 共有幾個？","o":[["1","9"],["2","10"],["3","11"],["4","5"],["5","6"]],"a":"3","e":"有交點：$\\frac{\\lvert k\\rvert}{\\sqrt5}\\le\\sqrt5$，$\\lvert k\\rvert\\le5$，$-5$～5 共 11 個。"},{"i":"b881","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"某公園有一座圓形噴水池，在坐標平面上，池緣的方程式為 $x^2+y^2-4x+2y-20=0$（單位：公尺）。公園打算在下列某處設置路燈，並從路燈拉一條直線步道，使步道恰與池緣相切。下列哪一個位置，恰好只能拉出一條這樣的步道？","o":[["1","$(5,3)$"],["2","$(6,1)$"],["3","$(-2,3)$"],["4","$(2,-7)$"],["5","$(0,0)$"]],"a":"1","e":"配方 $(x-2)^2+(y+1)^2=25$。「只能拉一條切線」就是點在圓上。差：$(5,3)$ 是 $9+16=25$，在圓上。$(6,1)$ 20、$(0,0)$ 5 在圓內（0 條）；$(-2,3)$ 32、$(2,-7)$ 36 在圓外（2 條）。"},{"i":"b882","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"若方程式 $x^2+y^2+2kx-4y+k+6=0$ 的圖形為一圓，且原點在此圓的外部，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$k>2$"],["2","$-6<k<-1$ 或 $k>2$"],["3","$k<-1$ 或 $k>2$"],["4","$-6<k<-1$"],["5","$k>-6$"]],"a":"2","e":"兩個條件都要成立：\n- 是圓：$r^2=k^2+4-(k+6)>0$，$k^2-k-2>0$，$(k-2)(k+1)>0$，得 $k>2$ 或 $k<-1$。\n- 原點在外部：原點代入只剩常數 $k+6>0$，得 $k>-6$。\n\n取交集：$-6<k<-1$ 或 $k>2$。\n〔易錯〕(3) 忘了原點條件，(5) 忘了「是圓」的條件。"},{"i":"b883","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"已知圓 $C:x^2+y^2-2x+4y-4=0$ 上，與直線 $L:3x+4y+k=0$ 的距離為 1 的點恰有 3 個，則 $k$ 的所有可能值為下列哪一個選項？","o":[["1","$5$ 或 $-15$"],["2","$10$ 或 $-10$"],["3","$15$"],["4","$15$ 或 $-5$"],["5","$-5$"]],"a":"4","e":"圓心 $(1,-2)$，$r=3$。距離 1 的點恰 3 個，表示兩個落點一個在中間、一個剛好在邊上：$d+1=3$，所以 $d=2$。\n$\\frac{\\lvert3-8+k\\rvert}5=2$，$\\lvert k-5\\rvert=10$，$k=15$ 或 $-5$。"},{"i":"b884","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"坐標平面上，動點 $P$ 到原點的距離恰為它到點 $(3,0)$ 距離的 2 倍。若直線 $x+y=k$ 與點 $P$ 的軌跡有交點，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$2\\le k\\le6$"],["2","$4-2\\sqrt2<k<4+2\\sqrt2$"],["3","$k\\le4+2\\sqrt2$"],["4","$-2\\sqrt2\\le k\\le2\\sqrt2$"],["5","$4-2\\sqrt2\\le k\\le4+2\\sqrt2$"]],"a":"5","e":"$x^2+y^2=4\\left[(x-3)^2+y^2\\right]$ 整理成 $(x-4)^2+y^2=4$，圓心 $(4,0)$、$r=2$。有交點：$\\frac{\\lvert4-k\\rvert}{\\sqrt2}\\le2$，$\\lvert k-4\\rvert\\le2\\sqrt2$。\n〔易錯〕「有交點」含相切，要用 $\\le$；(2) 是「交於相異兩點」的答案。"},{"i":"b885","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"與直線 $3x+4y=1$ 平行，且與圓 $x^2+y^2-6x+2y+6=0$ 相切的直線方程式為下列哪一個選項？","o":[["1","$3x+4y=5$ 或 $3x+4y=-15$"],["2","$3x+4y=10$ 或 $3x+4y=-10$"],["3","$3x+4y=15$ 或 $3x+4y=-5$"],["4","$3x+4y=11$ 或 $3x+4y=-1$"],["5","$4x-3y=15$ 或 $4x-3y=-5$"]],"a":"3","e":"圓心 $(3,-1)$，$r^2=9+1-6=4$，$r=2$。設切線 $3x+4y=c$：$\\frac{\\lvert9-4-c\\rvert}5=2$，$\\lvert5-c\\rvert=10$，$c=-5$ 或 15。"},{"i":"b886","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上兩點 $A(-3,0)$、$B(3,0)$。若直線 $y=x+k$ 上恰有一點 $P$ 使得 $\\angle APB=90^\\circ$，則 $k$ 的值為下列哪一個選項？","o":[["1","$\\pm3$"],["2","$\\pm3\\sqrt2$"],["3","$\\pm6$"],["4","$3\\sqrt2$"],["5","$\\pm9$"]],"a":"2","e":"$P$ 在以 $\\overline{AB}$ 為直徑的圓 $x^2+y^2=9$ 上。恰一點表示直線與圓相切：$\\frac{\\lvert k\\rvert}{\\sqrt2}=3$，$k=\\pm3\\sqrt2$。"},{"i":"b887","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-4x-6y+4=0$，下列敘述哪些正確？","o":[["1","原點在圓 $C$ 的外部"],["2","圓 $C$ 與 $x$ 軸相切"],["3","圓 $C$ 與 $y$ 軸交於相異兩點"],["4","直線 $x+y=1$ 與圓 $C$ 不相交"],["5","通過點 $(5,3)$ 可作兩條與圓 $C$ 相切的直線"]],"a":"123","e":"圓心 $(2,3)$，$r^2=4+9-4=9$，$r=3$。\n- (1) 常數 $4>0$，原點在外部。\n- (2) 圓心到 $x$ 軸 3＝$r$，相切。\n- (3) 圓心到 $y$ 軸 2＜3，交兩點。\n- (4) $d=\\frac{\\lvert2+3-1\\rvert}{\\sqrt2}=2\\sqrt2\\approx2.83<3$，相交，錯。\n- (5) $(5-2)^2+0=9$ 剛好等於 $r^2$，點在圓上，只能作 1 條，錯。"},{"i":"b888","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $x^2+y^2=25$ 與直線 $L:3x+4y=k$，下列敘述哪些正確？","o":[["1","當 $k=25$ 時，$L$ 與圓相切"],["2","當 $k=20$ 時，圓上與 $L$ 的距離為 1 的點恰有 3 個"],["3","當 $k=0$ 時，$L$ 被圓所截的弦長為 10"],["4","使 $L$ 與圓有交點的整數 $k$ 共有 50 個"],["5","當 $k=15$ 時，$L$ 被圓所截的弦長為 8"]],"a":"1235","e":"- (1) $d=\\frac{25}5=5=r$，相切。\n- (2) $d=4$，落點 3（中，2 點）、5（邊，1 點），共 3 個。\n- (3) 直線過圓心，弦長＝直徑 10。\n- (4) $\\lvert k\\rvert\\le25$，共 $2\\times25+1=51$ 個，錯。\n- (5) $d=3$，弦長 $2\\sqrt{25-9}=8$。"},{"i":"b889","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C$ 同時與直線 $L_1:x-2y=3$ 及 $L_2:x-2y=-7$ 相切，下列敘述哪些正確？","o":[["1","圓 $C$ 的半徑為 $\\sqrt5$"],["2","圓 $C$ 的直徑為 10"],["3","圓 $C$ 的圓心在直線 $x-2y=-2$ 上"],["4","若圓心在 $y$ 軸上，則圓心為 $(0,1)$"],["5","若圓心在 $x$ 軸上，則圓 $C$ 的方程式為 $(x-2)^2+y^2=5$"]],"a":"134","e":"- (1)(2) 兩線距離 $\\frac{10}{\\sqrt5}=2\\sqrt5$ 是直徑，半徑 $\\sqrt5$；(2) 錯。\n- (3) 中間線常數 $\\frac{3+(-7)}2=-2$，所以是 $x-2y=-2$。\n- (4) 代 $x=0$：$-2y=-2$，$y=1$。\n- (5) 代 $y=0$：$x=-2$，方程式是 $(x+2)^2+y^2=5$，錯。"},{"i":"b890","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上兩點 $A(0,0)$、$B(4,0)$，點 $P$ 滿足 $\\angle APB=90^\\circ$。下列敘述哪些正確？","o":[["1","點 $P$ 在圓 $(x-2)^2+y^2=4$ 上（$P$ 不為 $A$、$B$）"],["2","直線 $y=2$ 上恰有一個這樣的點 $P$"],["3","直線 $y=3$ 上有兩個這樣的點 $P$"],["4","直線 $x=1$ 上有兩個這樣的點 $P$"],["5","直線 $x+y=5$ 上有這樣的點 $P$"]],"a":"124","e":"$P$ 在以 $\\overline{AB}$ 為直徑的圓 $(x-2)^2+y^2=4$ 上。\n- (2) $y=2$：$d=2=r$，恰 1 點。\n- (3) $y=3$：$d=3>2$，0 點，錯。\n- (4) $x=1$：$d=1<2$，2 點。\n- (5) $d=\\frac{\\lvert2-5\\rvert}{\\sqrt2}=\\frac3{\\sqrt2}\\approx2.12>2$，沒有交點，錯。"},{"i":"b891","s":"數學","u":"單元07","t":"07-k範圍","k":"f","q":"若點 $(a,1)$ 在圓 $x^2+y^2-4x+2y-4=0$ 的內部，則 $a$ 的範圍為＿＿＿＿＿。","a":"$2-\\sqrt5<a<2+\\sqrt5$","e":"代入小於 0：$a^2+1-4a+2-4<0$，$a^2-4a-1<0$，得 $2-\\sqrt5<a<2+\\sqrt5$。"},{"i":"b892","s":"數學","u":"單元07","t":"07-k範圍","k":"f","q":"若圓 $x^2+y^2+2x-4y+k=0$ 與 $y$ 軸交於相異兩點，且與 $x$ 軸不相交，則 $k$ 的範圍為＿＿＿＿＿。","a":"$1<k<4$","e":"圓心 $(-1,2)$，$r^2=5-k$。\n- 與 $y$ 軸交兩點：$r>1$，$5-k>1$，$k<4$。\n- 與 $x$ 軸不相交：$r<2$，$5-k<4$，$k>1$。\n\n合起來 $1<k<4$。"},{"i":"b893","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"圓 $(x-1)^2+(y+1)^2=9$ 上，與直線 $4x-3y+3=0$ 的距離為 1 的點共有＿＿＿＿＿個。","a":"3","e":"圓心代入 $4x-3y+3$ 得 $4+3+3=10$，$d=2$，$r=3$。落點 1（中，2 點）、3（邊，1 點），共 3 個。"},{"i":"b894","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"坐標平面上有三點 $A(0,0)$、$B(4,0)$、$C(0,6)$。滿足 $\\overline{PA}=\\overline{PB}$ 且 $\\overline{PA}=\\frac12\\overline{PC}$ 的點 $P$ 共有＿＿＿＿＿個。","a":"2","e":"$\\overline{PA}=\\overline{PB}$ 得 $x=2$。$4(x^2+y^2)=x^2+(y-6)^2$ 整理成 $x^2+(y+2)^2=16$，左右範圍 $-4$～4，$x=2$ 在中間，2 個。"},{"i":"b895","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"若直線 $x+2y+k=0$ 與圓 $(x-2)^2+(y-1)^2=5$ 相切，則 $k=$＿＿＿＿＿。","a":"$1$ 或 $-9$","e":"圓心代入 $x+2y$ 得 4，$\\frac{\\lvert4+k\\rvert}{\\sqrt5}=\\sqrt5$，$\\lvert4+k\\rvert=5$，$k=1$ 或 $-9$。"},{"i":"b896","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"直線 $x-y+1=0$ 被圓 $x^2+y^2-6x-2y+1=0$ 所截的弦長為＿＿＿＿＿。","a":"$3\\sqrt2$","e":"圓心 $(3,1)$，$r^2=9+1-1=9$；$d=\\frac{\\lvert3-1+1\\rvert}{\\sqrt2}=\\frac3{\\sqrt2}$，$d^2=\\frac92$。弦長 $2\\sqrt{9-\\frac92}=2\\cdot\\frac3{\\sqrt2}=3\\sqrt2$。"},{"i":"b897","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"一圓同時與直線 $3x-4y=4$ 及 $3x-4y=-16$ 相切，且圓心在 $y$ 軸上，則此圓的方程式為＿＿＿＿＿。","a":"$x^2+\\left(y-\\frac32\\right)^2=4$","e":"兩線距離 $\\frac{20}5=4$ 是直徑，$r=2$。中間線 $3x-4y=\\frac{4+(-16)}2=-6$，代 $x=0$：$-4y=-6$，$y=\\frac32$。\n〔易錯〕最後要除以係數 $-4$，不能直接把 $-6$ 當成 $y$。"},{"i":"b898","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $3x+4y=k$ 與圓 $x^2+y^2-2x-3=0$ 交於相異兩點，則滿足條件的整數 $k$ 共有＿＿＿＿＿個。","a":"19","e":"圓心 $(1,0)$，$r^2=1+3=4$，$r=2$。$\\frac{\\lvert3-k\\rvert}5<2$，$\\lvert k-3\\rvert<10$，$-7<k<13$，整數 $-6$～12 共 19 個。\n〔易錯〕圓心不在原點，範圍不是對稱的 $\\pm10$。"},{"i":"b899","s":"數學","u":"單元05","t":"05-面積","k":"s","q":"坐標平面上，$P(a,0)$ 為 $x$ 軸上一點，其中 $a>0$。令 $L_1$、$L_2$ 為通過 $P$ 點，斜率分別為 $-\\frac43$、$-\\frac32$ 的直線。已知 $L_1$、$L_2$ 分別與兩坐標軸圍成的兩個直角三角形的面積差為 3，試問 $a$ 值為何？","o":[["1","$3\\sqrt2$"],["2","$6$"],["3","$6\\sqrt2$"],["4","$9$"],["5","$8\\sqrt2$"]],"a":"2","e":"兩直線的 $x$ 截距都是 $a$，$y$ 截距為 $\\frac43a$、$\\frac32a$。面積 $\\frac23a^2$、$\\frac34a^2$，差 $\\frac1{12}a^2=3$，$a=6$。","r":"114 學測 A"},{"i":"b900","s":"數學","u":"單元05","t":"單元05-綜合","k":"s","q":"某射擊遊戲的玩家要避開障礙物射擊目標。今在遊戲畫面中設立一直角坐標系，以長方形螢幕左下角 $O$ 為原點，螢幕下方的邊緣為 $x$ 軸、螢幕左方的邊緣為 $y$ 軸，目標物放在點 $P(12,10)$。畫面中有兩面牆（牆厚度可忽略不計），一面牆由點 $A(10,5)$ 水平延伸到點 $B(15,5)$，另一面牆由點 $C(0,6)$ 水平延伸到點 $D(9,6)$。若玩家在點 $Q$ 可直線射擊點 $P$ 的目標物，不會被兩面牆阻擋。下列哪一個選項有可能是點 $Q$ 的坐標？","o":[["1","$(6,3)$"],["2","$(7,3)$"],["3","$(8,5)$"],["4","$(9,1)$"],["5","$(9,2)$"]],"a":"2","e":"可射擊 ⟺ 直線 $PQ$ 的斜率介於 $m_{PD}=\\frac43$ 與 $m_{PA}=\\frac52$ 之間。五個選項的 $m_{PQ}$ 依序為 $\\frac76$、$\\frac75$、$\\frac54$、$3$、$\\frac83$，只有 $\\frac75$ 符合。","r":"113 學測 B（答對率 70%，原題附圖）"},{"i":"b901","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"點 $A(1,0)$ 在單位圓 $\\Gamma:x^2+y^2=1$ 上。試問：$\\Gamma$ 上除了 $A$ 點以外，還有幾個點到直線 $L:y=2x$ 的距離，等於 $A$ 點到 $L$ 的距離？","o":[["1","1 個"],["2","2 個"],["3","3 個"],["4","4 個"],["5","0 個"]],"a":"3","e":"$A$ 到 $L:2x-y=0$ 的距離為 $\\frac2{\\sqrt5}<1$。到 $L$ 距離為 $\\frac2{\\sqrt5}$ 的點落在 $L$ 兩側各一條平行線上，每條與單位圓交於 2 點，共 4 點，扣除 $A$ 剩 3 點。","r":"108 學測（答對率 53%）"},{"i":"b902","s":"數學","u":"單元06","t":"06-讀圓心","k":"s","q":"設 $\\Gamma$ 為坐標平面上的圓，點 $(0,0)$ 在 $\\Gamma$ 的外部且點 $(2,6)$ 在 $\\Gamma$ 的內部。試問下列哪一個選項是正確的？","o":[["1","$\\Gamma$ 的圓心不可能在第二象限"],["2","$\\Gamma$ 的圓心可能在第三象限且此時 $\\Gamma$ 的半徑必定大於 10"],["3","$\\Gamma$ 的圓心可能在第一象限且此時 $\\Gamma$ 的半徑必定小於 10"],["4","$\\Gamma$ 的圓心可能在 $x$ 軸上且此時圓心的 $x$ 坐標必定小於 10"],["5","$\\Gamma$ 的圓心可能在第四象限且此時 $\\Gamma$ 的半徑必定大於 10"]],"a":"5","e":"圓心離 $(2,6)$ 比離 $(0,0)$ 近，在中垂線 $x+3y=10$ 靠近 $(2,6)$ 的一側：$x+3y>10$。(1) $(-1,4)$ 可，錯。(2) 第三象限 $x+3y<0$，錯。(3) 圓心 $(100,100)$ 時半徑大於 10，錯。(4) $y=0$ 時 $x>10$，錯。(5) $b<0$ 時 $a>10-3b>10$，$r>\\sqrt{(a-2)^2+(b-6)^2}>\\sqrt{8^2+6^2}=10$，對。","r":"106 學測（答對率 34%）"},{"i":"b904","s":"數學","u":"單元05","t":"05-斜率","k":"m","q":"平面上有一個等腰直角三角形，已知其三邊的斜率分別為 $m_1$、$m_2$、$m_3$ 且 $m_1>m_2>m_3$，請選出正確的選項。","o":[["1","$m_1>0$"],["2","$m_2\\ge0$"],["3","$m_3<0$"],["4","$m_1=-m_3$"],["5","$m_1m_3=-1$"]],"a":"13","e":"兩股互相垂直，斜率乘積 $-1$，一正一負，故最大的 $m_1>0$、最小的 $m_3<0$。斜邊的斜率可能是三者中任一位置，$m_2$ 可正可負，(4)(5) 也不一定成立。","r":"建國中學段考"},{"i":"b905","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上有一圓，其圓心為 $A(a,b)$，且此圓與兩坐標軸皆相切。另有一點 $P(c,c)$，其中 $a>c>0$，且已知 $\\overline{PA}=a+c$。試選出正確的選項。","o":[["1","$a=b$"],["2","點 $P$ 位於直線 $x+y=0$ 上"],["3","點 $P$ 在此圓內"],["4","$\\frac{a+c}{b-c}=\\sqrt2$"],["5","$\\frac ac=2+3\\sqrt2$"]],"a":"14","e":"與兩軸相切，$\\lvert a\\rvert=\\lvert b\\rvert=r$。若 $b=-a$，$\\overline{PA}^2=(a-c)^2+(a+c)^2=(a+c)^2$ 得 $a=c$，矛盾，故 $b=a$。$\\overline{PA}=\\sqrt2(a-c)=a+c$，(4) 對。(2) $2c\\ne0$，錯。(3) $\\overline{PA}>r$，圓外，錯。(5) $\\frac ac=\\frac{\\sqrt2+1}{\\sqrt2-1}=3+2\\sqrt2$，錯。","r":"112 學測 B（答對率 29%）"},{"i":"b906","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"考慮坐標平面上滿足方程式 $\\frac{2^{x^2}}{8}=\\frac{4^x}{2^{y^2}}$ 的點 $P(x,y)$。試選出正確的選項。","o":[["1","當 $x=3$ 時，滿足此方程式的解有相異 2 個"],["2","若點 $(a,b)$ 滿足此方程式，則點 $(-a,-b)$ 也滿足此方程式"],["3","所有可能的點 $P(x,y)$ 構成的圖形為一個圓"],["4","點 $P(x,y)$ 可能在直線 $x+y=4$ 上"],["5","對於所有可能的點 $P(x,y)$，其 $x-y$ 的最大值為 $1+2\\sqrt2$"]],"a":"35","e":"$2^{x^2-3}=2^{2x-y^2}$，得 $(x-1)^2+y^2=4$。(1) $x=3$ 時 $y=0$，1 解，錯。(2) $(1,2)$ 在圖形上而 $(-1,-2)$ 不在，錯。(4) 圓心 $(1,0)$ 到 $x+y=4$ 的距離 $\\frac3{\\sqrt2}>2$，錯。(5) $x-y$ 的範圍為 $1\\pm2\\sqrt2$，對。","r":"114 學測 A"},{"i":"b907","s":"數學","u":"單元05","t":"05-斜率","k":"m","q":"考慮坐標平面上的直線 $L:5y+(2k-4)x-10k=0$（其中 $k$ 為一實數），以及長方形 $OABC$，其頂點坐標為 $O(0,0)$、$A(10,0)$、$B(10,6)$、$C(0,6)$。設 $L$ 分別交直線 $OC$、直線 $AB$ 於點 $D$、$E$。試選出正確的選項。","o":[["1","當 $k=4$ 時，直線 $L$ 通過點 $A$"],["2","若直線 $L$ 通過點 $C$，則 $L$ 的斜率為 $-\\frac52$"],["3","直線 $L$ 不可能通過長方形 $OABC$ 的中心"],["4","若 $k=\\frac12$，則線段 $\\overline{DE}$ 在長方形 $OABC$ 內部（含邊界）"],["5","若線段 $\\overline{DE}$ 在長方形 $OABC$ 內部（含邊界），則 $L$ 的斜率可能為 $\\frac3{10}$"]],"a":"135","e":"$(5y-4x)+k(2x-10)=0$，恆過 $(5,4)$。(1) $4x+5y=40$ 過 $(10,0)$，對。(2) 過 $(0,6)$、$(5,4)$ 的斜率 $-\\frac25$，錯。(3) 過 $(5,4)$、$(5,3)$ 的只有 $x=5$，$L$ 不是鉛直線，對。(4) 斜率 $\\frac35$，$E$ 的 $y$ 坐標 7，出界，錯。(5) $\\lvert m\\rvert\\le\\frac25$ 時 $\\overline{DE}$ 在內部，$\\frac3{10}$ 可以，對。","r":"112 學測 A（講義修改版）"},{"i":"b908","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"有一射擊遊戲，將發射台設置於坐標平面的原點，並放置三個半徑為 1 的圓盤靶子，其圓心分別為 $(2,2)$、$(4,6)$ 與 $(8,1)$。玩家選定一正數 $a$，並按下按鈕後，發射台將向點 $(1,a)$ 方向發射一道雷射光束（形成一射線）。假設雷射光束擊中靶子後可以穿透並繼續沿原方向前進（削過圓盤邊緣也視為擊中）。試選出正確的選項。","o":[["1","雷射光束落在通過原點且斜率為 $a$ 的直線上"],["2","若 $a=\\frac32$，則雷射光束會擊中圓心為 $(4,6)$ 的圓盤靶子"],["3","玩家可以僅發射一道雷射光束就擊中三個圓盤靶子"],["4","玩家至少需要發射三道雷射光束才可擊中三個圓盤靶子"],["5","玩家發射一道雷射光束後，若擊中圓心為 $(8,1)$ 的圓盤靶子，則 $a\\le\\frac{16}{63}$"]],"a":"125","e":"(1) 方向 $(1,a)$，斜率 $a$，對。(2) $y=\\frac32x$ 過 $(4,6)$，對。(5) $\\frac{\\lvert8a-1\\rvert}{\\sqrt{a^2+1}}\\le1$ 得 $0\\le a\\le\\frac{16}{63}$，對。擊中 $(4,6)$ 的靶需 $a>1$，一道不可能全中，(3) 錯；$a=\\frac32$ 同時擊中 $(2,2)$、$(4,6)$ 的靶，再一道射 $(8,1)$，兩道即可，(4) 錯。","r":"111 學測 B（答對率 54%）"},{"i":"b909","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"某高中已有一個長 90 公尺、寬 60 公尺的足球練習場。若想要在足球練習場的外圍鋪設內圈總長度為 400 公尺的跑道，跑道規格為左右兩側各是直徑相同的半圓，而中間是上下各一條的直線跑道，直線跑道與足球練習場的長邊平行。則一條直線跑道 $\\overline{AB}$ 長度的最大可能整數值為 $\\boxed{11\\text{-}1}\\,\\boxed{11\\text{-}2}\\,\\boxed{11\\text{-}3}$ 公尺。","a":"$105$","e":"$\\overline{AB}=200-\\pi r$，$2r\\ge60$，$\\overline{AB}\\le200-30\\pi\\approx105.75$。","r":"108 學測（答對率 26%）"},{"i":"b910","s":"數學","u":"單元06","t":"06-點圓最值","k":"f","q":"點 $K(-1,-1)$，圓 $C:(x-3)^2+(y-2)^2=9$，點 $P$ 在圓 $C$ 上，$\\overline{PK}$ 的最大值為 $\\boxed{12\\text{-}1}$。","a":"$8$","e":"圓心 $(3,2)$ 到 $K$ 的距離 $\\sqrt{16+9}=5$，$K$ 在圓外，最大值 $5+3=8$。","r":"建國中學段考（修改）"},{"i":"b911","s":"數學","u":"單元05","t":"單元05-綜合","k":"f","q":"坐標平面上，設 $P$、$A$、$B$ 為圖形 $x^2+y^2-6x-2y-15=0$ 上三點，其中 $P$ 點坐標為 $(0,-3)$，$A$ 點坐標為 $(7,-2)$，且 $\\angle APB$ 為直角，則 $B$ 點坐標為 $\\left(\\boxed{13\\text{-}1}\\,\\boxed{13\\text{-}2},\\ \\boxed{13\\text{-}3}\\right)$。","a":"$(-1,4)$","e":"圓心 $(3,1)$。$\\angle APB=90^\\circ$，$\\overline{AB}$ 為直徑，圓心為 $\\overline{AB}$ 中點，$B=2(3,1)-(7,-2)=(-1,4)$。","r":"武陵高中段考"},{"i":"b912","s":"數學","u":"單元05","t":"05-面積","k":"f","q":"正方形紙張上有一點 $P$，$P$ 點距離紙張左邊界 6 公分，距離下邊界 8 公分。今將紙張的左下角 $O$ 點往內摺至 $P$ 點，則摺進去的三角形面積是 $\\dfrac{\\boxed{14\\text{-}1}\\,\\boxed{14\\text{-}2}\\,\\boxed{14\\text{-}3}}{\\boxed{14\\text{-}4}\\,\\boxed{14\\text{-}5}}$ 平方公分。","a":"$\\frac{625}{24}$","e":"**14. $\\frac{625}{24}$**　$O(0,0)$、$P(6,8)$，摺痕為中垂線 $3x+4y=25$，交兩邊於 $\\left(\\frac{25}3,0\\right)$、$\\left(0,\\frac{25}4\\right)$，面積 $\\frac{625}{24}$。","r":"112 學測 B（答對率 16%，原題附圖）"},{"i":"b913","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"坐標平面上，設 $L_1$、$L_2$ 為通過點 $(3,1)$ 且斜率分別為 $m$、$-m$ 的兩條直線，其中 $m$ 為一實數。另設 $\\Gamma$ 為圓心在原點的一個圓。已知 $\\Gamma$ 與 $L_1$ 交於相異兩點 $A$、$B$，且知圓心到 $L_1$ 的距離為 1，又 $\\Gamma$ 與 $L_2$ 相切，則弦 $\\overline{AB}$ 的長度為 $\\dfrac{\\boxed{15\\text{-}1}\\,\\boxed{15\\text{-}2}}{\\boxed{15\\text{-}3}}$。","a":"$\\frac{24}5$","e":"**15. $\\frac{24}5$**　$\\frac{\\lvert1-3m\\rvert}{\\sqrt{m^2+1}}=1$，$m=\\frac34$（$m=0$ 時兩線重合，不合）。$L_2:3x+4y-13=0$，半徑 $\\frac{13}5$，$\\overline{AB}=2\\sqrt{\\frac{169}{25}-1}=\\frac{24}5$。","r":"114 學測 A"},{"i":"b914","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"坐標平面上，一個半徑為 12 的圓與直線 $x+y=0$ 相交於兩點，且這兩點的距離為 8。若此圓與直線 $x+y=24$ 交於 $P$、$Q$ 兩點，則線段 $\\overline{PQ}$ 的長度為 $\\boxed{16\\text{-}1}\\sqrt{\\boxed{16\\text{-}2}}$。","a":"$8\\sqrt7$","e":"圓心到 $x+y=0$ 的距離 $\\sqrt{144-16}=8\\sqrt2$。兩平行線相距 $12\\sqrt2$，圓心在兩線之間，到 $x+y=24$ 的距離 $4\\sqrt2$，半弦 $\\sqrt{144-32}=4\\sqrt7$。","r":"110 指考數甲（答對率 40%）"},{"i":"b915","s":"數學","u":"單元05","t":"05-面積","k":"f","q":"坐標平面上，在以 $O(0,0)$、$A(0,1)$、$B(1,1)$、$C(1,0)$ 為頂點的正方形（含邊界）內，令 $R$ 為滿足下述條件的點 $P(x,y)$ 所成區域：與點 $P(x,y)$ 的距離為 $\\lvert x-y\\rvert$ 之所有點所成圖形完全落在正方形 $OABC$（含邊界）內。則區域 $R$ 的面積為 $\\dfrac{\\boxed{17\\text{-}1}}{\\boxed{17\\text{-}2}}$。","a":"$\\frac13$","e":"在 $x\\ge y$ 一側，半徑 $x-y$ 不超過 $y$ 與 $1-x$，與 $y\\le x$ 圍成三角形 $(0,0)$、$(1,1)$、$\\left(\\frac23,\\frac13\\right)$，面積 $\\frac16$；兩側合計 $\\frac13$。","r":"113 學測 A（答對率 5%）"},{"i":"b917","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"圓形看板的半徑平方為 $\\dfrac{\\boxed{19\\text{-}1}\\,\\boxed{19\\text{-}2}}{\\boxed{19\\text{-}3}}$。（選填題，4 分）","a":"$\\frac{25}2$","c":"地面同一直線上原有三根垂直地面的小柱子 $\\overline{A_1A_2}$、$\\overline{B_1B_2}$、$\\overline{C_1C_2}$，$A_1$、$B_1$、$C_1$ 在地面上依序由左而右排列。已知 $\\overline{A_1A_2}=2$，$\\overline{B_1B_2}=1$，$\\overline{C_1C_2}=1$，且 $\\overline{A_1B_1}=2$，$\\overline{B_1C_1}=1$。今欲在此三根小柱子上架設一圓形看板，使看板的圓周通過 $A_2$、$B_2$、$C_2$ 三點；工作人員擔心看板不牢靠，欲在 $\\overline{C_1C_2}$ 右方 3 單位處，再架設第四根垂直地面的柱子 $\\overline{D_1D_2}$，由下方撐住看板。以 $B_1$ 為原點、地面為 $x$ 軸、向右為正向、向上為 $y$ 軸正向建立坐標平面。","e":"**19. $\\frac{25}2$**　設圓心 $\\left(\\frac12,t\\right)$，由 $MA_2^2=MB_2^2$：$\\frac{25}4+(t-2)^2=\\frac14+(t-1)^2$，$t=\\frac92$，$r^2=\\frac14+\\frac{49}4=\\frac{25}2$。","r":"科園實中段考（改編為混合題）"},{"i":"b958","s":"歷史","u":"L4 日治","t":"L4 日治-綜合","k":"s","q":"1622 年荷蘭東印度公司占領澎湖，1624 年轉往大員（今臺南安平）建立據點。荷蘭轉往大員最直接的原因是：","o":[["A","明朝出兵交涉，荷蘭撤離澎湖"],["B","日本鎖國，荷蘭失去對日貿易"],["C","西班牙已先占領大員"],["D","鄭成功封鎖臺灣海峽"]],"a":"A","e":"荷蘭 1622 年占澎湖，明朝視澎湖為版圖而出兵交涉，荷蘭 1624 年撤離，轉往大員。(B) 日本鎖國在 1630 年代；(C) 西班牙在北部的雞籠；(D) 鄭成功 1661 年才來臺。"},{"i":"b959","s":"歷史","u":"L4 日治","t":"L4 日治-綜合","k":"s","q":"十七世紀荷蘭人來臺後，西班牙官員的報告提到：「荷蘭與日本帶給我們極大的損失，如去年荷蘭人擄獲一艘我國船隻，船上載著大量銀兩。……我建議在臺灣的另一個港口取得據點，便可將荷蘭人逐出他們的現居地。如果國王能在那裡建一商館，將使我們的根據地回復舊時榮光。」報告中「另一個港口」和「根據地」分別是指：","o":[["A","打狗、澳門"],["B","基隆、馬尼拉"],["C","安平、麻六甲"],["D","淡水、巴達維亞"]],"a":"B","e":"西班牙要取得臺灣「另一個港口」對抗大員的荷蘭，就是北部的基隆（雞籠）；西班牙在東亞的根據地是菲律賓馬尼拉。","r":"113 學測社會第 4 題"},{"i":"b960","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"十七世紀西班牙傳教士提及：中國商人帶大量貨物來基隆，若貨物只能賣給西班牙駐軍，駐軍又因未領薪而缺錢購買商品，那麼中國商人將不再來基隆貿易。由此來看，基隆吸引中國商人前來貿易的主因是：","o":[["A","此處為天然良港，適合作為貿易據點"],["B","當地有西班牙駐軍，可保障交易安全"],["C","在此處與駐軍貿易，可取得美洲白銀"],["D","港區已是龐大市場，有利於發展貿易"]],"a":"C","e":"中國商人來基隆是為了賣貨換錢；西班牙駐軍的錢來自美洲白銀，所以吸引力在白銀。","r":"112 學測社會第 8 題"},{"i":"b961","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"下列有關西班牙在臺灣北部經營的敘述，何者正確？","o":[["A","以熱蘭遮城為統治中心"],["B","由東印度公司負責經營"],["C","統治時間約三十八年"],["D","道明會傳教士在當地傳教"]],"a":"D","e":"(A) 熱蘭遮城是荷蘭的；(B) 東印度公司是荷蘭的經營主體；(C) 西班牙只有約 16 年（1626～1642）。"},{"i":"b962","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"某政權將原住民各社的交易權公開招標，得標商人可獨占該社的買賣，政府只收取標金。這種制度是：","o":[["A","王田制"],["B","贌社制"],["C","地方會議"],["D","班兵制"]],"a":"B","e":"交易權招標、商人獨占、官方收標金，是贌社。(A) 王田是土地制度。"},{"i":"b963","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"1652 年，臺灣漢人不滿人頭稅等負擔而起事，結果遭統治者聯合原住民鎮壓。此事件為：","o":[["A","朱一貴事件"],["B","林爽文事件"],["C","施九緞事件"],["D","郭懷一事件"]],"a":"D","e":"1652 年郭懷一事件，荷蘭聯合原住民鎮壓。(A) 1721、(B) 1786、(C) 1888 都是清代。"},{"i":"b964","s":"歷史","u":"L4 日治","t":"L4 日治-綜合","k":"s","q":"史書記載：十七世紀下半葉，山東官員一旦知悉當地有船隻欲前往日本，往往立即派人搗毀船隻。在此同時，浙江、南京地方官員追討海賊時，還會將前往日本的商船扣押，並燒毀貨物。而廣東地方官員若查出有船主來自敵對陣營，會立即緝捕問斬、沒收其商品。這些地方官員採取上述措施的最主要目的為何？","o":[["A","確保東亞海域航道暢通"],["B","防止中國貨幣外流南洋"],["C","嚴禁走私保障本國稅收"],["D","斷絕鄭氏政權物資來源"]],"a":"D","e":"清初以遷界令與海禁封鎖沿海，搗毀船隻、扣押前往日本的商船，目的在切斷鄭氏的海上貿易與物資。","r":"115 學測社會第 7 題"},{"i":"b965","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"今日臺南「新營」、高雄「左營」、「前鎮」等地名，最可能源自下列哪一種制度？","o":[["A","鄭氏時期軍隊就地屯墾的營盤田"],["B","荷治時期由公司擁有土地的王田"],["C","清領時期由福建輪調來臺的班兵"],["D","日治時期以十戶為一甲的保甲"]],"a":"A","e":"「營、鎮」等地名來自鄭氏軍隊屯墾的營盤田。"},{"i":"b966","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-鄭制","k":"s","q":"1666 年，陳永華輔佐鄭經時的重要作為是：","o":[["A","設立臺灣府與臺灣、鳳山、諸羅三縣"],["B","建孔廟、設學校，推行教育"],["C","召集各社長老舉行地方會議"],["D","奏請廢除渡臺禁令"]],"a":"B","e":"陳永華 1666 年建孔廟、立學校。(A) 是清廷 1684 年；(C) 是荷蘭；(D) 是沈葆楨。"},{"i":"b967","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"1683 年鄭克塽降清後，清廷內部曾討論是否保留臺灣，最後在施琅力爭下決定納入版圖。1684 年清廷在臺灣設立的行政區劃為：","o":[["A","承天府、天興縣、萬年縣"],["B","臺北府與恆春縣"],["C","臺灣府及臺灣、鳳山、諸羅三縣"],["D","臺灣省及三府一州"]],"a":"C","e":"清廷 1684 年設一府三縣。(A) 是鄭氏；(B) 是 1875 年沈葆楨增設；(D) 是建省後。"},{"i":"b968","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清領前期實施渡臺禁令、禁止私販鐵器、不許築城，這些政策共同的考量最可能是：","o":[["A","防止臺灣再成為反清的基地"],["B","保護原住民的土地權利"],["C","鼓勵移民開墾以增加稅收"],["D","發展對外貿易以充實國庫"]],"a":"A","e":"三項禁令都是「防」：防人、防武器、防據守，總原則是為防臺而治臺。"},{"i":"b969","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"清廷治臺二百多年期間，多次調整臺灣地方行政區劃，其最主要的考量依據是：","o":[["A","根據自然地理的形勢，分區管理"],["B","根據交通線的延伸，作線狀開發"],["C","因應民變，考量治安，置縣設廳"],["D","隨漢人開發，設廳以保障原住民"]],"a":"C","e":"清代行政區調整多在重大民變之後，以治安為主要考量，例如林爽文事件後的調整。","r":"110 學測社會第 18 題"},{"i":"b970","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"學者指出：清代臺灣地圖除呈現一地的自然環境特徵外，往往也能反映出繪製官員對當時社會情況的關注重點。具體而言，政府會因統治、用兵和管理之需而繪製地圖，所繪地圖具有定疆劃界、兵防規劃、因應因地制宜等功效。表 1 是彙整自康熙（1696 年）、乾隆（1742、1747 年）不同時期《臺灣府志》地圖上出現的地名註記類別及數量統計。根據表 1，下列推論何者最合理？\n\n表 1\n\n| 地名註記類別（個） | 1696 | 1742 | 1747 |\n|---|---|---|---|\n| 山岳 | 24 | 29 | 127 |\n| 官署 | 5 | 8 | 7 |\n| 社 | 61 | 24 | 未註記 |\n| 一般地名（泛指與漢人有關的地名） | 59 | 95 | 17 |\n| 其他 | 56 | 23 | 88 |","o":[["A","山岳數量增加，顯示歷經多次民變，官府更重視近山治安"],["B","官署數量變化不大，顯示清代設官署治理的範圍並未變化"],["C","社的數量減少，顯示原住民歸化後，以一般地名取代社名"],["D","一般地名數量變化，顯示受渡臺禁令影響，漢人大幅減少"]],"a":"A","e":"1747 年山岳註記大增（127），配合清代多次民變後重視近山治安的背景。(B) 官署數量不變不代表治理範圍不變；(C) 1747 年「社」是未註記，不是被取代；(D) 渡臺禁令下漢人仍持續增加。","r":"115 學測社會第 8 題"},{"i":"b971","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-開港","k":"s","q":"十九世紀晚期臺灣開港通商，西方傳教士來傳教，但在漢人市街多遇反彈，故部分傳教士在洋行商人協助下，進入淺山地區的「熟番」部落傳教。此傳教活動範圍的擴張最可能和洋行商人經營哪項事業有關？","o":[["A","種椰取汁"],["B","圍獵捕鹿"],["C","插蔗煮糖"],["D","伐樟結腦"]],"a":"D","e":"淺山地區產樟樹，洋行經營樟腦業，傳教士隨之進入淺山部落。","r":"112 學測社會第 10 題"},{"i":"b972","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"s","q":"某位官員在臺灣推動清賦，丈量土地後改由小租戶負擔田賦，大租戶原可收取的大租則減少四成（減四留六）；他也興建鐵路、架設電報。這位官員是：","o":[["A","沈葆楨"],["B","劉銘傳"],["C","陳永華"],["D","施琅"]],"a":"B","e":"清賦、減四留六、鐵路、電報都是劉銘傳的新政。"},{"i":"b973","s":"歷史","u":"L4 日治","t":"武裝抗日","k":"s","q":"1895 年成立的臺灣民主國，年號「永清」。由此推論，其性質最可能是：","o":[["A","臺灣人民建立獨立國家，脫離清朝"],["B","清廷正式派兵收復臺灣的軍事組織"],["C","為抵抗日本接收、爭取國際干涉的權宜組織"],["D","日本為統治臺灣而扶植的地方政權"]],"a":"C","e":"年號「永清」表示仍奉清朝，目的在抵抗日本接收、爭取國際干涉，不是獨立建國。"},{"i":"b974","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"1896 年施行的「六三法」，最主要的影響是：","o":[["A","臺灣總督可發布具有法律效力的命令，權力高度集中"],["B","臺灣人可選出代表進入日本帝國議會"],["C","日本本國法律原則上全部施行於臺灣"],["D","設立臺灣議會審查總督府預算"]],"a":"A","e":"六三法授權總督發布具法律效力的律令，行政兼立法，權力集中。(C) 是 1921 年法三號的精神。"},{"i":"b975","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"日治時期統治臺灣的法律依據，依時間先後排列，下列何者正確？","o":[["A","法三號→六三法→三一法"],["B","三一法→六三法→法三號"],["C","六三法→法三號→三一法"],["D","六三法→三一法→法三號"]],"a":"D","e":"六三法（1896）→三一法（1906）→法三號（1921）。"},{"i":"b976","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"日治初期，總督府將臺灣人民十戶編為一甲、十甲為一保，協助警察維持治安、調查戶口，並實施連坐責任。這項制度是：","o":[["A","隘勇線"],["B","保甲制度"],["C","地方協議會"],["D","班兵制度"]],"a":"B","e":"十戶一甲、十甲一保、連坐，是保甲制度。"},{"i":"b977","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"1938 年，臺灣總督府發起「寺廟整理運動」，拆毀媽祖廟等不同廟宇，還禁止媽祖遶境活動。總督府發起「寺廟整理運動」最主要的動機是：","o":[["A","要積極破除迷信"],["B","推動皇民化運動"],["C","要廣設國民學校"],["D","改建為軍事基地"]],"a":"B","e":"1938 年正值皇民化時期，寺廟整理是為了以日本神道信仰取代臺灣民間信仰。","r":"110 學測社會第 67 題（題文節錄）"},{"i":"b978","s":"歷史","u":"L4 日治","t":"L4 日治-綜合","k":"s","q":"日治時期某報紙發刊詞提及：「……臺灣學堂裡的教科（科目），又多不用到漢文，對於漢文一學很不用工（很消極）……漢文因這樣難懂又沒獎勵的機會，所以我們臺灣的兄弟自二十年來已經廢棄不慣了。」此發刊詞的寫作背景，和日本殖民政府正在推行的哪項政策有關？","o":[["A","因應教師、通譯的需求，成立國語學校"],["B","公學校皆改為國民學校，推動義務教育"],["C","推行日臺共學，常用日語者可入小學校"],["D","日本領臺初期，將書房、義塾納入管理"]],"a":"C","e":"發刊詞說臺灣人已二十年不習漢文，時間約在 1920 年代，正值內地延長主義，推行日臺共學。(B) 國民學校是 1941 年；(A)(D) 是領臺初期。","r":"112 學測社會第 11 題"},{"i":"b979","s":"歷史","u":"L4 日治","t":"L4 日治-綜合","k":"s","q":"日治時期，某篇小說寫到，主人翁在內地時，被問到來自何處，總是謊稱來自四國或九州，也只敢以日本姓名與朋友交往，深怕被人認出真實的出身。主人翁表示，在內地時，他對於內地人、本島人、半島人、還是中國人，看一眼總能辨認出來。主人翁的時代背景和身分最可能是：","o":[["A","1900 年代前往日本工作的朝鮮學者"],["B","1930 年代在滿洲國任教的日本教師"],["C","1940 年代前往日本求學的臺灣學生"],["D","1950 年代回歸日本的前殖民地官員"]],"a":"C","e":"主人翁在日本隱藏出身、改用日本姓名，反映 1940 年代皇民化時期臺灣人的身分處境；「本島人」是當時對臺灣人的稱呼。","r":"115 學測社會第 9 題"},{"i":"b980","s":"歷史","u":"L4 日治","t":"社會運動","k":"s","q":"1920 年代某團體在各地舉辦演講會、設置讀報社、演出文化劇，向民眾傳播新知與民族意識。這個團體最可能是：","o":[["A","臺灣文化協會"],["B","臺灣民眾黨"],["C","臺灣農民組合"],["D","臺灣地方自治聯盟"]],"a":"A","e":"演講會、讀報社、文化劇是臺灣文化協會的啟蒙活動。"},{"i":"b981","s":"歷史","u":"L4 日治","t":"社會運動","k":"s","q":"1925 年，彰化二林地區的蔗農因甘蔗收購價格與秤重問題，與製糖會社發生衝突。此事件之後，下列哪一個組織成立，推動全島性的農民運動？","o":[["A","臺灣文化協會"],["B","臺灣民眾黨"],["C","臺灣工友總聯盟"],["D","臺灣農民組合"]],"a":"D","e":"1925 年二林蔗農事件後，1926 年成立臺灣農民組合。"},{"i":"b982","s":"歷史","u":"L4 日治","t":"武裝抗日","k":"s","q":"1930 年，莫那魯道率領族人襲擊運動會場的日本人，之後遭日軍強力鎮壓。此事件與涉及的族群，下列何者正確？","o":[["A","西來庵事件，漢人"],["B","牡丹社事件，排灣族"],["C","霧社事件，賽德克族"],["D","二林事件，蔗農"]],"a":"C","e":"1930 年霧社事件，莫那魯道為賽德克族。"},{"i":"b983","s":"歷史","u":"L4 戰後","t":"統治方針","k":"s","q":"1945 年國民政府接收臺灣後設置的機構，其首長同時兼任警備總司令，被時人比擬為「新總督府」。這個機構是：","o":[["A","臺灣省行政長官公署"],["B","臺灣省政府"],["C","臺灣總督府"],["D","臺灣省議會"]],"a":"A","e":"行政長官公署由陳儀任行政長官兼警備總司令，被比為「新總督府」；1947 年二二八事件後改組為臺灣省政府。"},{"i":"b984","s":"歷史","u":"L4 戰後","t":"L4 戰後-綜合","k":"s","q":"下列有關「動員戡亂時期臨時條款」與「戒嚴令」的比較，何者正確？","o":[["A","兩者都在 1987 年同時廢止"],["B","臨時條款主要凍結憲法部分規定、擴大總統權力，戒嚴令主要限制人民的集會結社與言論自由"],["C","戒嚴令主要擴大總統權力，臨時條款主要限制人民的人身自由"],["D","兩者都在二二八事件之前公布"]],"a":"B","e":"臨時條款（1948）管憲政，戒嚴令（1949）管社會自由。(A) 解嚴 1987、終止動員戡亂 1991；(D) 兩者都在 1947 年二二八之後。"},{"i":"b985","s":"歷史","u":"L4 戰後","t":"L4 戰後-綜合","k":"s","q":"下列民主化事件，依時間先後排列何者正確？\n甲、解除戒嚴　乙、民主進步黨成立　丙、首次總統直選　丁、終止動員戡亂時期","o":[["A","甲乙丁丙"],["B","乙丁甲丙"],["C","甲丁乙丙"],["D","乙甲丁丙"]],"a":"D","e":"民進黨成立 1986 → 解嚴 1987 → 終止動員戡亂 1991 → 總統直選 1996。\n〔易錯〕民進黨在戒嚴中成立，先於解嚴。"},{"i":"b986","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"m","q":"下列有關荷蘭東印度公司統治臺灣的敘述，哪些正確？","o":[["A","以贌社制度將原住民村社的交易權公開招標"],["B","透過地方會議，由各社長老推選臺灣長官"],["C","傳教士以羅馬字拼寫原住民語言，進行教化"],["D","向漢人課徵人頭稅，是郭懷一事件的背景之一"],["E","在臺灣設置一府三縣進行治理"]],"a":"ACD","e":"(B) 地方會議是公司授杖確認長老，並非由長老推選；(E) 一府三縣是清代。"},{"i":"b987","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-鄭制","k":"m","q":"下列有關鄭氏政權的敘述，哪些正確？","o":[["A","鄭成功來臺的主要目的是開發臺灣、發展農業"],["B","設承天府及天興、萬年二縣"],["C","以贌社標金作為最主要的財源"],["D","清廷實施遷界令與海禁，鄭氏仍藉海上貿易維持財源"],["E","1683 年施琅攻下澎湖後，鄭克塽降清"]],"a":"BDE","e":"(A) 鄭氏來臺是軍事需要，要建立反清基地、解決糧食；(C) 贌社是荷蘭的制度，鄭氏財源以屯墾與海上貿易為主。"},{"i":"b988","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"m","q":"下列有關清領前期治臺政策與影響的敘述，哪些正確？","o":[["A","渡臺禁令限制攜眷，造成男女比例失衡、羅漢腳增加"],["B","班兵由臺灣本地招募，以熟悉地形"],["C","土牛溝與番界的設置，目的在漢番隔離"],["D","官府不許築城，民變發生時常迅速蔓延"],["E","「三年一小反，五年一大亂」反映的是吏治與治安不佳的社會印象"]],"a":"ACDE","e":"(B) 班兵由福建各營輪調來臺，不在臺募兵，目的在防止軍隊在地化。"},{"i":"b989","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-沈劉","k":"m","q":"下列有關清領後期臺灣的敘述，哪些正確？","o":[["A","依天津條約、北京條約開港，安平、淡水、打狗、雞籠陸續開放"],["B","開港後出口以茶、糖、樟腦為大宗"],["C","牡丹社事件後，沈葆楨奏請廢除渡臺禁令，推動開山撫番"],["D","臺灣建省後首任巡撫為沈葆楨"],["E","劉銘傳清賦採「減四留六」，引發施九緞事件"]],"a":"ABCE","e":"(D) 首任巡撫是劉銘傳；沈葆楨是牡丹社事件後來臺。"},{"i":"b990","s":"歷史","u":"L4 日治","t":"統治方針","k":"m","q":"下列日治時期的政策與其所屬統治階段，哪些配對正確？","o":[["A","保甲制度——綏撫時期（1895～1919）"],["B","日臺共學——內地延長主義時期"],["C","國語家庭、改姓名——皇民化時期"],["D","1935 年首次地方選舉——皇民化時期"],["E","法三號——綏撫時期"]],"a":"ABC","e":"(D) 1935 年地方選舉屬內地延長主義時期；(E) 法三號 1921 年施行，屬內地延長主義時期。"},{"i":"b991","s":"歷史","u":"L4 日治","t":"社會運動","k":"m","q":"下列有關日治時期社會運動的敘述，哪些正確？","o":[["A","臺灣文化協會以演講會、讀報社、文化劇推動啟蒙"],["B","臺灣民眾黨是文協分裂後由左派另組的政黨"],["C","二林蔗農事件與甘蔗收購價格等爭議有關"],["D","臺灣議會設置請願運動最後獲帝國議會通過"],["E","1915 年西來庵事件後，抗日主軸轉向體制內的政治與文化運動"]],"a":"ACE","e":"(B) 民眾黨是文協分裂後右派（蔣渭水等）另組；(D) 請願十餘次都未獲通過。"},{"i":"b992","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"根據〈諭閩粵民人〉所述，族群衝突的起因應與下列何者有關？","o":[["A","朱一貴事件係因為閩粵械鬥而起，故事件後閩粵族群關係緊張"],["B","事件時粵籍移民協助官府鎮壓朱一貴，導致閩粵族群關係緊張"],["C","事件後官府厲行渡臺禁令，粵籍移民僅能偷渡來臺故多有衝突"],["D","事件後官府劃設番界，卻無力約束界外不同族群私墾者的衝突"]],"a":"B","c":"朱一貴事件後，隔年（1722）某官員於〈諭閩粵民人〉的文告中提及：「以後不許再分黨羽，再尋仇釁，各釋前怨，共敦新好。」1764 年《重修鳳山縣志》收錄這份文告時，不僅將篇名改為〈閩粵相仇諭〉，內容也改成：「以後不許再分黨羽，再尋仇釁。漳、泉、海豐（廣東惠州府）、三陽（廣東潮州府）之人經過客莊，客民經過漳、泉村落，宜各息前怨，共敦新好。」請問：","e":"文告要閩粵「各釋前怨」，表示衝突起於事件之中；朱一貴事件時粵籍移民組義民協助官府，閩粵關係因而緊張。(A) 朱一貴事件不是因閩粵械鬥而起。","r":"114 學測社會第 29、30 題"},{"i":"b993","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"《重修鳳山縣志》內容提及的「客民」，並未包括海豐、三陽，且將這兩個族群與漳、泉並列，由此判斷當時人最可能是以何種方式來區別族群？","o":[["A","省籍區別"],["B","來臺先後"],["C","血緣宗族"],["D","語言習俗"]],"a":"D","c":"朱一貴事件後，隔年（1722）某官員於〈諭閩粵民人〉的文告中提及：「以後不許再分黨羽，再尋仇釁，各釋前怨，共敦新好。」1764 年《重修鳳山縣志》收錄這份文告時，不僅將篇名改為〈閩粵相仇諭〉，內容也改成：「以後不許再分黨羽，再尋仇釁。漳、泉、海豐（廣東惠州府）、三陽（廣東潮州府）之人經過客莊，客民經過漳、泉村落，宜各息前怨，共敦新好。」請問：","e":"海豐、三陽屬廣東，卻與福建的漳、泉並列，不算「客民」，表示當時以語言習俗區分族群，而非省籍。","r":"114 學測社會第 29、30 題"},{"i":"b994","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"朱一貴事件發生於清領前期。下列何者最能說明清領前期民變頻繁的結構原因？","o":[["A","吏治不佳、班兵素質差，加上單身移民眾多，社會不穩"],["B","清廷積極開山撫番，引發原住民強烈反抗"],["C","開港通商後洋行壟斷貿易，造成農民破產"],["D","劉銘傳清賦增加田賦，觸動地方利益"]],"a":"A","c":"朱一貴事件後，隔年（1722）某官員於〈諭閩粵民人〉的文告中提及：「以後不許再分黨羽，再尋仇釁，各釋前怨，共敦新好。」1764 年《重修鳳山縣志》收錄這份文告時，不僅將篇名改為〈閩粵相仇諭〉，內容也改成：「以後不許再分黨羽，再尋仇釁。漳、泉、海豐（廣東惠州府）、三陽（廣東潮州府）之人經過客莊，客民經過漳、泉村落，宜各息前怨，共敦新好。」請問：","e":"清領前期民變的結構原因：吏治差、班兵與民爭利、渡臺禁令造成大量單身移民（羅漢腳）。(B)(C)(D) 都是清領後期的事。"},{"i":"b995","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-清前期","k":"s","q":"比較 1722 年與 1764 年兩個版本的文告，下列推論何者最合理？","o":[["A","到 1764 年，閩粵兩籍移民已經完全和解"],["B","朱一貴事件是因為閩粵械鬥而起"],["C","到 1764 年，官府更明確地將族群衝突界定為閩粵之間的問題，並點名相關群體"],["D","《重修鳳山縣志》的編者反對官府介入族群衝突"]],"a":"C","c":"朱一貴事件後，隔年（1722）某官員於〈諭閩粵民人〉的文告中提及：「以後不許再分黨羽，再尋仇釁，各釋前怨，共敦新好。」1764 年《重修鳳山縣志》收錄這份文告時，不僅將篇名改為〈閩粵相仇諭〉，內容也改成：「以後不許再分黨羽，再尋仇釁。漳、泉、海豐（廣東惠州府）、三陽（廣東潮州府）之人經過客莊，客民經過漳、泉村落，宜各息前怨，共敦新好。」請問：","e":"1764 年版本改篇名為〈閩粵相仇諭〉，並具體點名漳、泉、海豐、三陽、客民，可見官府把衝突明確界定為族群之間的問題。(A) 仍要求「各息前怨」，未和解；(B) 與第 35 題同理，不成立。"},{"i":"b996","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"題文中臺灣民眾所發起的政治抗爭活動，最主要的訴求為何？","o":[["A","由殖民政府遴選議員組成臺灣議會，審查總督發布之律令以防止專斷"],["B","由臺灣民眾選舉民意代表，至日本帝國議會參與臺灣相關法案的審議"],["C","在臺灣成立議會，由民選議員行使與臺灣相關的法案與預算之審議權"],["D","由議會通過臺灣加入日本決議，爭取與日本本土國民相同的政治權利"]],"a":"C","c":"1920 年代臺灣民眾積極參與政治抗爭活動，其中以在日臺灣留學生組成的「新民會」等發起、前後 15 次的「臺灣議會設置請願運動」為著。何以民眾會採用請願方式？因為統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府，達成改革訴求，故選擇體制內許可、效力較弱的請願權。\n\n在第 3 次請願運動期間，參與民眾在臺倡議成立「臺灣議會期成同盟會」，卻被警察以違反《治安警察法》禁止此類結社為由制止。參與者不服警察禁令又投訴無門，全島更有百餘位遭到逮捕、起訴。但一審法院判決被告全數無罪，導致檢察官不服上訴，直至二審，才改判徒刑或罰金。\n\n經歷此事件，論者認為總督府法院對檢方起訴內容不會照單全收，仍有依法審判空間，反而激起當時臺灣民眾的政治參與熱潮。請問：","e":"臺灣議會設置請願運動要求設立由臺灣人選出的議會，掌握臺灣相關法案與預算的審議權。","r":"114 學測社會第 33、34 題"},{"i":"b997","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"根據題文，下列有關日治臺灣法治運作與人民權利的分析與評論，何者最為適切？","o":[["A","臺灣人民不滿政府禁止結社的處分，但無法向司法機關請求救濟"],["B","日治臺灣司法聽命於行政權，可見司法獨立規範未被施行於臺灣"],["C","臺灣為殖民地，日本憲法有關人民權利保障只有原母國人民享有"],["D","臺灣議會期成同盟會籌組失敗，顯示日治時期臺灣人民無結社權"]],"a":"A","c":"1920 年代臺灣民眾積極參與政治抗爭活動，其中以在日臺灣留學生組成的「新民會」等發起、前後 15 次的「臺灣議會設置請願運動」為著。何以民眾會採用請願方式？因為統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府，達成改革訴求，故選擇體制內許可、效力較弱的請願權。\n\n在第 3 次請願運動期間，參與民眾在臺倡議成立「臺灣議會期成同盟會」，卻被警察以違反《治安警察法》禁止此類結社為由制止。參與者不服警察禁令又投訴無門，全島更有百餘位遭到逮捕、起訴。但一審法院判決被告全數無罪，導致檢察官不服上訴，直至二審，才改判徒刑或罰金。\n\n經歷此事件，論者認為總督府法院對檢方起訴內容不會照單全收，仍有依法審判空間，反而激起當時臺灣民眾的政治參與熱潮。請問：","e":"題文說臺灣未施行行政救濟制度，人民「投訴無門」，無法透過行政訴訟救濟。(B) 一審判無罪，表示法院仍有依法審判空間；(D) 只是這個結社被禁止，不能推到全部結社權。","r":"114 學測社會第 33、34 題"},{"i":"b998","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"題文第二段所描述的事件，一般稱為：","o":[["A","西來庵事件"],["B","二林事件"],["C","霧社事件"],["D","治警事件"]],"a":"D","c":"1920 年代臺灣民眾積極參與政治抗爭活動，其中以在日臺灣留學生組成的「新民會」等發起、前後 15 次的「臺灣議會設置請願運動」為著。何以民眾會採用請願方式？因為統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府，達成改革訴求，故選擇體制內許可、效力較弱的請願權。\n\n在第 3 次請願運動期間，參與民眾在臺倡議成立「臺灣議會期成同盟會」，卻被警察以違反《治安警察法》禁止此類結社為由制止。參與者不服警察禁令又投訴無門，全島更有百餘位遭到逮捕、起訴。但一審法院判決被告全數無罪，導致檢察官不服上訴，直至二審，才改判徒刑或罰金。\n\n經歷此事件，論者認為總督府法院對檢方起訴內容不會照單全收，仍有依法審判空間，反而激起當時臺灣民眾的政治參與熱潮。請問：","e":"1923 年總督府以違反治安警察法取締期成同盟會、逮捕百餘人，稱為治警事件。"},{"i":"b999","s":"歷史","u":"L4 日治","t":"統治方針","k":"s","q":"在請願運動之前，留日學生曾推動「六三法撤廢運動」。與六三法撤廢運動相比，臺灣議會設置請願運動的訴求更強調：","o":[["A","臺灣比照日本本國法制，與日本人完全相同"],["B","臺灣有其特殊性，應由臺灣人參與自身事務的立法與預算"],["C","以武力推翻總督府的統治"],["D","臺灣重新回歸清朝統治"]],"a":"B","c":"1920 年代臺灣民眾積極參與政治抗爭活動，其中以在日臺灣留學生組成的「新民會」等發起、前後 15 次的「臺灣議會設置請願運動」為著。何以民眾會採用請願方式？因為統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府，達成改革訴求，故選擇體制內許可、效力較弱的請願權。\n\n在第 3 次請願運動期間，參與民眾在臺倡議成立「臺灣議會期成同盟會」，卻被警察以違反《治安警察法》禁止此類結社為由制止。參與者不服警察禁令又投訴無門，全島更有百餘位遭到逮捕、起訴。但一審法院判決被告全數無罪，導致檢察官不服上訴，直至二審，才改判徒刑或罰金。\n\n經歷此事件，論者認為總督府法院對檢方起訴內容不會照單全收，仍有依法審判空間，反而激起當時臺灣民眾的政治參與熱潮。請問：","e":"六三法撤廢運動要求比照日本本國法制（同化）；議會請願要求設臺灣自己的議會（自治），強調臺灣的特殊性。"},{"i":"b1060","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"Dogs have a ______ sense of smell, so they can find things that humans cannot.","o":[["A","keen"],["B","modest"],["C","fatal"],["D","tribal"]],"a":"A","e":"keen sense of smell 敏銳的嗅覺。modest 適度的、fatal 致命的、tribal 部落的。"},{"i":"b1061","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The police dog was able to ______ the drugs hidden in the suitcase.","o":[["A","envy"],["B","detect"],["C","submit"],["D","bless"]],"a":"B","e":"detect 偵測到。envy 羨慕、submit 屈服、bless 保佑。"},{"i":"b1062","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"If your skin is ______ to sunlight, you should wear sunscreen before going out.","o":[["A","ordinary"],["B","positive"],["C","sensitive"],["D","violent"]],"a":"C","e":"be sensitive to 對……敏感。"},{"i":"b1063","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"Plastic bags were made for our ______, but they have caused great harm to the environment.","o":[["A","treatment"],["B","slavery"],["C","attraction"],["D","convenience"]],"a":"D","e":"for one's convenience 為了某人方便。treatment 對待、slavery 奴隸制、attraction 景點。"},{"i":"b1064","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"Some ______ substances from plastic end up inside the fish that we eat.","o":[["A","poisonous"],["B","ancient"],["C","vast"],["D","modest"]],"a":"A","e":"poisonous substances 有毒物質。"},{"i":"b1065","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"For more than a century, the Statue of Liberty has ______ freedom and hope for people around the world.","o":[["A","resembled"],["B","symbolized"],["C","consumed"],["D","predicted"]],"a":"B","e":"symbolize 象徵。has＋p.p. 是現在完成式。resemble 像、consume 吃喝、predict 預測。"},{"i":"b1066","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"Taipei 101 is a famous ______ in Taiwan; almost every tourist takes pictures of it.","o":[["A","hemisphere"],["B","drought"],["C","landmark"],["D","booth"]],"a":"C","e":"landmark 地標。hemisphere 半球、drought 旱災、booth 小隔間。"},{"i":"b1067","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The researchers ______ an experiment to find out whether music could make people take the stairs.","o":[["A","invaded"],["B","drifted"],["C","scattered"],["D","conducted"]],"a":"D","e":"conduct an experiment 做實驗。"},{"i":"b1068","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The piano stairs ______ people to take the stairs rather than the escalator.","o":[["A","motivated"],["B","endured"],["C","crushed"],["D","abandoned"]],"a":"A","e":"motivate sb. to V 激勵某人去做。endure 忍受、crush 壓碎、abandon 拋棄。"},{"i":"b1072","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The man ______ is standing next to the tree is my uncle.","o":[["A","which"],["B","whom"],["C","who"],["D","whose"]],"a":"C","e":"先行詞 the man 是人；關代後面直接接動詞 is standing，缺主詞，是主格，用 who。"},{"i":"b1073","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"Last summer we visited Taroko Gorge ______ one of the most beautiful places in Taiwan.","o":[["A",", which is"],["B","which is"],["C",", that is"],["D",", where is"]],"a":"A","e":"Taroko Gorge 是專有名詞，用非限定：要逗號、不能用 that；先行詞是地方，但後面缺主詞（which is），不能用 where。"},{"i":"b1074","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The girl ______ Tom met at the party yesterday is from Japan.","o":[["A","which"],["B","whose"],["C","what"],["D","whom"]],"a":"D","e":"先行詞是人；Tom met ___，met 後面缺受詞，是受格，用 whom。"},{"i":"b1075","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"This is the only gift ______ I received on my birthday.","o":[["A","that"],["B","who"],["C","what"],["D","whom"]],"a":"A","e":"先行詞有 the only，習慣用 that；I received ___ 缺受詞。"},{"i":"b1076","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The teacher made the students ______ the classroom after school.","o":[["A","to clean"],["B","cleaning"],["C","clean"],["D","cleaned"]],"a":"C","e":"make＋O＋原形動詞。"},{"i":"b1077","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"The students were made ______ the classroom after school.","o":[["A","clean"],["B","to clean"],["C","cleaning"],["D","cleaned"]],"a":"B","e":"使役動詞改被動，to 要還回來：be made to V。"},{"i":"b1078","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"My bike was broken, so I had the mechanic ______ it yesterday.","o":[["A","fix"],["B","to fix"],["C","fixing"],["D","fixes"]],"a":"A","e":"have＋O＋原形動詞（叫某人做）。"},{"i":"b1079","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"My parents didn't ______ me go to the concert alone because it ended late at night.","o":[["A","allow"],["B","let"],["C","permit"],["D","want"]],"a":"B","e":"let＋O＋原形動詞；allow、permit、want 後面要接 to V。"},{"i":"b1080","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"After a long talk, I finally got my brother ______ me with my science project.","o":[["A","help"],["B","helped"],["C","helping"],["D","to help"]],"a":"D","e":"get＋O＋to V。get 不是 make／have／let，不能接原形。"},{"i":"b1081","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"______ the heavy rain, the baseball game was canceled.","o":[["A","Because"],["B","Since"],["C","Because of"],["D","As"]],"a":"C","e":"空格後 the heavy rain 是名詞，用 because of。Because、Since、As 後面要接子句。"},{"i":"b1082","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"We stayed at home all day ______ it was raining heavily.","o":[["A","because of"],["B","because"],["C","due to"],["D","thanks to"]],"a":"B","e":"空格後 it was raining heavily 是完整子句，用 because。because of、due to、thanks to 後面接名詞。"},{"i":"b1083","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"______ in this park that I first met my wife ten years ago.","o":[["A","It was"],["B","That was"],["C","There was"],["D","It is"]],"a":"A","e":"強調句 It was＋被強調部分＋that；後面 met 是過去式，用 It was。"},{"i":"b1084","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"It was Jason ______ won first place in the English speech contest.","o":[["A","which"],["B","what"],["C","where"],["D","that"]],"a":"D","e":"強調句固定用 that（強調人時也可用 who，但選項沒有）。"},{"i":"b1085","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"It was ______ hot day that we all stayed indoors.","o":[["A","so"],["B","such a"],["C","so a"],["D","such"]],"a":"B","e":"後面有名詞 day（單數可數），用 such a＋adj.＋N。"},{"i":"b1086","s":"英文","u":"二段綜合","t":"二段綜合-綜合","k":"s","q":"They are ______ kind people that everyone in the village likes them.","o":[["A","so"],["B","such a"],["C","such"],["D","so many"]],"a":"C","e":"people 是複數，用 such＋adj.＋複數名詞，不加 a。"},{"i":"b1106","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市推動垃圾減量，市府與連鎖便利商店合作設置回收站，環保團體負責宣導，社區發展協會協助分類。這種處理公共事務的方式最接近下列何者？","o":[["A","由上而下的統治"],["B","垂直課責"],["C","匡正正義"],["D","治理中的公私協力"]],"a":"D","d":1},{"i":"b1107","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某區公所撥出一千萬元，由居民提案、公開討論，再由區民投票決定經費用途。這最能體現民主治理的哪一項核心概念？","o":[["A","參與"],["B","法治"],["C","水平課責"],["D","匡正"]],"a":"A","d":1},{"i":"b1108","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"民眾在公共政策網路參與平臺提出建議，達到附議門檻後，主管機關必須在期限內具體說明是否採納及理由。「主管機關必須具體說明」最能體現民主治理的哪一項原則？","o":[["A","透明"],["B","回應"],["C","水平課責"],["D","法治"]],"a":"B","d":1},{"i":"b1109","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某市針對是否興建焚化爐，隨機抽選 20 位市民，先閱讀正反雙方資料、聽取專家說明，再分組討論後提出建議。這種作法與一般電話民調最主要的差異為何？","o":[["A","參與人數較多，更能代表多數民意"],["B","參與者在獲得充分資訊並相互討論後才形成意見"],["C","討論結論具有法律拘束力，市府必須照辦"],["D","由專家代替市民做出最後決定"]],"a":"B","d":1},{"i":"b1110","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"立法委員在院會中針對某項軍購案質詢國防部長，並要求提出書面報告。這屬於下列哪一種課責？","o":[["A","垂直課責"],["B","社會課責"],["C","水平課責"],["D","程序正義"]],"a":"C","d":1},{"i":"b1111","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某公民團體每會期發布「立法委員問政評鑑報告」，公開各委員的出席率與提案情形。這屬於下列哪一種課責？","o":[["A","垂直課責"],["B","水平課責"],["C","程序正義"],["D","社會課責"]],"a":"D","d":1},{"i":"b1112","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某國政府拒絕公開國防以外的預算細目，國會議員與民眾因此難以判斷經費是否遭到濫用。這個情況最能說明下列哪一項敘述？","o":[["A","透明是課責的前提"],["B","回應原則等同於透明原則"],["C","垂直課責不需要任何資訊"],["D","政府資訊原則上應保密"]],"a":"A","d":1},{"i":"b1113","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某市長任內並無違法情事，但施政滿意度長期低落。市民若想追究其政治責任，下列何者正確？","o":[["A","可依法發動罷免，罷免不以違法為前提"],["B","只能請監察院提出彈劾"],["C","必須等法院判決有罪後才能追究"],["D","任期內無法追究任何責任"]],"a":"A","d":1},{"i":"b1114","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校在懲處學生前，先以書面通知當事人並給予陳述意見的機會；與當事人有親屬關係的委員則依規定迴避。這最符合下列哪一種正義？","o":[["A","分配正義"],["B","程序正義"],["C","匡正正義"],["D","效益主義"]],"a":"B","d":1},{"i":"b1115","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某人遭判刑入獄多年，後經再審判決無罪，國家依法給予冤獄賠償。這最符合下列哪一種正義？","o":[["A","分配正義"],["B","程序正義"],["C","實質平等"],["D","匡正正義"]],"a":"D","d":1},{"i":"b1116","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校獎學金規定：學期成績排名前 5% 的學生，可獲得一萬元獎學金。這項規定的分配標準為何？","o":[["A","依需要分配"],["B","平均分配"],["C","依表現（功績）分配"],["D","依匡正原則分配"]],"a":"C","d":1},{"i":"b1117","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某縣規定：家庭經濟情況列冊為低收入戶的國中小學生，營養午餐費用全免。這項規定的分配標準為何？","o":[["A","依需要分配"],["B","依表現分配"],["C","平均分配"],["D","依貢獻分配"]],"a":"A","d":1},{"i":"b1118","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某國為刺激消費，發給每位國民相同金額的消費券，不論收入高低。這項政策的分配標準為何？","o":[["A","依需要分配"],["B","依貢獻分配"],["C","平均分配"],["D","依表現分配"]],"a":"C","d":1},{"i":"b1119","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市議員主張將一座使用人數少的社區公園改建為停車場，理由是：「停車場的受益人數遠多於公園使用者，整體而言能讓最多市民獲得最大好處。」此主張最接近下列哪一種觀點？","o":[["A","羅爾斯的正義論"],["B","自由至上主義"],["C","效益主義"],["D","匡正正義"]],"a":"C","d":1},{"i":"b1120","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"老師在課堂上問：「如果你在出生前，完全不知道自己會生在富裕或貧窮的家庭、是否健康，你會希望社會制度怎麼設計？」老師的提問最接近下列哪一位學者的思考方式？","o":[["A","效益主義者"],["B","自由至上主義者"],["C","羅爾斯"],["D","諾齊克"]],"a":"C","d":1},{"i":"b1121","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲認為：「個人靠努力工作合法取得的所得，政府若課徵重稅轉而補助他人，等於侵犯個人的財產權。」甲的主張最接近下列哪一種觀點？","o":[["A","效益主義"],["B","羅爾斯的正義論"],["C","匡正正義"],["D","自由至上主義"]],"a":"D","d":1},{"i":"b1122","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"針對「提高高所得者稅率，以擴大育兒補助」的政策，三人意見如下：\n甲：「只要能讓全社會的總幸福增加，就應該實施。」\n乙：「這能改善處境最不利家庭的生活，應該實施。」\n丙：「政府不應強制拿走個人的合法財產。」\n甲、乙、丙的立場依序最接近下列何者？","o":[["A","效益主義、羅爾斯的正義論、自由至上主義"],["B","羅爾斯的正義論、效益主義、自由至上主義"],["C","自由至上主義、羅爾斯的正義論、效益主義"],["D","效益主義、自由至上主義、羅爾斯的正義論"]],"a":"A","d":1},{"i":"b1123","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某縣規定：縣府所屬各委員會的委員，任一性別不得少於三分之一。這項規定屬於下列何者？","o":[["A","形式平等"],["B","積極平權措施"],["C","性別歧視"],["D","匡正正義"]],"a":"B","d":1},{"i":"b1124","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某公司招募會計人員時規定：「身高未滿 170 公分者不得應徵。」這項規定不合理的主要原因為何？","o":[["A","任何差別待遇都違反平等原則"],["B","公司不得對應徵者設定任何條件"],["C","這項規定違反匡正正義"],["D","身高與會計工作的需求沒有合理關聯"]],"a":"D","d":1},{"i":"b1125","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某社區召開住戶大會，多數住戶投票通過「禁止身心障礙者團體家屋設在本社區」。下列評論何者最適當？","o":[["A","既然經過多數決，結果就一定符合正義"],["B","多數決不能侵害少數者的基本權利"],["C","住戶大會的決議屬於匡正正義"],["D","應改由效益主義決定，才不會有爭議"]],"a":"B","d":1},{"i":"b1126","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據表 1，下列推論何者最適當？","o":[["A","父母學歷為國中以下者，其子女都無法就讀大學"],["B","家中藏書量是決定子女能否就讀大學的唯一因素"],["C","父母學歷越高的組別，子女就讀大學的比例越高"],["D","政府的教育政策造成了三組之間的差異"]],"a":"C","c":"某研究調查 3,000 名 25 歲青年，依其父母最高學歷分組，結果如表 1。\n\n表 1\n\n| 父母最高學歷 | 本人就讀大學的比例 | 成長時家中藏書 100 本以上的比例 |\n|---|---|---|\n| 國中以下 | 28% | 12% |\n| 高中職 | 45% | 30% |\n| 大學以上 | 78% | 64% |","d":1},{"i":"b1127","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"表 1 中「家中藏書」最接近下列哪一種資本？","o":[["A","經濟資本"],["B","文化資本"],["C","社會資本"],["D","政治資本"]],"a":"B","c":"某研究調查 3,000 名 25 歲青年，依其父母最高學歷分組，結果如表 1。\n\n表 1\n\n| 父母最高學歷 | 本人就讀大學的比例 | 成長時家中藏書 100 本以上的比例 |\n|---|---|---|\n| 國中以下 | 28% | 12% |\n| 高中職 | 45% | 30% |\n| 大學以上 | 78% | 64% |","d":1},{"i":"b1128","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列哪一項敘述「無法」從表 1 得知？","o":[["A","大學以上組的子女就讀大學比例最高"],["B","國中以下組家中藏書 100 本以上的比例最低"],["C","三組中藏書比例與就讀大學比例的高低順序相同"],["D","父母學歷較高的家庭，家庭收入也較高"]],"a":"D","c":"某研究調查 3,000 名 25 歲青年，依其父母最高學歷分組，結果如表 1。\n\n表 1\n\n| 父母最高學歷 | 本人就讀大學的比例 | 成長時家中藏書 100 本以上的比例 |\n|---|---|---|\n| 國中以下 | 28% | 12% |\n| 高中職 | 45% | 30% |\n| 大學以上 | 78% | 64% |","d":1},{"i":"b1129","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某公司全體員工中女性占 55%，但主管職中女性僅占 18%。依據這項資料，下列推論何者最適當？","o":[["A","女性員工的工作能力不如男性"],["B","女性在升遷上可能面臨較多阻礙，值得進一步探究原因"],["C","該公司主管刻意歧視女性員工"],["D","女性員工普遍不願意擔任主管"]],"a":"B","d":1},{"i":"b1130","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某報社每天收到上百則新聞稿與記者回報，編輯會議只選出其中十餘則刊出，其餘不予報導。這最能說明媒體的哪一種作用？","o":[["A","框架"],["B","議題設定"],["C","守門"],["D","置入性行銷"]],"a":"C","d":1},{"i":"b1131","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"連續一週，各電視台晚間新聞的頭條都是某食品安全事件，民眾在餐桌上、網路上也普遍討論食安問題。這最能說明媒體的哪一種作用？","o":[["A","議題設定"],["B","框架"],["C","媒體近用"],["D","媒體再現"]],"a":"A","d":1},{"i":"b1132","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示，市長候選人甲的支持度為 41%，乙為 38%，抽樣誤差為正負 3.5 個百分點。下列解讀何者最適當？","o":[["A","甲確定領先乙"],["B","乙一定會落選"],["C","兩人差距在誤差範圍內，無法判斷誰領先"],["D","民調有誤差，因此完全沒有參考價值"]],"a":"C","d":1},{"i":"b1133","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某報刊登一則錯誤報導，指稱某商家販售過期食品。商家要求該報刊登更正與答辯內容。商家主張的是下列哪一種權利？","o":[["A","媒體近用權"],["B","第四權"],["C","守門權"],["D","框架權"]],"a":"A","d":1},{"i":"b1134","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某研究發現，國內電視劇中的新住民角色，多半被安排為家境困苦、需要他人救助的形象。這最能說明下列哪一種現象？","o":[["A","媒體近用不平等"],["B","媒體所有權集中"],["C","議題設定"] 議題設定"],["C","框架"],["D","媒體近用"]],"a":"C","d":1},{"i":"b1177","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"記者採訪了五位民眾對新政策的看法，晚間新聞最後只播出其中兩位的說法，其餘未播出。「決定播出哪些內容」最能說明媒體的哪一種作用？","o":[["A","框架"],["B","守門"],["C","置入性行銷"],["D","第四權"]],"a":"B","d":1},{"i":"b1178","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某美食節目的主持人在節目中反覆展示並稱讚某品牌醬油，但節目未標示這是廣告。這最可能屬於下列何者？","o":[["A","框架"],["B","議題設定"],["C","媒體近用"],["D","置入性行銷"]],"a":"D","d":1},{"i":"b1179","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某報記者以長期調查報導揭發官員收受廠商賄賂，檢調因此展開偵辦。這最能體現媒體的哪一種角色？","o":[["A","守門"],["B","框架"],["C","第四權"],["D","媒體再現"]],"a":"C","d":1},{"i":"b1180","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"下列有關民主治理與課責的敘述，哪些正確？","o":[["A","審計部審核政府決算，屬於水平課責"],["B","公民團體發布立委問政評鑑，屬於社會課責"],["C","發動罷免必須以官員違法為前提"],["D","透明是指政府對人民的意見作出答覆"],["E","網路提案達到附議門檻後，主管機關須具體回應"]],"a":"ABE","d":1},{"i":"b1181","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列各項敘述與其所屬類型的配對，哪些正確？","o":[["A","冤獄賠償──匡正正義"],["B","行政機關作成處分前，給予當事人陳述意見的機會──程序正義"],["C","「社會經濟的不平等必須對最不利者最有利」──效益主義"],["D","「國家不應強制進行財富重分配」──自由至上主義"],["E","依家庭收入高低發放不同金額的補助──匡正正義"]],"a":"ABD","d":1},{"i":"b1182","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義理論的敘述，哪些正確？","o":[["A","羅爾斯的第一原則是每個人享有平等的基本自由"],["B","羅爾斯的第二原則包含機會公平平等與差異原則"],["C","諾齊克是自由至上主義的代表人物"],["D","效益主義可能為了整體利益而犧牲少數人的利益"],["E","自由至上主義主張政府應大幅提高遺產稅"]],"a":"ABCD","d":1},{"i":"b1183","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等的敘述，哪些正確？","o":[["A","只要採取形式平等，就足以讓起點不同的人得到公平的結果"],["B","合理的差別待遇要有正當目的，且手段與目的之間有合理關聯"],["C","積極平權措施違反平等原則"],["D","身心障礙者定額進用制度屬於積極平權措施"],["E","設置無障礙設施是實質平等的實踐"]],"a":"BDE","d":1},{"i":"b1184","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"根據第 21～23 題的表 1，下列敘述哪些可以從表中直接得知？","o":[["A","城鎮學生每週線上學習時數超過 5 小時"],["B","偏鄉學生每週線上學習時數，不到都會區學生的一半"],["C","偏鄉家庭的收入低於都會區家庭"],["D","都會區學生每週線上學習時數是偏鄉學生的 3 倍以上"],["E","家中有電腦是學生進行線上學習的唯一條件"]],"a":"BD","d":1},{"i":"b1185","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體作用的敘述，哪些正確？","o":[["A","守門是指決定哪些消息能成為新聞"],["B","框架主要影響民眾「想什麼」"],["C","議題設定主要影響民眾「想什麼」"],["D","媒體被稱為第四權，是因為它能監督行政、立法、司法三權"],["E","媒體所有權集中，有助於社會意見更加多元"]],"a":"ACD","d":1},{"i":"b1186","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體近用與媒體再現的敘述，哪些正確？","o":[["A","民眾投書、要求媒體刊登更正與答辯，屬於行使媒體近用權"],["B","司法院大法官在釋字第 364 號解釋中，肯認媒體近用權屬於言論自由的保障範圍"],["C","再現不平等是指某些群體很難上媒體發聲"],["D","近用不平等是指媒體以刻板印象呈現某些群體"],["E","設立公共媒體，有助於改善近用不平等"]],"a":"ABE","d":1},{"i":"b1187","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關民意與媒體識讀的敘述，哪些正確？","o":[["A","網路上聲量大的意見，就代表多數民意"],["B","來源不明、標題聳動，是假訊息常見的特徵"],["C","訊息要求「趕快轉傳」，是假訊息常見的特徵"],["D","兩位候選人的支持度差距在誤差範圍內，不能說誰領先"],["E","演算法推送相似的內容，容易形成同溫層"]],"a":"BCDE","d":1},{"i":"b1194","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市推動參與式預算：市府先在網站公開各區過去三年的預算執行資料，再由居民提案、分組討論並投票決定部分預算用途；隔年市府公布各提案執行率，執行率偏低的局處首長須到市議會專案報告。題文中「沒有」直接呈現下列哪一項民主治理的概念？","o":[["A","透明"],["B","參與"],["C","水平課責"],["D","垂直課責"]],"a":"D","e":"透明＝公開執行資料；參與＝居民提案、討論、投票；水平課責＝首長到議會報告（機關之間）。題文**沒有**選舉、罷免或公投，所以垂直課責沒出現。⚠️ 參與式預算的「投票」是決定預算用途，不是選舉換人。","d":1},{"i":"b1195","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"甲：立法院刪減某部會的預算；乙：監察院對失職官員提出彈劾；丙：公民團體發布立法委員問政評鑑報告；丁：選民連署罷免某立法委員。上述哪兩項屬於同一種課責類型？","o":[["A","甲乙"],["B","甲丙"],["C","乙丁"],["D","丙丁"]],"a":"A","e":"甲（刪預算）、乙（彈劾）都是政府機關之間的水平課責。丙＝社會課責，丁＝垂直課責。","d":1},{"i":"b1196","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"公共政策網路參與平臺上，一項「延長學校午休」的提案在 60 天內達到附議門檻，主管機關隨即在期限內提出書面回覆，說明不採納的理由與替代方案。關於此案，下列敘述何者最適當？","o":[["A","機關不採納提案，表示其違反「回應」原則"],["B","提案達到附議門檻後即具有法律拘束力"],["C","此案屬於垂直課責，因為人民可藉此撤換官員"],["D","機關在期限內說明理由，已展現「回應」；回應不等於必須接受提案"]],"a":"D","e":"回應的意思是政府對人民的需求「有回覆、說明理由」，不是「一定照做」。(A) 把回應誤當接受；(B) 附議門檻只產生回覆義務，沒有法律拘束力；(C) 平臺提案不能撤換官員，不是垂直課責。","d":1},{"i":"b1197","s":"公民","u":"第4課","t":"4-5-民調","k":"s","q":"某縣政府想了解縣民對興建焚化爐的看法，考慮兩種做法。甲案：隨機抽樣電話訪問 1,068 位縣民「贊成或反對」。乙案：隨機邀請 20 位不同背景的居民，閱讀正反資料、聽取專家說明後分組討論兩天，提出共同意見書。下列比較何者最適當？","o":[["A","甲案較符合審議民主，因為樣本較大、較具代表性"],["B","乙案的結論可直接取代縣議會的決議"],["C","乙案重視參與者在充分資訊下交換理由，甲案主要呈現當下意見的分布"],["D","兩案都以多數決為核心，差別只在參與人數"]],"a":"C","e":"乙案有「充分資訊＋不同背景＋討論交換理由＋形成共同意見」，是審議民主；甲案只是測量當下贊成或反對的比例。(A) 樣本大不等於審議；(B) 審議結論是建議，不能取代議會；(D) 乙案的核心是討論，不是多數決。","d":1},{"i":"b1198","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某次公民審議會議的觀察紀錄寫道：「受過高等教育、熟悉公共事務的參與者，發言時間占全場七成；部分新住民與高齡參與者雖然全程出席，卻多半沉默。」這項紀錄最能說明審議民主可能面臨的何種問題？","o":[["A","參與者因文化資本不同，實際的發言機會並不平等"],["B","審議民主違反程序正義中的迴避原則"],["C","審議民主的結論必然偏向多數族群的利益"],["D","新住民與高齡者缺乏參與公共事務的意願"]],"a":"A","e":"發言時間被教育程度高的人占走，是文化資本差異造成的發言不平等。(B) 迴避是處理利益衝突，和發言多寡無關；(C)「必然」過度推論；(D) ⚠️ **題文沒說**——題文說他們「全程出席」，沉默不等於沒有意願。","d":1},{"i":"b1199","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市府在拆除違章建築前，依法事先通知屋主並給予陳述意見的機會；屋主陳述後，市府仍依法拆除。屋主主張：「市府沒有接受我的意見，所以程序不正義。」下列評論何者最適當？","o":[["A","屋主主張正確，程序正義要求機關必須採納當事人的意見"],["B","市府應先賠償屋主的損失，才符合程序正義"],["C","市府已依法通知並給予陳述機會，程序正義重在決定過程公正，不保證結果對當事人有利"],["D","此案涉及土地分配，屬於分配正義而非程序正義"]],"a":"C","e":"程序正義看的是「怎麼決定」：有通知、有陳述機會、依法處理，程序就是公正的；結果不一定要對當事人有利。(A) 把陳述意見誤當必須採納；(B) 賠償是匡正正義，而且依法拆除違建不需要賠償才合法；(D) 拆違建不是在分配資源。","d":1},{"i":"b1200","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲：冤獄平反後依法獲得刑事補償；乙：獎學金依學業成績高低核發；丙：法官與被告有親屬關係而自行迴避；丁：低收入戶子女學雜費全免。下列配對何者正確？","o":[["A","甲—分配正義；丙—程序正義"],["B","乙—依表現（貢獻）分配；丁—依需要分配"],["C","乙—程序正義；丁—平均分配"],["D","甲—匡正正義；乙—依需要分配"]],"a":"B","e":"乙依成績＝依表現（貢獻）；丁依家庭經濟困難＝依需要。甲是匡正正義（補救國家造成的錯誤），所以 (A) 錯；(C) 乙不是程序；(D) 前半對、乙錯。","d":1},{"i":"b1201","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲、乙、丙的主張，依序最接近哪些立場？","o":[["A","自由至上主義、羅爾斯、效益主義"],["B","羅爾斯、自由至上主義、效益主義"],["C","效益主義、羅爾斯、自由至上主義"],["D","自由至上主義、效益主義、羅爾斯"]],"a":"C","c":"某國討論是否實施「遺產稅最高稅率 50%，稅收專用於弱勢兒童教育」。\n甲：「只要稅收用於教育所帶來的整體社會效益，大於富人因繳稅減少的效用，就應實施。」\n乙：「如果在不知道自己會出生在富裕或貧窮家庭的情況下選擇制度，理性的人會贊成此案。」\n丙：「遺產是父母合法取得的財產，國家無權強制移轉給他人。」","e":"甲比較「整體效益 vs 損失」＝效益主義；乙「不知道自己出生在哪種家庭」＝無知之幕＝羅爾斯；丙「財產不可強制移轉」＝自由至上主義。","d":1},{"i":"b1202","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"承上，若研究證實：「實施此案後，富人大量移居國外，使國家總稅收與整體經濟福利明顯下降，但留在國內的弱勢兒童教育資源仍略有增加。」依各立場的判斷標準，下列推論何者最適當？","o":[["A","效益主義者會因弱勢兒童受益而更堅定支持"],["B","自由至上主義者會轉而支持，因為整體福利下降"],["C","三種立場都會反對，因為總稅收下降"],["D","羅爾斯的立場可能仍支持，因為最不利者的處境獲得改善"]],"a":"D","c":"某國討論是否實施「遺產稅最高稅率 50%，稅收專用於弱勢兒童教育」。\n甲：「只要稅收用於教育所帶來的整體社會效益，大於富人因繳稅減少的效用，就應實施。」\n乙：「如果在不知道自己會出生在富裕或貧窮家庭的情況下選擇制度，理性的人會贊成此案。」\n丙：「遺產是父母合法取得的財產，國家無權強制移轉給他人。」","e":"羅爾斯看「最不利者的處境」：弱勢兒童教育資源仍增加 → 可能仍支持。效益主義看整體福祉，總福利下降 → 傾向反對，(A) 錯；自由至上主義本來就反對重分配，和整體福利無關，(B) 錯；(C) 羅爾斯不一定反對。","d":1},{"i":"b1203","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某公立大學規定「身高未達 160 公分者不得報考護理系」，理由是「護理工作需要體力」。下列評論何者最適當？","o":[["A","此規定對所有考生一體適用，符合實質平等"],["B","只要目的正當，任何差別待遇都屬合理"],["C","差別待遇的目的或許正當，但身高與護理工作能力欠缺合理關聯，可能構成歧視"],["D","此規定屬積極平權措施，用以保障弱勢"]],"a":"C","e":"合理差別待遇要過兩關：①目的正當（需要體力，或許正當）②手段與目的有合理關聯（身高≠體力或護理能力）→ 第二關不過，可能構成歧視。(A) 一體適用是形式平等的說法，而且規定本身就是差別待遇；(B) 只看目的不夠；(D) 不是在保障弱勢。","d":1},{"i":"b1204","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"關於「原住民族學生升學優待」，有下列四種說法：甲：此措施是形式平等的展現；乙：此措施考量群體處境差異，屬於實質平等的追求；丙：有人主張應改以「經濟弱勢」而非「族群身分」為標準，這是針對差別待遇的手段與目的之關聯提出質疑；丁：只要是差別待遇，必然違反平等原則。正確的是：","o":[["A","甲乙"],["B","乙丙"],["C","丙丁"],["D","甲丁"]],"a":"B","e":"乙對：考量群體處境＝實質平等。丙對：質疑「用族群身分當手段，能不能精準幫到真正需要的人」＝檢驗手段與目的之關聯。甲錯（是實質平等，不是形式平等）；丁錯（合理的差別待遇不違反平等）。","d":1},{"i":"b1205","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據表 1，下列推論何者最適當？","o":[["A","父母國中以下組的成長幅度最大，表示教育不平等已經消除"],["B","父母教育程度低的子女，取得大學學歷的意願較低"],["C","各組比例皆上升，但父母教育程度越高，子女取得大學以上學歷的比例仍越高"],["D","父母大學以上的家庭，所得一定高於其他組"]],"a":"C","c":"表 1　某國 25～34 歲人口中「最高學歷為大學以上」的比例（依父母最高教育程度區分）\n\n| 父母最高教育程度 | 2015 年 | 2025 年 |\n|---|---|---|\n| 國中以下 | 28% | 35% |\n| 高中職 | 46% | 55% |\n| 大學以上 | 78% | 86% |","e":"表中三組都上升，但每一年都是父母教育程度越高、比例越高。(A) 成長幅度：國中以下 +7、高中職 +9、大學以上 +8，最大的是高中職，而且差距仍在，「已經消除」錯；(B) ⚠️ **題文沒說**「意願」，表只給學歷比例；(D) ⚠️ **題文沒說**所得，「一定」更是過度推論。","d":1},{"i":"b1206","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列哪一項「無法」從表 1 得知？","o":[["A","2025 年父母大學以上組與國中以下組的差距為 51 個百分點"],["B","2015 年父母高中職組的比例高於父母國中以下組"],["C","2025 年父母國中以下組的子女，有超過三分之一取得大學以上學歷"],["D","文化資本是造成各組差距的主要原因"]],"a":"D","c":"表 1　某國 25～34 歲人口中「最高學歷為大學以上」的比例（依父母最高教育程度區分）\n\n| 父母最高教育程度 | 2015 年 | 2025 年 |\n|---|---|---|\n| 國中以下 | 28% | 35% |\n| 高中職 | 46% | 55% |\n| 大學以上 | 78% | 86% |","e":"(A) 86−35＝51 ✓；(B) 46%＞28% ✓；(C) 35%＞33.3% ✓。(D) 表只呈現差距，**沒有提供原因**，文化資本只是可能的解釋之一，無法從表得知。","d":1},{"i":"b1207","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某國調查顯示：「女性占全體受僱者 46%，但在企業董事中僅占 14%；同職級、同年資的男女平均薪資差距為 3%，而全體男女平均薪資差距為 16%。」依據這項資料，下列推論何者最適當？","o":[["A","全體薪資差距主要來自同職級的同工不同酬"],["B","企業董事會刻意排斥女性"],["C","女性多因家庭因素自願放棄升遷"],["D","女性較少擔任高階職位，可能是全體薪資差距大於同職級差距的原因之一"]],"a":"D","e":"同職級差距只有 3%，全體差距卻有 16%，表示差距大多來自「男女分布在不同職級」；女性在董事中只占 14%，正好支持這個推論。(A) 同職級只差 3%，不是主要來源；(B)「刻意排斥」、(C)「自願放棄」都是 ⚠️ **題文沒說的原因**。","d":1},{"i":"b1208","s":"公民","u":"第5課","t":"4-5-讀題","k":"s","q":"某國調查：家戶上網率都會區 96%、偏鄉 81%；能用網路自行完成政府線上申辦的居民比例，都會區 72%、偏鄉 38%。依據這項資料，下列敘述何者最適當？","o":[["A","偏鄉家戶上網率與都會區的差距，大於線上申辦能力的差距"],["B","即使能上網，運用網路的能力仍有城鄉落差，數位落差不只是設備有無的問題"],["C","偏鄉居民不願意使用政府線上服務"],["D","只要把偏鄉上網率提高到 96%，申辦能力的差距就會消失"]],"a":"B","e":"上網率差 15 個百分點，申辦能力差 34 個百分點 → 有設備不代表會用，數位落差包括「使用能力」。(A) 說反了；(C) ⚠️ **題文沒說**「不願意」，資料測的是「能不能」；(D)「就會消失」過度推論，能力差距不會因為上網率提高就自動消失。","d":1},{"i":"b1209","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某研究訪談發現：「中產家庭家長常帶孩子參觀博物館、在餐桌上討論時事，孩子在課堂討論中較敢表達；勞工家庭家長工時長，較少有時間陪伴。」研究者以「文化資本」解釋這項差異。下列何者最符合題文中「文化資本」的意涵？","o":[["A","家庭擁有的房產與存款"],["B","家長認識學校主管，能替孩子爭取機會"],["C","家庭中培養的語言表達、知識品味與學習習慣"],["D","政府提供給學生的教育補助"]],"a":"C","e":"文化資本＝家庭培養出的語言、知識、品味、學習習慣。(A) 是經濟資本；(B) 靠人脈是社會資本（延伸）；(D) 是政府資源，不是家庭資本。","d":1},{"i":"b1210","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市議會以多數決通過「市立游泳池禁止穿著全身式泳衣入場」，理由是「維護水質」，但受影響者多為穆斯林女性。下列評論何者最適當？","o":[["A","經民主多數決通過，即符合公平正義"],["B","此規定未明文針對宗教，故不可能涉及差別待遇"],["C","應檢驗此規定與維護水質之間是否有合理關聯，並注意對少數群體權利的影響"],["D","少數群體應服從多數決，以維持社會秩序"]],"a":"C","e":"表面上對所有人一樣，實際上主要影響特定宗教群體，要檢驗「禁止全身泳衣」與「維護水質」有沒有合理關聯。(A)(D) 多數決不等於正義，民主也要保障少數；(B) 沒寫明宗教，仍可能造成事實上的差別待遇。","d":1},{"i":"b1211","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"「民眾認為食安是最重要社會問題的比例大幅上升」，最能說明媒體的哪一種作用？","o":[["A","守門"],["B","框架"],["C","議題設定"],["D","置入性行銷"]],"a":"C","c":"某月，各大電視台連續兩週以頭條報導一起食品安全事件。民調顯示，認為「食品安全是當前最重要社會問題」的民眾比例，從報導前的 8% 升到 31%。報導期間，甲台多以「黑心業者害人」為標題；乙台多以「衛生局稽查形同虛設」為標題；丙台則因同日發生重大車禍，決定當天不報導食安事件。","e":"媒體反覆報導，讓民眾覺得「這件事最重要」＝議題設定（影響大家想**什麼**）。","d":1},{"i":"b1212","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"甲台、乙台、丙台的做法，依序最能說明哪些媒體作用？","o":[["A","框架、框架、守門"],["B","議題設定、框架、守門"],["C","框架、守門、議題設定"],["D","守門、框架、框架"]],"a":"A","c":"某月，各大電視台連續兩週以頭條報導一起食品安全事件。民調顯示，認為「食品安全是當前最重要社會問題」的民眾比例，從報導前的 8% 升到 31%。報導期間，甲台多以「黑心業者害人」為標題；乙台多以「衛生局稽查形同虛設」為標題；丙台則因同日發生重大車禍，決定當天不報導食安事件。","e":"甲、乙兩台報同一事件，選擇的角度不同（業者 vs 主管機關）＝框架；丙台決定不報＝守門。⚠️ 甲台雖然也在報頭條，但本題問的是「標題角度」，是框架而不是議題設定。","d":1},{"i":"b1213","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某次民調在 95% 信心水準下，抽樣誤差為正負 3 個百分點，結果甲候選人支持度 41%，乙候選人 37%。下列敘述何者最適當？","o":[["A","甲的支持度一定高於乙"],["B","若重複調查 100 次，甲每次都會領先"],["C","抽樣誤差正負 3 個百分點，表示有 3% 的受訪者說謊"],["D","兩人支持度的可能區間有重疊，不能確定甲領先"]],"a":"D","e":"甲：41±3＝38%～44%；乙：37±3＝34%～40%。兩個區間在 38%～40% 重疊 → 不能確定誰領先。(A)「一定」錯；(B) 信心水準不是「每次都」；(C) 抽樣誤差是抽樣造成的不確定範圍，與說謊無關。","d":1},{"i":"b1214","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某團體委託民調，題目為：「在物價飛漲、勞工生活困苦的情況下，您是否支持調漲基本工資？」結果 85% 受訪者支持。下列評論何者最適當？","o":[["A","只要樣本是隨機抽出，結果就必然客觀"],["B","題目含有引導性用語，可能影響受訪者的回答"],["C","85% 遠超過誤差範圍，故可確定全國多數人支持"],["D","委託單位的立場與民調設計無關，不必考慮"]],"a":"B","e":"「物價飛漲、勞工生活困苦」先替受訪者設定立場，是引導性題目。(A) 隨機抽樣不能修正題目偏差；(C) 題目有偏差，比例再高也不能代表真實民意；(D) 委託者立場可能影響題目設計，要考慮。","d":1},{"i":"b1215","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"小明的社群首頁幾乎都是支持某政策的貼文，他因此認為「全國幾乎沒人反對」。後來具代表性的民調顯示，贊成與反對各約半數。下列何者最能解釋小明的誤判？","o":[["A","媒體近用不平等"],["B","媒體所有權集中"],["C","第四權失靈"],["D","演算法造成的同溫層效應"]],"a":"D","e":"演算法依照喜好推送相同立場的內容 → 同溫層，誤以為大家都同意。其他三項都和「只看到同樣意見」無關。","d":1},{"i":"b1216","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某財團在三年內陸續收購國內 3 家電視台與 2 家報社，引起學者擔憂。下列何者最可能是學者擔憂的理由？","o":[["A","新聞內容必然全部偏向財團立場"],["B","媒體數量增加，使觀眾注意力分散"],["C","政府將因此無法依法監理媒體"],["D","報導觀點可能趨於單一，削弱媒體的多元性"]],"a":"D","e":"所有權集中的主要風險是意見來源單一化。(A)「必然全部」過度推論；(B) 收購不會讓媒體數量增加；(C) 政府仍可依法監理（如 NCC），題文沒有說無法監理。","d":1},{"i":"b1217","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"甲：某報拒絕刊登移工團體針對不實報導提出的更正啟事；乙：連續劇中的原住民角色多被塑造成愛喝酒、不守時；丙：客家電視台開播；丁：新聞報導外籍配偶多聚焦於家暴與詐騙。下列敘述何者正確？","o":[["A","甲、丙涉及媒體近用；乙、丁涉及媒體再現"],["B","甲、乙涉及媒體再現；丙、丁涉及媒體近用"],["C","甲、丁涉及媒體近用；乙、丙涉及媒體再現"],["D","四者皆屬媒體所有權集中的問題"]],"a":"A","e":"甲（不能刊登更正）、丙（族群頻道提供發聲管道）＝**能不能發聲**＝近用；乙、丁（刻板形象、只報負面）＝**被呈現成什麼樣子**＝再現。","d":1},{"i":"b1218","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"關於媒體近用權，有下列四種說法：甲：使人民得以要求媒體提供版面或時段，表達意見或進行更正、答辯；乙：指媒體監督政府的權力；丙：公共電視與族群電視台的設立，有助於改善近用不平等；丁：指媒體不受政府干預的自由。正確的是：","o":[["A","甲乙"],["B","甲丙"],["C","乙丁"],["D","丙丁"]],"a":"B","e":"甲對：近用權是人民「接近、使用」媒體的權利（如更正、答辯）。丙對：族群頻道改善近用不平等。乙是第四權；丁是新聞自由。","d":1},{"i":"b1219","s":"公民","u":"第5課","t":"4-5-讀題","k":"s","q":"某則網路貼文寫道：「①衛福部今日公布，本週流感就診人次為 12 萬；②這個數字證明政府防疫徹底失敗；③大家都知道疫苗根本沒用。」下列分析何者最適當？","o":[["A","①②③皆為可查證的事實"],["B","①是可查證的事實陳述，②③屬於意見或未經證實的主張"],["C","②引用了官方數據，因此屬於事實"],["D","③使用「大家都知道」，表示已有共識，可信度高"]],"a":"B","e":"①是可以向衛福部查證的數據；②是對數字的評價（意見）；③是沒有證據的主張，「大家都知道」是常見的假訊息話術。(C) 引用數據不代表結論就是事實。","d":1},{"i":"b1220","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某電視台調查報導揭露某縣長以公帑支付私人旅遊；監察院隨後立案調查並提出彈劾；該縣長在下一次選舉中落選。題文依序出現哪些課責類型？","o":[["A","社會課責→水平課責→垂直課責"],["B","水平課責→社會課責→垂直課責"],["C","社會課責→垂直課責→水平課責"],["D","垂直課責→水平課責→社會課責"]],"a":"A","e":"電視台調查報導＝社會課責 → 監察院彈劾＝水平課責 → 選舉落選＝垂直課責。","d":1},{"i":"b1221","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"政府為打擊假訊息，擬立法規定：「凡在網路散布經主管機關認定為不實之訊息者，一律處罰。」下列何者是最可能的反對理由？","o":[["A","假訊息不會影響公共意見"],["B","由行政機關單方認定真偽，可能過度限制言論自由"],["C","網路言論不受言論自由保障"],["D","處罰假訊息違反媒體近用權"]],"a":"B","e":"打擊假訊息要兼顧言論自由；由行政機關自己判定真假並一律處罰，可能被濫用來壓制批評。(A) 假訊息確實會影響公共意見；(C) 網路言論也受保障；(D) 和近用權無關。","d":1},{"i":"b1222","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某河川整治計畫由縣府出資，在地企業認養河段，社區協會與環保團體共同巡守，並定期向縣府提出水質報告。這最能說明下列何種概念？","o":[["A","民主治理強調政府、市場與公民社會協力處理公共事務"],["B","政府已將公共責任完全轉移給民間"],["C","社會課責已取代水平課責"],["D","此案屬於垂直課責"]],"a":"A","e":"政府（出資）、市場（企業認養）、公民社會（社區、環保團體）一起處理 → 民主治理的協力。(B) 縣府仍出資並接收報告，不是完全轉移；(C)(D) 題文沒有課責替代或選舉。","d":1},{"i":"b1223","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市要在兩案中擇一。甲案：全市總體福祉提升幅度較大，但所得最低 10% 的市民所得下降 5%。乙案：全市總體福祉提升幅度較小，但所得最低 10% 的市民所得提高 8%。依各理論的判斷標準，下列何者最適當？","o":[["A","效益主義傾向甲案，羅爾斯傾向乙案"],["B","效益主義傾向乙案，羅爾斯傾向甲案"],["C","效益主義與羅爾斯都傾向甲案"],["D","效益主義與羅爾斯都傾向乙案"]],"a":"A","e":"效益主義看總體福祉，甲案提升較多 → 甲；羅爾斯看最不利者，乙案讓最低所得者提高 8% → 乙。","d":1},{"i":"b1224","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關民主治理與課責的敘述，哪些正確？","o":[["A","政府對人民提案說明理由並回覆，即使不採納，也可展現回應"],["B","審計部審核政府決算，屬於水平課責"],["C","公民投票屬於社會課責"],["D","政府資訊原則公開，有助於人民進行課責"],["E","民主治理意指由政府獨自承擔所有公共事務"]],"a":"ABD","e":"(A) 回應≠接受 ✓；(B) 審計部是政府機關，審核決算＝水平 ✓；(C) 公投是人民對政府＝垂直 ✗；(D) 透明是課責的前提 ✓；(E) 治理強調多方協力 ✗。","d":1},{"i":"b1225","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關審議民主的敘述，哪些正確？","o":[["A","參與者應在獲得多元、充分的資訊後再討論"],["B","重視彼此說明理由，而不只是表達偏好"],["C","審議結論必然具有法律拘束力，政府必須照單全收"],["D","參與者若因表達能力、文化資本差異而發言不均，可能影響審議品質"],["E","公民共識會議、參與式預算的審議討論，都屬於審議民主的實踐"]],"a":"ABDE","e":"(C) 審議結論通常是政策建議，不必然有法律拘束力 ✗。其餘都是審議民主的要件、限制或實踐。","d":1},{"i":"b1226","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義理論與正義類型的敘述，哪些正確？","o":[["A","效益主義重視每一個人的權利，因此不會為了多數人的利益犧牲少數人"],["B","羅爾斯認為，在無知之幕後，理性的人會選擇保障最不利者的制度"],["C","自由至上主義支持國家透過高額累進稅進行大規模財富重分配"],["D","程序正義、匡正正義屬於「正義的類型」，效益主義屬於「正義理論」"],["E","依需要分配的社會救助，較可能獲得羅爾斯立場的支持"]],"a":"BDE","e":"(A) 效益主義看總量，**可能**為多數犧牲少數 ✗（這正是它最常被批評的地方）；(C) 自由至上主義反對大規模重分配 ✗；(D) 正義類型（分配／程序／匡正）和正義理論（效益／羅爾斯／自由至上）是兩個層次 ✓；(E) 依需要協助最弱勢者，符合差異原則 ✓。","d":1},{"i":"b1227","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等的敘述，哪些正確？","o":[["A","形式平等可能忽略人們起點的差異"],["B","合理的差別待遇須目的正當，且手段與目的之間有合理關聯"],["C","積極平權措施若欠缺正當理由，也可能被批評為反向歧視"],["D","公共建築設置無障礙坡道，是追求實質平等的做法"],["E","差別待遇一經民主程序通過，即屬合理"]],"a":"ABCD","e":"(C) 積極平權本身追求實質平等，但若缺乏正當理由，確實可能被批評為反向歧視 ✓；(E) 民主程序通過仍要接受平等原則檢驗 ✗。","d":1},{"i":"b1228","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"表 2 為某國家庭可支配所得五等分位資料。依據表 2，下列敘述哪些可以直接得知？\n\n表 2\n\n| 項目 | 2014 年 | 2024 年 |\n|---|---|---|\n| 最高所得組／最低所得組 平均每戶可支配所得倍數 | 6.05 倍 | 6.14 倍 |\n| 未計入政府移轉收支（社福給付、租稅）前的倍數 | — | 9.80 倍 |\n| 最低所得組平均每戶可支配所得 | — | 35 萬元 |\n| 最高所得組平均每戶可支配所得 | — | 215 萬元 |","o":[["A","2024 年最高所得組平均每戶可支配所得約為最低所得組的 6 倍"],["B","十年間所得差距倍數略為擴大"],["C","2024 年政府移轉收支有縮小所得差距的效果"],["D","2024 年最低所得組的每一戶，可支配所得都低於 35 萬元"],["E","所得差距擴大的原因是產業外移"]],"a":"ABC","e":"(A) 215÷35≈6.14 ✓；(B) 6.05→6.14 ✓；(C) 移轉前 9.80 倍、移轉後 6.14 倍，差距縮小 ✓；(D) ⚠️ 35 萬是**平均**，不代表每一戶都低於 35 萬 ✗；(E) ⚠️ **題文沒說原因** ✗。","d":1},{"i":"b1229","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體作用的敘述，哪些正確？","o":[["A","議題設定影響大眾「想什麼」，框架影響大眾「怎麼想」"],["B","守門是指編輯、記者決定哪些訊息能成為新聞"],["C","置入性行銷使廣告與新聞內容的界線模糊，損害閱聽人知的權利"],["D","媒體所有權集中，通常會使觀點更加多元"],["E","演算法推薦可能強化同溫層，使人誤判多數意見"]],"a":"ABCE","e":"(D) 所有權集中會讓觀點趨於單一 ✗。","d":1},{"i":"b1230","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","抽樣是否隨機、具代表性，比單純增加樣本數更重要"],["B","95% 信心水準表示該次調查有 95% 的受訪者誠實作答"],["C","兩位候選人支持度的可能區間若重疊，不宜宣稱誰領先"],["D","民調題目的用語可能影響調查結果"],["E","委託單位的立場不會影響民調的設計"]],"a":"ACD","e":"(B) 信心水準是指「用同樣方法重複抽樣，約 95% 的區間會包含真實值」，與誠實作答無關 ✗；(E) 委託者可能影響題目設計 ✗。","d":1},{"i":"b1231","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體近用、媒體再現與媒體識讀的敘述，哪些正確？","o":[["A","人民要求媒體刊登更正或答辯，是在行使媒體近用權"],["B","媒體再現不平等，是指弱勢群體缺乏使用媒體發聲的管道"],["C","第四權是指媒體監督行政、立法、司法等政府權力"],["D","判斷網路訊息時，應區分可查證的事實與個人意見"],["E","利用事實查核平臺、交叉比對官方資料，都是查證訊息的方法"]],"a":"ACDE","e":"(B) 描述的是**近用**不平等；再現不平等是「被呈現的形象」 ✗。","d":1},{"i":"b1238","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"許多市民透過 1999 市民專線反映某路口一下大雨就淹水，工務局一週內派員勘查，並在網站公告改善工程的排程。工務局的做法最能體現民主治理的哪一項概念？","o":[["A","透明"],["B","參與"],["C","回應"],["D","水平課責"]],"a":"C","e":"人民先反映 → 政府處理並說明 ＝ 回應。⚠️ 公告排程有一點透明的成分，但題目的主軸是「對人民反映的問題作出處理」，最佳答案是回應。","d":1},{"i":"b1239","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某部會研擬「電動機車補助辦法」時，先把草案公告在網路上 60 天，徵求民眾與業者意見，再依意見修正條文。這項做法最能體現民主治理的哪一項概念？","o":[["A","參與"],["B","回應"],["C","垂直課責"],["D","匡正正義"]],"a":"A","e":"決策**之前**讓民眾表達意見 ＝ 參與。⚠️ 和第 1 題比較：參與是「決定前讓人民說話」；回應是「人民說了之後，政府處理、回覆」。","d":1},{"i":"b1240","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市長為了加快拆除進度，要求下屬「先拆再說，法律程序事後再補」。這項指示最直接違反民主治理的哪一項概念？","o":[["A","透明"],["B","法治"],["C","回應"],["D","社會課責"]],"a":"B","e":"法治＝依法行政、受法律拘束。「先拆再說、程序事後補」就是不依法定程序行事。","d":1},{"i":"b1241","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"甲：審計部發現某工程浮報經費並函送檢調；乙：媒體連續報導此案；丙：縣議會刪除該工程下年度的預算；丁：縣民連署罷免縣長。下列敘述何者正確？","o":[["A","乙屬於垂直課責"],["B","丁屬於社會課責"],["C","甲屬於社會課責"],["D","甲、丙都屬於水平課責"]],"a":"D","e":"甲（審計部）、丙（縣議會）都是政府機關追究行政機關＝水平課責。乙（媒體）是社會課責，丁（罷免）是垂直課責。","d":1},{"i":"b1242","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某市施政滿意度民調偏低，市長因此調整政策方向。有人認為「這是垂直課責」。下列評論何者最適當？","o":[["A","正確，因為民調是由人民表達意見"],["B","正確，因為民調結果具有法律效力"],["C","這屬於水平課責，因為市長在政府內部調整政策"],["D","不完全正確，垂直課責的典型是人民透過選舉、罷免、公投追究責任；市長依民調調整政策，較接近回應"]],"a":"D","e":"垂直課責要有「人民可以讓官員付出政治代價」的機制：選舉、罷免、公投。民調只是反映民意，沒有強制力；市長看到民調而調整政策，較接近回應。(C) 調整政策不是機關之間的追究。","d":1},{"i":"b1243","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"針對同一項爭議，甲案：舉辦全國性公民投票；乙案：隨機抽選 150 位公民組成公民會議，閱讀資料、詢問專家、討論三個週末後提出建議。關於兩案，下列敘述何者最適當？","o":[["A","甲、乙兩案都是審議民主的典型"],["B","乙案強調參與者在知情下互相說理，甲案主要是把個人偏好加總"],["C","甲案的結果對政府沒有拘束力，乙案的建議則有法律拘束力"],["D","乙案參與人數較少，因此違反民主原則"]],"a":"B","e":"公投是每個人投下自己的偏好再加總；公民會議是知情後互相說理。(A) 公投不是審議民主的典型；(C) 說反了，公投結果依法有拘束力，公民會議的建議通常沒有；(D) 審議民主的價值在討論品質，不是人數。","d":1},{"i":"b1244","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"下列哪一種做法「最不」符合審議民主的精神？","o":[["A","會議前提供參與者正反雙方的資料"],["B","由主持人確保每位參與者都有發言機會"],["C","為了節省時間，會議一開始就直接投票，不進行討論"],["D","讓參與者可以詢問不同立場的專家"]],"a":"C","e":"審議民主的核心是「投票前先充分討論、交換理由」。直接投票、跳過討論，就失去審議的意義。","d":1},{"i":"b1245","s":"公民","u":"第5課","t":"4-5-治理","k":"s","q":"某市以「網路報名、先到先得」的方式招募 30 位市民參加交通政策審議會，結果參與者多為 20～40 歲、住在市中心的上班族。這最可能造成審議的何種問題？","o":[["A","參與者組成欠缺代表性，郊區居民與高齡者的觀點可能被忽略"],["B","參與者太年輕，審議結論因此無效"],["C","上班族的文化資本較高，所以審議品質一定比較好"],["D","違反匡正正義"]],"a":"A","e":"先到先得的報名方式，讓參與者集中在某些族群，代表性不足。(B) 年輕不會讓結論無效；(C)「一定」過度推論；(D) 無關。","d":1},{"i":"b1246","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲：市府依各里老年人口比例分配長照據點；乙：公司依業績發放年終獎金；丙：法院判決肇事者賠償被害人的醫療費用；丁：選舉中每位公民一人一票。上述做法依序最符合下列哪一組？","o":[["A","依需要分配、平均分配、程序正義、依貢獻分配"],["B","依貢獻分配、依需要分配、匡正正義、程序正義"],["C","依需要分配、依貢獻分配、匡正正義、平均分配"],["D","平均分配、依貢獻分配、分配正義、依需要分配"]],"a":"C","e":"甲：依老年人口（照顧需求）＝需要；乙：依業績＝貢獻；丙：賠償被害人＝匡正正義；丁：一人一票＝平均分配。","d":1},{"i":"b1247","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某獎學金在受理申請前公告評分標準，審查後申請人可以查詢自己的分數，並在期限內提出申覆。這項設計主要符合下列何者？","o":[["A","分配正義中的依需要分配"],["B","程序正義"],["C","匡正正義"],["D","效益主義"]],"a":"B","e":"事先公告標準、可查分數、可申覆，都是在確保「決定過程公正」＝程序正義。","d":1},{"i":"b1248","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某國擬規定：「為使醫療資源發揮最大效益，重症病床不足時，優先救治預期存活年數較長的年輕患者。」下列評論何者最適當？","o":[["A","羅爾斯必然支持，因為高齡者是社會上最有利的人"],["B","自由至上主義必然支持，因為國家積極介入醫療分配"],["C","這是程序正義的問題，與正義理論無關"],["D","效益主義可能支持，因為救治年輕患者預期增加的總福祉較大；但此規定可能被批評犧牲少數人的權利"]],"a":"D","e":"效益主義看總福祉，可能支持；但它最常被批評的地方，正是為了總量而犧牲少數人（高齡患者）的權利。(A) 高齡重症患者不是最有利者；(B) 自由至上主義主張國家少介入；(C) 這是分配正義與正義理論的問題。","d":1},{"i":"b1249","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"下列哪一種情況，最符合羅爾斯「差異原則」可以接受的不平等？","o":[["A","所有人的所得完全相同"],["B","取消一切社會福利，以降低所有人的稅負"],["C","醫師的所得較高，但高所得吸引人才投入醫療，使貧困地區的居民也能獲得醫療服務"],["D","依家世背景分配公職"]],"a":"C","e":"差異原則不要求所有人一樣，而是容許不平等，前提是這個不平等**對最不利者有利**：醫師高薪 → 吸引人才 → 貧困地區也有醫療。(A) 完全平等不是羅爾斯的主張；(B) 取消社福傷害最不利者；(D) 違反機會平等。","d":1},{"i":"b1250","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲說：「只要財產是透過合法交易或自願贈與取得的，即使貧富差距很大，國家也不應強制重分配。」甲最可能贊成下列哪一項政策？","o":[["A","提高富人的所得稅率"],["B","全面實施免費公立托育，並以增稅支應"],["C","降低稅率，並縮減政府的社會福利支出"],["D","立法規定企業董事須有一定比例的女性"]],"a":"C","e":"自由至上主義重視財產權，反對強制重分配，所以傾向低稅、小政府。(A)(B) 都是重分配；(D) 是國家強制介入企業。","d":1},{"i":"b1251","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市規定：「公車博愛座優先提供孕婦、長者、身心障礙者及抱嬰兒者使用。」下列評論何者最適當？","o":[["A","違反形式平等，因此必然違法"],["B","考量特定群體的身體需要，差別待遇有正當目的與合理關聯，屬於追求實質平等"],["C","屬於匡正正義"],["D","所有差別待遇都是歧視"]],"a":"B","e":"博愛座的目的（照顧行動不便者）正當，手段（提供座位）與目的有合理關聯，屬於實質平等。","d":1},{"i":"b1252","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某公司的徵才條件為「須能配合每週六日加班，且任職三年內不得申請育嬰留職停薪」。條件中沒有提到性別，但實際上主要排除負擔照顧責任的女性。下列評論何者最適當？","o":[["A","條件文字中性，不可能構成性別歧視"],["B","這是積極平權措施"],["C","這是依需要分配"],["D","形式上對所有人相同，但可能對特定群體造成不利，需檢驗這些條件與工作需求是否有合理關聯"]],"a":"D","e":"條件文字沒有提到性別，但實際上不利於特定群體，屬於間接歧視的疑慮，要檢驗這些條件是否真的是工作所必需。(A) 文字中性仍可能造成歧視；(B) 不是在保障弱勢；(C) 無關。","d":1},{"i":"b1253","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據表 1 與附註，下列推論何者最適當？","o":[["A","族群丙勞動者的工作能力較低"],["B","各族群平均月薪的差距，可能與職業分布不同有關"],["C","雇主在同一職業中嚴重歧視族群丙"],["D","族群甲的每一位勞動者，月薪都高於 5 萬元"]],"a":"B","c":"表 1　某國 25～64 歲勞動者的職業與薪資（依族群區分）\n\n| 族群 | 從事「主管及專業人員」的比例 | 平均月薪 |\n|---|---|---|\n| 甲 | 32% | 5.2 萬元 |\n| 乙 | 18% | 3.9 萬元 |\n| 丙 | 12% | 3.4 萬元 |\n\n附註：在同一職業類別中，各族群的平均月薪差距都不超過 5%。","e":"附註說同一職業內的薪資差距不超過 5%，但三個族群擔任高薪職業的比例差很多，所以平均月薪差距很可能來自職業分布不同。(A)「能力較低」、(C)「嚴重歧視」都是 ⚠️ **題文沒說**，而且 (C) 和附註矛盾；(D) 平均≠每一位。","d":1},{"i":"b1254","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列哪一項「可以」從表 1 得知？","o":[["A","族群甲從事主管及專業人員的比例，約為族群丙的 2.7 倍"],["B","族群丙較不重視子女教育"],["C","族群乙的平均月薪在近十年持續上升"],["D","職業分布的差異來自教育機會不平等"]],"a":"A","c":"表 1　某國 25～64 歲勞動者的職業與薪資（依族群區分）\n\n| 族群 | 從事「主管及專業人員」的比例 | 平均月薪 |\n|---|---|---|\n| 甲 | 32% | 5.2 萬元 |\n| 乙 | 18% | 3.9 萬元 |\n| 丙 | 12% | 3.4 萬元 |\n\n附註：在同一職業類別中，各族群的平均月薪差距都不超過 5%。","e":"32÷12≈2.67，約 2.7 倍 ✓。(B) 子女教育、(C) 十年趨勢、(D) 原因，表中都沒有。","d":1},{"i":"b1255","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某調查顯示：「2005 年 30 歲青年平均需工作 8 年才能存足購屋頭期款，2025 年需 15 年；父母擁有兩戶以上房屋的青年，有 62% 在 35 歲前購屋，父母無自有房屋者僅 18%。」依據這項資料，下列推論何者最適當？","o":[["A","青年購屋困難，是因為青年不努力工作"],["B","父母無自有房屋的青年，比較不想買房"],["C","2025 年所有青年都買不起房屋"],["D","購屋難度上升，且家庭資產可能影響青年購屋機會，顯示不平等可能跨代延續"]],"a":"D","e":"8 年 → 15 年＝購屋變難；62% vs 18%＝家庭資產影響購屋機會 → 不平等可能跨代延續。(A)「不努力」、(B)「不想買」是 ⚠️ **題文沒說的原因與意願**；(C)「所有」過度推論。","d":1},{"i":"b1256","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"甲：某週各電視台連續報導青年低薪問題，青年低薪成為立法委員質詢的焦點；乙：A 台標題為「青年躺平不努力」，B 台標題為「薪資停滯，青年難以翻身」；丙：某台主管決定刪除受訪青年批評雇主的片段。甲、乙、丙依序最能說明哪些媒體作用？","o":[["A","議題設定、框架、守門"],["B","框架、議題設定、守門"],["C","守門、框架、議題設定"],["D","議題設定、守門、框架"]],"a":"A","e":"甲：大家都在談、進入質詢焦點＝議題設定；乙：同一議題不同角度＝框架；丙：決定哪些片段能播出＝守門。","d":1},{"i":"b1257","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某政府機關付費給電視台，在新聞時段以「專題報導」的形式介紹政策成果，畫面沒有標示為廣告。這項做法最主要的問題為何？","o":[["A","媒體近用不平等"],["B","議題設定"],["C","這是第四權的展現"],["D","政府置入性行銷，混淆新聞與宣傳，損害閱聽人知的權利與新聞獨立"]],"a":"D","e":"政府付費、以新聞形式呈現、未標示廣告＝政府置入性行銷，混淆新聞與宣傳。","d":1},{"i":"b1258","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調報告：「本次調查在 95% 信心水準下，抽樣誤差為正負 2.5 個百分點，贊成某政策者為 52%。」下列解讀何者最適當？","o":[["A","全體民眾中，贊成者一定是 52%"],["B","若以同樣方法重複抽樣多次，約有 95% 的估計區間會涵蓋真實比例；本次估計區間為 49.5%～54.5%"],["C","贊成者確定已經過半數"],["D","有 5% 的受訪者回答錯誤"]],"a":"B","e":"估計區間為 52±2.5＝49.5%～54.5%；下限低於 50%，所以**不能確定**已過半，(C) 錯。95% 信心水準的意思是「用同樣方法重複抽樣，約 95% 的區間會涵蓋真實值」。(A)「一定」錯；(D) 與回答錯誤無關。","d":1},{"i":"b1259","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某則訊息的標題為「緊急！某牌泡麵含致癌物，已有三人送醫」，內文沒有具體品名、批號或醫院名稱，結尾寫著「不轉不是臺灣人」。下列哪兩項最能顯示它可能是假訊息？甲：使用情緒性標題與道德勒索；乙：缺乏可查證的具體資訊；丙：文字通順易懂；丁：已被很多人分享。","o":[["A","甲丙"],["B","丙丁"],["C","甲乙"],["D","乙丁"]],"a":"C","e":"甲（情緒勒索）、乙（沒有可查證的資訊）是假訊息典型特徵。丙文字通順、丁轉傳多，都不能判斷真假。","d":1},{"i":"b1260","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某原住民族團體批評：「主流媒體報導部落時，總是聚焦在豐年祭的歌舞和喝酒，很少報導部落的產業與教育成就。」這個團體最可能提出下列哪一項改善要求？","o":[["A","要求政府收購主流媒體"],["B","要求媒體以多元角度報導，並讓族人參與節目製作"],["C","要求媒體停止所有關於部落的報導"],["D","要求提高電視台的廣告收入"]],"a":"B","e":"團體批評的是**被呈現的方式**（刻板印象）＝再現不平等，改善方式是多元報導、讓當事人參與製作。","d":1},{"i":"b1261","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某記者報導官員弊案後，官員要求記者交出消息來源。下列評論何者最適當？","o":[["A","記者應交出消息來源，因為第四權不受任何保障"],["B","這是媒體近用權的問題"],["C","這是議題設定的問題"],["D","保護消息來源有助於媒體發揮監督政府的第四權功能"]],"a":"D","e":"媒體能監督政府，前提是爆料者不必擔心身分曝光；保護消息來源是第四權得以運作的條件。","d":1},{"i":"b1262","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣府為一項開發案舉辦公聽會，只在平日上午於縣府會議室舉行，也沒有事先公布開發計畫的資料。批評者認為這場公聽會「流於形式」。下列何者最能說明批評者的理由？","o":[["A","上班族與偏遠居民難以出席，且缺乏資訊，使參與流於形式"],["B","公聽會本來就不屬於民主治理的做法"],["C","公聽會的結論具有法律拘束力，所以必須慎重"],["D","公聽會違反匡正正義"]],"a":"A","e":"參與要「有機會出席」又「有資訊可以判斷」。時間只在平日上午、又沒有資料，兩個條件都不足 → 流於形式。","d":1},{"i":"b1263","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市建置開放資料平臺，公開空氣品質即時數據；環保團體運用這些數據發布報告，批評某工業區污染嚴重並要求市府改善；市府隨後加強稽查並公布結果。題文依序最能體現哪些概念？","o":[["A","參與→垂直課責→法治"],["B","回應→水平課責→透明"],["C","透明→垂直課責→參與"],["D","透明→社會課責→回應"]],"a":"D","e":"開放空品數據＝透明 → 環保團體據此批評、要求改善＝社會課責 → 市府加強稽查並公布＝回應。","d":1},{"i":"b1264","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某大學面試時，一位面試委員是某考生的叔叔，卻沒有迴避；該考生最後沒有錄取。有人說：「反正沒錄取，所以沒有不公平。」下列評論何者最適當？","o":[["A","考生沒有因此得利，所以程序沒有問題"],["B","程序正義重視決定過程是否公正，委員未迴避本身就違反程序正義"],["C","這是匡正正義的問題"],["D","這是依需要分配的問題"]],"a":"B","e":"程序正義看過程；只要委員和考生有親屬關係卻沒有迴避，程序就有瑕疵，不論結果如何。","d":1},{"i":"b1265","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"我國地方民意代表選舉規定，選舉區應選名額達四人者，應有婦女當選名額一人。下列敘述何者最適當？","o":[["A","這屬於積極平權措施，目的是改善女性在政治參與上的結構性不利"],["B","這項規定違反實質平等"],["C","這屬於匡正正義中的國家賠償"],["D","這是依效益主義追求總量最大化"]],"a":"A","e":"婦女保障名額考量女性在政治參與上的結構性不利，屬於積極平權措施，追求實質平等。","d":1},{"i":"b1266","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某議題經媒體連續報導後，民調顯示多數民眾表示關注，立法院隨即將相關法案排入審查。這最能說明下列何者？","o":[["A","媒體與公共意見可能影響政策議程"],["B","媒體已取代立法院行使立法權"],["C","民調結果具有法律效力"],["D","媒體近用權受到侵害"]],"a":"A","e":"媒體報導 → 民眾關注 → 立法院排入審查：媒體與公共意見影響政策議程。(B) 立法權仍在立法院。","d":1},{"i":"b1267","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"甲：家長透過校友人脈，替孩子安排企業實習；乙：家長從小帶孩子學鋼琴、閱讀經典；丙：家長以存款支付孩子的海外遊學費用。甲、乙、丙依序最接近哪一種資本的運用？","o":[["A","文化資本、社會資本、經濟資本"],["B","經濟資本、文化資本、社會資本"],["C","社會資本、文化資本、經濟資本"],["D","社會資本、經濟資本、文化資本"]],"a":"C","e":"人脈＝社會資本；才藝、閱讀習慣＝文化資本；存款＝經濟資本。","d":1},{"i":"b1268","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"下列有關民主治理的敘述，哪些正確？","o":[["A","政府主動公開預算與決算資料，屬於透明"],["B","人民透過市民專線反映問題，政府隨即處理並說明，屬於回應"],["C","施政滿意度民調偏低，屬於垂直課責"],["D","行政機關不能「先做再補程序」，體現法治"],["E","立法院對行政院長提出不信任案，屬於水平課責"]],"a":"ABDE","e":"(C) 民調沒有強制力，不是垂直課責 ✗。(E) 不信任案是立法院追究行政院＝水平 ✓。","d":1},{"i":"b1269","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關審議民主與民意表達方式的敘述，哪些正確？","o":[["A","公民投票主要是把個人偏好加總，不以互相說理為核心"],["B","審議民主的參與者應盡量涵蓋不同背景，以提高代表性"],["C","公聽會若只在平日上班時間舉行、未提供資料，可能流於形式"],["D","審議民主主張由專家取代公民做決定"],["E","審議討論的品質可能受到參與者表達能力的影響"]],"a":"ABCE","e":"(D) 審議民主是讓一般公民在聽取專家意見後自己討論，不是由專家決定 ✗。","d":1},{"i":"b1270","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義的敘述，哪些正確？","o":[["A","程序正義關心決定過程是否公正，與結果是否對自己有利無關"],["B","羅爾斯的差異原則允許某些不平等存在，前提是對最不利者最有利"],["C","自由至上主義主張國家應積極縮小貧富差距"],["D","效益主義可能為了總體福祉而犧牲少數人的利益"],["E","冤獄賠償屬於分配正義"]],"a":"ABD","e":"(C) 自由至上主義反對國家積極重分配 ✗；(E) 冤獄賠償是在補救錯誤＝匡正正義 ✗。","d":1},{"i":"b1271","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等與歧視的敘述，哪些正確？","o":[["A","規定的文字中性，仍可能對特定群體造成不利"],["B","婦女保障名額屬於積極平權措施"],["C","博愛座是考量特定群體需要的合理差別待遇"],["D","合理的差別待遇須目的正當，且手段與目的之間有合理關聯"],["E","經多數決通過的規定，一定不會侵害少數人的權利"]],"a":"ABCD","e":"(E) 多數決可能侵害少數人的權利 ✗。","d":1},{"i":"b1272","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"表 2 為某國 15 歲學生數學素養的調查結果。依據表 2，下列敘述哪些可以直接得知？\n\n表 2\n\n| 家庭社經地位 | 平均分數 | 達最高等級的學生比例 |\n|---|---|---|\n| 最低 25% | 452 | 4% |\n| 次低 25% | 489 | 9% |\n| 次高 25% | 517 | 16% |\n| 最高 25% | 563 | 31% |","o":[["A","家庭社經地位越高的組別，平均分數越高"],["B","最高組與最低組的平均分數差距為 111 分"],["C","最低組中仍有學生達到最高等級"],["D","最低組的學生學習不夠努力"],["E","最高組每一位學生的分數，都高於最低組的每一位學生"]],"a":"ABC","e":"(A) 452→489→517→563 逐組上升 ✓；(B) 563−452＝111 ✓；(C) 最低組有 4% 達最高等級 ✓；(D) ⚠️ 題文沒說「努力」✗；(E) ⚠️ 平均分數高≠每個人都高 ✗。","d":1},{"i":"b1273","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體的敘述，哪些正確？","o":[["A","政府付費在新聞時段以報導形式宣傳政策，是在行使媒體近用權"],["B","保護消息來源，有助於媒體發揮監督政府的功能"],["C","媒體近用權是指媒體不受政府干預的權利"],["D","守門是指編輯、記者決定哪些事件可以成為新聞"],["E","媒體反覆報導使議題進入政策議程，可能與議題設定有關"]],"a":"BDE","e":"(A) 政府付費宣傳是置入性行銷，不是近用權 ✗；(C) 媒體不受干預是新聞自由，近用權是**人民**接近使用媒體的權利 ✗。","d":1},{"i":"b1274","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","估計值 52%、抽樣誤差正負 2.5 個百分點時，不能確定贊成者已過半數"],["B","網路自願填答的調查，樣本數再大也不一定具代表性"],["C","樣本數越大，題目引導用語造成的偏差就越小"],["D","民調可以作為政府了解民意、調整政策的參考"],["E","抽樣誤差的計算，已經包含題目用語造成的偏差"]],"a":"ABD","e":"(C) 樣本數再大，也無法修正題目用語的偏差 ✗；(E) 抽樣誤差只反映「抽樣」造成的不確定，不包含題目用語等非抽樣偏差 ✗。","d":1},{"i":"b1275","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體識讀的敘述，哪些正確？","o":[["A","情緒性標題、要求轉傳，是假訊息常見的特徵"],["B","被大量轉傳的訊息，就是可信的訊息"],["C","演算法依使用者偏好推送內容，可能形成同溫層"],["D","查證訊息時，應找原始出處並交叉比對"],["E","為防堵假訊息，政府可以不經任何程序，直接刪除所有批評政府的貼文"]],"a":"ACD","e":"(B) 轉傳多不代表可信 ✗；(E) 防堵假訊息也要兼顧言論自由與正當程序 ✗。","d":1},{"i":"b1282","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"某公司文件記載：「以中國生絲運往日本換取白銀，並在本島收購鹿皮輸往日本。」這段紀錄反映荷蘭在臺經營的主要性質為何？","o":[["A","轉口貿易的據點"],["B","大規模移民墾殖的殖民地"],["C","傳教士主導的宗教中心"],["D","對抗清朝的軍事基地"]],"a":"A","d":1},{"i":"b1283","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"1626 年西班牙出兵占領臺灣北部的雞籠，最主要的考量為何？","o":[["A","收購臺灣南部的鹿皮"],["B","在臺灣發展稻米與蔗糖"],["C","建立反清復明的根據地"],["D","防止荷蘭切斷其馬尼拉通往中國、日本的航線"]],"a":"D","d":1},{"i":"b1284","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"下列哪一件事發生於 1642 年？","o":[["A","鄭成功率軍登陸臺灣"],["B","荷蘭北上驅逐雞籠的西班牙勢力"],["C","郭懷一率漢人起事"],["D","陳永華建孔廟、設學校"]],"a":"B","d":1},{"i":"b1285","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"荷蘭東印度公司在臺灣可以築城、養兵、與原住民締約，甚至審判案件。這說明該公司的性質是：","o":[["A","由荷蘭國王直接派官治理的王室機構"],["B","以傳教為主要任務的教會組織"],["C","受母國授權、擁有國家權力的商業公司"],["D","由在臺漢人推舉組成的自治團體"]],"a":"C","d":1},{"i":"b1286","s":"歷史","u":"L3 荷鄭到清","t":"史1-3-荷制","k":"s","q":"荷蘭時期，各社長老每年前來集會，由公司授予藤杖、宣布法令。對這項制度的評論，下列何者最恰當？","o":[["A","原住民各社藉此實現自治，不受公司干涉"],["B","公司藉長老管理各社，是成本最低的間接統治"],["C","漢人透過此會
