"o":[["A","文化資本"],["B","經濟資本"],["C","人力資本"],["D","社會資本"]],"a":"D","e":"透過人際網絡取得資源，是社會資本。","d":1},{"i":"b351","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"新聞媒體連日大幅報導空氣汙染，之後的民調中，把空汙列為「最重要問題」的民眾明顯增加。這最能說明媒體的哪一種效果？","o":[["A","議題設定"],["B","框架"],["C","守門"],["D","第四權"]],"a":"A","e":"媒體大量報導，使民眾認為某議題最重要，是議題設定（影響「想什麼」）。","d":1},{"i":"b352","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"同一則電價調漲新聞，甲媒體以「政府終於正視電力公司虧損」為角度，乙媒體以「小市民荷包又失血」為角度報導。這最能說明下列何者？","o":[["A","議題設定"],["B","框架"],["C","守門"],["D","媒體近用"]],"a":"B","e":"同一事件選擇不同角度呈現，是框架（影響「怎麼想」）。","d":1},{"i":"b353","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"記者與編輯判斷新聞價值，決定哪些事件能成為新聞、哪些不刊登。這是媒體的哪一種功能？","o":[["A","框架"],["B","議題設定"],["C","守門"],["D","第四權"]],"a":"C","e":"記者、編輯決定哪些事件成為新聞，是守門。","d":1},{"i":"b354","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"媒體被稱為「第四權」，最主要的原因是：","o":[["A","媒體是政府設立的第四個部門"],["B","媒體有權審判犯罪者"],["C","媒體可以制定法律"],["D","媒體能監督行政、立法、司法三權"]],"a":"D","e":"媒體監督行政、立法、司法三權，所以稱為第四權；它不是政府部門。","d":1},{"i":"b355","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"下列何者屬於民眾行使媒體近用權？","o":[["A","讀者投書報社，對報導提出不同意見並要求刊登"],["B","記者決定新聞的播出順序"],["C","政府審查電影的分級"],["D","電視台購買外國節目的版權"]],"a":"A","e":"民眾投書要求媒體刊登不同意見，是媒體近用權。","d":1},{"i":"b356","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某日發生殺人案，警方經調查後召開破案記者會，指出有充分證據顯示甲應為兇手，並在回答媒體問題時，說明甲的姓名、家庭狀況等個資。記者根據警方提供的個人資料，報導甲家人的新聞，之後甲被起訴，並經法院判決有罪確定。對於本案中警方與記者的行為，下列評論哪項最適切？","o":[["A","因法院判決有罪，警方洩漏個資行為並未違反偵查不公開原則"],["B","破案記者會的時間在起訴前，故警方並未違反偵查不公開原則"],["C","警方提供記者與公益無關之嫌疑人個資，違反偵查不公開原則"],["D","記者報導甲家人的相關新聞，其行為明顯違反偵查不公開原則"]],"a":"C","e":"警方在偵查中提供與公益無關的嫌疑人個資，違反偵查不公開。(A)(B) 判決結果或起訴時間不影響偵查時應遵守的原則；(D) 偵查不公開規範的是偵查機關，不是記者。","r":"112 分科公民與社會第 5 題","d":1},{"i":"b357","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"我國曾存在國家以公權力抑制特定文化之現象。例如，1970 年代，以本土語言播出的布袋戲電視節目轟動一時，卻遭禁播，原因之一為政府宣稱節目充斥低俗趣味，且有違國語運動政策。有學者提出，當時無論在公開場合、文學或表演藝術的領域，已出現本土語文的更普遍使用。例如在選舉期間，有候選人幾乎全程採用本土語言進行街頭演講，同時也有鄉土文學作家書寫草根人物的本土語言習慣。依據題文，我國當時官方政策與語言文化之間的關連性，最適合以下列何項敘述加以詮釋？","o":[["A","文化政策體現權力不平等，主要存在於媒體再現之中"],["B","文化政策雖欲強化特定文化形象，卻仍面對反對力量"],["C","文化政策欲提升媒體品質，導致未能欣賞各文化之美"],["D","文化政策僅關注精緻文化，忽視通俗文化亦具趣味性"]],"a":"B","e":"政府雖以禁播等手段強化國語文化，但民間仍普遍使用本土語言（選舉演講、鄉土文學），表示政策面對反對力量。","r":"115 學測社會第 51 題（題文節錄）","d":1},{"i":"b358","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲支持度 52%、乙 43%，抽樣誤差為正負 3 個百分點。下列解讀何者正確？","o":[["A","兩人範圍重疊，無法判斷誰領先"],["B","兩人範圍不重疊，可以判斷甲領先"],["C","抽樣誤差太大，這份民調無效"],["D","乙的支持度仍有可能高於甲"]],"a":"B","e":"甲 49～55%，乙 40～46%，範圍不重疊，可以判斷甲領先。","d":1},{"i":"b359","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"下列哪一個民調題目的用字最為中立？","o":[["A","請問您贊不贊成興建新的捷運路線？"],["B","面對嚴重塞車，請問您贊成盡快興建捷運嗎？"],["C","請問您是否同意，浪費公帑的捷運計畫應該停止？"],["D","多數專家都支持興建捷運，請問您贊成嗎？"]],"a":"A","e":"(B) 用「嚴重塞車」引導贊成；(C) 用「浪費公帑」引導反對；(D) 用「多數專家支持」引導贊成。","d":1},{"i":"b360","s":"公民","u":"第5課","t":"4-5-讀題","k":"m","q":"某學者分析社會運動運用網路動員的情形，提出觀察如下：\n甲、原住民族運動在網路上並不活躍，少數存在的網站多由非原民夥伴建立及維護。\n乙、傳統婦運團體多形成實體社群，年輕婦運者則多以網路組織社群；這導致婦運內部在某些議題上分裂。\n丙、同志社運積極運用網路，更受惠於網路的匿名性，藉此提高找到倡議夥伴的可能性。\n依據上述觀察，以下哪些推論正確？","o":[["A","社運團體的世代差異會導致不同的動員策略"],["B","歷史愈久的社運，內部對議題的歧見便愈大"],["C","網路匿名性改善承受汙名群體的社運動員力"],["D","各社運的屬性不同，但皆試圖透過網路倡議"],["E","非原民的協助讓原民得以發聲並彰顯主體性"]],"a":"ACD","e":"(B) 題文只說婦運內部因世代差異而分裂，沒有比較歷史長短；(E) 原民網站由非原民建立，反而顯示原民未能充分彰顯主體性。","r":"112 分科公民與社會第 32 題","d":1},{"i":"b361","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義理論的敘述，哪些正確？","o":[["A","效益主義以整體幸福最大作為判斷標準"],["B","羅爾斯主張制度應使處境最不利的人獲得最大利益"],["C","自由至上主義支持國家以重稅進行大規模重分配"],["D","效益主義可能為了多數人的利益而忽略少數人的權益"],["E","無知之幕是指人們知道自己的社會地位之後再選擇制度"]],"a":"ABD","e":"(C) 自由至上主義反對國家以重稅重分配；(E) 無知之幕是指人們**不知道**自己的社會地位。","d":1},{"i":"b362","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義類型的敘述，哪些正確？","o":[["A","急診依病情決定看診順序，是依「表現」分配"],["B","依學業成績頒發獎學金，是依「表現」分配"],["C","國家賠償冤獄受害者，屬於程序正義"],["D","利益迴避的規定，屬於程序正義"],["E","每人一份的平均分配，也是分配正義的標準之一"]],"a":"BDE","e":"(A) 依病情是依「需要」；(C) 國家賠償冤獄是匡正正義。","d":1},{"i":"b363","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等原則的敘述，哪些正確？","o":[["A","形式平等不考慮個人處境的差異"],["B","合理的差別待遇必須有正當的目的"],["C","差別待遇的手段須與目的有合理關聯"],["D","為視障考生提供點字試卷，是實質平等的表現"],["E","公司只因性別拒絕錄用應徵者，屬於合理的差別待遇"]],"a":"ABCD","e":"(E) 只因性別就拒絕錄用，沒有正當目的，是不合理的差別待遇。","d":1},{"i":"b364","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體的敘述，哪些正確？","o":[["A","議題設定影響民眾「想什麼」"],["B","框架是指媒體選擇報導的角度與重點"],["C","守門是指政府在新聞播出前進行審查"],["D","民眾要求媒體更正錯誤報導，屬於媒體近用權"],["E","媒體監督行政、立法、司法三權，因此被稱為第四權"]],"a":"ABDE","e":"(C) 守門是記者與編輯篩選新聞，不是政府審查。","d":1},{"i":"b365","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關社會不平等的敘述，哪些正確？","o":[["A","文化資本會影響學生在學校的表現"],["B","社會資本是指人際網絡所帶來的資源"],["C","社會階層化是指社會資源在不同群體間分配不均，形成高低不同的等級"],["D","只要教育普及，階級複製的現象就會消失"],["E","性別差異不會造成社會不平等"]],"a":"ABC","e":"(D) 教育普及不保證消除階級複製，優勢家庭仍可能取得較好的教育資源；(E) 性別也是社會不平等的來源之一。","d":1},{"i":"b366","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","依隨機原則抽出的樣本較具代表性"],["B","自願參加的網路投票不能代表全體民意"],["C","兩人支持度的範圍不重疊時，可以判斷誰領先"],["D","信心水準越高，表示候選人的支持度越高"],["E","題目用字中立，可以減少對受訪者的引導"]],"a":"ABCE","e":"(D) 信心水準是「結果 ± 誤差」這個範圍的可靠程度，與支持度高低無關。","d":1},{"i":"b367","s":"公民","u":"第5課","t":"4-5-治理","k":"m","q":"下列有關民主治理的敘述，哪些正確？","o":[["A","立法委員質詢行政院長，屬於水平課責"],["B","人民透過選舉決定執政者去留，屬於垂直課責"],["C","媒體與公民團體監督政府，屬於社會課責"],["D","政府依民意調整政策並說明理由，屬於回應"],["E","治理強調由政府單獨決策，以提高效率"]],"a":"ABCD","e":"(E) 治理強調多元行動者協力，不是政府單獨決策。","d":1},{"i":"b374","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某縣政府將長期照顧中心委託民間團體經營，縣府負責訂定服務標準並定期評鑑。這種處理公共事務的方式最接近下列何者？","o":[["A","威權統治"],["B","直接民主"],["C","代議民主"],["D","治理中的公私協力"]],"a":"D","e":"政府訂標準、評鑑，民間團體經營，是治理中的公私協力。"},{"i":"b375","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"依據題文資訊，政府改善長照制度所欲達成的最重要政策目標為何？","o":[["A","保障勞動參與：增加長照勞力供給以保障勞工的就業機會"],["B","提倡兩性平權：確保家庭照護之責任由子女共同平均分擔"],["C","促進社會安全：因應人口結構變遷以保障人民生活的尊嚴"],["D","促進經濟平等：藉社會福利制度達成財富與資源重新分配"]],"a":"C","c":"美雲是單身職業婦女，獨力照顧同住的年邁母親，其餘兄弟並未分擔。近來母親失智情況惡化，她猶豫是否辭去工作照顧或聘請全天看護，但二者皆可能帶來身心與經濟壓力。美雲的困境反映我國因人口日趨老化，家屬照顧年長者的負擔也日益加重。因應上述問題，晚近政府積極改善長期照顧制度，例如：（甲）廣設日間照顧中心；（乙）改善外國籍家庭看護工引進政策；（丙）建立全國長照人員證照制度；（丁）提供直接補助給需要長照的家庭。請問：","e":"題文重點是人口老化使家屬照顧負擔加重，政府改善長照是為了保障人民生活尊嚴，屬社會安全。(B) 題文提到兄弟未分擔，但政策並沒有要求子女平均分擔。","r":"111 學測社會第 23、25 題"},{"i":"b376","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"依據題文資訊，政府改善長照制度的政策作為，何者最適合由政府委託民間執行？","o":[["A","甲"],["B","乙"],["C","丙"],["D","丁"]],"a":"A","c":"美雲是單身職業婦女，獨力照顧同住的年邁母親，其餘兄弟並未分擔。近來母親失智情況惡化，她猶豫是否辭去工作照顧或聘請全天看護，但二者皆可能帶來身心與經濟壓力。美雲的困境反映我國因人口日趨老化，家屬照顧年長者的負擔也日益加重。因應上述問題，晚近政府積極改善長期照顧制度，例如：（甲）廣設日間照顧中心；（乙）改善外國籍家庭看護工引進政策；（丙）建立全國長照人員證照制度；（丁）提供直接補助給需要長照的家庭。請問：","e":"日間照顧中心是實際提供服務的場所，適合委託民間經營；(B)(C) 涉及國家管制與證照，(D) 是政府直接補助。","r":"111 學測社會第 23、25 題"},{"i":"b377","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"審計部審核行政機關的決算，發現違失後移送相關機關處理。這屬於下列哪一種課責？","o":[["A","水平課責"],["B","垂直課責"],["C","社會課責"],["D","回應原則"]],"a":"A","e":"政府部門之間的監督，是水平課責。"},{"i":"b378","s":"公民","u":"第4課","t":"4-5-治理","k":"s","q":"某市設立陳情專線，民眾反映路燈故障後，市府三天內修復，並回覆處理情形。這最能體現民主治理的哪一項原則？","o":[["A","透明"],["B","回應"],["C","水平課責"],["D","效能"]],"a":"B","e":"依民眾反映處理並回覆，是回應。"},{"i":"b379","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某國試辦「助產士重返醫院」計畫，因成效良好，主管機關準備將此計畫法制化，交由國會儘速制定成法律。但甲學者提醒，立法過程仍應符合民主國和法治國的正當程序。關於該國國會未來可能的作為，下列何者最符合甲學者的提醒？","o":[["A","避免利益團體妨礙立法，程序應該秘密並防止外界干預"],["B","為使法律內容更完善，立法程序應充分考慮反對者意見"],["C","試辦計畫已證明結果良好，首要考量應為儘速完成立法"],["D","為落實助產制度，立法程序應該主要考慮助產士之權利"]],"a":"B","e":"正當程序要求立法過程公開、充分討論，包括聽取反對意見。(A) 秘密立法違反民主；(C)(D) 只求快或只顧一方。","r":"113 分科公民與社會第 29 題（題文節錄）"},{"i":"b380","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"甲主張：「父母留給子女的財產是父母的合法所得，政府不應課徵高額遺產稅。」甲的主張最接近下列哪一種正義理論？","o":[["A","效益主義"],["B","羅爾斯的正義論"],["C","匡正正義"],["D","自由至上主義"]],"a":"D","e":"尊重合法財產、反對以重稅移轉，是自由至上主義。"},{"i":"b381","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"乙主張：「社會福利應優先照顧處境最不利的人，讓他們獲得最大的利益。」乙的主張最接近下列哪一種正義理論？","o":[["A","羅爾斯的正義論"],["B","自由至上主義"],["C","效益主義"],["D","程序正義"]],"a":"A","e":"優先照顧最不利者，是羅爾斯的正義論。"},{"i":"b382","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"丙主張：「政府應選擇能使全體市民總幸福最大的方案，即使少數人必須承擔損失。」丙的主張最接近下列哪一種正義理論？","o":[["A","羅爾斯的正義論"],["B","自由至上主義"],["C","效益主義"],["D","匡正正義"]],"a":"C","e":"追求整體總幸福最大，是效益主義。"},{"i":"b383","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某校依學生的家庭收入發放助學金，家庭收入越低者領得越多。這是依據哪一種分配標準？","o":[["A","表現"],["B","需要"],["C","平均"],["D","年資"]],"a":"B","e":"依家庭經濟狀況，是依「需要」分配。"},{"i":"b384","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某工廠排放廢水汙染農田，法院判決工廠須賠償農民的損失。這屬於下列哪一種正義？","o":[["A","分配正義"],["B","程序正義"],["C","效益主義"],["D","匡正正義"]],"a":"D","e":"對受到不法侵害的人給予賠償，是匡正正義。"},{"i":"b385","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某里辦理社區旅遊，名額有限，事先公告以公開抽籤決定參加者，並請里民到場監督。這最重視下列何者？","o":[["A","程序正義"],["B","匡正正義"],["C","依需要分配"],["D","依表現分配"]],"a":"A","e":"公開抽籤、到場監督，重視過程公正，是程序正義。"},{"i":"b386","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"下列何者屬於合理的差別待遇？","o":[["A","餐廳拒絕身心障礙者入內用餐"],["B","公司規定女性員工懷孕後必須離職"],["C","政府在公職考試中為原住民族設置保障名額"],["D","學校規定只有男生可以參加科學營"]],"a":"C","e":"保障名額有改善長期弱勢的正當目的，屬積極平權。(A)(B)(D) 都沒有正當目的。"},{"i":"b387","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"某市對所有市民一律收取相同金額的垃圾處理費，不考慮家庭人數與收入。這最接近下列何者？","o":[["A","實質平等"],["B","形式平等"],["C","積極平權"],["D","匡正正義"]],"a":"B","e":"不考慮處境差異、一律相同對待，是形式平等。"},{"i":"b388","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"根據表 1，下列推論何者最適當？","o":[["A","補習是錄取公立大學的唯一原因"],["B","家庭收入越高的組別，子女參加補習與錄取公立大學的比例都越高"],["C","低收入家庭的子女都沒有參加補習"],["D","高收入家庭的子女一定能錄取公立大學"]],"a":"B","c":"某研究調查不同家庭月收入組別的高中生，結果如表 1。\n\n表 1\n\n| 家庭月收入組別 | 低 | 中 | 高 |\n|---|---|---|---|\n| 子女參加課後補習的比例 | 25% | 48% | 70% |\n| 子女錄取公立大學的比例 | 18% | 30% | 45% |\n\n請問：","e":"表中三組由低到高，兩個比例都上升。(A) 表只顯示關聯，不能說補習是唯一原因；(C) 低收入組有 25% 補習，不是都沒有；(D) 高收入組錄取比例是 45%，不是一定。"},{"i":"b389","s":"公民","u":"第4課","t":"4-5-正義","k":"s","q":"表 1 的現象最能用下列哪一個概念說明？","o":[["A","經濟資本影響教育機會，可能造成階級複製"],["B","教育擴張已經消除社會不平等"],["C","形式平等已經完全實現"],["D","效益主義追求最大多數人的幸福"]],"a":"A","c":"某研究調查不同家庭月收入組別的高中生，結果如表 1。\n\n表 1\n\n| 家庭月收入組別 | 低 | 中 | 高 |\n|---|---|---|---|\n| 子女參加課後補習的比例 | 25% | 48% | 70% |\n| 子女錄取公立大學的比例 | 18% | 30% | 45% |\n\n請問：","e":"家庭的經濟資本影響補習等教育資源，進而影響升學，可能使階級在世代間延續。"},{"i":"b390","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"若政府想改善表 1 呈現的不平等，下列哪一項做法最符合「實質平等」？","o":[["A","所有學生一律收取相同的學費"],["B","全面禁止補習班營業"],["C","為低收入家庭學生提供免費的課後輔導"],["D","依學業成績高低發放獎學金"]],"a":"C","c":"某研究調查不同家庭月收入組別的高中生，結果如表 1。\n\n表 1\n\n| 家庭月收入組別 | 低 | 中 | 高 |\n|---|---|---|---|\n| 子女參加課後補習的比例 | 25% | 48% | 70% |\n| 子女錄取公立大學的比例 | 18% | 30% | 45% |\n\n請問：","e":"針對不利的群體提供協助，是實質平等。(A) 是形式平等；(D) 依表現分配，反而可能擴大差距。"},{"i":"b391","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"1970 年代，以本土語言播出的布袋戲電視節目轟動一時，卻遭禁播。禁播原因之一為政府宣稱節目充斥低俗趣味，且有違國語運動政策。而該劇主題曲也因為歌詞提及女主角「討厭交男子，歡迎女朋友」，帶有同性戀隱喻，且強調女主角喜好江湖風流，不符女性應有氣質，遭到禁播。依據題文，下列何者最能說明當時社會之性別文化？","o":[["A","當時流行文化已開始出現物化女性現象"],["B","異性戀文化受挑戰而無法佔有主流地位"],["C","不同性別認同群體的自我實現機會不同"],["D","出現以多元性別平等訴求替代兩性平等"]],"a":"C","e":"政府以「不符女性應有氣質」、帶有同性戀隱喻為由禁播，表示不同性別認同群體自我實現的機會不同。","r":"115 學測社會第 50 題（題文節錄）"},{"i":"b392","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某生從小在家聽古典音樂、常隨父母參觀美術館，進大學後在藝術相關課程表現突出。這最能說明下列哪一種資本的影響？","o":[["A","經濟資本"],["B","社會資本"],["C","政治資本"],["D","文化資本"]],"a":"D","e":"家庭長期培養的藝術素養，是文化資本。"},{"i":"b393","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某人透過教會朋友的介紹，找到一份理想的工作。他運用的主要是下列哪一種資本？","o":[["A","社會資本"],["B","文化資本"],["C","經濟資本"],["D","人力資本"]],"a":"A","e":"透過人際網絡取得機會，是社會資本。"},{"i":"b394","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"某調查顯示，國內企業主管中女性占 30%、男性占 70%。下列推論何者最適當？","o":[["A","女性的工作能力不如男性"],["B","職場高階職位存在性別落差"],["C","所有企業都刻意歧視女性"],["D","女性都不想擔任主管"]],"a":"B","e":"資料只能說明高階職位男女比例有落差。(A) 題文沒有比較能力；(C) 題文沒有說明原因，也不能說「所有」企業；(D) 題文沒有調查意願。"},{"i":"b395","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某電視台連續數日大幅報導食品安全問題，之後的調查顯示，民眾最關心的議題變成食品安全。這最能說明媒體的哪一種作用？","o":[["A","框架"],["B","守門"],["C","第四權"],["D","議題設定"]],"a":"D","e":"大量報導使民眾認為某議題重要，是議題設定。"},{"i":"b396","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"同一份薪資統計，甲報下標「平均薪資創新高」，乙報下標「七成勞工領不到平均薪資」。這最能說明下列何者？","o":[["A","議題設定"],["B","守門"],["C","框架"],["D","媒體近用"]],"a":"C","e":"同一份資料選擇不同角度呈現，是框架。"},{"i":"b397","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"新聞編輯決定刪去一則地方新聞，改放一則國際新聞。這是媒體的哪一種作用？","o":[["A","守門"],["B","框架"],["C","議題設定"],["D","第四權"]],"a":"A","e":"決定哪些新聞刊出，是守門。"},{"i":"b398","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"記者長期追查某政府標案的弊端並公開報導，促使檢調單位介入調查。這最能說明媒體扮演的哪一種角色？","o":[["A","娛樂大眾"],["B","守門"],["C","議題設定"],["D","監督政府的第四權"]],"a":"D","e":"追查弊端、監督政府，是第四權。"},{"i":"b399","s":"公民","u":"第5課","t":"4-5-媒體","k":"s","q":"某社區團體向公共電視申請時段，播出自製的社區紀錄片。這屬於下列哪一項權利的行使？","o":[["A","新聞自由"],["B","媒體近用權"],["C","隱私權"],["D","守門"]],"a":"B","e":"民眾使用媒體發表自己的內容，是媒體近用權。"},{"i":"b400","s":"公民","u":"第4課","t":"4-5-讀題","k":"s","q":"小華收到一則轉傳訊息，內容是「某疫苗會致癌」。下列做法何者最適當？","o":[["A","立刻轉傳，提醒親友注意"],["B","轉傳的人很多，所以應該相信"],["C","訊息附有圖片，所以一定是真的"],["D","查證訊息來源，並比對可信機構公布的資料"]],"a":"D","e":"查證來源與可信的資料。轉傳次數、附有圖片都不能證明真實。"},{"i":"b401","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲支持度 46%、乙 43%，抽樣誤差為正負 3 個百分點。下列解讀何者正確？","o":[["A","兩人範圍重疊，無法斷定誰領先"],["B","甲確定領先乙"],["C","乙確定落後 3 個百分點"],["D","這份民調無效"]],"a":"A","e":"甲 43～49%，乙 40～46%，範圍重疊。"},{"i":"b402","s":"公民","u":"第5課","t":"4-5-民調","k":"s","q":"某民調顯示候選人甲支持度 55%、乙 40%，抽樣誤差為正負 4 個百分點。下列解讀何者正確？","o":[["A","兩人範圍重疊，無法判斷"],["B","兩人範圍不重疊，可以判斷甲領先"],["C","抽樣誤差太大，民調無效"],["D","兩人的實際支持度可能相同"]],"a":"B","e":"甲 51～59%，乙 36～44%，範圍不重疊，可以判斷甲領先。"},{"i":"b403","s":"公民","u":"第4課","t":"4-5-民調","k":"s","q":"某雜誌在官網讓讀者自由投票，共 3 萬人參加，其中八成支持某政策。下列評論何者正確？","o":[["A","參加人數很多，所以可以代表全國民意"],["B","支持者占八成，這項政策一定會通過"],["C","自願參加的樣本不具代表性，不能推論全體民意"],["D","只要抽樣誤差夠小，就能代表全體民意"]],"a":"C","e":"自願參加的樣本不具代表性，人數再多也不能推論全體民意。"},{"i":"b404","s":"公民","u":"第4課","t":"4-5-治理","k":"m","q":"下列有關民主治理的敘述，哪些正確？","o":[["A","公私協力是治理的一種方式"],["B","審計部審核政府決算，屬於水平課責"],["C","回應是指政府主動公開所有資訊"],["D","透明是課責的前提"],["E","社會課責是指人民透過選舉、罷免追究官員責任"]],"a":"ABD","e":"(C) 主動公開資訊是透明，回應是依民意處理並說明；(E) 透過選舉、罷免是垂直課責。"},{"i":"b405","s":"公民","u":"第4課","t":"4-5-正義","k":"m","q":"下列有關正義的敘述，哪些正確？","o":[["A","自由至上主義反對國家以重稅進行重分配"],["B","羅爾斯主張制度應使處境最不利的人獲得最大利益"],["C","效益主義主張每個人的權利都不可為了整體而犧牲"],["D","依家庭收入發放補助，是依「需要」分配"],["E","法院判決加害人賠償被害人，屬於匡正正義"]],"a":"ABDE","e":"(C) 效益主義可能為了整體利益而犧牲少數人。"},{"i":"b406","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"根據第 15～17 題的表 1，下列推論哪些正確？","o":[["A","高收入組子女參加補習的比例最高"],["B","低收入組子女錄取公立大學的比例最低"],["C","所有高收入家庭的子女都有參加補習"],["D","補習是錄取公立大學的唯一因素"],["E","表中資料顯示家庭收入與子女的教育機會有關聯"]],"a":"ABE","e":"(C) 高收入組補習比例是 70%，不是所有人；(D) 表只顯示關聯，不能推出唯一因素。"},{"i":"b407","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關平等原則的敘述，哪些正確？","o":[["A","形式平等是指一律相同對待"],["B","實質平等會考量個人處境的差異"],["C","公職考試的原住民族保障名額，屬於積極平權措施"],["D","只要有差別待遇，就違反平等原則"],["E","公司規定女性懷孕須離職，屬於合理的差別待遇"]],"a":"ABC","e":"(D) 合理的差別待遇不違反平等原則；(E) 沒有正當目的，是不合理的差別待遇。"},{"i":"b408","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體的敘述，哪些正確？","o":[["A","議題設定影響民眾「想什麼」"],["B","框架是指媒體決定哪些事件能成為新聞"],["C","守門是指政府審查新聞內容"],["D","媒體近用權包括民眾使用媒體表達意見"],["E","媒體被稱為第四權，是因為它能監督政府"]],"a":"ADE","e":"(B) 決定哪些事件成為新聞是守門，框架是報導的角度；(C) 守門是記者、編輯的篩選，不是政府審查。"},{"i":"b409","s":"公民","u":"第4課","t":"4-5-讀題","k":"m","q":"下列有關社會不平等的敘述，哪些正確？","o":[["A","文化資本可能影響學生的學業表現"],["B","社會資本是人際網絡所帶來的資源"],["C","階級複製是指社會地位在世代之間延續"],["D","只要教育普及，不平等就一定會消失"],["E","性別也可能是社會不平等的來源"]],"a":"ABCE","e":"(D) 教育普及不保證消除不平等。"},{"i":"b410","s":"公民","u":"第5課","t":"4-5-民調","k":"m","q":"下列有關民意調查的敘述，哪些正確？","o":[["A","兩人支持度的範圍重疊時，無法判斷誰領先"],["B","自願參加的網路投票不具代表性"],["C","信心水準越高，表示候選人的支持度越高"],["D","題目中帶有評價的用語，可能影響受訪者的回答"],["E","樣本人數越多，結果一定越準確"]],"a":"ABD","e":"(C) 信心水準與支持度無關；(E) 樣本代表性更重要，自願參加的大樣本仍可能偏差。"},{"i":"b411","s":"公民","u":"第5課","t":"4-5-媒體","k":"m","q":"下列有關媒體識讀的敘述，哪些正確？","o":[["A","演算法推薦相似內容，容易形成同溫層"],["B","訊息轉傳的次數越多，表示越可信"],["C","判斷訊息真偽，應查證來源與證據"],["D","閱讀新聞時，應區分事實與意見"],["E","訊息附有圖片，就表示內容一定是真的"]],"a":"ACD","e":"(B)(E) 轉傳次數與圖片都不能證明真實。"},{"i":"b701","s":"數學","u":"單元07","t":"07-弦長範圍","k":"s","q":"已知圓 $C:(x-2)^2+(y+1)^2=16$，圓 $C$ 被下列哪一條直線所截的弦最長？","o":[["1","$x$ 軸"],["2","$y$ 軸"],["3","$x+y-3=0$"],["4","$3x+4y=0$"],["5","$2x-y=0$"]],"a":"4","e":"弦越長，圓心 $(2,-1)$ 到直線的距離越小。五條線的距離依序為 $1$、$2$、$\\sqrt2$、$\\frac25$、$\\sqrt5$，最小的是 $3x+4y=0$。","d":1},{"i":"b702","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"已知圓 $C:(x-1)^2+(y+2)^2=9$ 與直線 $L:3x+4y+k=0$ 不相交，試問 $k$ 的範圍為下列哪一個選項？","o":[["1","$-10<k<20$"],["2","$k>20$ 或 $k<-10$"],["3","$k>15$ 或 $k<-15$"],["4","$-20<k<10$"],["5","$k>10$ 或 $k<-20$"]],"a":"2","e":"$d=\\frac{\\lvert3-8+k\\rvert}5=\\frac{\\lvert k-5\\rvert}5>3$，$\\lvert k-5\\rvert>15$，$k>20$ 或 $k<-10$。","r":"自編，依講義例題 5 與各校段考「含 $k$ 直線與圓不相交」題型","d":1},{"i":"b703","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"已知方程式 $x^2+y^2+4x-2y+k=0$ 的圖形為一圓，且此圓與直線 $x-y=0$ 不相交，試問 $k$ 的範圍為下列哪一個選項？","o":[["1","$k>\\frac12$"],["2","$k<5$"],["3","$\\frac12<k<5$"],["4","$k<\\frac12$"],["5","$0<k<5$"]],"a":"3","e":"〔關鍵〕兩個條件：本身是圓、與直線不相交。\n〔步驟〕圓心 $(-2,1)$，$r^2=4+1-k>0$，$k<5$。$y=x$ 代入：$2x^2+2x+k=0$，判別式 $4-8k<0$，$k>\\frac12$。取交集。\n〔易錯〕選 (1) 是漏了「是圓」的條件。","r":"自編，依講義演練 2 與段考常見陷阱「漏寫是圓的條件」","d":1},{"i":"b704","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"直線 $x+y=3$ 與圓 $x^2+y^2=5$ 交於 $A$、$B$ 兩點，試問線段 $\\overline{AB}$ 的長度為下列哪一個選項？","o":[["1","$\\sqrt2$"],["2","$1$"],["3","$2$"],["4","$\\sqrt5$"],["5","$2\\sqrt2$"]],"a":"1","e":"$y=3-x$ 代入：$x^2-3x+2=0$，交點 $(1,2)$、$(2,1)$，距離 $\\sqrt2$。也可用弦長公式：$d=\\frac3{\\sqrt2}$，$2\\sqrt{5-\\frac92}=\\sqrt2$。","d":1},{"i":"b705","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x-2)^2+(y+1)^2=10$ 與直線 $L:x+3y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=1$ 時，$L$ 通過圓 $C$ 的圓心"],["2","當 $k=11$ 時，$L$ 與圓 $C$ 相切"],["3","當 $k=-9$ 時，$L$ 與圓 $C$ 相切"],["4","$L$ 與圓 $C$ 交於相異兩點的充要條件為 $-9<k<11$"],["5","當 $k=5$ 時，圓 $C$ 被 $L$ 所截的弦長為 $2\\sqrt6$"]],"a":"1234","e":"圓心 $(2,-1)$，$r=\\sqrt{10}$，$d=\\frac{\\lvert k-1\\rvert}{\\sqrt{10}}$。(1) $2-3+1=0$。(2)(3) $\\lvert k-1\\rvert=10$，$k=11$ 或 $-9$。(4) $\\lvert k-1\\rvert<10$。(5) $d^2=\\frac{16}{10}$，弦長 $2\\sqrt{10-1.6}=2\\sqrt{8.4}\\ne2\\sqrt6$。","d":1},{"i":"b706","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x-4)^2+y^2=4$ 與直線 $L:y=mx$，其中 $m$ 為實數。試選出正確的選項。","o":[["1","當 $m=0$ 時，$L$ 與圓 $C$ 交於相異兩點"],["2","當 $m=1$ 時，$L$ 與圓 $C$ 交於相異兩點"],["3","當 $L$ 與圓 $C$ 相切時，$m=\\pm\\frac{\\sqrt3}3$"],["4","$L$ 與圓 $C$ 交於相異兩點的充要條件為 $-\\frac{\\sqrt3}3<m<\\frac{\\sqrt3}3$"],["5","當 $m=\\frac12$ 時，圓 $C$ 被 $L$ 所截的弦長為 $\\frac{2\\sqrt5}5$"]],"a":"134","e":"圓心 $(4,0)$、$r=2$，$d=\\frac{\\lvert4m\\rvert}{\\sqrt{m^2+1}}$。(1) $d=0$。(2) $m=1$ 時 $d=2\\sqrt2>2$，不相交。(3) $16m^2=4m^2+4$，$m^2=\\frac13$。(4) $d<2$ ⟺ $m^2<\\frac13$。(5) $d^2=\\frac{16}5$，弦長 $2\\sqrt{4-\\frac{16}5}=\\frac{4\\sqrt5}5$，不是 $\\frac{2\\sqrt5}5$。","r":"自編，依 111 學測 B（過原點直線與圓的距離判定）的結構","d":1},{"i":"b707","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"一圓與 $x$ 軸相切於點 $(4,0)$，且與直線 $L:3x-4y+6=0$ 相切。試選出所有可能的圓方程式。","o":[["1","$(x-4)^2+(y+2)^2=4$"],["2","$(x-4)^2+(y-2)^2=4$"],["3","$(x-4)^2+(y-18)^2=324$"],["4","$(x-4)^2+(y-3)^2=9$"],["5","$(x-4)^2+(y+18)^2=324$"]],"a":"25","e":"圓心 $(4,k)$、半徑 $\\lvert k\\rvert$；$\\frac{\\lvert12-4k+6\\rvert}5=\\lvert k\\rvert$，$(18-4k)^2=25k^2$，$k=2$ 或 $-18$。","r":"武陵高中段考（原題為填充，改為多選）","d":1},{"i":"b708","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-2x-4y-4=0$ 與點 $P(2,4)$。試選出正確的選項。","o":[["1","通過 $P$ 點的所有弦中，最短弦的長度為 $2\\sqrt5$"],["2","點 $P$ 在圓 $C$ 的內部"],["3","通過 $P$ 點的所有弦中，最短的弦所在的直線為 $x+2y=10$"],["4","通過 $P$ 點的弦，其長度可能為 3"],["5","通過 $P$ 點的所有弦中，最長的弦所在的直線為 $2x-y=0$"]],"a":"235","e":"圓心 $M(1,2)$、$r=3$。(2) $P$ 代入左邊得 $-4<0$，在圓內。(3) 最短弦垂直 $\\overline{MP}$，法向量 $\\overrightarrow{MP}=(1,2)$，$x+2y=2+8$。(1) 最短弦長 $2\\sqrt{9-5}=4$，錯。(4) 弦長介於 4 與 6 之間，3 不可能。(5) 最長弦為過 $M$、$P$ 的直徑，所在直線 $y=2x$。","r":"曉明女中段考（原題問最短弦直線，改為多選）","d":1},{"i":"b709","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知 $C:x^2+y^2+2x+4y+5-k^2=0$ 與直線 $L:3x+4y-4=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=2$ 時，$C$ 與 $L$ 相交"],["2","當 $k=3$ 時，$C$ 與 $L$ 相切"],["3","$C$ 與 $L$ 相交的充要條件為 $k\\ge3$"],["4","當 $k=0$ 時，$C$ 的圖形不是圓"],["5","當 $k=-4$ 時，$C$ 與 $L$ 交於相異兩點"]],"a":"245","e":"圓心 $(-1,-2)$，$r^2=k^2$，$r=\\lvert k\\rvert$；$d=3$。相交 ⟺ $\\lvert k\\rvert\\ge3$。(1) $k=2$ 不相交。(2) $\\lvert k\\rvert=3$ 相切。(3) 漏了 $k\\le-3$。(4) $r^2=0$，只是一點。(5) $\\lvert k\\rvert=4>3$。","d":1},{"i":"b710","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"考慮圓 $\\Gamma:x^2+y^2=4$ 上的點到直線 $L:3x+4y=5$ 的距離。試選出正確的選項。","o":[["1","距離的最大值為 3"],["2","距離的最小值為 1"],["3","到 $L$ 的距離為 1 的點恰有 3 個"],["4","到 $L$ 的距離為 2 的點恰有 1 個"],["5","到 $L$ 的距離為 3 的點恰有 1 個"]],"a":"135","e":"圓心到 $L$ 的距離為 1，$r=2$。(1) $1+2=3$。(2) $d<r$，最小值 0。距離為 $t$ 的點在 $3x+4y=5\\pm5t$ 兩條平行線上：$t=1$ 時一條相切、一條過圓心，$1+2=3$ 點；$t=2$ 時一條在圓外、一條距圓心 1，共 2 點；$t=3$ 時一條在圓外、一條相切，共 1 點。","r":"自編，依 108 學測（圓上到直線距離為定值的點數）的結構","d":1},{"i":"b711","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"直線 $L:x-2y+3=0$ 與圓 $C:(x+1)^2+(y-1)^2=20$ 交於 $A$、$B$ 兩點，則 $\\overline{AB}=\\boxed{11\\text{-}1}\\sqrt{\\boxed{11\\text{-}2}}$。","a":"$4\\sqrt5$","e":"圓心 $(-1,1)$ 代入 $x-2y+3$ 得 0，直線過圓心，弦為直徑，長 $2\\sqrt{20}=4\\sqrt5$。","d":1},{"i":"b712","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"已知圓心為 $(2,3)$ 的圓 $C$ 與直線 $L:x-y-1=0$ 交於 $A$、$B$ 兩點，且 $\\overline{AB}=4$，則圓 $C$ 的半徑平方為 $\\boxed{12\\text{-}1}$。","a":"$6$","e":"$d=\\frac{\\lvert2-3-1\\rvert}{\\sqrt2}=\\sqrt2$，$r^2=2+2^2=6$。","d":1},{"i":"b713","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知圓 $C$ 的圓心在 $x$ 軸上，圓 $C$ 與直線 $x=7$ 所截弦長為 4，與直線 $x=4$ 所截弦長為 14，則圓 $C$ 與 $y$ 軸所截弦長為 $\\boxed{13\\text{-}1}\\,\\boxed{13\\text{-}2}$。","a":"$18$","e":"圓心 $(h,0)$：$(7-h)^2+2^2=(4-h)^2+7^2$，$h=-2$，$r^2=85$；$y$ 軸 $d=2$，半弦 $\\sqrt{81}=9$。","r":"蘭陽女中段考","d":1},{"i":"b714","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"坐標平面上，設 $\\Gamma$ 為以原點為圓心的圓，$P$ 為 $\\Gamma$ 與 $x$ 軸的其中一個交點。已知通過 $P$ 點且斜率為 $\\frac12$ 的直線交 $\\Gamma$ 於另一點 $Q$，且 $\\overline{PQ}=1$，則 $\\Gamma$ 的半徑為 $\\dfrac{\\sqrt{\\boxed{14\\text{-}1}}}{\\boxed{14\\text{-}2}}$。","a":"$\\frac{\\sqrt5}4$","e":"**14. $\\frac{\\sqrt5}4$**　$P(-r,0)$，直線 $x-2y+r=0$，弦心距 $\\frac r{\\sqrt5}$，半弦 $\\frac{2r}{\\sqrt5}$，$\\overline{PQ}=\\frac{4r}{\\sqrt5}=1$。","r":"113 分科數甲（答對率 39%）","d":1},{"i":"b715","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"已知圓 $C:(x+1)^2+(y-2)^2=9$ 與直線 $L:4x-3y+k=0$ 相切，則 $k$ 的最大值為 $\\boxed{15\\text{-}1}\\,\\boxed{15\\text{-}2}$。","a":"$25$","e":"$\\frac{\\lvert-4-6+k\\rvert}5=3$，$k=25$ 或 $-5$。","d":1},{"i":"b716","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"坐標平面上，一圓與直線 $3x+4y=1$ 以及直線 $3x+4y=21$ 所截的弦長皆為 8，則此圓的面積為 $\\boxed{16\\text{-}1}\\,\\boxed{16\\text{-}2}\\,\\pi$。","a":"$20\\pi$","e":"兩線相距 $\\frac{20}5=4$，圓心在正中間，$d=2$，$r^2=4^2+2^2=20$。","r":"自編，依 102 學測（兩平行線截等長弦）改數字","d":1},{"i":"b717","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $y=x+k$ 與圓 $x^2+y^2=8$ 交於相異兩點，則滿足條件的整數 $k$ 共有 $\\boxed{17\\text{-}1}$ 個。","a":"$7$","e":"$\\frac{\\lvert k\\rvert}{\\sqrt2}<2\\sqrt2$，$\\lvert k\\rvert<4$，$k=-3,-2,\\dots,3$。","r":"自編，依各校段考「整數解個數」設問","d":1},{"i":"b719","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"骷髏山洞到兩人前進路線所在直線的距離為 $\\sqrt{\\boxed{19\\text{-}1}}$。（選填題，4 分）","a":"$\\sqrt2$","c":"業修和蔬沐澄在貪婪之島尋寶，據說寶藏都藏在島上的哥爾羅傑之墓。聰明的業修決定將島坐標化，並以島中央的大椰子樹為原點。經過測量，發現兩人現在的位置為 $(1,0)$。兩人從 $(1,0)$ 出發直線前進後到達冰霜森林 $(3,2)$，且業修發現沿同方向繼續直走可以到達哥爾羅傑之墓 $(8,k)$。已知有一骷髏山洞位於 $(5,2)$，山洞的骷髏們會以山洞為圓心，在附近一個圓內進行守備。","e":"$(5,2)$ 到 $x-y-1=0$ 的距離 $\\frac{\\lvert5-2-1\\rvert}{\\sqrt2}=\\sqrt2$。","r":"基隆高中段考（素養題，拆為混合題）","d":1},{"i":"b721","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"圓 $C:(x+2)^2+(y-3)^2=9$ 與直線 $L:4x-3y-3=0$ 的關係為下列哪一個選項？","o":[["1","交於相異兩點"],["2","相切"],["3","不相交"],["4","$L$ 通過圓心"],["5","條件不足，無法判斷"]],"a":"3","e":"圓心 $(-2,3)$，$r=3$。$d=\\frac{\\lvert-8-9-3\\rvert}5=4>3$，不相交。"},{"i":"b722","s":"數學","u":"單元07","t":"07-弦長","k":"s","q":"圓 $x^2+(y+2)^2=10$ 被 $y$ 軸所截的弦長為下列哪一個選項？","o":[["1","$2\\sqrt{10}$"],["2","$\\sqrt{10}$"],["3","$2\\sqrt6$"],["4","$6$"],["5","$2$"]],"a":"1","e":"圓心 $(0,-2)$ 在 $y$ 軸上，$d=0$，弦為直徑 $2\\sqrt{10}$。"},{"i":"b723","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"已知方程式 $x^2+y^2-2x+4y+k=0$ 的圖形為一圓，且此圓與直線 $x+y=0$ 交於相異兩點，試問 $k$ 的範圍為下列哪一個選項？","o":[["1","$k<5$"],["2","$k<\\frac92$"],["3","$\\frac92<k<5$"],["4","$k>\\frac92$"],["5","$k<\\frac12$"]],"a":"2","e":"〔步驟〕圓心 $(1,-2)$，$r^2=5-k$。$d=\\frac{\\lvert1-2\\rvert}{\\sqrt2}$，$d^2=\\frac12$。交兩點 $d^2<r^2$：$\\frac12<5-k$，$k<\\frac92$。是圓需 $k<5$，已被 $k<\\frac92$ 包含。\n〔易錯〕選 (3) 是把方向弄反；選 (1) 是只寫了是圓的條件。"},{"i":"b724","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"直線 $y=x+1$ 與圓 $x^2+y^2=13$ 交於兩點，其中 $x$ 坐標較大的交點為下列哪一個選項？","o":[["1","$(3,4)$"],["2","$(3,2)$"],["3","$(-3,-2)$"],["4","$(2,3)$"],["5","$(1,2)$"]],"a":"4","e":"$x^2+(x+1)^2=13$，$x^2+x-6=0$，$x=2$ 或 $-3$，較大者 $(2,3)$。"},{"i":"b725","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+(y-2)^2=8$。試選出正確的選項。","o":[["1","直線 $x+y-6=0$ 與圓 $C$ 相切"],["2","直線 $x+y-6=0$ 與圓 $C$ 的切點為 $(2,4)$"],["3","直線 $x+y-8=0$ 與圓 $C$ 交於相異兩點"],["4","直線 $x+y=2$ 通過圓 $C$ 的圓心"],["5","直線 $x-y=0$ 與圓 $C$ 交於相異兩點"]],"a":"1245","e":"圓心 $(0,2)$，$r=2\\sqrt2$。(1) $d=\\frac4{\\sqrt2}=2\\sqrt2$。(2) $y=6-x$ 代入得 $(x-2)^2=0$，切點 $(2,4)$。(3) $d=3\\sqrt2>r$。(4) $0+2=2$。(5) $d=\\sqrt2<r$。"},{"i":"b726","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x+3)^2+(y-1)^2=25$ 與直線 $L:4x+3y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=9$ 時，$L$ 通過圓 $C$ 的圓心"],["2","當 $k=24$ 時，$L$ 與圓 $C$ 相切"],["3","當 $k=-16$ 時，$L$ 與圓 $C$ 相切"],["4","$L$ 與圓 $C$ 不相交的充要條件為 $-16<k<34$"],["5","當 $k=-6$ 時，圓 $C$ 被 $L$ 所截的弦長為 8"]],"a":"135","e":"代入得 $k-9$，$d=\\frac{\\lvert k-9\\rvert}5$。(2) $d=3\\ne5$。(3) $d=5$。(4) 不相交是 $\\lvert k-9\\rvert>25$，$k>34$ 或 $k<-16$。(5) $d=3$，弦長 $2\\sqrt{25-9}=8$。"},{"i":"b727","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"一圓與直線 $4x+3y+23=0$ 及直線 $4x+3y-27=0$ 都相切，且圓心在直線 $x+2y-3=0$ 上。試選出正確的選項。","o":[["1","圓心為 $(-1,2)$"],["2","半徑為 10"],["3","此圓的方程式為 $(x+1)^2+(y-2)^2=25$"],["4","圓心在直線 $4x+3y=2$ 上"],["5","此圓與 $x$ 軸相切"]],"a":"134","e":"兩平行線的正中間是 $4x+3y-2=0$，與 $x+2y=3$ 聯立得 $(-1,2)$。半徑 $=\\frac12\\times\\frac{50}5=5$。圓心到 $x$ 軸 2，不等於 5。"},{"i":"b728","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-4x+2y-20=0$ 與點 $P(4,0)$。試選出正確的選項。","o":[["1","通過 $P$ 點的所有弦中，最短弦的長度為 $2\\sqrt5$"],["2","點 $P$ 在圓 $C$ 的內部"],["3","通過 $P$ 點的所有弦中，最短的弦所在的直線為 $2x+y=8$"],["4","通過 $P$ 點的所有弦中，最長的弦所在的直線為 $x+2y=4$"],["5","通過 $P$ 點的弦，其長度可能為 9"]],"a":"235","e":"圓心 $M(2,-1)$，$r=5$，$\\overline{MP}=\\sqrt5$。最短弦 $2\\sqrt{25-5}=4\\sqrt5\\approx8.94$，最長 10。最短弦垂直 $\\overrightarrow{MP}=(2,1)$：$2x+y=8$。最長弦過 $M$、$P$：$x-2y=4$。","r":"自編，依曉明女中段考題型"},{"i":"b729","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知 $C:x^2+y^2-6x+2y+10-k^2=0$ 與直線 $L:3x-4y+12=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=5$ 時，$C$ 與 $L$ 相切"],["2","當 $k=-5$ 時，$C$ 與 $L$ 相切"],["3","當 $k=6$ 時，$C$ 與 $L$ 不相交"],["4","當 $0<\\lvert k\\rvert<5$ 時，$C$ 與 $L$ 不相交"],["5","當 $k=0$ 時，$C$ 的圖形為一圓"]],"a":"124","e":"圓心 $(3,-1)$，$r^2=k^2$，$r=\\lvert k\\rvert$；$d=\\frac{\\lvert9+4+12\\rvert}5=5$。(3) $r=6>5$，交兩點。(5) $r=0$，只是一點。"},{"i":"b730","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"考慮圓 $\\Gamma:x^2+y^2=9$ 上的點到直線 $L:x=1$ 的距離。試選出正確的選項。","o":[["1","到 $L$ 的距離為 1 的點恰有 4 個"],["2","到 $L$ 的距離為 2 的點恰有 2 個"],["3","距離的最大值為 4"],["4","到 $L$ 的距離為 3 的點恰有 2 個"],["5","到 $L$ 的距離為 4 的點恰有 1 個"]],"a":"1345","e":"距離為 $t$ 的點在 $x=1+t$ 與 $x=1-t$ 上；$\\lvert c\\rvert<3$ 交 2 點，$\\lvert c\\rvert=3$ 交 1 點。$t=1$：$x=2$、$0$，共 4。$t=2$：$x=3$、$-1$，共 3。$t=3$：$x=4$、$-2$，共 2。$t=4$：$x=5$、$-3$，共 1。最大值 $1+3=4$。","r":"自編，依 108 學測題型（直線改為鉛直線）"},{"i":"b731","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"已知圓心為 $(1,-1)$ 的圓 $C$ 與直線 $3x+4y-9=0$ 相切，則圓 $C$ 的方程式為 $(x-1)^2+(y+1)^2=\\boxed{11\\text{-}1}$。","a":"$4$","e":"$r=\\frac{\\lvert3-4-9\\rvert}5=2$。"},{"i":"b732","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"坐標平面上，一圓與直線 $x-2y=3$ 以及直線 $x-2y=13$ 所截的弦長皆為 6，則此圓的面積為 $\\boxed{12\\text{-}1}\\,\\boxed{12\\text{-}2}\\,\\pi$。","a":"$14\\pi$","e":"兩線距離 $\\frac{10}{\\sqrt5}=2\\sqrt5$，$d=\\sqrt5$；半弦 3，$r^2=9+5=14$。","r":"自編，依 102 學測題型"},{"i":"b733","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"圓 $x^2+y^2+4x-2y-20=0$ 被直線 $3x-4y+5=0$ 所截的弦長為 $\\boxed{13\\text{-}1}\\sqrt{\\boxed{13\\text{-}2}}$。","a":"$4\\sqrt6$","e":"圓心 $(-2,1)$，$r^2=25$；$d=\\frac{\\lvert-6-4+5\\rvert}5=1$；$2\\sqrt{24}$。"},{"i":"b734","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $3x+4y+k=0$ 與圓 $(x-1)^2+(y-1)^2=4$ 不相交，則滿足條件的最小正整數 $k$ 為 $\\boxed{14\\text{-}1}$。","a":"$4$","e":"$d=\\frac{\\lvert k+7\\rvert}5>2$，$\\lvert k+7\\rvert>10$，$k>3$ 或 $k<-17$。"},{"i":"b735","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知直線 $y=x+k$ 與圓 $x^2+y^2=25$ 所截的弦長為 6，且 $k>0$，則 $k=\\boxed{15\\text{-}1}\\sqrt{\\boxed{15\\text{-}2}}$。","a":"$4\\sqrt2$","e":"半弦 3，$d^2=25-9=16$，$d=4=\\frac{k}{\\sqrt2}$，$k=4\\sqrt2$。"},{"i":"b736","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"已知圓 $x^2+y^2+kx-2y+4=0$ 與直線 $y=x$ 相切，則 $k$ 的最大值為 $\\boxed{16\\text{-}1}+\\boxed{16\\text{-}2}\\sqrt{\\boxed{16\\text{-}3}}$。","a":"$2+4\\sqrt2$","e":"$y=x$ 代入：$2x^2+(k-2)x+4=0$，判別式 $(k-2)^2-32=0$，$k=2\\pm4\\sqrt2$。兩者都使 $r^2=\\frac{k^2}4-3>0$。"},{"i":"b737","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知圓 $C$ 的圓心在 $y$ 軸上，圓 $C$ 與直線 $y=1$ 所截弦長為 8，與直線 $y=4$ 所截弦長為 2，則圓 $C$ 與 $x$ 軸所截弦長為 $\\boxed{17\\text{-}1}\\sqrt{\\boxed{17\\text{-}2}\\,\\boxed{17\\text{-}3}}$。","a":"$2\\sqrt{17}$","e":"**17. $2\\sqrt{17}$**　圓心 $(0,h)$：$(1-h)^2+16=(4-h)^2+1$，$h=0$，$r^2=17$；$x$ 軸 $d=0$，弦為直徑 $2\\sqrt{17}$。","r":"自編，依蘭陽女中段考題型"},{"i":"b739","s":"數學","u":"單元07","t":"07-k範圍","k":"f","q":"這艘船在偵測範圍內航行的距離為 $\\boxed{19\\text{-}1}$ 公里。（選填題，4 分）","a":"$6$","c":"海岸雷達站設在坐標平面上的點 $(2,1)$，偵測範圍是以雷達站為圓心、半徑 5 公里的圓形區域（含邊界）。一艘船沿直線 $3x+4y=30$ 航行，坐標單位為公里。","e":"$2\\sqrt{25-16}=6$。","r":"自編，依學測混合題結構"},{"i":"b741","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"點 $A(1,0)$ 在單位圓 $\\Gamma:x^2+y^2=1$ 上。試問：$\\Gamma$ 上除了 $A$ 點以外，還有幾個點到直線 $L:y=2x$ 的距離，等於 $A$ 點到 $L$ 的距離？","o":[["1","1 個"],["2","2 個"],["3","3 個"],["4","4 個"],["5","0 個"]],"a":"3","e":"$A$ 到 $L:2x-y=0$ 的距離為 $\\frac{2}{\\sqrt5}$。到 $L$ 距離為 $\\frac2{\\sqrt5}$ 的點在 $2x-y=2$ 與 $2x-y=-2$ 上。原點到這兩條線的距離都是 $\\frac2{\\sqrt5}<1$，各與單位圓交 2 點，共 4 點，扣掉 $A$ 剩 3 點。","r":"108 學測","d":1},{"i":"b742","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"圓 $C:(x-1)^2+(y+3)^2=10$ 與直線 $L:3x+y+5=0$ 的關係為下列哪一個選項？","o":[["1","交於相異兩點"],["2","相切"],["3","不相交"],["4","$L$ 通過圓心"],["5","條件不足，無法判斷"]],"a":"1","e":"圓心 $(1,-3)$，代入 $3-3+5=5$，$d=\\frac5{\\sqrt{10}}=\\frac{\\sqrt{10}}2<\\sqrt{10}$，交於兩點。","d":1},{"i":"b743","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"已知方程式 $x^2+y^2+kx+2y+2=0$ 的圖形為一圓，且此圓與直線 $y=x$ 相切，則 $k$ 的值為下列哪一個選項？","o":[["1","$k=2$"],["2","$k=-6$"],["3","$k=2$ 或 $-6$"],["4","$k=-2$"],["5","不存在"]],"a":"2","e":"〔步驟〕$y=x$ 代入：$2x^2+(k+2)x+2=0$，判別式 $(k+2)^2-16=0$，$k=2$ 或 $-6$。$r^2=\\frac{k^2}4+1-2=\\frac{k^2}4-1$。$k=2$ 時 $r^2=0$，只是一點，不合；$k=-6$ 時 $r^2=8$。\n〔易錯〕選 (3) 是忘了檢查 $r^2>0$。","d":1},{"i":"b744","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"已知直線 $L:y=mx+5$ 與圓 $C:(x+3)^2+(y-1)^2=9$ 相切，則實數 $m$ 的值為下列哪一個選項？","o":[["1","$\\frac{7}{24}$"],["2","$-\\frac{7}{24}$"],["3","$\\frac{24}{7}$"],["4","$0$"],["5","$\\frac34$"]],"a":"1","e":"$L:mx-y+5=0$，圓心 $(-3,1)$ 代入得 $4-3m$。$\\frac{\\lvert4-3m\\rvert}{\\sqrt{m^2+1}}=3$，平方：$16-24m+9m^2=9m^2+9$，$m=\\frac7{24}$。","d":1},{"i":"b745","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2=4$。試選出正確的選項。","o":[["1","若直線 $L$ 與圓 $C$ 相交，則原點到 $L$ 的距離必不大於 2"],["2","直線 $y=2$ 與圓 $C$ 相切"],["3","通過圓上一點的直線必為此圓的切線"],["4","通過 $(2,3)$ 且與圓 $C$ 相切的直線必有兩條"],["5","通過 $(1,1)$ 的直線與圓 $C$ 交於兩點"]],"a":"1245","e":"(1) 相交含相切，$d\\le2$。(2) $d=2=r$。(3) 過圓上一點的直線可能穿過圓。(4) $4+9>4$，點在圓外，有兩條切線。(5) $1+1<4$，點在圓內，任何直線都交兩點。","d":1},{"i":"b746","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"有一射擊遊戲，將發射台設置於坐標平面的原點，並放置三個半徑為 1 的圓盤靶子，其圓心分別為 $(2,2)$、$(4,6)$ 與 $(8,1)$。玩家選定一正數 $a$，並按下按鈕後，發射台將向點 $(1,a)$ 方向發射一道雷射光束（形成一射線）。假設雷射光束擊中靶子後可以穿透並繼續沿原方向前進（削過圓盤邊緣也視為擊中）。試選出正確的選項。","o":[["1","雷射光束落在通過原點且斜率為 $a$ 的直線上"],["2","若 $a=\\frac32$，則雷射光束會擊中圓心為 $(4,6)$ 的圓盤靶子"],["3","玩家可以僅發射一道雷射光束就擊中三個圓盤靶子"],["4","玩家至少需要發射三道雷射光束才可擊中三個圓盤靶子"],["5","玩家發射一道雷射光束後，若擊中圓心為 $(8,1)$ 的圓盤靶子，則 $a\\le\\frac{16}{63}$"]],"a":"125","e":"光束在 $y=ax$ 上，即 $ax-y=0$。擊中圓心 $(p,q)$ 的靶子：$\\frac{\\lvert ap-q\\rvert}{\\sqrt{a^2+1}}\\le1$。(2) $a=\\frac32$ 時 $\\lvert6-6\\rvert=0$。(5) $(8a-1)^2\\le a^2+1$，$63a^2-16a\\le0$，$0<a\\le\\frac{16}{63}$。擊中 $(2,2)$ 需 $3a^2-8a+3\\le0$，約 $0.45\\le a\\le2.22$，與 $a\\le\\frac{16}{63}$ 沒有交集，所以 (3) 錯。擊中 $(4,6)$ 需約 $1.12\\le a\\le2.08$，可與 $(2,2)$ 同時擊中，兩道光束就夠，所以 (4) 錯。","r":"111 學測 B","d":1},{"i":"b747","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知方程式 $x^2+y^2-6x+4y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=9$ 時，此圓與 $x$ 軸相切"],["2","當 $k=4$ 時，此圓與 $y$ 軸相切"],["3","當 $k=4$ 時，此圓被 $x$ 軸所截的弦長為 $2\\sqrt5$"],["4","當 $k=13$ 時，此方程式的圖形為一圓"],["5","若此圓與 $x$ 軸、$y$ 軸都交於相異兩點，則 $k<4$"]],"a":"1235","e":"圓心 $(3,-2)$，$r^2=13-k$。到 $x$ 軸距離看 $y$：2；到 $y$ 軸距離看 $x$：3。(1) $r=2$。(2) $r=3$。(3) $2\\sqrt{9-4}=2\\sqrt5$。(4) $r^2=0$，只是一點。(5) 需 $r>3$ 且 $r>2$，$13-k>9$，$k<4$。","d":1},{"i":"b748","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x-3)^2+(y+1)^2=13$，直線 $L$ 與直線 $2x-3y=0$ 垂直且與圓 $C$ 相切。試選出正確的選項。","o":[["1","直線 $L$ 的斜率為 $-\\frac32$"],["2","直線 $3x+2y+6=0$ 是滿足條件的一條切線"],["3","直線 $3x+2y-6=0$ 是滿足條件的一條切線"],["4","直線 $3x+2y-20=0$ 是滿足條件的一條切線"],["5","滿足條件的兩條切線之間的距離為 $\\sqrt{13}$"]],"a":"124","e":"$2x-3y=0$ 的斜率為 $\\frac23$，垂直的斜率為 $-\\frac32$，設 $L:3x+2y+c=0$。圓心代入得 $7+c$，$\\frac{\\lvert7+c\\rvert}{\\sqrt{13}}=\\sqrt{13}$，$c=6$ 或 $-20$。(5) 兩切線距離 $\\frac{26}{\\sqrt{13}}=2\\sqrt{13}$，等於直徑。","d":1},{"i":"b749","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x-2)^2+(y-1)^2=5$ 與直線 $L:2x-y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=2$ 時，$L$ 與圓 $C$ 相切"],["2","當 $k=8$ 時，$L$ 與圓 $C$ 相切"],["3","$L$ 與圓 $C$ 交於相異兩點的充要條件為 $-8<k<2$"],["4","當 $k=0$ 時，$L$ 與圓 $C$ 不相交"],["5","當 $k=-3$ 時，$L$ 通過圓 $C$ 的圓心"]],"a":"135","e":"圓心代入得 $k+3$，門檻 $\\sqrt5\\times\\sqrt5=5$。(1) $\\lvert5\\rvert=5$。(2) $\\lvert11\\rvert\\ne5$。(3) $\\lvert k+3\\rvert<5$，$-8<k<2$。(4) $\\lvert3\\rvert<5$，交兩點。(5) $k+3=0$。","d":1},{"i":"b750","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C$ 的圓心為 $(-3,2)$，且與直線 $L:3x+y-3=0$ 相切。試選出正確的選項。","o":[["1","圓 $C$ 的半徑為 $\\sqrt{10}$"],["2","圓 $C$ 與 $L$ 的切點為 $(0,3)$"],["3","圓 $C$ 的方程式為 $(x-3)^2+(y+2)^2=10$"],["4","圓 $C$ 與 $y$ 軸交於相異兩點"],["5","圓 $C$ 與 $x$ 軸不相交"]],"a":"124","e":"$r=\\frac{\\lvert-9+2-3\\rvert}{\\sqrt{10}}=\\sqrt{10}$。(2) $(0,3)$ 在 $L$ 上，且 $9+1=10$ 在圓上。(3) 圓心符號錯，應為 $(x+3)^2+(y-2)^2=10$。(4) 到 $y$ 軸距離 $3<\\sqrt{10}$。(5) 到 $x$ 軸距離 $2<\\sqrt{10}$，交兩點。","d":1},{"i":"b751","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"坐標平面上，一圓與直線 $x-y=1$ 以及直線 $x-y=5$ 所截的弦長皆為 14。則此圓的面積為 $\\boxed{11\\text{-}1}\\,\\boxed{11\\text{-}2}\\,\\pi$。","a":"$51\\pi$","e":"兩線距離 $\\frac4{\\sqrt2}=2\\sqrt2$，$d=\\sqrt2$；$r^2=7^2+2=51$。","r":"102 學測","d":1},{"i":"b752","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"坐標平面上，一個半徑為 12 的圓與直線 $x+y=0$ 相交於兩點，且這兩點的距離為 8。若此圓與直線 $x+y=24$ 交於 $P$、$Q$ 兩點，則線段 $\\overline{PQ}$ 的長度為 $\\boxed{12\\text{-}1}\\sqrt{\\boxed{12\\text{-}2}}$。（化成最簡根式）","a":"$8\\sqrt7$","e":"$x+y=0$ 的弦心距 $\\sqrt{144-16}=8\\sqrt2$。兩線距離 $\\frac{24}{\\sqrt2}=12\\sqrt2$，所以圓心到 $x+y=24$ 的距離為 $12\\sqrt2-8\\sqrt2=4\\sqrt2$（另一種 $20\\sqrt2>12$ 不會相交）。$\\overline{PQ}=2\\sqrt{144-32}=8\\sqrt7$。","r":"110 指考數甲","d":1},{"i":"b753","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"坐標平面上，設 $L_1$、$L_2$ 為通過點 $(3,1)$ 且斜率分別為 $m$、$-m$ 的兩條直線，其中 $m$ 為一實數。另設 $\\Gamma$ 為圓心在原點的一個圓。已知 $\\Gamma$ 與 $L_1$ 交於相異兩點 $A$、$B$，且知圓心到 $L_1$ 的距離為 1，又 $\\Gamma$ 與 $L_2$ 相切，則弦 $\\overline{AB}$ 的長度為 $\\frac{\\boxed{13\\text{-}1}\\,\\boxed{13\\text{-}2}}{\\boxed{13\\text{-}3}}$。（化為最簡分數）","a":"$\\frac{24}{5}$","e":"**13. $\\frac{24}5$**　$L_1:mx-y+1-3m=0$，$\\frac{\\lvert1-3m\\rvert}{\\sqrt{m^2+1}}=1$，得 $m=0$ 或 $\\frac34$。$m=0$ 時 $L_1$、$L_2$ 都是 $y=1$，$L_2$ 相切則 $L_1$ 也相切，不合。$m=\\frac34$：$r=\\frac{\\lvert1+3m\\rvert}{\\sqrt{m^2+1}}=\\frac{13/4}{5/4}=\\frac{13}5$，$\\overline{AB}=2\\sqrt{\\frac{169}{25}-1}=\\frac{24}5$。","r":"114 學測 A","d":1},{"i":"b754","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"直線 $x-y=1$ 與圓 $x^2+y^2=13$ 交於 $A$、$B$ 兩點，則 $\\overline{AB}=\\boxed{14\\text{-}1}\\sqrt{\\boxed{14\\text{-}2}}$。","a":"$5\\sqrt2$","e":"$d=\\frac1{\\sqrt2}$，$2\\sqrt{13-\\frac12}=2\\cdot\\frac5{\\sqrt2}=5\\sqrt2$。或求交點 $(3,2)$、$(-2,-3)$ 再算距離。","d":1},{"i":"b755","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"已知圓 $C$ 的圓心在第一象限，且同時與 $x$ 軸、$y$ 軸、直線 $3x+4y-12=0$ 相切，則所有可能的圓 $C$ 的半徑總和為 $\\boxed{15\\text{-}1}$。","a":"$7$","e":"與兩軸相切且圓心在第一象限，圓心 $(r,r)$。$\\frac{\\lvert7r-12\\rvert}5=r$，$r=6$ 或 $r=1$，和為 7。","d":1},{"i":"b756","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $3x-4y+k=0$ 與圓 $(x+1)^2+(y-2)^2=9$ 至少有一個交點，則滿足條件的整數 $k$ 共有 $\\boxed{16\\text{-}1}\\,\\boxed{16\\text{-}2}$ 個。","a":"$31$","e":"圓心代入得 $k-11$，$\\frac{\\lvert k-11\\rvert}5\\le3$，$-4\\le k\\le26$，共 31 個整數。","d":1},{"i":"b757","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知直線 $x+3y+k=0$ 與圓 $(x-1)^2+(y+2)^2=10$ 所截的弦長為 $2\\sqrt6$，且 $k>0$，則 $k=\\boxed{17\\text{-}1}+\\boxed{17\\text{-}2}\\sqrt{\\boxed{17\\text{-}3}\\,\\boxed{17\\text{-}4}}$。","a":"$5+2\\sqrt{10}$","e":"**17. $5+2\\sqrt{10}$**　半弦 $\\sqrt6$，$d^2=10-6=4$，$d=2$。圓心代入得 $k-5$，$\\lvert k-5\\rvert=2\\sqrt{10}$，$k=5\\pm2\\sqrt{10}$；$5-2\\sqrt{10}<0$ 不合。","d":1},{"i":"b759","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"當 $k=39$ 時，需要架設的橋長為 $\\boxed{19\\text{-}1}$ 公里。（選填題，4 分）","a":"$8$","c":"坐標平面上（單位：公里），一座圓形湖的湖岸為圓 $(x-3)^2+(y-4)^2=25$。縣政府規劃一條筆直的道路，沿直線 $4x+3y=k$ 興建。道路經過湖面的部分必須架橋。","e":"$2\\sqrt{25-9}=8$。","r":"自編，依學測混合題結構","d":1},{"i":"b761","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"已知 $P(x,y)$ 為圓 $C:(x+3)^2+(y+1)^2=40$ 上的點，且 $P$ 和直線 $L:x+3y=4$ 的距離恰好為 $\\sqrt{10}$，求滿足上述條件的 $P$ 點個數共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"4","e":"圓心 $(-3,-1)$，$r=2\\sqrt{10}$。到 $L$ 距離為 $\\sqrt{10}$ 的點在 $x+3y=14$ 與 $x+3y=-6$ 上。圓心代入 $x+3y$ 得 $-6$：到 $x+3y=-6$ 的距離為 0，交 2 點；到 $x+3y=14$ 的距離為 $\\frac{20}{\\sqrt{10}}=2\\sqrt{10}=r$，相切，交 1 點。共 3 點。"},{"i":"b762","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"已知圓 $C:(x-2)^2+(y+1)^2=25$。通過下列哪一個點，恰可作兩條與圓 $C$ 相切的直線？","o":[["1","$(2,-1)$"],["2","$(5,3)$"],["3","$(4,1)$"],["4","$(7,-1)$"],["5","$(6,3)$"]],"a":"5","e":"代入 $(x-2)^2+(y+1)^2$ 與 25 比：(1) 0，圓內；(2) 25，圓上；(3) 8，圓內；(4) 25，圓上；(5) $16+16=32$，圓外，可作兩條切線。"},{"i":"b763","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"若直線 $x+y=k$ 與圓 $(x-1)^2+(y-2)^2=8$ 不相交，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$-1<k<7$"],["2","$k>7$ 或 $k<-1$"],["3","$k\\ge7$ 或 $k\\le-1$"],["4","$-1\\le k\\le7$"],["5","$k>7$"]],"a":"2","e":"圓心代入得 $3-k$，$\\frac{\\lvert3-k\\rvert}{\\sqrt2}>2\\sqrt2$，$\\lvert k-3\\rvert>4$，往外跑：$k>7$ 或 $k<-1$。相切時有交點，所以不含等號。"},{"i":"b764","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"若將圓 $C:x^2+y^2=4$ 向右平移 $h$ 單位後，與直線 $3x+4y-25=0$ 相切，則 $h$ 的所有可能值為下列哪一個選項？","o":[["1","$5$"],["2","$\\frac{35}{3}$"],["3","$5$ 或 $\\frac{35}{3}$"],["4","$5$ 或 $-\\frac{35}{3}$"],["5","$-5$ 或 $\\frac{35}{3}$"]],"a":"3","e":"平移後圓心 $(h,0)$，$\\frac{\\lvert3h-25\\rvert}5=2$，$3h-25=\\pm10$，$h=\\frac{35}3$ 或 $5$。"},{"i":"b765","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"令 $m$ 為實數，若直線 $L:mx-y+3-m=0$ 和圓 $C:x^2+y^2=2$ 恰交一點，並令其交點為 $A$。設圓 $C$ 的圓心為 $O$，已知對於任意實數 $m$，直線 $L$ 必通過某定點 $P$，試選出正確的選項。","o":[["1","$P$ 點坐標為 $(1,3)$"],["2","滿足題目敘述的實數 $m$ 有兩個，且恰為一正數一負數"],["3","$\\triangle AOP$ 的面積為 4"],["4","$\\triangle AOP$ 的外接圓方程式為 $\\left(x-\\frac12\\right)^2+\\left(y-\\frac32\\right)^2=\\frac52$"],["5","若 $A$ 在第一象限上，則 $A$ 點坐標為 $\\left(\\frac75,\\frac15\\right)$"]],"a":"1245","e":"$L:m(x-1)-(y-3)=0$，必過 $P(1,3)$。相切：$\\frac{\\lvert3-m\\rvert}{\\sqrt{m^2+1}}=\\sqrt2$，$m^2+6m-7=0$，$m=1$ 或 $-7$。$OA\\perp AP$，$OA=\\sqrt2$，$OP=\\sqrt{10}$，$AP=2\\sqrt2$，面積為 2。直角三角形的外接圓以斜邊 $OP$ 為直徑：圓心 $\\left(\\frac12,\\frac32\\right)$，半徑平方 $\\frac{10}4=\\frac52$。$m=-7$ 時，切點為 $O$ 到 $7x+y-10=0$ 的垂足 $\\left(\\frac75,\\frac15\\right)$，在第一象限。"},{"i":"b766","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $\\Gamma:(x-1)^2+(y+2)^2=10$ 與直線 $L:x+3y=5$。試選出正確的選項。","o":[["1","$L$ 與 $\\Gamma$ 相切"],["2","$\\Gamma$ 上到 $L$ 的距離為 $\\sqrt{10}$ 的點恰有 2 個"],["3","$\\Gamma$ 上到 $L$ 的距離為 $2\\sqrt{10}$ 的點恰有 2 個"],["4","$\\Gamma$ 上的點到 $L$ 的距離最大值為 $2\\sqrt{10}$"],["5","$\\Gamma$ 上到 $L$ 的距離為 1 的點恰有 4 個"]],"a":"124","e":"圓心代入 $x+3y-5$ 得 $-10$，$d=\\frac{10}{\\sqrt{10}}=\\sqrt{10}=r$，相切。整個圓都在 $L$ 的同一側，只有朝圓心那一側的平行線會碰到圓。距離 $t$ 的那條平行線到圓心的距離為 $\\lvert\\sqrt{10}-t\\rvert$：$t=\\sqrt{10}$ 時為 0，交 2 點；$t=2\\sqrt{10}$ 時為 $\\sqrt{10}=r$，交 1 點；$t=1$ 時交 2 點（另一側 0 點），共 2 點。最遠的點是直徑另一端，距離 $2r=2\\sqrt{10}$。"},{"i":"b767","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2-6x+8y=0$。試選出正確的選項。","o":[["1","原點在圓 $C$ 上"],["2","通過點 $(3,0)$ 的任一直線都與圓 $C$ 交於相異兩點"],["3","通過點 $(9,0)$ 恰可作兩條與圓 $C$ 相切的直線"],["4","若圓心到直線 $L$ 的距離不小於 5，則 $L$ 與圓 $C$ 不相交"],["5","直線 $3x-4y=0$ 與圓 $C$ 交於相異兩點"]],"a":"123","e":"圓心 $(3,-4)$，$r=5$。(1) $0+0=0$。(2) $(3,0)$：$0+16<25$，圓內。(3) $(9,0)$：$36+16>25$，圓外。(4)「不小於 5」包含等於 5，此時相切，有交點。(5) $\\frac{\\lvert9+16\\rvert}5=5=r$，相切。"},{"i":"b768","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x+2)^2+(y-1)^2=9$ 與直線 $L:4x-3y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=26$ 時，$L$ 與圓 $C$ 相切"],["2","當 $k=4$ 時，$L$ 與圓 $C$ 相切"],["3","$L$ 與圓 $C$ 不相交的充要條件為 $-4<k<26$"],["4","當 $k=0$ 時，$L$ 與圓 $C$ 交於相異兩點"],["5","$L$ 與圓 $C$ 至少有一個交點的充要條件為 $-4\\le k\\le26$"]],"a":"145","e":"圓心代入得 $k-11$，門檻 $3\\times5=15$。(1) $\\lvert15\\rvert=15$。(2) $\\lvert-7\\rvert\\ne15$。(3) 不相交是 $\\lvert k-11\\rvert>15$，$k>26$ 或 $k<-4$。(4) $\\lvert-11\\rvert<15$。(5) $\\lvert k-11\\rvert\\le15$，$-4\\le k\\le26$。"},{"i":"b769","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"一圓的半徑為 5，圓心落在兩平行線 $3x+4y=0$ 與 $3x+4y=20$ 之間，且此圓被直線 $3x+4y=0$ 所截的弦長為 8。試選出正確的選項。","o":[["1","圓心到直線 $3x+4y=0$ 的距離為 3"],["2","兩平行線 $3x+4y=0$ 與 $3x+4y=20$ 的距離為 20"],["3","圓心到直線 $3x+4y=20$ 的距離為 1"],["4","此圓被直線 $3x+4y=20$ 所截的弦長為 $4\\sqrt6$"],["5","此圓與直線 $3x+4y=-5$ 不相交"]],"a":"134","e":"$d_1=\\sqrt{25-16}=3$。兩線距離 $\\frac{20}5=4$，不是 20。圓心在兩線之間，$d_2=4-3=1$，弦長 $2\\sqrt{24}=4\\sqrt6$。$3x+4y=-5$ 在 $3x+4y=0$ 的另一側，距離 1，圓心到它的距離為 $3+1=4<5$，相交。","r":"自編，依 110 指考數甲題型"},{"i":"b770","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知直線 $L:y=x+k$ 與圓 $C:x^2+y^2=8$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=4$ 時，$L$ 與圓 $C$ 相切"],["2","當 $k=4$ 時，切點為 $(-2,2)$"],["3","當 $k=2$ 時，圓 $C$ 被 $L$ 所截的弦長為 4"],["4","當 $k=-5$ 時，$L$ 與圓 $C$ 交於相異兩點"],["5","$L$ 與圓 $C$ 交於相異兩點的充要條件為 $-4<k<4$"]],"a":"125","e":"$L:x-y+k=0$，$d=\\frac{\\lvert k\\rvert}{\\sqrt2}$，$r=2\\sqrt2$。(1) $d=2\\sqrt2$。(2) $(-2,2)$ 在 $L$ 上且 $4+4=8$。(3) $d=\\sqrt2$，弦長 $2\\sqrt6$。(4) $d=\\frac5{\\sqrt2}>2\\sqrt2$，不相交。(5) $\\lvert k\\rvert<4$。"},{"i":"b771","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"令坐標平面上的原點為 $O$。已知圓 $C:(x+6)^2+(y+1)^2=25$ 和直線 $L:2x+y+3=0$ 交於 $A$、$B$ 兩點，其中 $\\overline{OA}>\\overline{OB}$，則 $B$ 點坐標為 $(\\boxed{11\\text{-}1}\\,\\boxed{11\\text{-}2},\\boxed{11\\text{-}3}\\,\\boxed{11\\text{-}4})$。","a":"$(-1,-1)$","e":"$y=-2x-3$ 代入：$5x^2+20x+15=0$，$x=-1$ 或 $-3$，交點 $(-1,-1)$、$(-3,3)$。到原點距離 $\\sqrt2<\\sqrt{18}$，$B=(-1,-1)$。"},{"i":"b772","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"坐標平面上，圓 $x^2+y^2-2x-4y-5=0$ 與直線 $x-y-1=0$ 交於 $A$、$B$ 兩點，若以 $\\overline{AB}$ 為一邊作一圓內接矩形 $ABCD$，則此矩形的面積為 $\\boxed{12\\text{-}1}\\,\\boxed{12\\text{-}2}$。","a":"$16$","e":"圓心 $(1,2)$，$r^2=10$，$d=\\frac{\\lvert1-2-1\\rvert}{\\sqrt2}=\\sqrt2$，$\\overline{AB}=2\\sqrt8=4\\sqrt2$。圓內接矩形的對邊 $CD$ 與 $AB$ 對稱於圓心，所以另一邊長 $2d=2\\sqrt2$，面積 $4\\sqrt2\\times2\\sqrt2=16$。"},{"i":"b773","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"圓 $C:x^2+y^2=k$ 上恰有兩個點與直線 $L:3x+4y=10$ 的距離為 2，則滿足條件的整數 $k$ 有 $\\boxed{13\\text{-}1}\\,\\boxed{13\\text{-}2}$ 個。","a":"$15$","e":"距離 $L$ 為 2 的點在 $3x+4y=20$（離原點 4）與 $3x+4y=0$（過原點）上。$3x+4y=0$ 過圓心，必交 2 點；要恰好兩點，$3x+4y=20$ 必須不交：$\\sqrt k<4$，$0<k<16$，共 15 個整數。$k=16$ 時相切，共 3 點。"},{"i":"b774","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"坐標平面上有一圓 $(x+2)^2+(y-2)^2=4$ 完全落在聯立不等式 $\\begin{cases}x-y+8\\ge0\\\\3x+y-6\\le0\\\\5x+12y+k\\ge0\\end{cases}$ 的解區域內部（含邊界），則 $k$ 的最小值為 $\\boxed{14\\text{-}1}\\,\\boxed{14\\text{-}2}$。","a":"$12$","e":"圓心 $(-2,2)$，$r=2$。圓心代入 $5x+12y+k$ 得 $14+k$，要在 $\\ge0$ 那一側且距離 $\\ge2$：$\\frac{14+k}{13}\\ge2$，$k\\ge12$。另兩條：$x-y+8$ 代入得 $4$，距離 $2\\sqrt2\\ge2$；$3x+y-6$ 代入得 $-10$，距離 $\\sqrt{10}\\ge2$，都符合。"},{"i":"b775","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"已知 $a>0$。若坐標平面上，$y=\\lvert ax+b\\rvert$ 的圖形與 $(x-3)^2+(y-10)^2=10$ 的圖形恰相切於兩點，則 $(a,b)=(\\boxed{15\\text{-}1},\\boxed{15\\text{-}2}\\,\\boxed{15\\text{-}3})$。","a":"$(3,-9)$","e":"$y=\\lvert ax+b\\rvert$ 的圖形對稱於直線 $x=-\\frac ba$，恰切於兩點，圓心必在對稱軸上：$-\\frac ba=3$，$b=-3a$。右半支 $y=a(x-3)$，$\\frac{\\lvert3a-10-3a\\rvert}{\\sqrt{a^2+1}}=\\sqrt{10}$，$a^2+1=10$，$a=3$，$b=-9$。"},{"i":"b776","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"通過點 $(4,2)$ 且斜率為 $m$ 的直線與圓 $x^2+y^2=4$ 相切，且 $m>0$，則 $m=\\frac{\\boxed{16\\text{-}1}}{\\boxed{16\\text{-}2}}$。","a":"$\\frac43$","e":"$mx-y+2-4m=0$，$\\frac{\\lvert2-4m\\rvert}{\\sqrt{m^2+1}}=2$，平方：$12m^2-16m=0$，$m=0$ 或 $\\frac43$。","r":"自編，依 114 學測 A 題型"},{"i":"b777","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知圓 $x^2+y^2-2x+4y-20=0$ 被直線 $3x-4y+k=0$ 所截的弦長為 8，且 $k>0$，則 $k=\\boxed{17\\text{-}1}$。","a":"$4$","e":"圓心 $(1,-2)$，$r=5$，半弦 4，$d=3$。代入得 $11+k$，$\\lvert k+11\\rvert=15$，$k=4$ 或 $-26$。"},{"i":"b779","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"若颱風中心每小時移動 25 公里，則城市在暴風圈內的時間共 $\\boxed{19\\text{-}1}\\,\\boxed{19\\text{-}2}$ 小時。（選填題，4 分）","a":"$16$","c":"氣象局將某城市標在坐標平面上的點 $(3,1)$，坐標的 1 單位長代表 50 公里。一個颱風的中心沿直線 $3x+4y=28$ 等速移動，暴風半徑為 5 單位長（250 公里）。當颱風中心與城市的距離不超過暴風半徑時，城市就在暴風圈內。","e":"暴風圈在路徑上截出的弦長 $2\\sqrt{25-9}=8$ 單位長，即 400 公里，$400\\div25=16$ 小時。","r":"自編，依學測混合題結構"},{"i":"b781","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"已知圓 $C:x^2+y^2-4x+6y-12=0$。通過下列哪一個點，無法作出任何一條與圓 $C$ 相切的直線？","o":[["1","$(5,1)$"],["2","$(-2,0)$"],["3","$(7,0)$"],["4","$(-3,-3)$"],["5","$(6,-1)$"]],"a":"5","e":"〔關鍵〕無法作切線⇔點在圓內。\n〔步驟〕配方：$(x-2)^2+(y+3)^2=25$。代入 $(x-2)^2+(y+3)^2$：$(5,1)$ 得 25、$(-2,0)$ 得 25、$(7,0)$ 得 34、$(-3,-3)$ 得 25、$(6,-1)$ 得 20。只有 $(6,-1)$ 小於 25，在圓內。\n〔易錯〕算出 25 是在圓上，可以作 1 條切線，不是答案。"},{"i":"b782","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上，三點 $A(0,0)$，$B(0,2)$，$C(8,0)$，若動點 $P$ 滿足 $\\overline{PA}=\\overline{PB}$ 且 $\\overline{PA}=\\frac13\\overline{PC}$，則動點 $P$ 所成的軌跡圖形為下列何者？","o":[["1","1 個點"],["2","2 個點"],["3","一直線"],["4","一圓"],["5","不存在"]],"a":"2","e":"〔關鍵〕兩個條件各是一個圖形，答案是兩個圖形的交點。\n〔步驟〕$\\overline{PA}=\\overline{PB}$：$P$ 在 $\\overline{AB}$ 的中垂線 $y=1$ 上。$9\\overline{PA}^2=\\overline{PC}^2$：$9(x^2+y^2)=(x-8)^2+y^2$，整理得 $(x+1)^2+y^2=9$，是圓心 $(-1,0)$、半徑 3 的圓。圓心到 $y=1$ 的距離 $1<3$，交 2 點。\n〔易錯〕看到「動點軌跡」就選「一圓」；要把兩個條件同時考慮。"},{"i":"b783","s":"數學","u":"單元07","t":"07-k範圍","k":"s","q":"若直線 $3x-4y+k=0$ 與圓 $x^2+y^2+2x-4y-4=0$ 有交點，則 $k$ 的範圍為下列哪一個選項？","o":[["1","$-4<k<26$"],["2","$k<-4$ 或 $k>26$"],["3","$k\\le-4$ 或 $k\\ge26$"],["4","$-4\\le k\\le26$"],["5","$-26\\le k\\le4$"]],"a":"4","e":"〔關鍵〕有交點包含相切，$d\\le r$，夾中間、含等號。\n〔步驟〕圓心 $(-1,2)$，$r=3$。$d=\\frac{\\lvert-3-8+k\\rvert}5=\\frac{\\lvert k-11\\rvert}5\\le3$，$\\lvert k-11\\rvert\\le15$，$-4\\le k\\le26$。\n〔易錯〕(1) 少了等號，是「交兩點」的範圍；(3) 是「沒有交點或相切」。"},{"i":"b784","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"已知圓 $C:(x-1)^2+(y+2)^2=9$ 與直線 $L:3x+4y=10$。圓 $C$ 上與 $L$ 的距離為 2 的點共有幾個？","o":[["1","0 個"],["2","1 個"],["3","2 個"],["4","3 個"],["5","4 個"]],"a":"3","e":"〔關鍵〕距離為 2 的點在兩條平行線上，兩條分別和 $r$ 比。\n〔步驟〕圓心 $(1,-2)$ 代入 $3x+4y$ 得 $-5$，$r=3$。兩條平行線 $3x+4y=10\\pm10$，即 $3x+4y=20$ 與 $3x+4y=0$。到 $3x+4y=20$：$d=\\frac{25}5=5>3$，0 點；到 $3x+4y=0$：$d=\\frac55=1<3$，2 點。共 2 點。\n〔易錯〕原直線 $L$ 本身 $d=\\frac{15}5=3$ 與圓相切，但題目問的是距離 2 的點，不是 $L$ 上的點。","r":"自編，依 108 學測與北一女中 113 期末考題型"},{"i":"b785","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2=5$ 與直線 $L:y=2x+k$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","當 $k=5$ 時，$L$ 與 $C$ 交於相異兩點"],["2","當 $k=3$ 時，$L$ 與 $C$ 交於相異兩點"],["3","當 $k=-5$ 時，$L$ 與 $C$ 相切，且切點為 $(2,-1)$"],["4","當 $k=-6$ 時，$L$ 與 $C$ 沒有交點"],["5","使 $L$ 與 $C$ 有交點的整數 $k$ 共有 10 個"]],"a":"234","e":"〔關鍵〕$d=\\frac{\\lvert k\\rvert}{\\sqrt5}$ 與 $r=\\sqrt5$ 比：$\\lvert k\\rvert<5$ 交兩點、$=5$ 相切、$>5$ 不交。\n〔步驟〕(1) $k=5$ 相切，錯。(2) $\\lvert3\\rvert<5$，對。(3) $k=-5$ 相切；切點是原點到 $2x-y-5=0$ 的垂足，沿法向量 $(2,-1)$ 走：$t(2,-1)$ 代入得 $5t-5=0$，$t=1$，切點 $(2,-1)$，對。(4) $6>5$，對。(5) $-5\\le k\\le5$ 共 11 個整數，錯。\n〔易錯〕(5) 有交點含相切，兩端都要算，$-5$ 到 $5$ 是 11 個。"},{"i":"b786","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $\\Gamma:x^2+y^2-4x-2y-20=0$，直線 $L_1:3x+4y=0$ 與 $L_2:3x+4y=20$。試選出正確的選項。","o":[["1","$L_1$ 與 $\\Gamma$ 交於相異兩點"],["2","$L_1$ 被 $\\Gamma$ 所截的弦長為 $\\sqrt{21}$"],["3","$L_1$ 與 $L_2$ 被 $\\Gamma$ 所截的弦長相等"],["4","$L_1$ 與 $L_2$ 的距離為 4"],["5","直線 $3x+4y=35$ 與 $\\Gamma$ 相切"]],"a":"1345","e":"〔關鍵〕平行線截弦，看兩條線各自的弦心距。\n〔步驟〕圓心 $(2,1)$，$r=5$，代入 $3x+4y$ 得 10。$L_1$：$d=2<5$，交兩點，弦長 $2\\sqrt{25-4}=2\\sqrt{21}$。$L_2$：$d=\\frac{\\lvert10-20\\rvert}5=2$，弦長相等。$L_1$、$L_2$ 距離 $\\frac{20}5=4$。$3x+4y=35$：$d=\\frac{25}5=5=r$，相切。\n〔易錯〕(2) 弦長要乘 2；(4) 平行線距離要除以 $\\sqrt{3^2+4^2}=5$。","r":"自編，依 102 學測題型"},{"i":"b787","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上兩點 $A(3,-1)$ 與 $B(-3,3)$，點 $P$ 在直線 $L:x+y-6=0$ 上，且 $P$ 滿足 $\\angle APB=90^\\circ$。試選出正確的選項。","o":[["1","以 $\\overline{AB}$ 為直徑的圓，其圓心為 $(0,1)$"],["2","以 $\\overline{AB}$ 為直徑的圓，其半徑為 13"],["3","$P$ 點可以是 $(2,4)$"],["4","$P$ 點可以是 $(3,3)$"],["5","滿足條件的 $P$ 點恰有一個"]],"a":"134","e":"〔關鍵〕$\\angle APB=90^\\circ$⇔$P$ 在以 $\\overline{AB}$ 為直徑的圓上（$P\\ne A,B$），所以 $P$ 是這個圓與 $L$ 的交點。\n〔步驟〕圓心是中點 $(0,1)$，半徑 $\\sqrt{3^2+2^2}=\\sqrt{13}$。圓：$x^2+(y-1)^2=13$。$y=6-x$ 代入：$x^2+(5-x)^2=13$，$x^2-5x+6=0$，$x=2$ 或 $3$，$P=(2,4)$ 或 $(3,3)$。\n〔易錯〕(2) 13 是半徑平方；(5) 圓心到 $L$ 距離 $\\frac5{\\sqrt2}<\\sqrt{13}$，有兩個交點。"},{"i":"b788","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上有一圓，其圓心為 $A(a,b)$，且此圓與兩坐標軸皆相切，另有一點 $P(c,c)$，其中 $a>c>0$，且已知 $\\overline{PA}=a+c$，試選出正確的選項。","o":[["1","$a=b$"],["2","點 $P$ 位於直線 $x+y=0$ 上"],["3","點 $P$ 在此圓內"],["4","$\\dfrac{a+c}{b-c}=\\sqrt2$"],["5","$\\dfrac{a}{c}=2+3\\sqrt2$"]],"a":"14","e":"〔關鍵〕與兩軸皆相切：圓心到兩軸距離都等於半徑，$r=\\lvert a\\rvert=\\lvert b\\rvert$。\n〔步驟〕$a>0$，$r=a$，$b=\\pm a$。若 $b=-a$：$(a-c)^2+(a+c)^2=(a+c)^2$，得 $a=c$，矛盾。所以 $b=a$。$\\overline{PA}^2=2(a-c)^2=(a+c)^2$，$a+c=\\sqrt2(a-c)$，$\\frac{a+c}{b-c}=\\frac{a+c}{a-c}=\\sqrt2$。解 $\\frac ac=\\frac{\\sqrt2+1}{\\sqrt2-1}=3+2\\sqrt2$。$\\overline{PA}=a+c>a=r$，$P$ 在圓外。$P(c,c)$ 在 $x-y=0$ 上。\n〔易錯〕(5) 是 $3+2\\sqrt2$；(3) 點與圓的位置看「點到圓心距離」與 $r$ 比。","r":"112 學測數學 B 第 11 題"},{"i":"b789","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"在坐標平面上有一定點 $P(-3,3)$ 與圓 $C:x^2+y^2=18$，$A(x_1,y_1)$、$B(x_2,y_2)$ 在圓 $C$ 上，滿足 $\\overline{AB}=6$ 以及 $x_1>x_2$，試選出正確的選項。","o":[["1","$P$ 點落在圓 $C$ 上"],["2","過 $P$ 點且與圓 $C$ 相切的切線方程式為 $x-y+6=0$"],["3","$\\triangle ABP$ 面積的最大值為 $9\\sqrt2$"],["4","當 $\\triangle ABP$ 的面積有最大值時，此時 $A$、$B$ 兩點均落在直線 $x-y+3\\sqrt2=0$ 上"],["5","當 $\\triangle ABP$ 的面積有最大值時，此時 $A$ 點的坐標為 $(3\\sqrt2,0)$"]],"a":"125","e":"〔關鍵〕弦長 6、$r=3\\sqrt2$，弦心距固定 $\\sqrt{18-9}=3$；三角形的高最大是 $\\overline{OP}+3$。\n〔步驟〕(1) $9+9=18$，對。(2) 圓心到 $x-y+6=0$ 的距離 $\\frac6{\\sqrt2}=3\\sqrt2=r$，相切，且 $P$ 在此線上，對。(3) 最大面積 $\\frac12\\times6\\times(3\\sqrt2+3)=9\\sqrt2+9$，錯。(4) 最大時 $\\overline{AB}$ 垂直 $\\overline{OP}$，在 $P$ 的對側：$P$ 代入 $x-y$ 得 $-6$，對側的線是 $x-y=3\\sqrt2$，即 $x-y-3\\sqrt2=0$，錯。(5) $x^2+(x-3\\sqrt2)^2=18$，$x=0$ 或 $3\\sqrt2$，$x_1>x_2$，$A=(3\\sqrt2,0)$，對。\n〔易錯〕(4) 和 $P$ 同側的線離 $P$ 比較近，面積反而最小。"},{"i":"b790","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"設 $\\Gamma$ 為坐標平面上通過 $(7,0)$ 與 $\\left(0,\\frac72\\right)$ 兩點的圓。試選出正確的選項。","o":[["1","$\\Gamma$ 的半徑大於或等於 5"],["2","當 $\\Gamma$ 的半徑達到最小可能值時，$\\Gamma$ 通過原點"],["3","$\\Gamma$ 與直線 $x+2y=6$ 有交點"],["4","$\\Gamma$ 的圓心不可能在第四象限"],["5","若 $\\Gamma$ 的圓心在第三象限，則 $\\Gamma$ 的半徑大於 8"]],"a":"25","e":"〔關鍵〕圓心在 $(7,0)$、$\\left(0,\\frac72\\right)$ 的中垂線 $y=2x-\\frac{21}4$ 上。\n〔步驟〕(1) 最小半徑是兩點距離的一半：$\\frac12\\sqrt{49+\\frac{49}4}=\\frac{7\\sqrt5}4\\approx3.9<5$，錯。(2) 此時以兩點連線為直徑，原點與兩點所成角為直角，原點在圓上，對。(3) 兩點都在 $x+2y=7$ 上，此線與 $x+2y=6$ 平行、相距 $\\frac1{\\sqrt5}$；圓心往遠離 $x+2y=6$ 的方向移得很遠時，圓在弦的這一側凸出越來越少，碰不到 $x+2y=6$，錯。(4) 圓心 $\\left(h,2h-\\frac{21}4\\right)$，$0<h<\\frac{21}8$ 時在第四象限，錯。(5) $h<0$ 時，$r^2=(h-7)^2+\\left(2h-\\frac{21}4\\right)^2>49+\\frac{441}{16}>64$，對。\n〔易錯〕(3) 不能只拿最小圓檢查，要考慮所有可能的圓。","r":"108 指考數學甲 多選第 4 題"},{"i":"b791","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"坐標平面上有兩圓 $C_1:(x-1)^2+(y-2)^2=4$ 與 $C_2:(x-7)^2+(y-5)^2=16$，若直線 $L:x+by+c=0$ 將 $C_1$ 的面積平分，直線 $L$ 也將 $C_2$ 的面積平分，則數對 $(b,c)=(\\boxed{11\\text{-}1}\\,\\boxed{11\\text{-}2},\\ \\boxed{11\\text{-}3})$。","a":"$(-2,3)$","e":"平分圓面積的直線必過圓心，$L$ 過 $(1,2)$ 與 $(7,5)$：$1+2b+c=0$，$7+5b+c=0$，$b=-2$，$c=3$。"},{"i":"b792","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"坐標平面上，已知圓 $C$ 通過點 $P(0,-5)$，其圓心在 $x=2$ 上。若圓 $C$ 截 $x$ 軸所成之弦長為 6，則其半徑為 $\\sqrt{\\boxed{12\\text{-}1}\\,\\boxed{12\\text{-}2}}$。（化成最簡根式）","a":"$\\sqrt{13}$","e":"圓心 $(2,k)$，弦心距 $\\lvert k\\rvert$，$r^2=9+k^2$。過 $(0,-5)$：$4+(k+5)^2=9+k^2$，$k=-2$，$r^2=13$。","r":"107 指考數學甲 選填 A"},{"i":"b793","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"在坐標平面上 $A(0,6)$ 處有一點光源，將圓 $C:x^2+y^2+2x-6y+5=0$ 投射在 $x$ 軸上，則此圓在 $x$ 軸上的陰影長度為 $\\boxed{13\\text{-}1}\\,\\boxed{13\\text{-}2}$。","a":"$15$","e":"圓心 $(-1,3)$，$r=\\sqrt5$。過 $A$ 的切線 $y=mx+6$：$\\frac{\\lvert-m-3+6\\rvert}{\\sqrt{m^2+1}}=\\sqrt5$，$2m^2+3m-2=0$，$m=\\frac12$ 或 $-2$。與 $x$ 軸交於 $x=-12$ 與 $x=3$，陰影長 15。","r":"新竹女中段考（講義段考練功坊 02）"},{"i":"b794","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"坐標平面上，所有通過點 $A(3,4)$ 且與直線 $L:x-y+5=0$ 相切的圓之中，面積最小的圓之圓心坐標為 $(\\boxed{14\\text{-}1},\\ \\boxed{14\\text{-}2})$。","a":"$(2,5)$","e":"過 $A$ 且與 $L$ 相切的圓，直徑至少是 $A$ 到 $L$ 的距離；最小時直徑就是 $A$ 到 $L$ 的垂線段。垂足：$A$ 代入 $x-y+5$ 得 4，垂足 $=(3,4)-\\frac42(1,-1)=(1,6)$，圓心是中點 $(2,5)$。"},{"i":"b795","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"平面上有一圓 $C:x^2+y^2+4x-6y+k=0$，將圓 $C$ 對著直線 $L:\\sqrt3x+y=3$ 對稱，可得圓 $C'$。若圓 $C$ 與圓 $C'$ 有交點，則 $k$ 的最大值為 $\\boxed{15\\text{-}1}\\,\\boxed{15\\text{-}2}$。","a":"$10$","e":"$C$：圓心 $(-2,3)$，$r^2=13-k$。$C'$ 的圓心是 $(-2,3)$ 對 $L$ 的對稱點，兩圓有交點⇔圓心到 $L$ 的距離 $\\le r$：$\\frac{\\lvert-2\\sqrt3+3-3\\rvert}2=\\sqrt3\\le\\sqrt{13-k}$，$k\\le10$。"},{"i":"b796","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"已知圓 $x^2+y^2-6x+2y+k=0$ 被直線 $4x-3y+5=0$ 所截的弦長為 8，則 $k=\\boxed{16\\text{-}1}\\,\\boxed{16\\text{-}2}\\,\\boxed{16\\text{-}3}$。","a":"$-22$","e":"圓心 $(3,-1)$，$d=\\frac{\\lvert12+3+5\\rvert}5=4$，$r^2=4^2+4^2=32$。一般式 $r^2=9+1-k=10-k=32$，$k=-22$。"},{"i":"b797","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $y=x+k$ 與圓 $x^2+y^2-2x+4y-4=0$ 交於相異兩點，則滿足條件的整數 $k$ 共有 $\\boxed{17\\text{-}1}$ 個。","a":"$9$","e":"圓心 $(1,-2)$，$r=3$。$x-y+k=0$，$d=\\frac{\\lvert3+k\\rvert}{\\sqrt2}<3$，$\\lvert k+3\\rvert<3\\sqrt2\\approx4.24$，$-7.24<k<1.24$，整數 $k=-7,-6,\\dots,1$，共 9 個。","r":"自編，依各校段考「整數個數」題型"},{"i":"b799","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"若 $L$ 與 $\\Gamma$ 相切，則 $m=\\dfrac{\\boxed{19\\text{-}1}\\,\\boxed{19\\text{-}2}}{\\boxed{19\\text{-}3}}$。（選填題，4 分）","a":"$-\\frac34$","c":"坐標平面上有一圓 $\\Gamma:x^2+y^2-6x-8y=0$，以及通過點 $P(2,11)$ 且斜率為 $m$ 的直線 $L$，其中 $m$ 為負實數。","e":"$\\Gamma$：圓心 $(3,4)$，$r=5$。$L:mx-y+11-2m=0$，$\\frac{\\lvert3m-4+11-2m\\rvert}{\\sqrt{m^2+1}}=5$，$(m+7)^2=25(m^2+1)$，$12m^2-7m-12=0$，$m=\\frac43$ 或 $-\\frac34$；$m<0$，取 $-\\frac34$。"},{"i":"b801","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"若點 $(-1,1)$ 及 $(1,2)$ 分別在圓 $C:x^2+y^2+3x+y+k=0$ 的內部、外部，則下列何者可為 $k$ 的值？","o":[["1","$-7$"],["2","$0$"],["3","$4$"],["4","$-11$"],["5","$1$"]],"a":"1","e":"〔關鍵〕點代入一般式：負→圓內，正→圓外。\n〔步驟〕$(-1,1)$：$1+1-3+1+k=k<0$；$(1,2)$：$1+4+3+2+k=10+k>0$。所以 $-10<k<0$（且 $r^2=\\frac52-k>0$ 自動成立），只有 $-7$ 符合。\n〔易錯〕一般式代入的正負就等於「距離² $-r^2$」的正負。"},{"i":"b802","s":"數學","u":"單元07","t":"07-位置關係","k":"s","q":"已知直線 $L:3x+y-5=0$ 與圓 $C:(x+2)^2+(y-1)^2=35$ 交於 $A(x_1,y_1)$、$B(x_2,y_2)$ 兩點，求 $x_1+x_2$ 的值。","o":[["1","$-\\frac12$"],["2","$-2$"],["3","$-\\frac23$"],["4","$2$"],["5","$-\\frac32$"]],"a":"4","e":"〔步驟〕$y=5-3x$ 代入：$(x+2)^2+(4-3x)^2=35$，$10x^2-20x-15=0$，$x_1+x_2=\\frac{20}{10}=2$。"},{"i":"b803","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"在坐標平面上的圓 $C:(x-6)^2+(y-8)^2=16$ 上，共有幾個點與直線 $4x-3y+35=0$ 的距離正好是整數值？","o":[["1","14"],["2","15"],["3","16"],["4","17"],["5","18"]],"a":"3","e":"〔關鍵〕先求圓上點到直線的距離範圍。\n〔步驟〕圓心 $(6,8)$，$d=\\frac{\\lvert24-24+35\\rvert}5=7$，$r=4$。圓上的點到直線的距離從 $7-4=3$ 到 $7+4=11$。距離 3、11 各只有 1 點（相切的兩端），距離 4～10 各有 2 點：$2+7\\times2=16$。\n〔易錯〕兩端點各只有 1 點。"},{"i":"b804","s":"數學","u":"單元07","t":"單元07-綜合","k":"s","q":"坐標平面上有三點 $A(0,0)$、$B(10,0)$、$C(0,6)$。若動點 $P$ 滿足 $\\overline{PA}=\\overline{PB}$ 且 $\\overline{PA}=\\frac12\\overline{PC}$，則動點 $P$ 所成的圖形為下列何者？","o":[["1","1 個點"],["2","2 個點"],["3","一直線"],["4","一圓"],["5","不存在"]],"a":"5","e":"〔步驟〕中垂線 $x=5$；$4(x^2+y^2)=x^2+(y-6)^2$ 整理成 $x^2+(y+2)^2=16$，左右範圍 $-4$ 到 4，$x=5$ 在外面，不存在。"},{"i":"b805","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"在坐標平面上，已知圓 $C:x^2+y^2+4x-2y-4=0$，直線 $L:3x-4y+k=0$，下列敘述何者為正確？","o":[["1","圓 $C$ 的半徑為 9"],["2","若 $L$ 與圓 $C$ 有最大的割線段長，則 $k=8$"],["3","若 $k=10$ 時，圓 $C$ 上恰有 3 點到 $L$ 距離為 2"],["4","若 $k=-2$ 時，則 $L$ 與 $C$ 交於相異兩點"],["5","若 $L$ 與 $C$ 不相交，此時 $k$ 可能為 $-6$"]],"a":"45","e":"〔步驟〕$(x+2)^2+(y-1)^2=9$，$r=3$，(1) 錯。最大割線段＝直徑，直線過圓心：$-6-4+k=0$，$k=10$，(2) 錯。$k=10$ 過圓心，距離 2 的兩條線離圓心都是 2，都在中間，共 4 點，(3) 錯。$k=-2$：$d=\\frac{\\lvert-10-2\\rvert}5=2.4<3$，(4) 對。$k=-6$：$d=\\frac{16}5=3.2>3$，不相交，(5) 對。"},{"i":"b806","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:(x-2)^2+(y-3)^2=9$ 與直線 $L:4x-3y+k=0$，其中 $k$ 為實數。試選出正確的選項。","o":[["1","$k=16$ 時，$L$ 與 $C$ 相切"],["2","$k=-14$ 時，$L$ 與 $C$ 相切"],["3","$k=1$ 時，$L$ 通過 $C$ 的圓心"],["4","$k=-15$ 時，$L$ 與 $C$ 交於相異兩點"],["5","使 $L$ 與 $C$ 交於相異兩點的整數 $k$ 共有 31 個"]],"a":"123","e":"圓心代入 $4x-3y$ 得 $-1$，$r\\times5=15$，$-k=-1\\pm15$，$k=-14$ 或 16 相切。$k=1$：$8-9+1=0$，過圓心。交兩點 $-14<k<16$，$k=-15$ 在外面；整數 $-13$～15 共 29 個，不是 31 個。"},{"i":"b807","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $\\Gamma:(x+3)^2+(y-2)^2=25$，直線 $L_1:4x+3y=19$ 與 $L_2:4x+3y=-31$。試選出正確的選項。","o":[["1","$L_1$、$L_2$ 都與 $\\Gamma$ 相切"],["2","$L_1$ 與 $L_2$ 的距離為 50"],["3","$L_1$ 與 $L_2$ 的距離為 10"],["4","直線 $4x+3y=-6$ 被 $\\Gamma$ 所截的弦長為 10"],["5","通過點 $(2,2)$ 可作兩條與 $\\Gamma$ 相切的直線"]],"a":"134","e":"圓心代入 $4x+3y$ 得 $-6$。$L_1$：$d=\\frac{25}5=5$；$L_2$：$d=\\frac{25}5=5$，都相切。兩線距離 $\\frac{50}5=10$。$4x+3y=-6$ 過圓心，弦長＝直徑 10。$(2,2)$ 差 $(5,0)$，在圓上，只能作 1 條。"},{"i":"b808","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"坐標平面上兩點 $A(-2,1)$ 與 $B(2,5)$，點 $P$ 在直線 $L:x-y=1$ 上，且 $P$ 滿足 $\\angle APB=90^\\circ$。試選出正確的選項。","o":[["1","以 $\\overline{AB}$ 為直徑的圓，其圓心為 $(0,3)$"],["2","以 $\\overline{AB}$ 為直徑的圓，其半徑為 $2\\sqrt2$"],["3","滿足條件的 $P$ 點恰有一個"],["4","$P$ 點為 $(2,1)$"],["5","$P$ 點可以是 $(3,2)$"]],"a":"1234","e":"圓心 $(0,3)$，$r=\\frac{\\sqrt{32}}2=2\\sqrt2$。圓心到 $x-y=1$：$\\frac{\\lvert0-3-1\\rvert}{\\sqrt2}=2\\sqrt2=r$，相切，$P=(0,3)+2(1,-1)=(2,1)$。$(3,2)$：$9+1=10\\ne8$。"},{"i":"b809","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $C:x^2+y^2=10$ 與直線 $L:x-y=2$。試選出正確的選項。","o":[["1","$L$ 與 $C$ 的交點為 $(3,1)$ 與 $(-1,-3)$"],["2","$L$ 被 $C$ 所截的弦長為 $4\\sqrt2$"],["3","$C$ 的圓心到 $L$ 的距離為 2"],["4","$L$ 被 $C$ 所截的弦，中點為 $(1,-1)$"],["5","直線 $x-y=2\\sqrt5$ 與 $C$ 相切"]],"a":"1245","e":"$x=y+2$ 代入：$y^2+2y-3=0$，交點 $(3,1)$、$(-1,-3)$，弦長 $\\sqrt{16+16}=4\\sqrt2$，中點 $(1,-1)$。$d=\\frac2{\\sqrt2}=\\sqrt2$。$x-y=2\\sqrt5$：$d=\\frac{2\\sqrt5}{\\sqrt2}=\\sqrt{10}=r$，相切。"},{"i":"b810","s":"數學","u":"單元07","t":"07-多選","k":"m","q":"已知圓 $\\Gamma:x^2+y^2-4x+6y-12=0$。試選出正確的選項。","o":[["1","原點在 $\\Gamma$ 的內部"],["2","點 $(5,1)$ 在 $\\Gamma$ 上"],["3","通過點 $(7,-3)$ 可作兩條與 $\\Gamma$ 相切的直線"],["4","通過點 $(6,1)$ 可作兩條與 $\\Gamma$ 相切的直線"],["5","點 $(-1,-7)$ 在 $\\Gamma$ 的內部"]],"a":"124","e":"$(x-2)^2+(y+3)^2=25$，常數項 $-12<0$，原點在圓內。$(5,1)$ 差 $(3,4)$，圓上。$(7,-3)$ 差 $(5,0)$，圓上，1 條。$(6,1)$ 差 $(4,4)$，32，圓外，2 條。$(-1,-7)$ 差 $(-3,-4)$，圓上，不是內部。"},{"i":"b811","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"坐標平面上，已知圓 $C$ 通過點 $P(2,-1)$，其圓心在 $y=4$ 上。若圓 $C$ 截 $y$ 軸所成之弦長為 6，則其半徑為 $\\sqrt{\\boxed{11\\text{-}1}\\,\\boxed{11\\text{-}2}}$。","a":"$\\sqrt{34}$","e":"圓心 $(h,4)$，到 $y$ 軸距離 $\\lvert h\\rvert$，$r^2=h^2+9$。過 $(2,-1)$：$(2-h)^2+25=h^2+9$，$h=5$，$r^2=34$。"},{"i":"b812","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"直線 $2x-y=3$ 與圓 $x^2+y^2=5$ 有兩個交點，其中在第一象限的交點為 $(\\boxed{12\\text{-}1},\\ \\boxed{12\\text{-}2})$。","a":"$(2,1)$","e":"$y=2x-3$ 代入：$5x^2-12x+4=0$，$x=2$ 或 $\\frac25$；$x=2$ 時 $y=1$。"},{"i":"b813","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"直線 $4x+3y+12=0$ 被圓 $x^2+y^2-2x+4y-20=0$ 所截的弦長為 $\\boxed{13\\text{-}1}\\sqrt{\\boxed{13\\text{-}2}\\,\\boxed{13\\text{-}3}}$。","a":"$2\\sqrt{21}$","e":"**13. $2\\sqrt{21}$**　圓心 $(1,-2)$，$r=5$，$d=\\frac{\\lvert4-6+12\\rvert}5=2$，弦長 $2\\sqrt{25-4}=2\\sqrt{21}$。"},{"i":"b814","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"與直線 $x+2y=0$ 垂直，且與圓 $x^2+y^2=20$ 相切的直線為 $2x-y+c=0$。若 $c>0$，則 $c=\\boxed{14\\text{-}1}\\,\\boxed{14\\text{-}2}$。","a":"$10$","e":"$\\frac{\\lvert c\\rvert}{\\sqrt5}=2\\sqrt5$，$c=\\pm10$，取 10。"},{"i":"b815","s":"數學","u":"單元07","t":"07-弦長","k":"f","q":"圓心為 $(1,2)$ 的圓被直線 $3x-4y=0$ 所截的弦長為 8，則此圓的半徑平方為 $\\boxed{15\\text{-}1}\\,\\boxed{15\\text{-}2}$。","a":"$17$","e":"$d=\\frac{\\lvert3-8\\rvert}5=1$，半弦 4，$r^2=1+16=17$。"},{"i":"b816","s":"數學","u":"單元07","t":"07-相切k","k":"f","q":"一圓同時與直線 $3x+4y=7$ 及 $3x+4y=-13$ 相切，且圓心在 $y$ 軸上，則圓心的 $y$ 坐標為 $\\dfrac{\\boxed{16\\text{-}1}\\,\\boxed{16\\text{-}2}}{\\boxed{16\\text{-}3}}$。","a":"$-\\frac34$","e":"圓心在兩平行切線正中間的直線 $3x+4y=\\frac{7+(-13)}2=-3$ 上；在 $y$ 軸上：$4y=-3$，$y=-\\frac34$。（半徑是兩線距離的一半：$\\frac{20}5\\div2=2$。）"},{"i":"b817","s":"數學","u":"單元07","t":"07-位置關係","k":"f","q":"若直線 $x+y=k$ 與圓 $(x-1)^2+(y-1)^2=18$ 交於相異兩點，則滿足條件的整數 $k$ 共有 $\\boxed{17\\text{-}1}\\,\\boxed{17\\text{-}2}$ 個。","a":"$11$","e":"$d=\\frac{\\lvert2-k\\rvert}{\\sqrt2}<3\\sqrt2$，$\\lvert k-2\\rvert<6$，$-4<k<8$，整數 $-3$～7 共 11 個。","r":"自編，依各校段考整數個數題型"},{"i":"b819","s":"數學","u":"單元07","t":"單元07-綜合","k":"f","q":"公路上收得到訊號的路段長為 $\\boxed{19\\text{-}1}$ 公里。（選填題，4 分）","a":"$6$","c":"坐標平面上，一座手機基地台位於點 $(3,4)$，坐標的 1 單位長代表 1 公里，基地台的訊號可涵蓋距離基地台 5 公里以內（含 5 公里）的區域。一條公路沿 $x$ 軸鋪設。","e":"$2\\sqrt{25-16}=6$ 公里。","r":"自編，依學測混合題結構"},{"i":"b821","s":"數學","u":"單元07","t":"07-相切k","k":"s","q":"已知圓 $C:x^2+y^2-2x-4y-20=0$。通過下列哪一個點，恰可作兩條與圓 $C$ 相切的直線？","o":[["1","$(4
